// Inspect the real configured Android model and Cargo task without compiling or assembling.
gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.tasks.register('verifyNativeSelectionFixture') {
        doLast {
            def android = app.extensions.getByName('android')
            assert !android.defaultConfig.buildConfigFields.containsKey('NATIVE_ENGINE_ENABLED'):
                'Removed engine-selection BuildConfig field returned'
            assert app.tasks.findByName('cargoNdkBuild') == null:
                'Removed legacy engine producer returned'

            def cargo = app.tasks.named('cargoNdkBuildVortxFfi').get().commandLine
            def featureIndex = cargo.indexOf('--features')
            assert featureIndex >= 0 && featureIndex + 1 < cargo.size(): 'Cargo features are missing'
            def features = cargo[featureIndex + 1]
            assert features == 'jni,server,resource-host': "Cargo features mismatch: ${features}"
            assert cargo.contains('--locked'): 'Native dependency resolution must stay locked'
            assert cargo.contains('--no-default-features'): 'Native feature set must stay explicit'

            ['Full', 'Play'].each { flavor ->
                def merge = app.tasks.named("merge${flavor}DebugJniLibFolders").get()
                def dependencies = merge.taskDependencies.getDependencies(merge)*.name
                assert dependencies.contains('cargoNdkBuildVortxFfi'): 'Native VortX task is missing'
                assert !dependencies.contains('cargoNdkBuild'):
                    "${flavor} retained a legacy producer: ${dependencies}"
            }
            println "native-selection: native-only, features=${features}, legacy=false"
        }
    }
}
