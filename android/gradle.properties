# Heap ceiling raised from 2048m (was fine through parity wave 4). CI builds BOTH
# flavors in one `assembleFullDebug assemblePlayDebug --no-daemon` invocation, so the
# two Kotlin compiles run no-isolation inside the Gradle JVM and share this ceiling;
# once the TV and artwork waves grew the source, 2048m OOM'd the Kotlin compiler on the
# 16GB ubuntu-24.04 runner (physical RAM was never the limit, the cap was). 5g Gradle
# plus an explicit 4g Kotlin-daemon ceiling (used only when a separate daemon is forked)
# fits comfortably under 16GB and restores headroom for further waves.
org.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# android.suppressUnsupportedCompileSdk=36 removed (S01): AGP 8.10.0 (this project's floor as of
# S01, see gradle/libs.versions.toml) officially supports compileSdk/targetSdk 36, so the escape
# hatch that let the prior AGP 8.5.2 pin compile against it unsupported is no longer needed.
