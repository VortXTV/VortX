# One Android version catalog for both app flavors and :mpv-seam.
# Coordinated stable candidate: AGP built-in Kotlin + matching Compose compiler plugin.
# Gradle 9.7.0 is within KGP 2.4.21's tested Gradle range; AGP 9.4.1 is newer than
# KGP's published fully-tested AGP maximum (9.3.1), so the hosted composition gate is required.
# compileSdk 37 satisfies current Core/Lifecycle AAR metadata; targetSdk 36 / minSdk 26 stay fixed.
# Media3 1.11.1 is already selected independently; this wave does not change it.
# The libmpv AAR is still full-only. Updating the source-built seam's NDK does not rebuild its
# precompiled FFmpeg/mbedTLS payload. Security Crypto 1.1.0 is deprecated but remains the latest
# stable compatibility reader; replacing encrypted preferences requires a separate data migration.
# Tink remains the explicit X25519 dependency used for byte-compatible device pairing. Its raw
# subtle.X25519 API is upstream @Alpha; the 1.24.0 candidate must pass existing pairing vectors
# and encrypted-preference compatibility/readback before shipping, not just dependency resolution.
# Cast/TV/Coil/Work/OkHttp remain plain dependencies in both flavors, never a GPL boundary change.

[versions]
agp = "9.4.1"
kotlin = "2.4.21"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
coreKtx = "1.19.1"
coreSplashscreen = "1.2.0"
lifecycle = "2.11.0"
coroutines = "1.11.0"
media3 = "1.11.1"
securityCrypto = "1.1.0"
tink = "1.24.0"
mpvLibmpv = "1.0.0"
tvMaterial = "1.1.0"
tvProvider = "1.1.0"
coil = "3.6.3"
work = "2.12.0"
okhttp = "5.5.0"
smbj = "0.15.0"
playServicesCast = "23.0.0"
mediarouter = "1.8.1"
junit = "4.13.2"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"
jsonJvm = "20260814"
zxing = "3.5.4"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
tink-android = { group = "com.google.crypto.tink", name = "tink-android", version.ref = "tink" }

lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }

mpv-libmpv = { group = "dev.jdtech.mpv", name = "libmpv", version.ref = "mpvLibmpv" }

tv-material = { group = "androidx.tv", name = "tv-material", version.ref = "tvMaterial" }
tv-provider = { group = "androidx.tvprovider", name = "tvprovider", version.ref = "tvProvider" }

coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
smbj = { group = "com.hierynomus", name = "smbj", version.ref = "smbj" }

# Google Cast lane (see the playServicesCast / mediarouter version notes above). Both are plain
# `implementation` in BOTH flavors -- no GPL native code, so the `play` build stays GPL-clean.
play-services-cast-framework = { group = "com.google.android.gms", name = "play-services-cast-framework", version.ref = "playServicesCast" }
androidx-mediarouter = { group = "androidx.mediarouter", name = "mediarouter", version.ref = "mediarouter" }

work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
json-jvm = { group = "org.json", name = "json", version.ref = "jsonJvm" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# The :mpv-seam library module (W1-B source-built libmpv JNI seam) rides the SAME AGP pin as the
# app; no separate version, one Gradle/AGP per build.
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
