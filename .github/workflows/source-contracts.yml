name: Website roster Swift checkpoint fixtures

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website-roster-session:
    if: github.repository == 'VortXTV/VortX' && github.actor == 'mamaclapper' && github.ref == 'refs/heads/beta-website-roster-swift-proof-20261112'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out exact reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Exercise the full Swift Session fixture
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = c93addc2bdb22de5ca40502ddad456d2852b76de
          test "$(git diff --name-only HEAD^ HEAD)" = $'.github/workflows/source-contracts.yml\nscripts/test-native-migration-phase-a.cjs'
          test -z "$(git status --porcelain)"
          bash scripts/test-native-migration-phase-a.sh session
          set -- app/build/native-migration-session.*
          test "$#" = 1
          jq -e '.stage == "session" and .exit == 0 and .interrupted == 0' "$1/result.json"
          test -f "$1/ci-stub/VortxEngine.xcframework/STUB-CI-ONLY.txt"
          grep -Fx 'Website roster checkpoint: sealed exact witness, restart, wrong-witness refusal and exclusive first install passed' "$1/test.log"
          grep -Fx 'Native session: acknowledged transactions, sealed cold state/context, legacy preservation and independent screen/logout fences passed' "$1/test.log"
          test -z "$(git status --porcelain)"
