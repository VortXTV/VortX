name: Protected Apple website roster loopback proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vortx-apple-website-roster-loopback-proof
  cancel-in-progress: false

jobs:
  website-roster-real-swift:
    if: >-
      github.event_name == 'workflow_dispatch' && github.repository == 'VortXTV/VortX' &&
      github.actor == 'mamaclapper' && github.ref == 'refs/tags/vortx-apple-website-roster-repair-20261112'
    runs-on: macos-26
    environment: engine-ci
    timeout-minutes: 65
    env:
      APP_SOURCE: 113f42bc8e3ce66d87dc6b39ef77a233680c7e3a
      WEBSITE_ROSTER_PRODUCTION_SOURCE: 4c8c029d7941e7acab0f80f09b3bbc68bc04bcf5
      ENGINE_SOURCE: 2ea2e0f27dd2e53b7b28228435ca35a70f92831f
      HOST_TOOLCHAIN: nightly-2026-07-19
      HOST_TARGET: aarch64-apple-darwin
      ENGINE_MANIFEST_SHA: 5449db9efa1c2b05b71a8aed9748dd112f71cb80e9cbbd4915f4cb78ab95c4eb
      ENGINE_LOCK_SHA: a320e65b9a11884c3f0f7e6cbf1a796d7726d9902bc2b08662e2adc14c4e69cc
      ENGINE_TOOLCHAIN_SHA: eac015d1adbedf2b5d10ba7662255a184c45257fddefaf997e296c27f822fcc5
      ENGINE_HEADER_SHA: 02698eaa7bbd99b89b7003be7ee6c39714b8fe7ba87cf9dce0e10769617b5b6f
      TOOLCHAIN_HELPER_SHA: 46d45ba9ed29ab1da747680d019503a59e9c9d6def3766a1366dd3a83170746a
    steps:
      - name: Check out exact reviewed operations source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: operations
          fetch-depth: 2
          persist-credentials: false

      - name: Check out exact frozen Swift fixture source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.APP_SOURCE }}
          path: frozen
          fetch-depth: 2
          persist-credentials: false

      - name: Authenticate the protected ref and fixture boundary
        shell: bash
        run: |
          set -euo pipefail
          REF='refs/tags/vortx-apple-website-roster-repair-20261112'
          test "$GITHUB_REPOSITORY" = VortXTV/VortX
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_ACTOR" = mamaclapper
          test "$GITHUB_REF" = "$REF"
          test "$GITHUB_WORKFLOW_REF" = "VortXTV/VortX/.github/workflows/source-contracts.yml@$REF"
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(uname -m)" = arm64
          [[ "$APP_SOURCE" =~ ^[a-f0-9]{40}$ ]]
          test "$(git -C operations rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C operations rev-list --parents -n 1 HEAD)" = "$GITHUB_SHA $APP_SOURCE"
          test "$(git -C operations diff --name-only "$APP_SOURCE" HEAD)" = .github/workflows/source-contracts.yml
          test -z "$(git -C operations status --porcelain --untracked-files=all)"
          test "$(git -C frozen rev-parse HEAD)" = "$APP_SOURCE"
          test "$(git -C frozen rev-parse HEAD^)" = "$WEBSITE_ROSTER_PRODUCTION_SOURCE"
          test -z "$(git -C frozen status --porcelain --untracked-files=all)"
          test -f frozen/scripts/test-apple-website-roster.sh && test ! -L frozen/scripts/test-apple-website-roster.sh
          printf '%s  %s\n' "$TOOLCHAIN_HELPER_SHA" frozen/scripts/native-rust-toolchain-env.sh | shasum -a 256 -c --status

      - name: Verify focused native account admission and receipt policies
        timeout-minutes: 8
        shell: bash
        working-directory: frozen
        run: |
          set -euo pipefail
          bash scripts/test-native-migration-phase-a.sh restore
          set -- app/build/native-migration-restore.*
          test "$#" = 1
          jq -e '.stage == "restore" and .exit == 0 and .interrupted == 0' "$1/result.json"
          grep -Fx 'Native restore admission: 260 focused checks passed; no device/login or full mount proof' "$1/test.log"
          grep -Fx 'Website roster publication receipt: authentic restart, exact retry, definitive rejection and readback passed' "$1/test.log"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Install the exact host Rust nightly
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$HOST_TOOLCHAIN" --profile minimal --component llvm-tools-preview
          test "$(rustup run "$HOST_TOOLCHAIN" rustc -vV | sed -n 's/^host: //p')" = "$HOST_TARGET"

      - name: Fetch only the exact private engine revision
        timeout-minutes: 5
        env:
          ENGINE_REPO_TOKEN: ${{ secrets.ENGINE_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "${ENGINE_REPO_TOKEN:-}"
          SCRATCH="$(mktemp -d "$RUNNER_TEMP/vortx-website-swift-private.XXXXXXXX")"
          trap 'rm -rf -- "$SCRATCH"' EXIT
          PRIVATE_CHECKOUT="$SCRATCH/engine"
          mkdir "$PRIVATE_CHECKOUT"
          PRIVATE_REPO="$(awk '$1 == "repository:" && $2 == "VortXTV/vortx-core" { print $2 }' frozen/.github/workflows/android.yml)"
          test "$PRIVATE_REPO" = VortXTV/vortx-core
          if ! (
            export LC_ALL=C GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
            unset GIT_TRACE GIT_TRACE_PACKET GIT_TRACE_CURL GIT_CURL_VERBOSE
            ASKPASS="$SCRATCH/askpass"
            cat > "$ASKPASS" <<'SH' || exit 1
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$ENGINE_REPO_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
            chmod 700 "$ASKPASS" || exit 1
            export GIT_ASKPASS="$ASKPASS"
            git -C "$PRIVATE_CHECKOUT" init --quiet || exit 1
            git -C "$PRIVATE_CHECKOUT" -c credential.helper= -c http.followRedirects=false \
              -c protocol.allow=never -c protocol.https.allow=always fetch --no-tags --depth=1 \
              "https://github.com/$PRIVATE_REPO.git" "$ENGINE_SOURCE" || exit 1
            git -C "$PRIVATE_CHECKOUT" -c core.hooksPath=/dev/null checkout --detach --quiet FETCH_HEAD
          ) >"$SCRATCH/private-fetch.log" 2>&1; then
            echo '::error::Exact private engine fetch failed.'
            exit 1
          fi
          rm -- "$SCRATCH/askpass"
          test "$(git -C "$PRIVATE_CHECKOUT" rev-parse HEAD)" = "$ENGINE_SOURCE"
          test -z "$(git -C "$PRIVATE_CHECKOUT" status --porcelain --untracked-files=all)"
          printf 'VORTX_WEBSITE_SWIFT_PRIVATE_DIR=%s\n' "$SCRATCH" >> "$GITHUB_ENV"
          trap - EXIT

      - name: Run the frozen Swift fixture with real host FFI
        id: probe
        timeout-minutes: 50
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -z "${ENGINE_REPO_TOKEN+x}"
          SCRATCH="$VORTX_WEBSITE_SWIFT_PRIVATE_DIR"
          PREFIX="$RUNNER_TEMP/vortx-website-swift-private."
          SUFFIX="${SCRATCH#"$PREFIX"}"
          [[ "$SUFFIX" =~ ^[A-Za-z0-9]{8}$ && "$SCRATCH" == "$PREFIX$SUFFIX" ]]
          test -d "$SCRATCH" && test ! -L "$SCRATCH"
          APP="$GITHUB_WORKSPACE/frozen"
          PRIVATE_CHECKOUT="$SCRATCH/engine"
          WORKSPACE="$PRIVATE_CHECKOUT/vortx-core"
          TARGET_RELEASE="$SCRATCH/target/$HOST_TARGET/release"
          ENGINE_LIBRARY="$TARGET_RELEASE/libvortx_ffi.dylib"
          ENGINE_HEADER="$WORKSPACE/crates/ffi/include/vortx_ffi.h"
          SDK_DIR="$SCRATCH/sdk"
          PROOF_DIR="$(mktemp -d "$RUNNER_TEMP/vortx-website-swift-proof.XXXXXXXX")"

          sha256() { shasum -a 256 "$1" | cut -d ' ' -f 1; }
          verify_engine_inputs() {
            test "$(git -C "$PRIVATE_CHECKOUT" rev-parse HEAD)" = "$ENGINE_SOURCE" &&
            test -z "$(git -C "$PRIVATE_CHECKOUT" status --porcelain --untracked-files=all)" &&
            test "$(sha256 "$WORKSPACE/Cargo.toml")" = "$ENGINE_MANIFEST_SHA" &&
            test "$(sha256 "$WORKSPACE/Cargo.lock")" = "$ENGINE_LOCK_SHA" &&
            test "$(sha256 "$WORKSPACE/rust-toolchain.toml")" = "$ENGINE_TOOLCHAIN_SHA" &&
            test "$(sha256 "$ENGINE_HEADER")" = "$ENGINE_HEADER_SHA"
          }
          verify_engine_inputs
          ENGINE_SYMLINK="$(find "$WORKSPACE" -type l -print -quit 2>"$SCRATCH/private-filetypes.log")"
          test -z "$ENGINE_SYMLINK"
          DEVELOPER_DIR="$(cd "$(xcode-select -p)" && pwd -P)"
          export DEVELOPER_DIR
          XCODE_INFO="$(xcodebuild -version)"
          HOST_XCODE_VERSION="$(sed -n 's/^Xcode //p' <<< "$XCODE_INFO")"
          HOST_XCODE_BUILD="$(sed -n 's/^Build version //p' <<< "$XCODE_INFO")"
          HOST_MACOS_SDK_VERSION="$(xcrun --sdk macosx --show-sdk-version)"
          HOST_RUSTC_COMMIT="$(rustup run "$HOST_TOOLCHAIN" rustc -vV | sed -n 's/^commit-hash: //p')"
          [[ "$HOST_XCODE_VERSION" =~ ^26\.[0-9]+(\.[0-9]+)?$ && "$HOST_XCODE_BUILD" =~ ^[A-Za-z0-9]+$ ]]
          [[ "$HOST_MACOS_SDK_VERSION" =~ ^26\.[0-9]+(\.[0-9]+)?$ && "$HOST_RUSTC_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          test -d "$SDKROOT"
          export SDKROOT HOST_XCODE_VERSION HOST_XCODE_BUILD HOST_MACOS_SDK_VERSION HOST_RUSTC_COMMIT
          printf 'arm64 host, Xcode %s (%s), macOS SDK %s.\n' "$HOST_XCODE_VERSION" "$HOST_XCODE_BUILD" "$HOST_MACOS_SDK_VERSION"

          echo 'Building the reviewed host FFI with one Cargo job.'
          if ! (
            source "$APP/scripts/native-rust-toolchain-env.sh" || exit 1
            LLVM_PATH="$(native_rust_llvm_library_path "$HOST_TOOLCHAIN")" || exit 1
            cd "$WORKSPACE" || exit 1
            CARGO_HOME="$SCRATCH/cargo" DYLD_LIBRARY_PATH="$LLVM_PATH" MACOSX_DEPLOYMENT_TARGET=14.0 \
              nice -n 15 cargo "+$HOST_TOOLCHAIN" build --locked --manifest-path "$WORKSPACE/Cargo.toml" \
              -p vortx-ffi --no-default-features --features resource-host --release \
              --target "$HOST_TARGET" --target-dir "$SCRATCH/target" --jobs 1
          ) >"$SCRATCH/private-cargo.log" 2>&1; then
            echo '::error::The protected host FFI build failed.'
            exit 1
          fi
          verify_engine_inputs
          test -s "$ENGINE_LIBRARY" && test ! -L "$ENGINE_LIBRARY"
          test "$(xcrun lipo -archs "$ENGINE_LIBRARY" 2>"$SCRATCH/private-lipo.log")" = arm64
          xcrun otool -hv "$ENGINE_LIBRARY" >"$SCRATCH/private-macho.txt" 2>&1
          grep -Eq '(^|[[:space:]])DYLIB([[:space:]]|$)' "$SCRATCH/private-macho.txt"
          xcrun nm -gjU "$ENGINE_LIBRARY" >"$SCRATCH/private-exports.txt" 2>&1
          symbols=(
            vortx_init_runtime vortx_init_from_state_json vortx_dispatch_json vortx_resolve_json
            vortx_get_state_json vortx_get_state_delta_json vortx_string_free vortx_engine_free
            vortx_resource_host_abi_version vortx_resource_host_new vortx_resource_host_load_json
            vortx_resource_host_free vortx_cancel_new vortx_cancel_cancel vortx_cancel_free
            vortx_owner_history_canonicalize_evidence_json vortx_owner_history_session_open
            vortx_owner_history_session_fork vortx_owner_history_session_json vortx_owner_history_session_free
          )
          for symbol in "${symbols[@]}"; do
            grep -Fxq "_$symbol" "$SCRATCH/private-exports.txt"
          done
          {
            printf 'void probe(void) {\n'
            printf '    (void)&%s;\n' "${symbols[@]}"
            printf '}\n'
          } | xcrun --sdk macosx clang -target arm64-apple-macos14.0 -isysroot "$SDKROOT" \
              -Werror -fsyntax-only -x c -include "$ENGINE_HEADER" - > "$SCRATCH/private-header.log" 2>&1

          mkdir -p "$SDK_DIR/Headers/vortx"
          cp "$ENGINE_HEADER" "$SDK_DIR/Headers/vortx/vortx_ffi.h"
          cp "$ENGINE_LIBRARY" "$SDK_DIR/libvortx_ffi.dylib"
          printf 'module VortxEngine { header "vortx_ffi.h" export * }\n' > "$SDK_DIR/Headers/vortx/module.modulemap"
          ENGINE_LIBRARY_SHA="$(sha256 "$ENGINE_LIBRARY")"
          MODULEMAP_SHA="$(sha256 "$SDK_DIR/Headers/vortx/module.modulemap")"
          export ENGINE_LIBRARY_SHA
          verify_sdk_bytes() {
            test "$(sha256 "$ENGINE_LIBRARY")" = "$ENGINE_LIBRARY_SHA" &&
            test "$(sha256 "$SDK_DIR/libvortx_ffi.dylib")" = "$ENGINE_LIBRARY_SHA" &&
            test "$(sha256 "$SDK_DIR/Headers/vortx/vortx_ffi.h")" = "$ENGINE_HEADER_SHA" &&
            test "$(sha256 "$SDK_DIR/Headers/vortx/module.modulemap")" = "$MODULEMAP_SHA"
          }
          verify_sdk_bytes
          echo 'Running the exact Swift loopback fixture.'
          if ! (
            cd "$APP" || exit 1
            export VORTX_FIXTURE_DYLD_LIBRARY_PATH="$SDK_DIR:$TARGET_RELEASE:$TARGET_RELEASE/deps"
            DYLD_LIBRARY_PATH="$VORTX_FIXTURE_DYLD_LIBRARY_PATH" \
              bash scripts/test-apple-website-roster.sh "$SDK_DIR" "$PROOF_DIR"
          ) >"$SCRATCH/private-fixture.log" 2>&1; then
            echo '::error::The protected Swift loopback fixture failed.'
            # Forward only the fixed failure stages, source coordinates and bounded fixture status.
            awk '/^::error::Apple website roster stage failed: [a-z-]+$/ ||
                /^VORTX_FIXTURE_ORDER observed=[0-9]+ expected=[0-9]+ outcome=(completed|pending|failed|unknown) version=(-1|0|40|41|42) mounted=(true|false) applied=(true|false)$/ ||
                /^(WebsiteRoster[A-Za-z]+\.swift|apple-website-roster\.mjs):[0-9]+:[0-9]+$/ {
                  if (++printed <= 25) print
                }' "$SCRATCH/private-fixture.log"
            exit 1
          fi
          verify_sdk_bytes
          verify_engine_inputs
          test "$(git -C "$APP" rev-parse HEAD)" = "$APP_SOURCE"
          test -z "$(git -C "$APP" status --porcelain --untracked-files=all)"

          RECEIPT="$PROOF_DIR/website-roster-apple-proof.json"
          CHECKSUM="$PROOF_DIR/website-roster-apple-proof.sha256"
          test -d "$PROOF_DIR" && test ! -L "$PROOF_DIR"
          test -s "$RECEIPT" && test -f "$RECEIPT" && test ! -L "$RECEIPT"
          test -f "$CHECKSUM" && test ! -L "$CHECKSUM"
          test "$(find "$PROOF_DIR" -mindepth 1 -maxdepth 1 | wc -l | tr -d '[:space:]')" = 2
          test "$(wc -c < "$RECEIPT")" -le 65536
          PROOF_SHA="$(sha256 "$RECEIPT")"
          cmp -s "$CHECKSUM" <(printf '%s  website-roster-apple-proof.json\n' "$PROOF_SHA")
          printf 'proof_dir=%s\n' "$PROOF_DIR" >> "$GITHUB_OUTPUT"
          printf 'Verified the protected Swift host proof. SHA-256 %s\n' "$PROOF_SHA"

      - name: Retain only the sanitized Apple fixture receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VortX-Apple-Website-Roster-Loopback-Proof
          path: |
            ${{ steps.probe.outputs.proof_dir }}/website-roster-apple-proof.json
            ${{ steps.probe.outputs.proof_dir }}/website-roster-apple-proof.sha256
          if-no-files-found: error
          retention-days: 14
          overwrite: false

      - name: Remove this run's scoped private scratch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          SCRATCH="${VORTX_WEBSITE_SWIFT_PRIVATE_DIR:-}"
          [ -n "$SCRATCH" ] || exit 0
          PREFIX="$RUNNER_TEMP/vortx-website-swift-private."
          SUFFIX="${SCRATCH#"$PREFIX"}"
          [[ "$SUFFIX" =~ ^[A-Za-z0-9]{8}$ && "$SCRATCH" == "$PREFIX$SUFFIX" ]]
          if [ -e "$SCRATCH" ] || [ -L "$SCRATCH" ]; then
            test -d "$SCRATCH" && test ! -L "$SCRATCH"
            rm -rf -- "$SCRATCH"
          fi
