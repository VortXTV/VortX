name: Verify and stage the VortX web static bundle
run-name: Web provider settings and subtitle shortcut proof

on: workflow_dispatch

permissions:
  contents: read

jobs:
  web:
    if: >-
      github.event_name == 'workflow_dispatch' && github.repository == 'VortXTV/VortX' &&
      github.repository_id == '1261501126' && github.actor == 'mamaclapper' &&
      github.actor_id == '50227842' && github.run_attempt == '1' &&
      github.ref == 'refs/heads/beta-web-provider-shortcut-proof-20261112'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Verify the exact web source and operation
        shell: bash
        run: |
          set -euo pipefail
          APP_SOURCE=e92c4538f79fb3ecba3a381266132af82f5f0d53
          MAIN_BASE=60ab24bc58fa93d4c2d1d95e98291cc4ee2c6b4d
          WEB_TREE=9c0d86cf99c810dc8da22022be26649f91284419
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = VortXTV/VortX
          test "$GITHUB_REPOSITORY_ID" = 1261501126
          test "$GITHUB_ACTOR" = mamaclapper
          test "$GITHUB_ACTOR_ID" = 50227842
          test "$GITHUB_TRIGGERING_ACTOR" = mamaclapper
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = 'refs/heads/beta-web-provider-shortcut-proof-20261112'
          test "$GITHUB_WORKFLOW_REF" = "VortXTV/VortX/.github/workflows/source-contracts.yml@$GITHUB_REF"
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list --parents -n 1 HEAD)" = "$GITHUB_SHA $APP_SOURCE"
          test "$(git rev-list --parents -n 1 "$APP_SOURCE")" = "$APP_SOURCE $MAIN_BASE"
          test "$(git rev-parse HEAD:webapp)" = "$WEB_TREE"
          test "$(git diff --name-only "$APP_SOURCE" HEAD)" = .github/workflows/source-contracts.yml
          test "$(git diff --name-only "$MAIN_BASE" "$APP_SOURCE")" = "$(printf '%s\n' \
            webapp/src/lib/account.realtime-sync.test.mjs \
            webapp/src/lib/account.settings-sync.test.mjs \
            webapp/src/lib/account.ts \
            webapp/src/lib/player.source-fence.test.mjs \
            webapp/src/lib/player.ts \
            webapp/src/lib/playerControls.ts)"
          test -z "$(git status --porcelain --untracked-files=all)"
          printf 'Verified web source %s tree %s on exact attempt 1.\n' "$APP_SOURCE" "$WEB_TREE"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm install --global npm@12.2.0
      - name: Install the pinned web dependencies
        working-directory: webapp
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Pass web typecheck, test suite and production static build
        working-directory: webapp
        run: npm run typecheck && npm test && npm run build
      - name: Stage and hash the exact static files
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- webapp
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import subprocess


          def require(condition, message):
              if not condition:
                  raise SystemExit(message)


          def read_regular(path):
              with os.fdopen(os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK), "rb") as stream:
                  require(stat.S_ISREG(os.fstat(stream.fileno()).st_mode), f"Unexpected static file type: {path}")
                  return stream.read()


          def git(*args):
              return subprocess.check_output(["git", *args], timeout=10)


          def digest(data):
              return hashlib.sha256(data).hexdigest()


          def json_bytes(data):
              return (json.dumps(data, sort_keys=True, separators=(",", ":")) + "\n").encode()


          dist = Path("webapp/dist")
          require(dist.is_dir() and not dist.is_symlink(), "Expected a real webapp/dist directory")
          required = {"index.html", "_headers", "_redirects"}
          protected = {}
          for name in ("package-lock.json", "public/_headers", "public/_redirects"):
              source = read_regular(Path("webapp") / name)
              require(source == git("show", f"HEAD:webapp/{name}"), f"Protected web input changed: {name}")
              protected[name] = digest(source)
          for name in ("_headers", "_redirects"):
              require(digest(read_regular(dist / name)) == protected[f"public/{name}"],
                      f"Built Pages policy differs from source: {name}")

          output = Path(os.environ["RUNNER_TEMP"]) / "vortx-web-static"
          output.mkdir(mode=0o700)
          entries = []
          seen = set()
          for entry in sorted(dist.rglob("*")):
              relative = entry.relative_to(dist)
              path = relative.as_posix()
              require(all(re.fullmatch(r"[A-Za-z0-9_][A-Za-z0-9._-]*", part) for part in relative.parts),
                      f"Unsafe static path: {path}")
              require(path.casefold() not in seen and not entry.is_symlink(),
                      f"Duplicate or symlink static path: {path}")
              seen.add(path.casefold())
              if entry.is_dir():
                  continue
              data = read_regular(entry)
              if path in required:
                  require(data, f"Missing content in required static file: {path}")
              target = output / "dist" / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              entries.append({"path": path, "size": len(data), "sha256": digest(data)})
          require(required <= {row["path"] for row in entries}, "Static bundle lacks required Pages files")
          manifest = json_bytes({"schemaVersion": 1, "root": "dist", "files": entries})
          (output / "manifest.json").write_bytes(manifest)

          node = subprocess.check_output(["node", "--version"], text=True, timeout=10).strip()
          npm = subprocess.check_output(["npm", "--version"], text=True, timeout=10).strip()
          require((node, npm) == ("v22.23.3", "12.2.0"), "Web build toolchain differs from pinned versions")
          run = {
              "schemaVersion": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "repositoryId": int(os.environ["GITHUB_REPOSITORY_ID"]),
              "ref": os.environ["GITHUB_REF"],
              "workflowRef": os.environ["GITHUB_WORKFLOW_REF"],
              "sourceCommit": git("rev-parse", "HEAD^").decode().strip(),
              "baseCommit": git("rev-parse", "HEAD^^").decode().strip(),
              "webTree": git("rev-parse", "HEAD:webapp").decode().strip(),
              "operationsCommit": os.environ["GITHUB_SHA"],
              "workflowCommit": os.environ["GITHUB_WORKFLOW_SHA"],
              "runId": int(os.environ["GITHUB_RUN_ID"]),
              "attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "actorId": int(os.environ["GITHUB_ACTOR_ID"]),
              "nodeVersion": node,
              "npmVersion": npm,
              "protectedInputSha256": protected,
              "manifestSha256": digest(manifest),
          }
          (output / "provenance.json").write_bytes(json_bytes(run))
          print(f"Verified web static bundle with {len(entries)} files and manifest SHA-256 {digest(manifest)}.")
          PY
      - name: Upload the verified static bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VortX-web-static-proof
          path: ${{ runner.temp }}/vortx-web-static/
          if-no-files-found: error
