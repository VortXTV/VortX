name: Verify Android website roster account recovery

on: workflow_dispatch

permissions:
  contents: read

jobs:
  android-website-roster:
    if: >-
      github.event_name == 'workflow_dispatch' && github.repository == 'VortXTV/VortX' &&
      github.actor == 'mamaclapper' && github.ref == 'refs/heads/beta-website-roster-checks-20261111'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Authenticate the isolated source and test overlay
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
          test "$GITHUB_WORKFLOW_REF" = 'VortXTV/VortX/.github/workflows/source-contracts.yml@refs/heads/beta-website-roster-checks-20261111'
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^2)" = 01ae071a9a087262de5f798b913a3780e3b4a6dd
          test "$(git diff --name-only HEAD^2 HEAD)" = .github/workflows/source-contracts.yml
          test -z "$(git status --porcelain)"

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - name: Select the pinned Android NDK
        run: sdkmanager 'ndk;30.0.16248370'

      - name: Run focused website roster, receipt and checkpoint unit checks
        working-directory: android
        run: >-
          ./gradlew :app:testPlayDebugUnitTest --no-daemon --max-workers=2
          -Pvortx.nativeEngine=true -Pvortx.nativeResourceHost=true
          --tests com.vortx.android.engine.NativeWebsiteRosterProjectionTest
          --tests com.vortx.android.engine.NativeWebsiteRosterAdmissionTest
          --tests com.vortx.android.sync.NativeWebsiteRosterDenialReceiptTest
          --tests com.vortx.android.sync.NativeWebsiteRosterReceiptStoreTest
          --tests com.vortx.android.sync.NativeWebsiteRosterManagerTest
          --tests com.vortx.android.sync.AccountFileRestoreAbsenceTest
          --tests 'com.vortx.android.engine.VortxNativeSessionTest.captured absence is create only and tamper never becomes absence'

      - name: Require the exact unit fixture roster with no failure or skip
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          expected = {
              'engine.NativeWebsiteRosterProjectionTest': 15,
              'engine.NativeWebsiteRosterAdmissionTest': 4,
              'sync.NativeWebsiteRosterDenialReceiptTest': 5,
              'sync.NativeWebsiteRosterReceiptStoreTest': 6,
              'sync.NativeWebsiteRosterManagerTest': 9,
              'sync.AccountFileRestoreAbsenceTest': 18,
              'engine.VortxNativeSessionTest': 1,
          }
          root = Path('android/app/build/test-results/testPlayDebugUnitTest')
          expected = {'com.vortx.android.' + name: cases for name, cases in expected.items()}
          paths = set(root.glob('TEST-*.xml'))
          assert paths == {root / ('TEST-' + name + '.xml') for name in expected}
          for name, cases in expected.items():
              suite = ET.parse(root / ('TEST-' + name + '.xml')).getroot()
              assert suite.tag == 'testsuite' and suite.get('name') == name
              assert len(suite.findall('testcase')) == int(suite.get('tests', '-1')) == cases
              assert all(suite.get(field) == '0' for field in ('failures', 'errors', 'skipped'))
              assert all(not suite.findall('.//' + field) for field in ('failure', 'error', 'skipped'))
              print(f'{name}: {cases} passed')
          print(f'Passed exactly {sum(expected.values())} focused Android unit fixtures.')
          PY
