name: Verify Android owner follow-ups
run-name: Android owner follow-up Play Debug proof

on: workflow_dispatch

permissions:
  contents: read

jobs:
  android:
    if: >-
      github.event_name == 'workflow_dispatch' && github.repository == 'VortXTV/VortX' &&
      github.repository_id == '1261501126' && github.actor == 'mamaclapper' &&
      github.actor_id == '50227842' && github.run_attempt == '1' &&
      github.ref == 'refs/heads/beta-android-owner-followup-proof-20261112'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the exact source and operation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = VortXTV/VortX
          test "$GITHUB_REPOSITORY_ID" = 1261501126
          test "$GITHUB_ACTOR" = mamaclapper
          test "$GITHUB_ACTOR_ID" = 50227842
          test "$GITHUB_TRIGGERING_ACTOR" = mamaclapper
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = 'refs/heads/beta-android-owner-followup-proof-20261112'
          test "$GITHUB_WORKFLOW_REF" = "VortXTV/VortX/.github/workflows/source-contracts.yml@$GITHUB_REF"
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list --parents -n 1 HEAD)" = "$GITHUB_SHA acbec246470a1d105fdc433b36c23fc42b5d02c5"
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/source-contracts.yml
          test -z "$(git status --porcelain)"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - name: Select the pinned Android NDK
        run: sdkmanager 'ndk;30.0.16248370'
      - name: Compile Play Debug and run Android owner tests
        working-directory: android
        run: >-
          ./gradlew :app:testPlayDebugUnitTest --no-daemon --max-workers=2
          -Pvortx.nativeEngine=true -Pvortx.nativeResourceHost=true
          --tests com.vortx.android.deeplink.VortXDeepLinkTest
          --tests com.vortx.android.downloads.DownloadManagerOwnerClaimContractTest
          --tests com.vortx.android.downloads.DownloadPlaybackRoutingTest
          --tests com.vortx.android.downloads.DownloadTransferPolicyTest
          --tests com.vortx.android.notifications.EpisodeNotificationOwnerTest
          --tests com.vortx.android.player.PlaybackOwnerWiringTest
          --tests com.vortx.android.profile.ContinueWatchingOwnerGateTest
          --tests com.vortx.android.profile.ProfileSelectionHandoffTest
          --tests com.vortx.android.profile.ProfileSelectionWiringTest
          --tests com.vortx.android.tv.WatchNextPublicationTest
          --tests com.vortx.android.ui.screens.WhosWatchingPickerContractTest
      - name: Require the exact focused Android owner roster
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          expected = {
              'com.vortx.android.deeplink.VortXDeepLinkTest': 20,
              'com.vortx.android.downloads.DownloadManagerOwnerClaimContractTest': 5,
              'com.vortx.android.downloads.DownloadPlaybackRoutingTest': 19,
              'com.vortx.android.downloads.DownloadTransferPolicyTest': 36,
              'com.vortx.android.notifications.EpisodeNotificationOwnerTest': 5,
              'com.vortx.android.player.PlaybackOwnerWiringTest': 13,
              'com.vortx.android.profile.ContinueWatchingOwnerGateTest': 2,
              'com.vortx.android.profile.ProfileSelectionHandoffTest': 12,
              'com.vortx.android.profile.ProfileSelectionWiringTest': 8,
              'com.vortx.android.tv.WatchNextPublicationTest': 3,
              'com.vortx.android.ui.screens.WhosWatchingPickerContractTest': 6,
          }
          source = Path('android/app/src/test/kotlin')
          for name, count in expected.items():
              test_source = (source / (name.replace('.', '/') + '.kt')).read_text(encoding='utf-8')
              assert len(re.findall(r'^\s*@Test\b', test_source, flags=re.M)) == count, f'{name}: source count differs'

          root = Path('android/app/build/test-results/testPlayDebugUnitTest')
          paths = set(root.rglob('*.xml'))
          assert paths == {root / ('TEST-' + name + '.xml') for name in expected}, 'JUnit XML roster differs'
          for name, count in expected.items():
              suite = ET.parse(root / ('TEST-' + name + '.xml')).getroot()
              cases = suite.findall('testcase')
              assert suite.tag == 'testsuite' and suite.get('name') == name, f'{name}: wrong suite identity'
              assert len(cases) == int(suite.get('tests', '-1')) == count, f'{name}: wrong count'
              assert all(case.get('classname') == name and case.get('name') for case in cases), f'{name}: wrong case identity'
              assert len({case.get('name') for case in cases}) == count, f'{name}: duplicate test names'
              assert all(suite.get(field) == '0' for field in ('failures', 'errors', 'skipped')), f'{name}: non-green count'
              assert all(not suite.findall('.//' + field) for field in ('failure', 'error', 'skipped')), f'{name}: non-green case'
              print(f'{name}: {count} passed')
          print(f'ANDROID_OWNER_FOLLOWUP_PROOF: {sum(expected.values())} passed in {len(expected)} suites')
          PY
