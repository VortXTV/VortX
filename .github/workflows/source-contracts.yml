name: Verify corrected Beta 13 Apple player contracts

on: workflow_dispatch

permissions:
  contents: read

jobs:
  exact-fixtures:
    if: >-
      github.event_name == 'workflow_dispatch' && github.repository == 'VortXTV/VortX' &&
      github.actor == 'mamaclapper' && github.ref == 'refs/heads/beta13-player-contract-proof-20261111'
    runs-on: macos-26-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prove fixture-only changes against the exact frozen application source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_WORKFLOW_REF" = 'VortXTV/VortX/.github/workflows/source-contracts.yml@refs/heads/beta13-player-contract-proof-20261111'
          test "$GITHUB_RUN_ATTEMPT" = 1
          FROZEN=4d3ef04324b887038da4ff4cf3e822cd07cf101e
          FIXTURE=d21423d65e80a85ecb2083bcc3f54f51315a6bfb
          test "$(git rev-parse HEAD^)" = "$FIXTURE"
          test "$(git rev-parse "$FIXTURE^" )" = "$FROZEN"
          git diff --name-only "$FROZEN" HEAD | LC_ALL=C sort | cmp - <(printf '%s\n' \
            .github/workflows/source-contracts.yml \
            app/Tests/PlayerLiveContractTests.swift \
            test/apple-player-timeline-boundaries.test.js)
          test -z "$(git status --porcelain)"

      - name: Run the same Apple playback parity contracts
        run: bash scripts/test-apple-parity-contracts.sh

      - name: Run the same Apple player timeline contracts and runtime probes
        run: bash scripts/test-apple-player-timeline.sh
