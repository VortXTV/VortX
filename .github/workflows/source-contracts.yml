name: Apple website sign-in probe proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website-signin-probe:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'VortXTV/VortX' && github.actor == 'mamaclapper' &&
      github.ref == 'refs/heads/beta-website-signin-probe-proof-20261112'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Check out the exact reviewed probe source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Exercise Apple account admission and the sign-in probe
        shell: bash
        run: |
          set -euo pipefail
          ref=refs/heads/beta-website-signin-probe-proof-20261112
          test "$GITHUB_REF" = "$ref"
          test "$GITHUB_WORKFLOW_REF" = "VortXTV/VortX/.github/workflows/source-contracts.yml@$ref"
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 9ef28055ed041776ea6324b43640ccde5ea24c94
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/source-contracts.yml
          test -z "$(git status --porcelain)"
          bash scripts/test-native-migration-phase-a.sh restore
          set -- app/build/native-migration-restore.*
          test "$#" = 1
          jq -e '.stage == "restore" and .exit == 0 and .interrupted == 0' "$1/result.json"
          grep -Fx 'Native restore admission: 259 focused checks passed; no device/login or full mount proof' "$1/test.log"
          test -z "$(git status --porcelain)"
