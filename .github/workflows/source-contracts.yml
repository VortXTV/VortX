        type: boolean
        default: false
      native_media_apple:
        description: Include Apple in a manual native-media candidate run
        type: boolean
        default: true
      native_media_android:
        description: Include Android in a manual native-media candidate run
        type: boolean
        default: true

# Pure source/HTTP fixtures only: no private engine checkout, signing credentials or publication.
permissions:
  contents: read
concurrency:
  group: source-contracts-${{ github.workflow }}-${{ github.ref }}${{ inputs.native_media_candidates && format('-native-media-{0}-{1}', inputs.native_media_apple, inputs.native_media_android) || '' }}
  cancel-in-progress: ${{ !inputs.native_media_candidates }}
jobs:
  apple-policies:
    if: ${{ !inputs.native_media_candidates && !inputs.apple_hotfix_checks }}
    # The production SwiftUI views use SDK 26 glass APIs; exercise them on the same
    # runner generation as Apple packaging instead of the older default SDK.
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Ensure ripgrep is available
        id: apple_prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install ripgrep
          fi
          rg --version
      - run: bash scripts/test-release-orchestration-contracts.sh
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - run: ruby scripts/test-native-apple-project.rb
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - run: bash scripts/test-cinema-rail-layout.sh
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - run: bash scripts/test-avplayer-recovery-settlement.sh
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - run: bash scripts/test-player-skip-chrome.sh
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - run: bash scripts/test-apple-playback-profile-lifecycle.sh
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - run: bash scripts/test-landscape-backdrop-cache.sh
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - run: bash scripts/test-native-transport.sh
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - run: bash scripts/test-tv-search-collections.sh
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - run: bash scripts/test-addon-selfhosted.sh
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - run: bash scripts/test-episode-source-isolation.sh
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - name: Fetch immutable public next-episode cancellation baseline
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
        run: git fetch --no-tags --depth=1 origin f9c45518ba6b8d779343c076da9f0dbcda129a30
      - run: bash scripts/test-next-preparation-attempt.sh
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - run: python3 scripts/tests/test_native_builder_startup.py
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - run: python3 scripts/tests/test_native_apple_package.py
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - run: python3 scripts/tests/test_release_native_snapshot_argv.py
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - run: python3 scripts/tests/test_android_release_version.py
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - run: python3 scripts/tests/test_tv_hidden_up_reveal.py
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - run: node --test workers/vortx-appcast/test/index.test.mjs
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - run: bash scripts/test-subtitle-source-contracts.sh
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - run: bash scripts/test-apple-playback-recovery.sh
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - run: node scripts/test-native-qr-join.cjs
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - run: bash scripts/test-profile-selection-read.sh
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - run: bash scripts/test-native-facade-lock.sh
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - run: bash scripts/test-legacy-profile-recovery.sh
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - name: Fetch immutable public playback snapshot baseline
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
        run: git fetch --no-tags --depth=1 origin 57e1a98806d99b1ba074a455791b20aaea33894a
      - run: bash scripts/test-native-playback-snapshot.sh working-tree --focused
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - name: Fetch immutable public Library projection oracle
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
        run: git fetch --no-tags --depth=1 origin 82cc8387222469d36dfbb7fc09881c375e36de45
      - run: bash scripts/test-native-library-projection-perf.sh working-tree --functional-only
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - run: bash scripts/test-issue240-playback-failures.sh
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - run: bash scripts/test-source-continuity-and-seek-intent.sh
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - run: bash scripts/test-hls-seek-producer-gate.sh
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - run: bash scripts/test-hls-startup-reservation.sh
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - run: bash scripts/test-mpv-seek-settlement.sh
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - run: bash scripts/test-mpv-manual-subtitle-retirement.sh
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - run: bash scripts/test-avplayer-subtitle-clock.sh
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - run: bash scripts/test-subtitle-mount-owner.sh
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - run: bash scripts/test-subtitle-timing-policy.sh
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - run: bash scripts/test-sync-derived-document-revisions.sh
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - run: bash scripts/test-native-bootstrap-archive.sh
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - run: bash scripts/test-profile-roster-propagation.sh
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - run: node --test test/android-profile-picker-startup.test.mjs
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - name: Fetch immutable public Continue Watching regression baselines
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
        run: |
          git fetch --no-tags --depth=1 origin 0e196c586ebe95810476be8efde84fb0c061ca12
          git fetch --no-tags --depth=1 origin 01a0ec988205781d345d94ec2c30a65d1f1bca8c
      - run: bash scripts/test-cw-service-selection.sh
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - run: bash scripts/test-home-cw-selection.sh
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - run: bash scripts/test-cw-worker-currentness.sh
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - run: bash scripts/test-series-sticky-ownership.sh
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - run: bash scripts/test-loopback-playback-assertion.sh
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - run: bash scripts/test-addon-stream-publication.sh
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - run: bash scripts/test-native-preference-acknowledgement.sh
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - run: bash scripts/test-apple-parity-contracts.sh
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - run: node test/native-callback-generation.mjs
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - run: bash scripts/test-apple-player-timeline.sh
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - run: swift app/Tests/MacSettingsShellContractTests.swift
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
      - run: swiftc -parse-as-library app/SourcesShared/TabBarPrefs.swift app/Tests/CompactNavigationPolicyTests.swift -o /tmp/compact-navigation-test && /tmp/compact-navigation-test
        if: ${{ !cancelled() && steps.apple_prerequisites.outcome == 'success' }}
  web:
    if: ${{ !inputs.native_media_candidates && !inputs.apple_hotfix_checks }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm install --global npm@12.2.0
      - working-directory: webapp
        run: npm ci --ignore-scripts --no-audit --no-fund
      - working-directory: webapp
        run: npm run typecheck && npm test && npm run build

  apple-hotfix-checks:
    if: github.event_name == 'workflow_dispatch' && inputs.apple_hotfix_checks && !inputs.native_media_candidates
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ensure focused test prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install ripgrep
          fi
          rg --version
      - name: Focused Apple recovery regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tests/test_native_builder_startup.py
          python3 scripts/tests/test_ci_beta8_apple_hotfix.py
          bash scripts/test-native-profile-picker-routing.sh
          mkdir -p app/build/auth-recovery
          echo "c83153feedd91bee93000305604d68772d4b7164716749f0a04605bbb2253f62  test/mpv-bounded-child.mjs" | shasum -a 256 --check
          auth_status=0
          nice -n 15 node test/mpv-bounded-child.mjs run 300 "$PWD/app/build/auth-recovery/supervisor.json" -- \
            /bin/zsh test/apple-auth-recovery/test-auth-recovery.sh "$PWD" "$PWD/app/build/auth-recovery" \
            > app/build/auth-recovery/run.log 2>&1 || auth_status=$?
          cat app/build/auth-recovery/run.log
          node test/mpv-bounded-child.mjs check "$PWD/app/build/auth-recovery/supervisor.json" "$auth_status"
          test "$auth_status" -eq 0
          node test/mpv-bounded-child.mjs check "$PWD/app/build/auth-recovery/supervisor.json" 0 normal-exit
          bash scripts/test-xperience-export-contracts.sh
      - name: Session renewal and credential storage regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/build/session-renewal-receipts
          echo "c83153feedd91bee93000305604d68772d4b7164716749f0a04605bbb2253f62  test/mpv-bounded-child.mjs" | shasum -a 256 --check
          renewal_status=0
          nice -n 15 node test/mpv-bounded-child.mjs run 600 "$PWD/app/build/session-renewal-receipts/supervisor.json" -- \
            /bin/bash test/apple-session-renewal/run-hosted.sh "$PWD/app/SourcesShared" \
            "$PWD/test/apple-session-renewal/source-pins.json" "$PWD" "$PWD/app/build/session-renewal-receipts/scratch" \
            > app/build/session-renewal-receipts/run.log 2>&1 || renewal_status=$?
          printf '%s\n' "$renewal_status" > app/build/session-renewal-receipts/status.txt
          cat app/build/session-renewal-receipts/run.log
          node test/mpv-bounded-child.mjs check "$PWD/app/build/session-renewal-receipts/supervisor.json" "$renewal_status"
          test "$renewal_status" -eq 0
          node test/mpv-bounded-child.mjs check "$PWD/app/build/session-renewal-receipts/supervisor.json" 0 normal-exit
      - name: Verify bootstrap, Library and diagnostic installer fixes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/build/local-installer-checks
          echo "c83153feedd91bee93000305604d68772d4b7164716749f0a04605bbb2253f62  test/mpv-bounded-child.mjs" | shasum -a 256 --check
          if ! git cat-file -e 82cc8387222469d36dfbb7fc09881c375e36de45^{commit}; then
            git -c gc.auto=0 fetch --no-tags --depth=1 origin 82cc8387222469d36dfbb7fc09881c375e36de45
          fi
          # Real native OAuth runs under the protected real-SDK live-ABI parent before app builds.
          for local_check in bootstrap library diagnostics; do
            case "$local_check" in
              bootstrap) local_command=(/bin/bash scripts/test-native-bootstrap-archive.sh) ;;
              library) local_command=(/bin/bash scripts/test-native-library-projection-perf.sh working-tree --functional-only) ;;
              diagnostics) local_command=(/usr/bin/env node scripts/test-pre-profile-diagnostic-export.mjs) ;;
            esac
            local_status=0
            nice -n 15 node test/mpv-bounded-child.mjs run 600 "$PWD/app/build/local-installer-checks/$local_check.supervisor.json" -- \
              "${local_command[@]}" > "app/build/local-installer-checks/$local_check.log" 2>&1 || local_status=$?
            printf '%s\n' "$local_status" > "app/build/local-installer-checks/$local_check.status.txt"
            cat "app/build/local-installer-checks/$local_check.log"
            node test/mpv-bounded-child.mjs check "$PWD/app/build/local-installer-checks/$local_check.supervisor.json" "$local_status"
            test "$local_status" -eq 0
            node test/mpv-bounded-child.mjs check "$PWD/app/build/local-installer-checks/$local_check.supervisor.json" 0 normal-exit
          done
      - name: Retain focused regression outputs and failure receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Apple-hotfix-regression-receipts
          path: |
            app/build/auth-recovery/**
            app/build/session-renewal-receipts/**
            app/build/local-installer-checks/**
            app/build/native-migration-bootstrap.*/**
            app/build/native-library-projection.*/**
            app/build/pre-profile-diagnostic-export.*/**
            app/build/profile-picker-routing.*/**
            app/build/xperience-export-contracts.*/**
          if-no-files-found: warn
          retention-days: 30

  native-media-candidates:
    if: github.event_name == 'workflow_dispatch' && inputs.native_media_candidates
    uses: ./.github/workflows/native-media-candidates.yml
    with:
      apple: ${{ inputs.native_media_apple }}
      android: ${{ inputs.native_media_android }}
