name: Verify downloaded cross-season playback
run-name: Android and Apple downloaded cross-season proof

on: workflow_dispatch

permissions:
  contents: read

env:
  APP_SOURCE: 4543d6d507c4f3e60054e82f7c4ab61065d1c2a0

jobs:
  android:
    if: >-
      github.event_name == 'workflow_dispatch' && github.repository == 'VortXTV/VortX' &&
      github.repository_id == '1261501126' && github.actor == 'mamaclapper' &&
      github.actor_id == '50227842' && github.run_attempt == '1' &&
      github.ref == 'refs/heads/beta-downloaded-cross-season-proof-20261112'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the exact source and operation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = VortXTV/VortX
          test "$GITHUB_REPOSITORY_ID" = 1261501126
          test "$GITHUB_ACTOR" = mamaclapper
          test "$GITHUB_ACTOR_ID" = 50227842
          test "$GITHUB_TRIGGERING_ACTOR" = mamaclapper
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = 'refs/heads/beta-downloaded-cross-season-proof-20261112'
          test "$GITHUB_WORKFLOW_REF" = "VortXTV/VortX/.github/workflows/source-contracts.yml@$GITHUB_REF"
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list --parents -n 1 HEAD)" = "$GITHUB_SHA $APP_SOURCE"
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/source-contracts.yml
          test -z "$(git status --porcelain)"
          test "$(grep -Ec '^ +[^#]+: [A-Z_]+_COUNT_PLACEHOLDER,$' .github/workflows/source-contracts.yml)" = 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0 cmake;4.1.2'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - name: Select the pinned Android NDK
        run: sdkmanager 'ndk;30.0.16248370'
      - name: Compile Play Debug and run focused JVM tests
        working-directory: android
        run: >-
          ./gradlew :app:testPlayDebugUnitTest --no-daemon --max-workers=2 --no-build-cache
          -Pvortx.nativeEngine=true -Pvortx.nativeResourceHost=true
          --tests com.vortx.android.downloads.DownloadedSeasonBoundaryTest
          --tests com.vortx.android.downloads.OfflinePlaybackIdentityTest
          --tests com.vortx.android.downloads.DownloadPlaybackRoutingTest
          --tests com.vortx.android.downloads.DownloadManagerOwnerClaimContractTest
          --tests com.vortx.android.player.PlaybackOwnerWiringTest
      - name: Acquire the reviewed public Android mpv component for Full Debug
        run: /usr/bin/python3 -I scripts/acquire-android-mpv-component.py
      - name: Compile Full Debug and run focused JVM tests
        working-directory: android
        run: >-
          ./gradlew :app:testFullDebugUnitTest --no-daemon --max-workers=2 --no-build-cache
          -Pvortx.nativeEngine=true -Pvortx.nativeResourceHost=true
          --tests com.vortx.android.downloads.DownloadedSeasonBoundaryTest
          --tests com.vortx.android.downloads.OfflinePlaybackIdentityTest
          --tests com.vortx.android.downloads.DownloadPlaybackRoutingTest
          --tests com.vortx.android.downloads.DownloadManagerOwnerClaimContractTest
          --tests com.vortx.android.player.PlaybackOwnerWiringTest
      - name: Require both exact focused Android rosters
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          expected = {
              'com.vortx.android.downloads.DownloadedSeasonBoundaryTest': 12,
              'com.vortx.android.downloads.OfflinePlaybackIdentityTest': 16,
              'com.vortx.android.downloads.DownloadPlaybackRoutingTest': 19,
              'com.vortx.android.downloads.DownloadManagerOwnerClaimContractTest': 5,
              'com.vortx.android.player.PlaybackOwnerWiringTest': 13,
          }
          source = Path('android/app/src')
          for name, count in expected.items():
              test_source = (source / 'test' / 'kotlin' / (name.replace('.', '/') + '.kt')).read_text(encoding='utf-8')
              assert len(re.findall(r'^\s*@Test\b', test_source, flags=re.M)) == count, f'{name}: source count differs'

          for variant in ('Play', 'Full'):
              root = Path(f'android/app/build/test-results/test{variant}DebugUnitTest')
              paths = set(root.rglob('*.xml'))
              assert paths == {root / ('TEST-' + name + '.xml') for name in expected}, f'{variant}: JUnit XML roster differs'
              for name, count in expected.items():
                  suite = ET.parse(root / ('TEST-' + name + '.xml')).getroot()
                  cases = suite.findall('testcase')
                  assert suite.tag == 'testsuite' and suite.get('name') == name, f'{variant}/{name}: wrong suite identity'
                  assert len(cases) == int(suite.get('tests', '-1')) == count, f'{variant}/{name}: wrong count'
                  assert all(case.get('classname') == name and case.get('name') for case in cases), f'{variant}/{name}: wrong case identity'
                  assert len({case.get('name') for case in cases}) == count, f'{variant}/{name}: duplicate test names'
                  assert all(suite.get(field) == '0' for field in ('failures', 'errors', 'skipped')), f'{variant}/{name}: non-green count'
                  assert all(not suite.findall('.//' + field) for field in ('failure', 'error', 'skipped')), f'{variant}/{name}: non-green case'
                  print(f'{variant} Debug {name}: {count} passed')
              print(f'ANDROID_CROSS_SEASON_PROOF_{variant.upper()}: {sum(expected.values())} passed in {len(expected)} suites')
          PY

  apple:
    if: >-
      github.event_name == 'workflow_dispatch' && github.repository == 'VortXTV/VortX' &&
      github.repository_id == '1261501126' && github.actor == 'mamaclapper' &&
      github.actor_id == '50227842' && github.run_attempt == '1' &&
      github.ref == 'refs/heads/beta-downloaded-cross-season-proof-20261112'
    runs-on: macos-26
    timeout-minutes: 18
    env:
      APPLE_NON_SERIES_EXPECTED_PASS_COUNT: '106'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the exact source and operation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = VortXTV/VortX
          test "$GITHUB_REPOSITORY_ID" = 1261501126
          test "$GITHUB_ACTOR" = mamaclapper
          test "$GITHUB_ACTOR_ID" = 50227842
          test "$GITHUB_TRIGGERING_ACTOR" = mamaclapper
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = 'refs/heads/beta-downloaded-cross-season-proof-20261112'
          test "$GITHUB_WORKFLOW_REF" = "VortXTV/VortX/.github/workflows/source-contracts.yml@$GITHUB_REF"
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list --parents -n 1 HEAD)" = "$GITHUB_SHA $APP_SOURCE"
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/source-contracts.yml
          test -z "$(git status --porcelain)"
          test "$(grep -Ec '^ +[^#]+: [A-Z_]+_COUNT_PLACEHOLDER,$' .github/workflows/source-contracts.yml)" = 0
          [[ "$APPLE_NON_SERIES_EXPECTED_PASS_COUNT" =~ ^[1-9][0-9]*$ ]]
      - name: Compile and run standalone Swift 6 cross-season fixtures
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d "$RUNNER_TEMP/vortx-cross-season.XXXXXXXX")"
          trap 'rm -rf -- "$scratch"' EXIT
          xcrun swiftc --version
          swift_flags=(-swift-version 6 -strict-concurrency=complete -warnings-as-errors -parse-as-library -j 1 -num-threads 1)

          nice -n 15 xcrun swiftc "${swift_flags[@]}" \
            app/Tests/DownloadResumeLaunchContractTests.swift -o "$scratch/download-resume-launch"
          "$scratch/download-resume-launch" | tee "$scratch/download-resume-launch.log"
          test "$(grep -Fxc 'PASS downloaded Apple resume lookup, owner/cancel/file guards and preview-exit persistence ordering' \
            "$scratch/download-resume-launch.log")" = 1

          nice -n 15 xcrun swiftc "${swift_flags[@]}" \
            app/SourcesShared/DetailMetaRecoveryPolicy.swift \
            app/SourcesShared/CatalogRowResolution.swift \
            app/SourcesShared/AppleCWSeasonRolloverPolicy.swift \
            app/SourcesShared/UsenetStreamValidation.swift \
            app/SourcesShared/DebridPlaybackAvailability.swift \
            app/SourcesShared/ProfileAddonPreferences.swift \
            app/SourcesShared/DiagnosticPlaybackIntegrityPolicy.swift \
            app/SourcesShared/CoreModels.swift \
            app/SourcesShared/SubtitleReleaseFingerprint.swift \
            app/SourcesShared/DownloadModels.swift \
            app/Tests/NonSeriesEpisodeLifecycleContractTests.swift \
            -o "$scratch/nonseries-episode-lifecycle"
          "$scratch/nonseries-episode-lifecycle" | tee "$scratch/nonseries-episode-lifecycle.log"
          test "$(grep -Fxc 'ALL PASS' "$scratch/nonseries-episode-lifecycle.log")" = 1
          test "$(grep -c '^FAIL  ' "$scratch/nonseries-episode-lifecycle.log")" = 0
          test "$(grep -c '^PASS  ' "$scratch/nonseries-episode-lifecycle.log")" = "$APPLE_NON_SERIES_EXPECTED_PASS_COUNT"
          printf 'APPLE_CROSS_SEASON_PROOF: launch wiring passed; %s lifecycle assertions passed\n' "$APPLE_NON_SERIES_EXPECTED_PASS_COUNT"
