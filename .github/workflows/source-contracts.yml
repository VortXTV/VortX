name: Verify downloaded playback and Top Shelf fallback

on: workflow_dispatch

permissions:
  contents: read

jobs:
  apple:
    if: >-
      github.event_name == 'workflow_dispatch' && github.repository == 'VortXTV/VortX' &&
      github.actor == 'mamaclapper' && github.ref == 'refs/heads/beta-offline-playback-proof-20261111'
    runs-on: macos-26-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the exact source and operation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
          test "$GITHUB_WORKFLOW_REF" = 'VortXTV/VortX/.github/workflows/source-contracts.yml@refs/heads/beta-offline-playback-proof-20261111'
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '33ada1bc6506643c350ab8add91fe6dff23caa71'
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/source-contracts.yml
          test -z "$(git status --porcelain)"
      - name: Parse changed production Swift for each Apple SDK
        shell: bash
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r file; do files+=("$file"); done < <(
            git diff --name-only 4d3ef04324b887038da4ff4cf3e822cd07cf101e HEAD -- 'app/Sources*/*.swift'
          )
          test "${#files[@]}" -gt 0
          for pair in macosx:x86_64-apple-macosx15.0 iphoneos:arm64-apple-ios18.0 appletvos:arm64-apple-tvos18.0; do
            sdk="${pair%%:*}"
            xcrun --sdk "$sdk" swiftc -frontend -parse -swift-version 6 -target "${pair#*:}" \
              -sdk "$(xcrun --sdk "$sdk" --show-sdk-path)" "${files[@]}"
          done
      - name: Verify Apple playback and downloaded resume
        run: bash scripts/test-apple-parity-contracts.sh
      - name: Verify Apple end-of-playback and episode transition regressions
        run: bash scripts/test-apple-player-timeline.sh
      - name: Exercise downloaded file and immediate successor policies
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc -j 1 -num-threads 1 -o "$RUNNER_TEMP/nonseries-episode-lifecycle" \
            app/SourcesShared/DetailMetaRecoveryPolicy.swift \
            app/SourcesShared/CatalogRowResolution.swift \
            app/SourcesShared/AppleCWSeasonRolloverPolicy.swift \
            app/SourcesShared/UsenetStreamValidation.swift \
            app/SourcesShared/DebridPlaybackAvailability.swift \
            app/SourcesShared/ProfileAddonPreferences.swift \
            app/SourcesShared/DiagnosticPlaybackIntegrityPolicy.swift \
            app/SourcesShared/CoreModels.swift \
            app/SourcesShared/SubtitleReleaseFingerprint.swift \
            app/SourcesShared/DownloadModels.swift \
            app/Tests/NonSeriesEpisodeLifecycleContractTests.swift
          "$RUNNER_TEMP/nonseries-episode-lifecycle"
      - name: Exercise Top Shelf privacy and active-profile fallback
        run: |
          bash scripts/test-home-cw-selection.sh
          bash scripts/test-cw-service-selection.sh

  android:
    if: >-
      github.event_name == 'workflow_dispatch' && github.repository == 'VortXTV/VortX' &&
      github.actor == 'mamaclapper' && github.ref == 'refs/heads/beta-offline-playback-proof-20261111'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the exact source and operation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
          test "$GITHUB_WORKFLOW_REF" = 'VortXTV/VortX/.github/workflows/source-contracts.yml@refs/heads/beta-offline-playback-proof-20261111'
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '33ada1bc6506643c350ab8add91fe6dff23caa71'
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/source-contracts.yml
          test -z "$(git status --porcelain)"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - name: Select the pinned Android NDK
        run: sdkmanager 'ndk;30.0.16248370'
      - name: Compile the app and exercise downloaded playback identity
        working-directory: android
        run: >-
          ./gradlew :app:testPlayDebugUnitTest --no-daemon --max-workers=2
          -Pvortx.nativeEngine=true -Pvortx.nativeResourceHost=true
          --tests com.vortx.android.downloads.OfflinePlaybackIdentityTest
          --tests com.vortx.android.downloads.DownloadPlaybackRoutingTest
          --tests com.vortx.android.player.PlaybackOwnerWiringTest
          --tests com.vortx.android.player.PlaybackIntentControllerTest
      - name: Require every focused regression to run
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          expected = {
              'com.vortx.android.downloads.OfflinePlaybackIdentityTest': 13,
              'com.vortx.android.downloads.DownloadPlaybackRoutingTest': 15,
              'com.vortx.android.player.PlaybackOwnerWiringTest': 13,
              'com.vortx.android.player.PlaybackIntentControllerTest': 20,
          }
          root = Path('android/app/build/test-results/testPlayDebugUnitTest')
          paths = set(root.glob('TEST-*.xml'))
          assert paths == {root / ('TEST-' + name + '.xml') for name in expected}
          for name, cases in expected.items():
              suite = ET.parse(root / ('TEST-' + name + '.xml')).getroot()
              assert suite.tag == 'testsuite' and suite.get('name') == name
              assert len(suite.findall('testcase')) == int(suite.get('tests', '-1')) == cases
              assert all(suite.get(field) == '0' for field in ('failures', 'errors', 'skipped'))
              assert all(not suite.findall('.//' + field) for field in ('failure', 'error', 'skipped'))
              print(f'{name}: {cases} passed')
          PY
