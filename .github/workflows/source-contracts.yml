name: Verify Android downloaded playback and ownership

on: workflow_dispatch

permissions:
  contents: read

jobs:
  android:
    if: >-
      github.event_name == 'workflow_dispatch' && github.repository == 'VortXTV/VortX' &&
      github.actor == 'mamaclapper' && github.ref == 'refs/heads/beta-offline-playback-android-proof-20261111'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the exact source and operation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
          test "$GITHUB_WORKFLOW_REF" = 'VortXTV/VortX/.github/workflows/source-contracts.yml@refs/heads/beta-offline-playback-android-proof-20261111'
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '86b19107c8bb23cb2c0a3cf80cb6d4f42d7ed151'
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/source-contracts.yml
          test -z "$(git status --porcelain)"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - name: Select the pinned Android NDK
        run: sdkmanager 'ndk;30.0.16248370'
      - name: Compile the app and exercise downloaded playback identity
        working-directory: android
        run: >-
          ./gradlew :app:testPlayDebugUnitTest --no-daemon --max-workers=2
          -Pvortx.nativeEngine=true -Pvortx.nativeResourceHost=true
          --tests com.vortx.android.downloads.OfflinePlaybackIdentityTest
          --tests com.vortx.android.downloads.DownloadPlaybackRoutingTest
          --tests com.vortx.android.player.PlaybackOwnerWiringTest
          --tests com.vortx.android.player.PlaybackIntentControllerTest
      - name: Require every focused regression to run
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          expected = {
              'com.vortx.android.downloads.OfflinePlaybackIdentityTest': 13,
              'com.vortx.android.downloads.DownloadPlaybackRoutingTest': 15,
              'com.vortx.android.player.PlaybackOwnerWiringTest': 13,
              'com.vortx.android.player.PlaybackIntentControllerTest': 20,
          }
          root = Path('android/app/build/test-results/testPlayDebugUnitTest')
          paths = set(root.glob('TEST-*.xml'))
          assert paths == {root / ('TEST-' + name + '.xml') for name in expected}
          for name, cases in expected.items():
              suite = ET.parse(root / ('TEST-' + name + '.xml')).getroot()
              assert suite.tag == 'testsuite' and suite.get('name') == name
              assert len(suite.findall('testcase')) == int(suite.get('tests', '-1')) == cases
              assert all(suite.get(field) == '0' for field in ('failures', 'errors', 'skipped'))
              assert all(not suite.findall('.//' + field) for field in ('failure', 'error', 'skipped'))
              print(f'{name}: {cases} passed')
          PY
