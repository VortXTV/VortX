name: Release packaging validation

# REL-03 secretless pull-request validation lane. The privileged release workflows
# (.github/workflows/android-release.yml, release-tvos.yml) hold signing secrets and the private
# engine token, so by design they never run on pull requests; before this file existed the first
# complete exercise of packaging-specific scripts could happen only after merge or during a real
# release. This lane closes that gap WITHOUT weakening the W1-A signing posture:
#
#   - It references NO secrets of any kind (`secrets.` context is banned here; the contract test
#     scripts/test-release-orchestration-contracts.sh enforces that), fetches NO private repos,
#     and holds only `contents: read`.
#   - Android job: exercises the EXACT release packaging tasks from android-release.yml
#     (assembleFullRelease assemblePlayRelease bundlePlayRelease) against an EPHEMERAL ad-hoc
#     keystore generated on the runner at run time. Nothing is published from this lane, so the
#     throwaway identity proves packaging mechanics only; the production four-secret fail-closed
#     gate, the pinned production signer SHA-256 verification, and the tag/source-commit binding
#     remain exclusively in the protected release stage.
#   - Apple job: runs the fixture-driven tests of the packaging/feed scripts that releases call
#     (release-feed.mjs, gen-altstore-source.py, repackage-ipa.sh), then generates the real Xcode
#     project via pinned XcodeGen and exercises compile/link/package for tvOS, iOS, and macOS
#     shells with CODE_SIGNING_ALLOWED=NO. CI-only stub engine xcframeworks stand in for the
#     private engine source (unavailable to PRs); contract tests prove protected workflows cannot
#     consume them. Signed archives and notarization stay in the thin protected release stage.
#
# Documented limits of what CAN be validated secretlessly (do not silently widen):
#   - libvortx_ffi.so comes from a PRIVATE repository, so the Android APKs built
#     here carry no engine .so files (the gradle tasks warn-skip exactly as on dev machines).
#     Engine-linked packaging stays validated by the privileged push/release lanes only.
#   - No Apple code-signing identity or notarization is exercised here (requires paid accounts).

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-packaging-validation-${{ github.workflow_ref }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-release-packaging:
    name: Ad-hoc Android Full+Play release packaging (secretless)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      # Toolchain parity with the privileged lanes: same pinned setup-android/setup-gradle/NDK as
      # android.yml + android-release.yml, so packaging behavior observed here transfers.
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0 cmake;4.1.2"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Install Android NDK (must match ndkVersion in app/build.gradle.kts)
        run: |
          yes | sdkmanager "ndk;30.0.16248370"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Prove the native-only build and rejection of removed engine selections
        run: bash scripts/test-android-native-selection.sh

      - name: Exercise signer parsing and strict verification fixtures
        run: |
          bash scripts/test-android-release-signing.sh
          python3 scripts/tests/test_android_release_version.py

      # Ephemeral ad-hoc release identity: generated on THIS runner for THIS run only, never
      # committed, never used to publish, shredded below even on failure. A distinct CN (not
      # "Android Debug") keeps the no-debug-fallback invariant testable: the verifier below
      # asserts the exact ad-hoc subject AND rejects any Android Debug certificate.
      - name: Generate ephemeral ad-hoc release keystore
        env:
          ADHOC_STORE_PASS: vortx-adhoc-ci-store
          # JDK PKCS12 normalizes a distinct key password to the store password. Keep this
          # deliberately equal so the Gradle release build below proves the exact supported path.
          ADHOC_KEY_PASS: vortx-adhoc-ci-store
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/adhoc-signing"
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/adhoc-signing/adhoc-release.jks" \
            -storetype PKCS12 \
            -alias adhoc-release \
            -keyalg RSA -keysize 4096 -validity 1 \
            -storepass "$ADHOC_STORE_PASS" -keypass "$ADHOC_KEY_PASS" \
            -dname "CN=VortX CI Ad-hoc Release, O=VortXTV, C=US"
          # The immediately following Gradle release build consumes both storePassword and
          # keyPassword from these same inputs, proving the supported PKCS12 signing path.
          keytool -list -v -keystore "$RUNNER_TEMP/adhoc-signing/adhoc-release.jks" \
            -storetype PKCS12 -storepass "$ADHOC_STORE_PASS" -alias adhoc-release >/dev/null

      # Same task set as the privileged release build (android-release.yml), same fail-closed
      # signing-config path in app/build.gradle.kts (the four VORTX_* inputs are all provided,
      # pointing at the ephemeral keystore). Engines are intentionally NOT fetched and
      # VORTX_REQUIRE_ENGINE is NOT set, so the native Cargo task takes the documented dev-machine
      # warn-and-skip path; every other packaging phase (Kotlin/Compose release compilation,
      # manifest merge, resources, libmpv native merge, DEX, AGP signing, AAB) is exercised.
      - name: Acquire reviewed Android mpv component (public-only; baseline is a no-op)
        run: /usr/bin/python3 -I scripts/acquire-android-mpv-component.py

      - name: Build Full+Play release packages with the ephemeral identity
        working-directory: android
        env:
          VORTX_KEYSTORE_PATH: ${{ runner.temp }}/adhoc-signing/adhoc-release.jks
          VORTX_KEYSTORE_PASSWORD: vortx-adhoc-ci-store
          VORTX_KEY_ALIAS: adhoc-release
          VORTX_KEY_PASSWORD: vortx-adhoc-ci-store
        run: ./gradlew :app:assembleFullRelease :app:assemblePlayRelease :app:bundlePlayRelease --no-daemon --stacktrace

      - name: Check player startup caller contracts
        run: |
          mkdir -p android/app/build/first-frame-focused
          receipt_dir="$(mktemp -d "$PWD/android/app/build/first-frame-focused/receipt.XXXXXX")"
          node scripts/tests/android-first-frame-presentation/source-contracts.mjs "$PWD" "$receipt_dir"

      # Preserve the bounded recovery filters and exercise the actual shared Media3 metadata
      # policies. JNI-gated cases still skip without the real private native runtime.
      - name: Test Android sync, account recovery and active-media metadata
        working-directory: android
        run: >-
          ./gradlew :app:testPlayDebugUnitTest
          -Pvortx.nativeEngine=true -Pvortx.nativeResourceHost=true
          --tests com.vortx.android.sync.AndroidRealtimeSyncTest
          --tests com.vortx.android.sync.DurableSessionStateTest
          --tests com.vortx.android.sync.NativeAccountSyncTest
          --tests com.vortx.android.sync.VortXSessionOwnerTransitionContractTest
          --tests com.vortx.android.diagnostics.DiagnosticShareOperationTest
          --tests com.vortx.android.engine.NativeRetirementDispatchTest
          --tests com.vortx.android.sync.NativeAccountAttemptTest
          --tests com.vortx.android.engine.NativeWatchedMigrationProducerTest
          --tests com.vortx.android.sync.VortXSyncManagerStaleAddonEnvelopeTest
          --tests com.vortx.android.ui.viewmodel.PlaybackResolveFenceTest
          --tests com.vortx.android.ui.randompick.RandomPickPolicyTest
          --tests com.vortx.android.ui.randompick.RandomLibraryPickModelTest
          --tests com.vortx.android.ui.randompick.RandomEpisodePickModelTest
          --tests com.vortx.android.ui.randompick.RandomEpisodePlaybackLeaseTest
          --tests com.vortx.android.ui.randompick.RandomEpisodeAccessTest
          --tests com.vortx.android.ui.randompick.RandomTitlePlayRequestTest
          --tests com.vortx.android.ui.randompick.RandomPickControlsContractTest
          --tests com.vortx.android.engine.DirectLinkDisplayGroupsTest
          --tests com.vortx.android.ui.tv.TvDetailSourcesActionContractTest
          --tests com.vortx.android.whatsnew.ChangelogParserTest
          --tests com.vortx.android.player.ExoPlayerEngineStatePolicyTest
          --tests com.vortx.android.player.PlaybackMetadataTest
          --tests com.vortx.android.player.PlaybackStartupPresentationTest
          --tests com.vortx.android.player.ExoStartupAdmissionTest
          --tests com.vortx.android.player.SessionAudioPresetSessionTest
          --tests com.vortx.android.player.SessionAudioPresetSourceContractTest
          --tests com.vortx.android.sources.SourceQuickFiltersTest
          --tests com.vortx.android.sources.SourceQuickFilterCallerContractTest
          --tests com.vortx.android.sources.SourceQuickFilterTrustTest
          --tests com.vortx.android.sources.SourceQuickFilterRankingConservationTest
          --tests com.vortx.android.foryou.ForYouRowsModelTest
          --tests com.vortx.android.ui.profilepicker.ProfilePickerPresentationTest
          --tests com.vortx.android.ui.profilepicker.ProfilePickerArtworkStartupTest
          --tests com.vortx.android.iptv.LiveGuideTest
          --tests com.vortx.android.player.subtitles.SubtitleTimingSessionTest
          --tests com.vortx.android.player.SubtitleOffsetBoundaryTest
          --tests com.vortx.android.player.SubtitleOffsetMemoryTest
          --tests 'com.vortx.android.engine.NativeOwnAccountSourcesTest.malformed own row is held without losing valid siblings or raw source bytes'
          --no-daemon --stacktrace

      - name: Test Full player native-load metadata identity
        working-directory: android
        run: >-
          ./gradlew :app:testFullDebugUnitTest
          -Pvortx.nativeEngine=true -Pvortx.nativeResourceHost=true
          --tests com.vortx.android.player.mpv.MpvMetadataLoadIdentityTest
          --tests com.vortx.android.player.mpv.MpvSessionAudioRouteTest
          --no-daemon --stacktrace

      - name: Retain current-source recovery test execution and skips
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Android-recovery-unit-results
          path: |
            android/app/build/test-results/testPlayDebugUnitTest/*.xml
            android/app/build/test-results/testFullDebugUnitTest/*.xml
          if-no-files-found: error

      - name: Require the exact release package set (two universal APKs, one AAB)
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(android/app/build/outputs/apk/full/release/*.apk android/app/build/outputs/apk/play/release/*.apk)
          bundles=(android/app/build/outputs/bundle/playRelease/*.aab)
          if [ ${#apks[@]} -ne 2 ] || [ ${#bundles[@]} -ne 1 ]; then
            echo "::error::expected exactly two flavor release APKs and one play AAB, found ${#apks[@]} APKs and ${#bundles[@]} AABs"
            exit 1
          fi
          echo "ok: full + play release APKs and playRelease AAB produced"

      # Self-consistency proof of the ad-hoc signature chain, mirroring the strictness of
      # scripts/verify-android-release-signing.sh (v2 scheme required, single signer, explicit
      # Android Debug rejection) while comparing against the EPHEMERAL certificate instead of the
      # production pin. The production pin itself is untouched and lives only in the verify
      # script used by the release workflow.
      - name: Verify ad-hoc signatures fail-closed (v2 scheme, pinned-to-run cert, no debug signer)
        run: |
          set -euo pipefail
          shopt -s nullglob
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          [ -x "$apksigner" ] || { echo "::error::apksigner not found under $ANDROID_HOME/build-tools"; exit 1; }
          expected_dn="CN=VortX CI Ad-hoc Release, O=VortXTV, C=US"
          expected_fp="$(LC_ALL=C "$JAVA_HOME/bin/keytool" -list -v \
            -keystore "$RUNNER_TEMP/adhoc-signing/adhoc-release.jks" \
            -storetype PKCS12 -storepass vortx-adhoc-ci-store -alias adhoc-release \
            | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n1 | tr -d ' :' | tr '[:lower:]' '[:upper:]')"
          [ -n "$expected_fp" ] || { echo "::error::could not derive the ad-hoc certificate fingerprint from the ephemeral keystore"; exit 1; }
          apks=(android/app/build/outputs/apk/full/release/*.apk android/app/build/outputs/apk/play/release/*.apk)
          for apk in "${apks[@]}"; do
            out="$("$apksigner" verify --verbose --print-certs-pem "$apk")"
            grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' <<<"$out" \
              || { echo "::error::$apk is not verified with APK Signature Scheme v2"; exit 1; }
            begin_count="$(grep -Fc -- '-----BEGIN CERTIFICATE-----' <<<"$out" || true)"
            end_count="$(grep -Fc -- '-----END CERTIFICATE-----' <<<"$out" || true)"
            [ "$begin_count" = "1" ] && [ "$end_count" = "1" ] || { echo "::error::$apk must contain exactly one PEM signer certificate"; exit 1; }
            certificate_dir="$(mktemp -d)"
            certificate_file="$certificate_dir/signer.pem"
            awk '/-----BEGIN CERTIFICATE-----/{keep=1} keep{print} /-----END CERTIFICATE-----/{exit}' <<<"$out" > "$certificate_file"
            certificate_out="$(LC_ALL=C "$JAVA_HOME/bin/keytool" -printcert -file "$certificate_file")" || { rm -rf "$certificate_dir"; echo "::error::could not read PEM signer certificate from $apk"; exit 1; }
            rm -rf "$certificate_dir"
            if grep -Eiq 'CN[[:space:]]*=[[:space:]]*Android Debug|Android Debug' <<<"$certificate_out"; then
              echo "::error::$apk is signed by an Android Debug certificate"; exit 1
            fi
            fp="$(sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' <<<"$certificate_out" | tr -d ' :' | tr '[:lower:]' '[:upper:]')"
            [ "$fp" = "$expected_fp" ] || { echo "::error::$apk signer does not match the ephemeral ad-hoc certificate"; exit 1; }
            dn="$(sed -n 's/^Owner:[[:space:]]*//p' <<<"$certificate_out")"
            [ "$dn" = "$expected_dn" ] || { echo "::error::$apk signer DN is not the ad-hoc release identity: $dn"; exit 1; }
            echo "ok: $apk carries a valid v2 ad-hoc signature bound to the run-local certificate"
          done
          bundle="$(ls android/app/build/outputs/bundle/playRelease/*.aab)"
          # The signer is intentionally self-signed and run-local: trust ONLY this generated keystore,
          # while retaining strict entry verification and the independent fingerprint/subject checks.
          jarsigner_out="$(LC_ALL=C "$JAVA_HOME/bin/jarsigner" -verify -strict -verbose \
            -keystore "$RUNNER_TEMP/adhoc-signing/adhoc-release.jks" \
            -storepass vortx-adhoc-ci-store "$bundle" 2>&1)" \
            || { echo "::error::jarsigner strict verification failed for $bundle"; printf '%s\n' "$jarsigner_out"; exit 1; }
          grep -Eq '^jar verified.$' <<<"$jarsigner_out" \
            || { echo "::error::$bundle does not contain a verified JAR signature"; exit 1; }
          bundle_out="$(LC_ALL=C "$JAVA_HOME/bin/keytool" -printcert -jarfile "$bundle")"
          if grep -Eiq 'CN[[:space:]]*=[[:space:]]*Android Debug|Android Debug' <<<"$bundle_out"; then
            echo "::error::$bundle is signed by an Android Debug certificate"; exit 1
          fi
          bundle_count="$(sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' <<<"$bundle_out" | wc -l | tr -d '[:space:]')"
          [ "$bundle_count" = "1" ] || { echo "::error::$bundle must report exactly one signer fingerprint, found $bundle_count"; exit 1; }
          bundle_fp="$(sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' <<<"$bundle_out" | tr -d ' :' | tr '[:lower:]' '[:upper:]')"
          [ "$bundle_fp" = "$expected_fp" ] || { echo "::error::$bundle signer does not match the ephemeral ad-hoc certificate"; exit 1; }
          echo "ok: $bundle passes strict JAR verification bound to the run-local certificate"

      # Licensing boundary holds regardless of engines: the play flavor must never contain the
      # GPL mpv/ffmpeg set, and the full flavor must merge the mavenCentral libmpv natives for
      # ALL shipped ABIs (real native-input packaging proof available without the private engines).
      - name: Enforce the GPL boundary and prove native-lib merge packaging
        run: |
          set -euo pipefail
          shopt -s nullglob
          gpl_pattern='lib(mpv|player|avcodec|avformat|avutil)\.so'
          for apk in android/app/build/outputs/apk/play/release/*.apk; do
            listing="$(unzip -l "$apk")"
            if grep -Eq "$gpl_pattern" <<<"$listing"; then
              echo "::error::GPL native library found in play release APK: $apk"
              exit 1
            fi
          done
          echo "ok: play flavor is clean of GPL native libraries"
          full_apk="$(ls android/app/build/outputs/apk/full/release/*.apk)"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -p "$full_apk" "lib/$abi/libmpv.so" > /dev/null 2>&1 \
              || { echo "::error::lib/$abi/libmpv.so missing from $full_apk"; exit 1; }
            echo "ok: $full_apk packages merged native library for $abi"
          done

      - name: Shred ephemeral ad-hoc keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/adhoc-signing"

  apple-shell-packaging:
    name: Apple tvOS/iOS/macOS shell packaging (secretless)
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fixture-driven tests of the exact scripts the privileged release lane invokes
      # (release-tvos.yml calls release-feed.mjs build-artifact/project-build,
      # gen-altstore-source.py via the AltStore source step, repackage-ipa.sh for IPA packing).
      - name: Run release-feed contract tests
        run: node scripts/tests/release-feed.test.mjs

      - name: Run AltStore source generator tests
        run: python3 scripts/tests/test_gen_altstore_source.py

      - name: Run IPA repackaging tests
        run: bash scripts/tests/repackage-ipa.test.sh

      - name: Prove all-shell failure aggregation keeps every gate fail-closed
        run: node scripts/test-shell-validation-aggregation.mjs

      - name: Test explicit watched-history retry and account readiness
        run: bash scripts/test-native-watched-retry.sh "$GITHUB_WORKSPACE"

      # Pinned XcodeGen, identical version + checksum gate as release-tvos.yml so project
      # generation here observes the same generator the release lane uses.
      - name: Install pinned XcodeGen
        env:
          XCODEGEN_VERSION: "2.46.0"
          XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
        run: |
          set -euo pipefail
          workdir="$RUNNER_TEMP/xcodegen"
          mkdir -p "$workdir"
          url="https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          curl -fsSL --retry 3 -o "$workdir/xcodegen.zip" "$url"
          printf '%s  %s\n' "$XCODEGEN_SHA256" "$workdir/xcodegen.zip" > "$workdir/xcodegen.sha256"
          shasum -a 256 -c "$workdir/xcodegen.sha256"
          unzip -q "$workdir/xcodegen.zip" -d "$workdir"
          "$workdir/xcodegen/bin/xcodegen" --version
          echo "$workdir/xcodegen/bin" >> "$GITHUB_PATH"

      # Public fonts and the player package use the protected lane's reviewed pins. The private
      # engine and Mac daemon are represented by marked, fail-closed CI stand-ins only here.
      # This checks real native Swift compile/link/package mechanics, not engine/server behavior.
      - name: Fetch subtitle fonts
        run: ./scripts/fetch-server-deps.sh

      - name: Fetch MPVKit-DVFEL artifacts (public release asset, sha256-verified)
        env:
          MPVKIT_ARTIFACTS_SHA256: "f4e4fcc25a61997ee4e74a7ad155d46192f4d86d7953ce1a352da796b8765672"
        run: |
          set -euo pipefail
          DEST="app/Vendor/MPVKit-DVFEL"
          curl -sfL --retry 3 -o "$RUNNER_TEMP/mpvkit.zip" \
            "https://github.com/VortXTV/VortX/releases/download/vendor-mpvkit-dvfel-ffmpeg9-20261021/mpvkit-dvfel-ffmpeg-9.0.2-candidate.zip"
          ACTUAL="$(shasum -a 256 "$RUNNER_TEMP/mpvkit.zip" | cut -d' ' -f1)"
          if [ "$ACTUAL" != "$MPVKIT_ARTIFACTS_SHA256" ]; then
            echo "::error::MPVKit artifact checksum mismatch: expected $MPVKIT_ARTIFACTS_SHA256 got $ACTUAL"
            exit 1
          fi
          rm -rf "$DEST/artifacts"
          unzip -oq "$RUNNER_TEMP/mpvkit.zip" -d "$DEST"
          bash scripts/verify-mpvkit-dvfel-artifacts.sh "$DEST"

      - name: Generate CI-only stub engine xcframeworks
        run: |
          ./scripts/build-stub-engine-xcframeworks.sh
          test -f app/Vendor/VortxEngine.xcframework/STUB-CI-ONLY.txt || { echo "::error::VortxEngine stub marker missing"; exit 1; }
          test -x app/Vendor/vortx-streaming-server || { echo "::error::CI-only Mac daemon is missing"; exit 1; }
          test -f app/Vendor/vortx-streaming-server.STUB-CI-ONLY.txt || { echo "::error::CI-only Mac daemon marker missing"; exit 1; }

      - name: Generate the Xcode project
        run: |
          set -euo pipefail
          cd app
          # All-zero revision is an explicit CI-only sentinel; no private engine was fetched.
          ruby ../scripts/generate-native-apple-project.rb \
            --engine-revision 0000000000000000000000000000000000000000 \
            --mpvkit "$PWD/Vendor/MPVKit-DVFEL" --output "$PWD/.native-ci-project.yml"
          xcodegen generate --spec .native-ci-project.yml
          ruby ../scripts/native-apple-swift6-policy.rb VortX.xcodeproj native

      # Real compile/link/package per platform shell. Signing is disabled outright (no identity,
      # none needed for simulator or unsigned macOS builds). Each produced .app must carry the
      # expected bundle ID and a Mach-O executable whose engine symbols are RESOLVED (defined in
      # the linked binary), proving the link phase consumed the engine libraries.
      # All four native app targets are built, including both tvOS Lite simulator architectures.
      - name: Build and verify tvOS, iOS, and macOS shells
        run: |
          set -euo pipefail
          build_one_shell() {
            local scheme="$1" destination="$2" expected_bundle="$3" dd="$4" require_engines="$5" arch="${6:-}"
            echo "::group::xcodebuild $scheme"
            # Keep code in the executable checked below, not Xcode's Debug preview trampoline/dylib pair.
            xcodebuild -project app/VortX.xcodeproj -scheme "$scheme" \
              -destination "$destination" \
              -derivedDataPath "$dd" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ENABLE_DEBUG_DYLIB=NO ${arch:+ARCHS=$arch ONLY_ACTIVE_ARCH=NO} \
              build
            echo '::endgroup::'
            local products_dir
            products_dir="$(find "$dd/Build/Products" -type d -name '*.app' -prune -print | sed -n '1p')"
            [ -n "$products_dir" ] || { echo "::error::$scheme produced no .app"; exit 1; }
            local bundle_id exe info_plist executable_dir
            info_plist="$products_dir/Info.plist"
            executable_dir="$products_dir"
            if [ -f "$products_dir/Contents/Info.plist" ]; then
              info_plist="$products_dir/Contents/Info.plist"
              executable_dir="$products_dir/Contents/MacOS"
            fi
            bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$info_plist")"
            [ "$bundle_id" = "$expected_bundle" ] || { echo "::error::$scheme bundle id $bundle_id != $expected_bundle"; exit 1; }
            exe="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$info_plist")"
            file "$executable_dir/$exe" | grep -q 'Mach-O' || { echo "::error::$scheme executable is not Mach-O"; exit 1; }
            # Capture first: grep -q can close the pipe early and make nm fail with SIGPIPE under pipefail.
            local defined_symbols undefined_symbols
            defined_symbols="$(nm -gU "$executable_dir/$exe")"
            undefined_symbols="$(nm -u "$executable_dir/$exe")"
            grep -Eq '[[:space:]][Tt][[:space:]]+_vortx_init_from_state_json$' <<< "$defined_symbols" \
              || { echo "::error::$scheme binary lacks a defined native state-import symbol"; exit 1; }
            grep -Eq '[[:space:]][Tt][[:space:]]+_vortx_resource_host_new$' <<< "$defined_symbols" \
              || { echo "::error::$scheme binary lacks a defined native resource-host symbol"; exit 1; }
            if [ "$require_engines" = "in-process" ]; then
              grep -Eq '[[:space:]][Tt][[:space:]]+_vortx_server_start$' <<< "$defined_symbols" \
                || { echo "::error::$scheme binary lacks a defined in-process server symbol"; exit 1; }
            fi
            if grep -Eq '_stremiox_core_|_node_start' <<< "$defined_symbols"; then
              echo "::error::$scheme binary retains removed engine/runtime symbols"; exit 1;
            fi
            if grep -Eq '_stremiox_core_|_vortx_' <<< "$undefined_symbols"; then
              echo "::error::$scheme binary still has unresolved engine symbols"; grep -E '_stremiox_core_|_vortx_' <<< "$undefined_symbols"; exit 1
            fi
            echo "ok: $scheme -> $(basename "$products_dir") bundle=$bundle_id executable=$exe engines resolved"
          }
          # Keep every original gate fail-fast within its isolated shell, but collect all
          # platform failures before the job fails. A Lite error must not hide an iOS/Mac error.
          # A fresh Bash process is intentional: invoking a function directly in `if` disables
          # errexit inside that function, even if it calls `set -e` again.
          export -f build_one_shell
          shell_failures=0
          build_shell() {
            if bash -euo pipefail -c 'build_one_shell "$@"' -- "$@"; then
              echo "::notice::shell passed: $1 ${6:-default}"
            else
              echo "::error::shell failed: $1 ${6:-default}"
              shell_failures=$((shell_failures + 1))
            fi
          }
          build_shell VortXTVLite   'generic/platform=tvOS Simulator' com.stremiox.tv.lite     "$RUNNER_TEMP/dd-tvlite" native
          build_shell VortXTV       'generic/platform=tvOS Simulator' com.stremiox.tv         "$RUNNER_TEMP/dd-tv"     in-process arm64
          build_shell VortXTVLite   'generic/platform=tvOS Simulator' com.stremiox.tv.lite    "$RUNNER_TEMP/dd-tvlite-x86" native x86_64
          build_shell VortXiOSNative 'generic/platform=iOS Simulator'  com.stremiox.app.native "$RUNNER_TEMP/dd-ios"    in-process
          build_shell VortXMac      'platform=macOS,arch=arm64'       com.stremiox.mac        "$RUNNER_TEMP/dd-mac"    daemon
          [ "$shell_failures" -eq 0 ] || { echo "::error::$shell_failures shell checks failed"; exit 1; }
