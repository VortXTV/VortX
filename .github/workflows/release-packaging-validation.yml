name: Protected Build 302 verification

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Exact read-only verification stage
        required: true
        type: choice
        options: [apple-original, android-original, ci-originals, draft]
      apple_archive:
        description: Reviewed Apple archive ID size SHA256 separated by single spaces
        type: string
      android_archive:
        description: Reviewed Android archive ID size SHA256 separated by single spaces
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: vortx-stable-302-read-only-verification
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'VortXTV/VortX' && github.actor == 'mamaclapper' && github.ref == 'refs/heads/beta-stable-057-hosted-verify-20261117'
    runs-on: macos-26
    timeout-minutes: 55
    env:
      FROZEN_SOURCE: c56213a20fe064b0ac1ac0cc8e607c2ef449fea1
      FROZEN_VERIFIER_SHA: "fb58d5f4b415b847cb1a4eeb318af83c0a4ca6b013073cc3f5500980a2170673"
      FROZEN_CI_VERIFIER_SHA: "344b29ca070214e7228bf500cbd14a72ea3fcbeae4ee8f25c3b2cccd32a3bc6a"
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Bind reviewed operations ref and original archive pointers
        env:
          MODE: ${{ inputs.mode }}
          APPLE_ARCHIVE: ${{ inputs.apple_archive }}
          ANDROID_ARCHIVE: ${{ inputs.android_archive }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = VortXTV/VortX
          test "$GITHUB_ACTOR" = mamaclapper
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          expected_ref=refs/heads/beta-stable-057-hosted-verify-20261117
          test "$GITHUB_REF" = "$expected_ref"
          test "$GITHUB_WORKFLOW_REF" = "VortXTV/VortX/.github/workflows/release-packaging-validation.yml@$expected_ref"
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
          test "$GITHUB_RUN_ATTEMPT" = 1
          archive_pattern='^[1-9][0-9]{0,17} [1-9][0-9]{0,17} [0-9a-f]{64}$'
          case "$MODE" in
            apple-original) [[ "$APPLE_ARCHIVE" =~ $archive_pattern && -z "$ANDROID_ARCHIVE" ]] ;;
            android-original) [[ "$ANDROID_ARCHIVE" =~ $archive_pattern && -z "$APPLE_ARCHIVE" ]] ;;
            ci-originals|draft) [[ "$APPLE_ARCHIVE" =~ $archive_pattern && "$ANDROID_ARCHIVE" =~ $archive_pattern ]] ;;
            *) exit 1 ;;
          esac

      - name: Check out the frozen package source by exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.FROZEN_SOURCE }}
          path: frozen
          persist-credentials: false

      - name: Check out the reviewed verifier overlay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: verifier
          persist-credentials: false
          sparse-checkout: scripts/verify-stable-build302.py
          sparse-checkout-cone-mode: false

      - name: Set up JDK 21 for Android signature and version inspection
        if: inputs.mode != 'apple-original'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up pinned Android inspection tools
        if: inputs.mode != 'apple-original'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Reauthenticate package bytes with the reviewed verifier
        id: verify
        env:
          MODE: ${{ inputs.mode }}
          APPLE_ARCHIVE: ${{ inputs.apple_archive }}
          ANDROID_ARCHIVE: ${{ inputs.android_archive }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: VortXTV/VortX
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          FROZEN_ROOT="$GITHUB_WORKSPACE/frozen"
          OPERATIONS_ROOT="$GITHUB_WORKSPACE/verifier"
          TOOL="$OPERATIONS_ROOT/scripts/verify-stable-build302.py"
          test "$(git -C "$FROZEN_ROOT" rev-parse HEAD)" = "$FROZEN_SOURCE"
          test "$(git -C "$OPERATIONS_ROOT" rev-parse HEAD)" = "$GITHUB_WORKFLOW_SHA"
          test -z "$(git -C "$FROZEN_ROOT" status --porcelain)"
          test -z "$(git -C "$OPERATIONS_ROOT" status --porcelain)"
          printf '%s  %s\n' "$FROZEN_VERIFIER_SHA" "$TOOL" | shasum -a 256 --check --status
          printf '%s  %s\n' "$FROZEN_CI_VERIFIER_SHA" "$FROZEN_ROOT/scripts/verify-ci-direct-beta.py" | shasum -a 256 --check --status
          WORK="$(mktemp -d "$RUNNER_TEMP/vortx-stable-302-verify.XXXXXXXX")"
          RESULT="$RUNNER_TEMP/vortx-stable-302-receipts"
          trap 'rm -rf "$WORK"' EXIT
          test ! -e "$RESULT" && test ! -L "$RESULT"
          cp "$TOOL" "$WORK/verify_stable.py"
          ARGS=(--repo-root "$FROZEN_ROOT" --name ready)
          case "$MODE" in
            apple-original|android-original|ci-originals) ARGS+=("--$MODE") ;;
            draft) ;;
            *) exit 1 ;;
          esac
          if [ -n "$APPLE_ARCHIVE" ]; then
            read -r APPLE_ID APPLE_SIZE APPLE_DIGEST <<< "$APPLE_ARCHIVE"
            ARGS+=(--apple-archive "$APPLE_ID" "$APPLE_SIZE" "$APPLE_DIGEST")
          fi
          if [ -n "$ANDROID_ARCHIVE" ]; then
            read -r ANDROID_ID ANDROID_SIZE ANDROID_DIGEST <<< "$ANDROID_ARCHIVE"
            ARGS+=(--android-archive "$ANDROID_ID" "$ANDROID_SIZE" "$ANDROID_DIGEST")
          fi
          if [ "$MODE" != apple-original ]; then
            test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
            test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
            BUNDLETOOL="$WORK/bundletool.jar"
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
              --connect-timeout 10 --max-time 90 --max-filesize 33554432 \
              https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar \
              --output "$BUNDLETOOL"
            printf '%s  %s\n' a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29 "$BUNDLETOOL" | shasum -a 256 --check --status
            ARGS+=(--bundletool "$BUNDLETOOL" --java-home "$JAVA_HOME" --android-sdk "$ANDROID_HOME")
          fi
          if ! python3 -B "$WORK/verify_stable.py" "${ARGS[@]}" >"$WORK/verifier.log" 2>&1; then
            if [ "$MODE" = draft ] && grep -Eq '^gh: (Not Found|Resource not accessible by integration)' "$WORK/verifier.log"; then
              echo '::error::GitHub denied an authenticated read. Run ci-originals and verify the exact draft with the local authenticated reader.'
            else
              echo '::error::Frozen package verification failed. Detailed logs are confined to this step.'
            fi
            exit 1
          fi
          python3 -B "$WORK/verify_stable.py" --check-output "$WORK/ready" --output-mode "$MODE"
          test -z "$(git -C "$FROZEN_ROOT" status --porcelain)"
          mv "$WORK/ready" "$RESULT"
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"

      - name: Upload bounded stable verification receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VortX-0.5.7-302-verified-${{ inputs.mode }}
          path: ${{ steps.verify.outputs.result }}
          if-no-files-found: error
          retention-days: 7
