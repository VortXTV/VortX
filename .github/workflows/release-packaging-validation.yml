name: Protected Beta 13 hosted draft operations

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Verify the empty draft or attach the independently accepted assets and verify the draft
        type: choice
        options:
          - prepare
          - attach
        required: true
      release_id:
        description: Exact existing empty or safely partial Beta 13 draft numeric ID
        type: string
        required: true
      apple_artifact_id:
        description: Exact original attempt-one VortX-tvOS-ci artifact numeric ID
        type: string
        required: true
      preflight_run_id:
        description: Exact successful read-only hosted preflight run numeric ID
        type: string
        required: true
      preflight_artifact_id:
        description: Exact sanitized read-only preflight proof artifact numeric ID
        type: string
        required: true
      preflight_source:
        description: Exact reviewed operations commit of the read-only preflight run
        type: string
        required: true
      preflight_sha256:
        description: Independently reviewed canonical preflight JSON digest
        type: string
        required: true
      prepare_run_id:
        description: Attach only, exact successful hosted prepare run numeric ID
        type: string
        required: false
      prepare_artifact_id:
        description: Attach only, exact independently reviewed prepared proof artifact numeric ID
        type: string
        required: false
      prepared_sha256:
        description: Attach only, independently held prepared provenance digest
        type: string
        required: false
      draft_body_sha256:
        description: Attach only, independently held digest of the provenance-bound draft notes
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: vortx-beta13-protected-draft-operations
  cancel-in-progress: false

jobs:
  draft-ops:
    name: Beta 13 exact draft ${{ inputs.phase }}
    if: >-
      github.event_name == 'workflow_dispatch' && github.repository == 'VortXTV/VortX' &&
      github.actor == 'mamaclapper' && github.ref == 'refs/tags/vortx-beta13-release-ops-20261111'
    environment: release-approval
    runs-on: macos-26
    timeout-minutes: 65
    # Exact draft GET/asset downloads require the same draft-capable token as
    # the existing coordinator. The helper has one asset-only POST path.
    permissions:
      actions: read
      contents: write
    env:
      FROZEN_SOURCE: 4d3ef04324b887038da4ff4cf3e822cd07cf101e
      OPS_HELPER_SHA: f279df7220e7ef571c57eca7ada775f193285cd14a95eac43485be4033057a12
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact reviewed operations source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: operations
          persist-credentials: false

      - name: Check out the frozen package source by exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.FROZEN_SOURCE }}
          path: frozen
          persist-credentials: false

      - name: Set up JDK 21 for Android package verification
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android package inspection tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Run the exact phase against the existing authenticated draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: VortXTV/VortX
          OP_PHASE: ${{ inputs.phase }}
          RELEASE_ID: ${{ inputs.release_id }}
          APPLE_ARTIFACT_ID: ${{ inputs.apple_artifact_id }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          PREFLIGHT_ARTIFACT_ID: ${{ inputs.preflight_artifact_id }}
          PREFLIGHT_SOURCE: ${{ inputs.preflight_source }}
          PREFLIGHT_SHA: ${{ inputs.preflight_sha256 }}
          PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
          PREPARE_ARTIFACT_ID: ${{ inputs.prepare_artifact_id }}
          PREPARED_SHA: ${{ inputs.prepared_sha256 }}
          DRAFT_BODY_SHA: ${{ inputs.draft_body_sha256 }}
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
          test "$(git -C "$GITHUB_WORKSPACE/operations" rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git -C "$GITHUB_WORKSPACE/operations" status --porcelain)"
          TOOL="$GITHUB_WORKSPACE/operations/scripts/ops-beta13-draft.py"
          printf '%s  %s\n' "$OPS_HELPER_SHA" "$TOOL" | shasum -a 256 --check --status
          TEMP="$(mktemp -d "$RUNNER_TEMP/vortx-beta13-draft-work.XXXXXXXX")"
          trap 'rm -rf "$TEMP"' EXIT
          SAFE_OUTPUT="$(mktemp -d "$RUNNER_TEMP/vortx-beta13-draft-proof.XXXXXXXX")"
          BUNDLETOOL="$TEMP/bundletool.jar"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 10 --max-time 90 --max-filesize 33554432 \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar \
            --output "$BUNDLETOOL"
          printf '%s  %s\n' a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29 "$BUNDLETOOL" | shasum -a 256 --check --status
          export APKSIGNER_BIN="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          export AAPT2_BIN="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          test -x "$APKSIGNER_BIN" && test -x "$AAPT2_BIN"
          if ! python3 -B "$TOOL" "$OP_PHASE" --release-id "$RELEASE_ID" --apple-artifact "$APPLE_ARTIFACT_ID" \
            --preflight-run "$PREFLIGHT_RUN_ID" --preflight-artifact "$PREFLIGHT_ARTIFACT_ID" \
            --preflight-source "$PREFLIGHT_SOURCE" --preflight-sha "$PREFLIGHT_SHA" \
            --prepare-run "$PREPARE_RUN_ID" --prepare-artifact "$PREPARE_ARTIFACT_ID" \
            --prepared-sha "$PREPARED_SHA" --draft-body-sha "$DRAFT_BODY_SHA" \
            --repo-root "$GITHUB_WORKSPACE/frozen" --bundletool "$BUNDLETOOL" --output "$SAFE_OUTPUT" \
            >"$TEMP/operation.log" 2>&1; then
            echo '::error::Protected draft operation failed closed. Read the exact numeric draft state before recovery.'
            exit 1
          fi
          test -z "$(git -C "$GITHUB_WORKSPACE/frozen" status --porcelain)"
          case "$OP_PHASE" in
            prepare) stem=beta13-prepared-provenance ;;
            attach) stem=beta13-draft-verified ;;
            *) exit 1 ;;
          esac
          test "$(find "$SAFE_OUTPUT" -mindepth 1 -maxdepth 1 | wc -l | tr -d '[:space:]')" = 2
          (cd "$SAFE_OUTPUT" && shasum -a 256 --check "$stem.sha256")
          printf 'VORTX_BETA13_DRAFT_PROOF_DIR=%s\n' "$SAFE_OUTPUT" >> "$GITHUB_ENV"
          printf 'Verified frozen Beta 13 %s evidence SHA-256 %s\n' \
            "$OP_PHASE" "$(cut -d ' ' -f 1 "$SAFE_OUTPUT/$stem.sha256")"

      - name: Retain sanitized prepared provenance and checksum only
        if: inputs.phase == 'prepare'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VortX-Beta13-prepared-proof
          path: |
            ${{ env.VORTX_BETA13_DRAFT_PROOF_DIR }}/beta13-prepared-provenance.json
            ${{ env.VORTX_BETA13_DRAFT_PROOF_DIR }}/beta13-prepared-provenance.sha256
          if-no-files-found: error
          retention-days: 7
          overwrite: false

      - name: Retain sanitized verified draft receipt and checksum only
        if: inputs.phase == 'attach'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VortX-Beta13-draft-verified
          path: |
            ${{ env.VORTX_BETA13_DRAFT_PROOF_DIR }}/beta13-draft-verified.json
            ${{ env.VORTX_BETA13_DRAFT_PROOF_DIR }}/beta13-draft-verified.sha256
          if-no-files-found: error
          retention-days: 7
          overwrite: false
