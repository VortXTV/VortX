name: Protected Beta 13 hosted preflight

on:
  workflow_dispatch:
    inputs:
      apple_artifact_id:
        description: Numeric ID of the original attempt-one VortX-tvOS-ci artifact
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: vortx-beta13-hosted-preflight
  cancel-in-progress: false

jobs:
  verify-candidate:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      FROZEN_SOURCE: 4d3ef04324b887038da4ff4cf3e822cd07cf101e
      FROZEN_VERIFIER_SHA: bba10af16bd18ed6f7c0aa4d4c9fb3b4bbece95e89be71b77c8f7b0e26556b2b
      CANDIDATE: v0.5.6-beta.13-candidate.1
      FINAL_TAG: v0.5.6-beta.13
      APPLE_RUN: '43067463614'
      ANDROID_RUN: '43032604411'
      ANDROID_ARTIFACT: '13863521461'
      ANDROID_ARTIFACT_SHA: ff6ecb5edfd87ca5cc0975b181a434af4af77978a8b52f286a8407df6f104596
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Admit only the reviewed operations branch and artifact ID
        env:
          APPLE_ARTIFACT: ${{ inputs.apple_artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          expected_ref=refs/heads/beta13-hosted-preflight-20261111
          test "$GITHUB_REPOSITORY" = VortXTV/VortX
          test "$GITHUB_ACTOR" = mamaclapper
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = "$expected_ref"
          test "$GITHUB_WORKFLOW_REF" = "VortXTV/VortX/.github/workflows/release-packaging-validation.yml@$expected_ref"
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
          [[ "$APPLE_ARTIFACT" =~ ^[1-9][0-9]{0,17}$ ]]

      - name: Check out the frozen package source by exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.FROZEN_SOURCE }}
          path: frozen
          persist-credentials: false

      - name: Set up JDK 21 for read-only Android package verification
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android package inspection tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Reauthenticate the two original candidate builds without release writes
        env:
          APPLE_ARTIFACT: ${{ inputs.apple_artifact_id }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: VortXTV/VortX
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          FROZEN_ROOT="$GITHUB_WORKSPACE/frozen"
          TOOL="$FROZEN_ROOT/scripts/verify-ci-direct-beta.py"
          test "$(git -C "$FROZEN_ROOT" rev-parse HEAD)" = "$FROZEN_SOURCE"
          test -z "$(git -C "$FROZEN_ROOT" status --porcelain)"
          printf '%s  %s\n' "$FROZEN_VERIFIER_SHA" "$TOOL" | shasum -a 256 --check --status
          WORK_DIR="$(mktemp -d "$RUNNER_TEMP/vortx-beta13-private.XXXXXXXX")"
          trap 'rm -rf "$WORK_DIR"' EXIT
          PUBLIC_DIR="$(mktemp -d "$RUNNER_TEMP/vortx-beta13-safe-proof.XXXXXXXX")"
          BUNDLETOOL="$WORK_DIR/bundletool.jar"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 10 --max-time 90 --max-filesize 33554432 \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar \
            --output "$BUNDLETOOL"
          printf '%s  %s\n' a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29 "$BUNDLETOOL" | shasum -a 256 --check --status
          export APKSIGNER_BIN="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          export AAPT2_BIN="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          test -x "$APKSIGNER_BIN" && test -x "$AAPT2_BIN"
          if ! python3 -B "$TOOL" preflight --tag "$FINAL_TAG" --source-commit "$FROZEN_SOURCE" \
            --repo-root "$FROZEN_ROOT" --work-dir "$WORK_DIR" --bundletool "$BUNDLETOOL" \
            --output "$WORK_DIR/beta13-preflight.json" \
            --apple-run "$APPLE_RUN" --apple-attempt 1 --apple-artifact "$APPLE_ARTIFACT" \
            --android-run "$ANDROID_RUN" --android-attempt 1 --android-artifact "$ANDROID_ARTIFACT" \
            >"$WORK_DIR/verifier.log" 2>&1; then
            echo '::error::Frozen preflight failed. No raw logs or receipts were exported.'
            exit 1
          fi
          test -z "$(git -C "$FROZEN_ROOT" status --porcelain)"
          if ! python3 -B - "$TOOL" "$WORK_DIR" "$PUBLIC_DIR" >"$WORK_DIR/export.log" 2>&1 <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import runpy
          import sys

          def check(ok):
              if not ok:
                  raise ValueError("invalid or non-public preflight evidence")

          def obj(value, *keys):
              check(type(value) is dict and set(value) == set(keys))
              return value

          def matches(value, pattern):
              check(type(value) is str and re.fullmatch(pattern, value) is not None)

          def sha(value):
              matches(value, r"[0-9a-f]{64}")

          def positive(value):
              check(type(value) is int and 0 < value < 2**63)

          def hashes(value, names):
              obj(value, *names)
              for item in value.values():
                  sha(item)

          def no_duplicates(pairs):
              value = dict(pairs)
              check(len(value) == len(pairs))
              return value

          tool, work, output = map(Path, sys.argv[1:])
          v = runpy.run_path(str(tool))
          source = os.environ["FROZEN_SOURCE"]
          candidate = os.environ["CANDIDATE"]
          tag = os.environ["FINAL_TAG"]
          version, build = "0.5.6", "285"
          input_path = work / "beta13-preflight.json"
          check(input_path.is_file() and not input_path.is_symlink())
          with input_path.open("rb") as stream:
              raw = stream.read(1024**2 + 1)
          check(0 < len(raw) <= 1024**2)
          receipt = obj(json.loads(raw, object_pairs_hook=no_duplicates), "schemaVersion", "mode", "evidence")
          check(raw == v["canonical"](receipt))
          check(type(receipt["schemaVersion"]) is int and receipt["schemaVersion"] == 1 and
                receipt["mode"] == "beta13-candidate-preflight")
          ev = obj(receipt["evidence"], "schemaVersion", "distribution", "repository", "tag", "sourceCommit",
                   "version", "build", "sourceFileSha256", "builds", "evidence", "artifacts", "stableMustRemain")
          check(type(ev["schemaVersion"]) is int and ev["schemaVersion"] == 1 and
                (ev["distribution"], ev["repository"], ev["tag"], ev["sourceCommit"], ev["version"], ev["build"]) ==
                ("hosted-direct-beta", "VortXTV/VortX", tag, source, version, build))
          hashes(ev["sourceFileSha256"], v["TOOLS"] + v["BETA12_TOOLS"])
          check(ev["sourceFileSha256"]["scripts/verify-ci-direct-beta.py"] == os.environ["FROZEN_VERIFIER_SHA"])

          builds = obj(ev["builds"], "apple", "android")
          for lane, proof in builds.items():
              required = ["runId", "attempt", "artifactId", "workflow", "workflowId", "sourceCommit", "headBranch",
                          "event", "repositoryId", "jobId", "jobName", "requiredSuccessfulSteps", "artifactName",
                          "artifactSha256", "artifactSize", "artifactCreatedAt", "protectedNativeGate"]
              if lane == "apple":
                  required.append("protectedAetherGate")
              obj(proof, *required)
              expected_run = int(os.environ[lane.upper() + "_RUN"])
              expected_artifact = int(os.environ[lane.upper() + "_ARTIFACT"])
              positive(proof["runId"])
              positive(proof["attempt"])
              positive(proof["artifactId"])
              check((proof["runId"], proof["attempt"], proof["artifactId"]) == (expected_run, 1, expected_artifact))
              workflow, job, artifact = v["LANES"][lane][:3]
              check((proof["workflow"], proof["jobName"], proof["artifactName"]) ==
                    (".github/workflows/" + workflow, job, artifact))
              check((proof["workflowId"], proof["sourceCommit"], proof["headBranch"], proof["event"]) ==
                    ({"apple": 293211344, "android": 342394030}[lane], source, candidate, "workflow_dispatch"))
              check(proof["requiredSuccessfulSteps"] == list(v["job_contract"](lane, tag)[0]))
              for key in ("repositoryId", "jobId", "artifactSize"):
                  positive(proof[key])
              sha(proof["artifactSha256"])
              matches(proof["artifactCreatedAt"], r"[0-9]{4}(?:-[0-9]{2}){2}T[0-9]{2}(?::[0-9]{2}){2}Z")
          android = builds["android"]
          check(android["artifactSha256"] == os.environ["ANDROID_ARTIFACT_SHA"] and android["artifactSize"] == 201681040)
          check(builds["apple"]["repositoryId"] == android["repositoryId"])

          gate = obj(builds["apple"]["protectedNativeGate"], "artifactId", "artifactSha256", "coordinatorSha256",
                     "sdkHeaderSha256", "sdkArchiveSha256", "assertionCounts", "fullLiveAbi")
          positive(gate["artifactId"])
          for key in ("artifactSha256", "coordinatorSha256", "sdkHeaderSha256", "sdkArchiveSha256"):
              sha(gate[key])
          hashes(gate["fullLiveAbi"], ("headerSha256", "librarySha256"))
          for count in obj(gate["assertionCounts"], "converter", "service", "restore").values():
              positive(count)
          gate = obj(android["protectedNativeGate"], "artifactId", "artifactSha256", "hostLibrarySha256",
                     "hostSourceInputsSha256", "executed", "realJniCases", "junitXmlSha256", "backupCas")
          positive(gate["artifactId"])
          for key in ("artifactSha256", "hostLibrarySha256", "hostSourceInputsSha256"):
              sha(gate[key])
          positive(gate["executed"])
          positive(gate["realJniCases"])
          check((gate["executed"], gate["realJniCases"]) == (107, 52))
          hashes(gate["junitXmlSha256"], ("TEST-" + name + ".xml" for name in v["BETA12_JNI_CLASSES"]))
          backup = obj(gate["backupCas"], "cases", "xmlSha256")
          check(type(backup["cases"]) is int and backup["cases"] == 16)
          sha(backup["xmlSha256"])

          aether = obj(builds["apple"]["protectedAetherGate"], "artifactId", "artifactSha256", "apps",
                       "packages", "packageResolvedSha256", "resolutionReceiptSha256")
          positive(aether["artifactId"])
          for key in ("artifactSha256", "packageResolvedSha256", "resolutionReceiptSha256"):
              sha(aether[key])
          check(aether["packages"] == v["BETA12_AETHER_PACKAGES"])
          for key, app in obj(aether["apps"], *v["BETA12_AETHER_APPS"]).items():
              obj(app, "aetherLinkMapSha256", "nativeAppReceiptSha256", "provider", "binaries")
              sha(app["aetherLinkMapSha256"])
              sha(app["nativeAppReceiptSha256"])
              provider = obj(app["provider"], "platform", "variant", "libraryIdentifier", "upstreamSha256",
                             "processedSha256", "arm64Sha256")
              check((provider["platform"], provider["variant"]) == v["BETA12_AETHER_APPS"][key])
              matches(provider["libraryIdentifier"], r"[A-Za-z0-9_-]{1,100}")
              for field in ("upstreamSha256", "processedSha256", "arm64Sha256"):
                  sha(provider[field])
              for name, binary in obj(app["binaries"], *v["BETA12_AETHER_BINARIES"]).items():
                  obj(binary, "path", "architectures", "rawSha256", "normalizedSha256")
                  prefix = "Contents/Frameworks/" if key == "macos" else "Frameworks/"
                  versioned = r"(?:Versions/[A-Za-z0-9_-]+/)?" if key == "macos" else ""
                  matches(binary["path"], re.escape(prefix + name + ".framework/") + versioned + re.escape(name))
                  check(binary["architectures"] in (["arm64"], ["arm64", "x86_64"]))
                  sha(binary["rawSha256"])
                  sha(binary["normalizedSha256"])

          nested = obj(ev["evidence"], "apple", "android")
          apple_ev = obj(nested["apple"], "originalWorkflow", "originalDispatch", "receiptSha256")
          apple_identity = {"schemaVersion": 1, "sourceCommit": source, "workflowCommit": source,
                            "runId": builds["apple"]["runId"], "attempt": 1}
          check(v["canonical"](apple_ev["originalWorkflow"]) == v["canonical"]({
              **apple_identity, "tag": "", "verifierSha256": ev["sourceFileSha256"]["scripts/verify-native-apple-package.py"]}))
          check(v["canonical"](apple_ev["originalDispatch"]) == v["canonical"]({
              **apple_identity, "event": "workflow_dispatch", "ref": "refs/tags/" + candidate, "inputs": v["APPLE_INPUTS"]}))
          apple_files, apple_contents, android_files = v["file_matrix"](tag, version)
          hashes(apple_ev["receiptSha256"], (name for name in apple_contents if name.endswith(".json")))
          android_ev = obj(nested["android"], "signingAndVersionEvidenceSha256", "checksumEvidenceSha256",
                            "engineSourceCommit", "nativeFeatures")
          sha(android_ev["signingAndVersionEvidenceSha256"])
          sha(android_ev["checksumEvidenceSha256"])
          check((android_ev["engineSourceCommit"], android_ev["nativeFeatures"]) ==
                (v["expected_engine"](tag), "jni,server,resource-host"))

          apple_names = {name.replace("-ci.", f"-{tag}-ci."): platform for platform, name in apple_files.items()}
          bundle_ids = {"ios": "com.stremiox.app.native", "tvos": "com.stremiox.tv",
                        "tvos-lite": "com.stremiox.tv.lite", "macos": "com.stremiox.mac"}
          assets = ev["artifacts"]
          check(type(assets) is list and len(assets) == 7)
          check({asset["name"] for asset in assets} == set(apple_names) | android_files)
          for asset in assets:
              name = asset["name"]
              fields = ["name", "sha256", "size", "platform", "version", "build", "signature"]
              if name in apple_names:
                  platform = apple_names[name]
                  obj(asset, *fields, "bundleIdentifier", "notarization")
                  check((asset["platform"], asset["bundleIdentifier"]) == (platform, bundle_ids[platform]))
                  signing = ("adhoc", "not-notarized") if platform == "macos" else ("unsigned-resign-required", "not-applicable")
                  check((asset["signature"], asset["notarization"]) == signing)
              else:
                  obj(asset, *fields)
                  check((asset["platform"], asset["signature"]) == ("android", "pinned-production-signer"))
              check((asset["version"], asset["build"]) == (version, build))
              sha(asset["sha256"])
              positive(asset["size"])

          stable = obj(ev["stableMustRemain"], "latest", "mainCommit", "routes")
          matches(stable["mainCommit"], r"[0-9a-f]{40}")
          stable_tag = r"v[0-9]+\.[0-9]+\.[0-9]+(?:-beta\.[1-9][0-9]*)?"
          latest = obj(stable["latest"], "id", "tag")
          positive(latest["id"])
          matches(latest["tag"], stable_tag)
          routes = obj(stable["routes"], "altstore", "appcast", "download", "feedGeneration")
          matches(routes["feedGeneration"], stable_tag + r":[0-9]+:[0-9a-f]{64}")
          appcast = obj(routes["appcast"], "tag", "apple", "android")
          matches(appcast["tag"], stable_tag)
          apple_route_names = {"ios": ("iOS", "ipa"), "tvos": ("tvOS", "ipa"), "mac": ("macOS", "dmg")}
          for key, row in obj(appcast["apple"], *apple_route_names).items():
              slug, suffix = apple_route_names[key]
              obj(row, "tag", "asset", "build", "sha256", "version", "size", "artifactType")
              check(row["tag"] == appcast["tag"] and row["artifactType"] == suffix)
              check(row["asset"] == f"VortX-{slug}-{row['tag']}-ci.{suffix}")
              matches(row["build"], r"[0-9]{1,12}")
              matches(row["version"], r"[0-9]+\.[0-9]+\.[0-9]+")
              sha(row["sha256"])
              positive(row["size"])
          for key, row in obj(routes["altstore"], bundle_ids["ios"], bundle_ids["tvos"]).items():
              obj(row, "tag", "asset", "build", "sha256")
              linked = appcast["apple"]["ios" if key == bundle_ids["ios"] else "tvos"]
              check(row == {name: linked[name] for name in row})
          engines = {"full": "mpv", "play": "media3"}
          if appcast["android"] is not None:
              for flavor, row in obj(appcast["android"], *engines).items():
                  obj(row, "tag", "asset", "version", "sha256", "size", "artifactType", "engine", "flavor")
                  matches(row["tag"], stable_tag)
                  matches(row["version"], r"[0-9]+\.[0-9]+\.[0-9]+")
                  engine = engines[flavor]
                  check((row["artifactType"], row["flavor"], row["engine"], row["asset"]) ==
                        ("apk", flavor, engine, f"VortX-{row['version']}-{flavor}-{engine}-universal.apk"))
                  sha(row["sha256"])
                  positive(row["size"])
          download = obj(routes["download"], "tag", "asset", "platform", "engine", "flavor")
          matches(download["tag"], stable_tag)
          check((download["platform"], download["engine"], download["flavor"]) == ("android", "mpv", "full"))
          matches(download["asset"], r"VortX-[0-9]+\.[0-9]+\.[0-9]+-full-mpv-universal\.apk")

          checksum = hashlib.sha256(raw).hexdigest()
          marker = f"Verified both original {tag} candidate builds; no release writes. Receipt SHA-256: {checksum}"
          log = work / "verifier.log"
          check(log.is_file() and log.stat().st_size <= 1024**2)
          check(log.read_text().splitlines().count(marker) == 1)
          check(output.is_dir() and not output.is_symlink() and not list(output.iterdir()))
          with (output / "beta13-preflight.json").open("xb") as stream:
              stream.write(raw)
          with (output / "beta13-preflight.sha256").open("x") as stream:
              stream.write(f"{checksum}  beta13-preflight.json\n")
          PY
          then
            echo '::error::Preflight output did not pass the strict public receipt allowlist.'
            exit 1
          fi
          test "$(find "$PUBLIC_DIR" -mindepth 1 -maxdepth 1 | wc -l | tr -d '[:space:]')" = 2
          (cd "$PUBLIC_DIR" && shasum -a 256 --check beta13-preflight.sha256)
          printf 'BETA13_SAFE_PREFLIGHT_DIR=%s\n' "$PUBLIC_DIR" >> "$GITHUB_ENV"
          printf 'Verified frozen Beta 13 candidate bytes; sanitized preflight receipt SHA-256 %s\n' \
            "$(cut -d ' ' -f 1 "$PUBLIC_DIR/beta13-preflight.sha256")"

      - name: Retain only the original sanitized receipt and its checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VortX-Beta13-protected-preflight
          path: |
            ${{ env.BETA13_SAFE_PREFLIGHT_DIR }}/beta13-preflight.json
            ${{ env.BETA13_SAFE_PREFLIGHT_DIR }}/beta13-preflight.sha256
          if-no-files-found: error
          retention-days: 3
          overwrite: false
