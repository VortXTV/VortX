name: Verify Android Beta 15 update popup

on:
  workflow_dispatch:

permissions: {}

jobs:
  updater:
    if: >-
      github.repository == 'VortXTV/VortX' &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == 'mamaclapper' && github.triggering_actor == 'mamaclapper' &&
      github.ref == 'refs/tags/vortx-beta15-b301-android-update-ui-20261116' &&
      github.workflow_ref == 'VortXTV/VortX/.github/workflows/release-packaging-validation.yml@refs/tags/vortx-beta15-b301-android-update-ui-20261116' &&
      github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APK_NAME: VortX-0.5.6-play-media3-universal.apk
      APK_SHA256: 7c3d007eeae0007dd9d616627e79ae307830bc02ed72f9b645aff8fdfe96b4fb
      APK_SIZE: '86653823'
      APK_SIGNER: fc22b87ecd9e4fa26930a1c3e227d8f7d918c646b216032b5da820ef1ac218ca
      ARTIFACT_DIR: ${{ runner.temp }}/vortx-android-update-smoke
    steps:
      - name: Verify exact public workflow attempt
        run: |
          set -euo pipefail
          mkdir "$ARTIFACT_DIR"
          curl -fsS --proto '=https' --max-time 15 --max-filesize 131072 \
            "https://api.github.com/repos/VortXTV/VortX/actions/runs/$GITHUB_RUN_ID" | \
            jq -e --arg sha "$GITHUB_SHA" 'select(
              .workflow_id == 343149688 and .run_attempt == 1 and .event == "workflow_dispatch" and
              .head_branch == "vortx-beta15-b301-android-update-ui-20261116" and
              .head_sha == $sha and .actor.login == "mamaclapper" and .triggering_actor.login == "mamaclapper"
            ) | {id, workflow_id, run_attempt, head_sha, head_branch}' | tee "$ARTIFACT_DIR/run-identity.json"

      - name: Verify public feed offers Build 301
        run: |
          set -euo pipefail
          curl -fsS --proto '=https' --max-time 15 --max-filesize 524288 \
            https://vortx.tv/appcast.json -o "$ARTIFACT_DIR/public-appcast.json"
          jq -e '.schemaVersion == 2 and .android.play.build == 301 and
            .android.play.tag == "v0.5.6-beta.15" and .android.play.signed == true and
            .android.play.prerelease == false and .android.play.applicationId == "com.vortx.android"' \
            "$ARTIFACT_DIR/public-appcast.json" > /dev/null
          shasum -a 256 "$ARTIFACT_DIR/public-appcast.json"

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: "platform-tools build-tools;36.0.0"

      - name: Verify the exact already-published Build 283 APK
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/$APK_NAME"
          curl -fsSL --proto '=https' --proto-redir '=https' --max-time 90 --max-redirs 4 \
            --max-filesize "$APK_SIZE" \
            "https://github.com/VortXTV/VortX/releases/download/v0.5.6-beta.12/$APK_NAME" -o "$apk"
          test "$(wc -c < "$apk")" -eq "$APK_SIZE"
          printf '%s  %s\n' "$APK_SHA256" "$apk" | sha256sum -c
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/aapt2" dump badging "$apk" > "$ARTIFACT_DIR/installed-apk.txt"
          grep -Fq "package: name='com.vortx.android' versionCode='283' versionName='0.5.6'" \
            "$ARTIFACT_DIR/installed-apk.txt"
          grep -E "^native-code: .*'x86_64'" "$ARTIFACT_DIR/installed-apk.txt"
          "$tools/apksigner" verify --print-certs "$apk" | awk -v expected="$APK_SIGNER" '
            /^Signer #[0-9]+ certificate SHA-256 digest: / { count++; if (tolower($NF) == expected) matched++ }
            END { exit !(count == 1 && matched == 1) }
          '

      - name: Observe the real update popup on a fresh phone emulator
        timeout-minutes: 13
        env:
          ANDROID_SERIAL: emulator-5554
        run: |
          set -euo pipefail
          sdkmanager --install "emulator" "system-images;android-35;google_apis;x86_64"
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          export ANDROID_USER_HOME="$RUNNER_TEMP/vortx-smoke-android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          avdmanager create avd --name vortx-update-phone --package "system-images;android-35;google_apis;x86_64" \
            --device pixel_2 --path "$ANDROID_AVD_HOME/vortx-update-phone.avd" </dev/null
          "$ANDROID_HOME/emulator/emulator" -avd vortx-update-phone -port 5554 -accel on -gpu swiftshader \
            -no-window -no-audio -no-boot-anim -no-snapshot > "$ARTIFACT_DIR/emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'timeout 6s adb emu kill >/dev/null 2>&1 || kill "$emulator_pid" 2>/dev/null || true' EXIT
          timeout 240s bash -c '
            while kill -0 "$1" 2>/dev/null; do
              ready="$(timeout 5s adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r" || true)"
              if [[ "$ready" == 1 ]]; then exit 0; fi
              sleep 2
            done
            exit 1
          ' _ "$emulator_pid"
          test "$(adb shell getprop ro.product.cpu.abi | tr -d '\r')" = x86_64
          adb shell input keyevent 82
          for setting in window_animation_scale transition_animation_scale animator_duration_scale; do
            adb shell settings put global "$setting" 0
          done
          timeout 120s adb install "$RUNNER_TEMP/$APK_NAME"
          adb shell dumpsys package com.vortx.android | grep -E 'versionCode=283([[:space:]]|$)' > "$ARTIFACT_DIR/on-device-version.txt"
          timeout 45s adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.LAUNCHER \
            -n com.vortx.android/.MainActivity > "$ARTIFACT_DIR/launcher.txt"
          grep -Fq 'Status: ok' "$ARTIFACT_DIR/launcher.txt"
          timeout 105s python3 - "$ARTIFACT_DIR/window.xml" <<'PYTHON' | tee "$ARTIFACT_DIR/result.txt"
          import pathlib
          import re
          import subprocess
          import sys
          import time
          import xml.etree.ElementTree as ET

          destination = pathlib.Path(sys.argv[1])
          device_dump = "/sdcard/update-smoke.xml"
          entered = False
          for _ in range(14):
              try:
                  subprocess.run(["adb", "shell", "uiautomator", "dump", "--compressed", device_dump],
                                 stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=True, timeout=12)
                  window = subprocess.check_output(["adb", "exec-out", "cat", device_dump], timeout=6)
                  destination.write_bytes(window)
                  root = ET.fromstring(window)
              except (ET.ParseError, subprocess.SubprocessError):
                  time.sleep(2)
                  continue
              nodes = {node.get("text", ""): node for node in root.iter("node")
                       if node.get("package") == "com.vortx.android"}
              match = next((text for text in nodes if re.search(r"\bbuild\s+301\b", text, re.I)), "")
              if match and "Update available" in nodes and "Get the update" in nodes:
                  print(f"PASS signed Android Build 283 Play opened the live update popup: {match}")
                  sys.exit(0)
              if not entered and "Restore an account backup?" in nodes and "Continue to VortX" in nodes:
                  bounds = nodes["Continue to VortX"].get("bounds", "")
                  coords = re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", bounds)
                  if coords:
                      x1, y1, x2, y2 = map(int, coords.groups())
                      if x1 < x2 and y1 < y2:
                          subprocess.run(["adb", "shell", "input", "tap", str((x1+x2)//2), str((y1+y2)//2)],
                                         check=True, timeout=6)
                          entered = True
              time.sleep(2)
          sys.exit("Build 301 update popup was not observed")
          PYTHON
          timeout 12s adb exec-out screencap -p > "$ARTIFACT_DIR/popup.png"
          test -s "$ARTIFACT_DIR/popup.png"

      - name: Retain emulator evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-build-283-live-update-popup
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 7
