name: Protected Android website roster JNI proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vortx-android-website-roster-jni-proof
  cancel-in-progress: false

jobs:
  website-roster-real-jni:
    if: >-
      github.event_name == 'workflow_dispatch' && github.repository == 'VortXTV/VortX' &&
      github.actor == 'mamaclapper' && github.ref == 'refs/tags/vortx-android-website-roster-roundtrip-20261112'
    runs-on: ubuntu-24.04
    environment: engine-ci
    timeout-minutes: 75
    env:
      APP_SOURCE: 85a46ac4b3ce5ebc75084383d00dc9152b738cb8
      ENGINE_SOURCE: 2ea2e0f27dd2e53b7b28228435ca35a70f92831f
      HOST_TOOLCHAIN: nightly-2026-07-19
      HOST_TARGET: x86_64-unknown-linux-gnu
      PYTHON_HELPER_SHA: f36342789c411c87d94fd4bf97debf67d1df159a07349807c17750df553fcbf2
      GRADLE_INIT_SHA: 61726fe917b9400d411d405ff6e24c7df72a3440e3cb3d0d642fdf62b93f7f6a
      TEST_SOURCE_SHA: 826148572f9333b9f32889314614d47544c39767474534d1ec92c90a48f60b2b
      GRADLE_WRAPPER_SHA: dfe4f5a7c503ce4c2e29e020a1614c7ce5e40d5529e6c2ae59016094497d768c
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the exact reviewed operations commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: operations
          fetch-depth: 2
          persist-credentials: false

      - name: Check out the exact composed Android test source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.APP_SOURCE }}
          path: frozen
          persist-credentials: false

      - name: Authenticate the protected ref and the narrow source delta
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_REF='refs/tags/vortx-android-website-roster-roundtrip-20261112'
          test "$GITHUB_REPOSITORY" = VortXTV/VortX
          test "$GITHUB_ACTOR" = mamaclapper
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = "$EXPECTED_REF"
          test "$GITHUB_WORKFLOW_REF" = "VortXTV/VortX/.github/workflows/android.yml@$EXPECTED_REF"
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git -C operations rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C operations rev-list --parents -n 1 HEAD)" = "$GITHUB_SHA $APP_SOURCE"
          test "$(git -C operations diff --name-only "$APP_SOURCE" HEAD)" = "$(printf '%s\n' \
            .github/workflows/android.yml scripts/website-roster-jni-proof.init.gradle scripts/website-roster-jni-proof.py)"
          test -z "$(git -C operations status --porcelain)"
          test "$(git -C frozen rev-parse HEAD)" = "$APP_SOURCE"
          test -z "$(git -C frozen status --porcelain)"
          printf '%s  %s\n' "$PYTHON_HELPER_SHA" operations/scripts/website-roster-jni-proof.py | sha256sum --check --status
          printf '%s  %s\n' "$GRADLE_INIT_SHA" operations/scripts/website-roster-jni-proof.init.gradle | sha256sum --check --status
          printf '%s  %s\n' "$TEST_SOURCE_SHA" frozen/android/app/src/test/kotlin/com/vortx/android/engine/NativeWebsiteRosterGatewayJniTest.kt | sha256sum --check --status
          printf '%s  %s\n' "$GRADLE_WRAPPER_SHA" frozen/android/gradle/wrapper/gradle-wrapper.properties | sha256sum --check --status

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK for JVM unit test compilation
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0 cmake;4.1.2'

      - name: Select the pinned SDK NDK for Gradle configuration only
        shell: bash
        run: sdkmanager 'ndk;30.0.16248370'

      - name: Install the exact Rust nightly for the x86_64 Linux host
        uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2
        with:
          toolchain: nightly-2026-07-19
          targets: x86_64-unknown-linux-gnu
          components: rust-src

      - name: Fetch the exact private engine with isolated credentials
        timeout-minutes: 5
        env:
          ENGINE_REPO_TOKEN: ${{ secrets.ENGINE_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "${ENGINE_REPO_TOKEN:-}"
          SCRATCH="$(mktemp -d "$RUNNER_TEMP/vortx-website-jni-private.XXXXXXXX")"
          trap 'rm -rf -- "$SCRATCH"' EXIT
          APP="$GITHUB_WORKSPACE/frozen"
          PRIVATE_CHECKOUT="$SCRATCH/engine"
          mkdir "$PRIVATE_CHECKOUT"
          PRIVATE_REPO="$(awk '$1 == "repository:" && $2 == "VortXTV/vortx-core" { print $2 }' "$APP/.github/workflows/android.yml")"
          test "$PRIVATE_REPO" = VortXTV/vortx-core

          echo 'Authenticating the reviewed private engine checkout.'
          (
            export LC_ALL=C GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
            unset GIT_TRACE GIT_TRACE_PACKET GIT_TRACE_CURL GIT_CURL_VERBOSE
            ASKPASS="$SCRATCH/askpass"
            cat > "$ASKPASS" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$ENGINE_REPO_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
            chmod 700 "$ASKPASS"
            export GIT_ASKPASS="$ASKPASS"
            git -C "$PRIVATE_CHECKOUT" init --quiet
            git -C "$PRIVATE_CHECKOUT" -c credential.helper= -c http.followRedirects=false \
              -c protocol.allow=never -c protocol.https.allow=always fetch --no-tags --depth=1 \
              "https://github.com/$PRIVATE_REPO.git" "$ENGINE_SOURCE"
            git -C "$PRIVATE_CHECKOUT" -c core.hooksPath=/dev/null checkout --detach --quiet FETCH_HEAD
          ) >"$SCRATCH/private-checkout.log" 2>&1
          rm "$SCRATCH/askpass"
          test "$(git -C "$PRIVATE_CHECKOUT" rev-parse HEAD)" = "$ENGINE_SOURCE"
          test -z "$(git -C "$PRIVATE_CHECKOUT" status --porcelain --untracked-files=all)"
          printf 'VORTX_WEBSITE_JNI_PRIVATE_DIR=%s\n' "$SCRATCH" >> "$GITHUB_ENV"
          trap - EXIT

      - name: Prove the exact nine website roster tests with private real host JNI
        timeout-minutes: 60
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(uname -m)" = x86_64
          test -z "${ENGINE_REPO_TOKEN+x}"
          SCRATCH="$VORTX_WEBSITE_JNI_PRIVATE_DIR"
          PREFIX="$RUNNER_TEMP/vortx-website-jni-private."
          SUFFIX="${SCRATCH#"$PREFIX"}"
          [[ "$SUFFIX" =~ ^[A-Za-z0-9]{8}$ && "$SCRATCH" == "$PREFIX$SUFFIX" ]] || exit 1
          test -d "$SCRATCH" && test ! -L "$SCRATCH" || exit 1
          PUBLIC_PROOF="$(mktemp -d "$RUNNER_TEMP/vortx-website-jni-proof.XXXXXXXX")"
          HELPER="$GITHUB_WORKSPACE/operations/scripts/website-roster-jni-proof.py"
          INIT="$GITHUB_WORKSPACE/operations/scripts/website-roster-jni-proof.init.gradle"
          APP="$GITHUB_WORKSPACE/frozen"
          PRIVATE_CHECKOUT="$SCRATCH/engine"
          test "$(git -C "$PRIVATE_CHECKOUT" rev-parse HEAD)" = "$ENGINE_SOURCE"
          test -z "$(git -C "$PRIVATE_CHECKOUT" status --porcelain --untracked-files=all)"
          WORKSPACE="$PRIVATE_CHECKOUT/vortx-core"
          test -f "$WORKSPACE/Cargo.toml" && test -f "$WORKSPACE/Cargo.lock" || exit 1
          test -z "$(find "$WORKSPACE" -type l -print -quit)"

          echo 'Building only the reviewed x86_64 Linux host JNI library.'
          python3 -B "$HELPER" manifest "$WORKSPACE" "$SCRATCH/source-before.json" \
            >"$SCRATCH/private-manifest-before.log" 2>&1
          (
            cd "$WORKSPACE"
            timeout --signal=TERM --kill-after=30s 36m nice -n 15 \
              cargo "+$HOST_TOOLCHAIN" build --locked --manifest-path "$WORKSPACE/Cargo.toml" \
              -p vortx-ffi --no-default-features --features jni,server,resource-host \
              --release --target "$HOST_TARGET" --target-dir "$SCRATCH/target" --jobs 1
          ) >"$SCRATCH/private-cargo.log" 2>&1
          python3 -B "$HELPER" manifest "$WORKSPACE" "$SCRATCH/source-after-build.json" \
            >"$SCRATCH/private-manifest-after-build.log" 2>&1
          cmp --silent "$SCRATCH/source-before.json" "$SCRATCH/source-after-build.json"
          LIBRARY="$SCRATCH/target/$HOST_TARGET/release/libvortx_ffi.so"
          test -s "$LIBRARY" && test ! -L "$LIBRARY" || exit 1
          readelf -h "$LIBRARY" >"$SCRATCH/private-elf.log" 2>&1
          grep -Eq 'Machine:[[:space:]]+Advanced Micro Devices X86-64' "$SCRATCH/private-elf.log"
          grep -Eq 'Type:[[:space:]]+DYN' "$SCRATCH/private-elf.log"
          READELF=readelf bash "$APP/scripts/verify-native-engine-abi.sh" android "$LIBRARY" owner-history \
            >"$SCRATCH/private-abi.log" 2>&1
          LIBRARY_SHA="$(sha256sum "$LIBRARY" | cut -d ' ' -f 1)"
          test "${#LIBRARY_SHA}" -eq 64

          echo 'Running the exact website roster JVM test class with required real JNI.'
          export VORTX_JNI_WEBSITE_ROSTER_ADMISSION=1
          export VORTX_JNI_LIBRARY="$LIBRARY" VORTX_JNI_SHA256="$LIBRARY_SHA"
          export VORTX_ENGINE_CORE_DIR="$SCRATCH/no-android-cross-build-workspace" VORTX_REQUIRE_ENGINE=0
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370" ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/30.0.16248370"
          export JAVA_TOOL_OPTIONS='-XX:ActiveProcessorCount=1'
          GRADLE_RESULTS="$APP/android/app/build/test-results/testPlayDebugUnitTest"
          RESULTS="$SCRATCH/private-junit"
          test ! -e "$GRADLE_RESULTS"
          if (
            cd "$APP/android" &&
            timeout --signal=TERM --kill-after=30s 23m nice -n 15 \
              ./gradlew :app:testPlayDebugUnitTest -I "$INIT" --no-daemon --no-build-cache \
              --max-workers=1 --no-parallel --no-configuration-cache \
              -Pkotlin.compiler.execution.strategy=in-process -Pvortx.nativeEngine=true -Pvortx.nativeResourceHost=true \
              --tests com.vortx.android.engine.NativeWebsiteRosterGatewayJniTest
          ) >"$SCRATCH/private-gradle.log" 2>&1; then
            mv -- "$GRADLE_RESULTS" "$RESULTS"
          else
            status=$?
            if [ -d "$GRADLE_RESULTS" ]; then
              mv -- "$GRADLE_RESULTS" "$RESULTS"
            fi
            TEST_SOURCE="$APP/android/app/src/test/kotlin/com/vortx/android/engine/NativeWebsiteRosterGatewayJniTest.kt"
            python3 -B "$HELPER" diagnose "$RESULTS" "$TEST_SOURCE" 2>"$SCRATCH/private-diagnosis.log" ||
              echo 'Website roster JVM test stage failed. No bounded public fixture diagnostic was available.'
            exit "$status"
          fi

          echo 'Authenticating the exact nine results and post-runtime native bytes.'
          python3 -B "$HELPER" manifest "$WORKSPACE" "$SCRATCH/source-after-runtime.json" \
            >"$SCRATCH/private-manifest-after-runtime.log" 2>&1
          test "$(git -C "$PRIVATE_CHECKOUT" rev-parse HEAD)" = "$ENGINE_SOURCE"
          test -z "$(git -C "$PRIVATE_CHECKOUT" status --porcelain --untracked-files=all)"
          test "$(git -C "$APP" rev-parse HEAD)" = "$APP_SOURCE"
          test -z "$(git -C "$APP" status --porcelain --untracked-files=all)"
          python3 -B "$HELPER" receipt "$RESULTS" "$SCRATCH/source-before.json" "$SCRATCH/source-after-runtime.json" \
            "$LIBRARY" "$LIBRARY_SHA" "$PUBLIC_PROOF" >"$SCRATCH/private-receipt.log" 2>&1
          test "$(find "$PUBLIC_PROOF" -mindepth 1 -maxdepth 1 | wc -l | tr -d '[:space:]')" = 2
          (cd "$PUBLIC_PROOF" && sha256sum --check website-roster-jni-proof.sha256)
          printf 'VORTX_WEBSITE_JNI_PROOF_DIR=%s\n' "$PUBLIC_PROOF" >> "$GITHUB_ENV"
          printf 'Verified nine exact Android website roster tests with real host JNI and zero skips or failures. Proof SHA-256 %s\n' \
            "$(cut -d ' ' -f 1 "$PUBLIC_PROOF/website-roster-jni-proof.sha256")"

      - name: Retain only sanitized JNI counts and digests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VortX-Android-Website-Roster-JNI-Proof
          path: |
            ${{ env.VORTX_WEBSITE_JNI_PROOF_DIR }}/website-roster-jni-proof.json
            ${{ env.VORTX_WEBSITE_JNI_PROOF_DIR }}/website-roster-jni-proof.sha256
          if-no-files-found: error
          retention-days: 14
          overwrite: false

      - name: Remove only this run's scoped private workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          SCRATCH="${VORTX_WEBSITE_JNI_PRIVATE_DIR:-}"
          [ -n "$SCRATCH" ] || exit 0
          PREFIX="$RUNNER_TEMP/vortx-website-jni-private."
          SUFFIX="${SCRATCH#"$PREFIX"}"
          [[ "$SUFFIX" =~ ^[A-Za-z0-9]{8}$ && "$SCRATCH" == "$PREFIX$SUFFIX" ]] || exit 1
          if [ -e "$SCRATCH" ] || [ -L "$SCRATCH" ]; then
            test -d "$SCRATCH" && test ! -L "$SCRATCH" || exit 1
            rm -rf -- "$SCRATCH"
          fi
