name: Build Android APK

# CI-first Android artifact build. Local source/unit validation is also possible with a configured
# SDK/JDK; this lane supplies the pinned private-engine packaging proof. It builds BOTH flavors when
# an integration-branch push touches android/, verifies the native-only VortX .so for every shipped
# ABI, and enforces the GPL licensing boundary: the Play-Store `play` flavor must never carry the GPLv3
# libmpv native libs. The engine crates live in PRIVATE repos (moved out of the public tree in
# 33ff9b5) and are fetched below at pinned commits; bumping an engine pin means editing this file,
# which is itself a path trigger, so the old `core/**` path filters are gone (that dir no longer
# exists in the public tree).
#
# No `pull_request` trigger, DELIBERATELY: the engine-fetch steps below hold ENGINE_REPO_TOKEN in
# the same job that executes repo-controlled code (gradle build scripts, cargo build scripts), so
# building PR heads here would hand any same-repo PR author's code a credential / private-source
# exfiltration lane. Fork PRs never received secrets anyway, so their builds could only die at the
# token preflight; nothing of value is lost. The dev flow is push-to-branch (which triggers this
# workflow); PR contracts belong in separate SECRETLESS validation lanes, not in this engine build.
# Do not re-add `pull_request` -- and never
# `pull_request_target` -- to THIS workflow.

# PRIVILEGED-LANE TRIGGER SURFACE. This job holds ENGINE_REPO_TOKEN plus the Trakt and SIMKL
# secrets, so the push trigger is constrained to the EXACT integration branches, main and beta, and
# nothing else. The former "android/**" glob is REMOVED: it let a push to ANY android/* feature
# branch reach the token-bearing job, which means unreviewed branch code executing next to the
# credential (gradle and cargo build scripts run in the same job that reads the token). That token
# grants access to the PRIVATE engine repositories, so the blast radius was the engine source, not
# just this build. Feature-branch build feedback belongs to a future SECRETLESS workflow (no engine
# fetch, no secrets in the job), not this lane.
#
# This closes the WORKFLOW half only. The REPO-SETTINGS half is the owner's and is still open:
#   - `workflow_dispatch` below can be launched from ANY ref. Only an `engine-ci` environment with a
#     deployment-branch policy stops a dispatch from an unlisted ref reaching the token. That
#     environment must exist and list only main, beta and the release tag lane.
#   - main and beta need branch protection with required review. A direct push to beta today is
#     unreviewed code running beside the secret.
#   - ENGINE_REPO_TOKEN should live INSIDE the `engine-ci` environment (value re-entry) so no job
#     that has not passed the environment gate can read it.
on:
  push:
    branches: [main, beta]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    # Environment gate for the token-bearing job (trust boundary): the `engine-ci` environment
    # carries explicit deployment protection policies: BRANCH entries (beta, main, ci/engine-token)
    # plus a `v*` TAG policy (the tag lane is used by the release workflow; this workflow only ever
    # runs on branch refs, which enter via the branch entries). A push to any OTHER branch -- e.g.
    # the android/** trigger patterns above -- still starts the workflow but the job BLOCKS at this
    # gate before any step runs, which makes ENGINE_REPO_TOKEN unreachable from arbitrary branches.
    # The ci/engine-token entry in that policy is TEMPORARY, for proof runs on the CI branch, and
    # is removed at integration. Moving the ENGINE_REPO_TOKEN secret itself INTO the environment
    # (value re-entry) is a queued owner step; until then the gate still stops arbitrary-branch jobs
    # from ever reaching the fetch steps that read it.
    environment: engine-ci
    # Pinned explicit runner label: `ubuntu-latest` is a MOVING alias (it means ubuntu-24.04 today,
    # per actions/runner-images), and a silent alias flip would swap the whole toolchain -- JDK
    # packages, kernel -- under a runtime-proven lane with no diff in this file. (The APK gate below
    # no longer leans on the image's binutils readelf; it uses the pinned NDK's own llvm-readelf, so
    # its provenance is tied to the NDK pin, not this image.) Moving to a newer image is a
    # deliberate edit here, verified by a run, not an alias drift.
    runs-on: ubuntu-24.04
    # GitHub-owned actions are SHA-pinned too (finishing the supply-chain pass that already pinned
    # the third-party actions): a mutable tag -- even on an actions/* repo -- can be repointed, and
    # this job holds ENGINE_REPO_TOKEN. Each pin carries the tag it resolved from.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ---- Private engine fetch (moved out of the public tree in 33ff9b5) --------------------------
      # Native Android artifacts use libvortx_ffi.so only, built with jni,server,resource-host from
      # the reviewed vortx-core pin. The stremiox-core checkout and full-SHA pin stay available for
      # explicit non-native comparison builds, but native variants do not schedule cargoNdkBuild and
      # Gradle excludes libstremiox_core.so from those packages.
      #
      # Both fetches use actions/checkout (GitHub's own auth path: the token is injected through an
      # env-sourced local git config, never argv, and persist-credentials: false wipes it after the
      # step), pinned to the exact commits the current build links. Requires the ENGINE_REPO_TOKEN
      # secret (fine-grained PAT, Contents:read on both private repos; deploy keys are disabled by
      # the VortXTV org). Both immutable source pins are checked; a missing VortX manifest/toolchain
      # fails native builds closed, while the retained Stremio pin is not compiled in native mode.
      - name: Preflight the engine token (fail closed)
        env:
          ENGINE_REPO_TOKEN: ${{ secrets.ENGINE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ENGINE_REPO_TOKEN:-}" ]; then
            echo "::error::ENGINE_REPO_TOKEN secret is not set; CI cannot fetch the private engine repos (VortXTV/stremiox-core + VortXTV/vortx-core)"
            exit 1
          fi

      # stremiox-core is a STANDALONE crate (Cargo.toml at its repo root): check out straight into core/.
      - name: Fetch stremiox-core (private, pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: VortXTV/stremiox-core
          # Same reviewed, immutable wrapper as both release lanes. Its lockfile resolves the
          # published Git dependency; callable history exports are verified below for every ABI.
          ref: 31c66611822043e089f5819ad232a5df93975873
          token: ${{ secrets.ENGINE_REPO_TOKEN }}
          path: core
          persist-credentials: false

      # vortx-core is a MONOREPO whose engine workspace is its vortx-core/ SUBDIR (the engine manifest
      # sits at vortx-core/vortx-core/Cargo.toml inside the repo). Check out to a temp path, then
      # promote only that subdir to the app-root vortx-core/ the gradle task builds from.
      - name: Fetch vortx-core (private monorepo, pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: VortXTV/vortx-core
          ref: dd520b0c9e540e11b9e115467b4fe5ec0ccb3fb2
          token: ${{ secrets.ENGINE_REPO_TOKEN }}
          path: _vortx_core_src
          persist-credentials: false

      - name: Promote the vortx-core workspace + record exact private source pins
        run: |
          set -euo pipefail
          vortx_sha="$(git -C _vortx_core_src rev-parse HEAD^{commit})"
          test "$vortx_sha" = "dd520b0c9e540e11b9e115467b4fe5ec0ccb3fb2" \
            || { echo "::error::vortx-core checkout does not match the reviewed private pin"; exit 1; }
          stremio_sha="$(git -C core rev-parse HEAD^{commit})"
          test "$stremio_sha" = "31c66611822043e089f5819ad232a5df93975873" \
            || { echo "::error::stremiox-core checkout does not match its immutable pin"; exit 1; }
          echo "VORTX_ENGINE_SOURCE_SHA=$vortx_sha" >> "$GITHUB_ENV"
          echo "STREMIOX_CORE_SOURCE_SHA=$stremio_sha" >> "$GITHUB_ENV"
          rm -rf vortx-core
          mv _vortx_core_src/vortx-core vortx-core
          rm -rf _vortx_core_src
          test -f core/Cargo.toml       || { echo "::error::stremiox-core crate missing after checkout (core/Cargo.toml)"; exit 1; }
          test -f vortx-core/Cargo.toml || { echo "::error::vortx-core engine workspace missing after promote (vortx-core/Cargo.toml)"; exit 1; }
          test -d vortx-core/crates     || { echo "::error::vortx-core engine crates/ missing after promote (vortx-core/crates)"; exit 1; }
          echo "pinned private sources: stremiox-core@$stremio_sha vortx-core@$vortx_sha (promoted monorepo subdir)"

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      # Non-GitHub-owned actions below are pinned to full commit SHAs (mutable tags on third-party
      # repos are a supply-chain hole; GitHub-owned actions/* stay on major tags).
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      # No gradle-version here: the committed wrapper (android/gradle/wrapper/gradle-wrapper.properties)
      # is the single Gradle-version truth. setup-gradle is kept only for its build cache; the build
      # runs via ./gradlew below.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      # Native artifacts cross-compile vortx-ffi from the reviewed VortX workspace. The pinned NDK,
      # Rust nightly Android targets and cargo-ndk are required for that output. The legacy Stremio
      # source remains pinned for explicit non-native comparison builds but is not built here.
      - name: Install Android NDK (must match ndkVersion in app/build.gradle.kts)
        run: |
          yes | sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      # SHA-pinned (see the pin note above). Pinning drops the toolchain-from-ref-name convention
      # (@nightly), so the toolchain is passed explicitly.
      #
      # Toolchain truth: rust-toolchain.toml IS the Rust-version authority, not this step. BOTH
      # engine checkouts carry one (core/rust-toolchain.toml and the promoted
      # vortx-core/rust-toolchain.toml, each `channel = "nightly-2026-07-19"` + rust-src; verified
      # at the pinned engine commits), and rustup's directory-override rule means every cargo
      # invocation inside those dirs resolves the toolchain through that file. This step is ONLY
      # the installer that puts that DATED toolchain + the Android targets on the runner for those
      # files to select; it MUST name the same dated channel the engine toolchain files pin,
      # because the Android targets are installed per-toolchain. Drift fails closed, not silently:
      # if the files pin a different date, rustup auto-installs that toolchain WITHOUT the Android
      # targets and the cargo-ndk build dies with a missing-target error.
      - name: Install Rust nightly + Android targets
        uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2 # nightly branch, 2026-07-19
        with:
          toolchain: nightly-2026-07-19
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          components: rust-src

      # Second workspace line: the vortx-ffi cross-build's CARGO_TARGET_DIR is pinned by the gradle
      # task to <engine>/target-andx (build.gradle.kts:407), not the default target/.
      #
      # Ref-scoped cache key (private-intermediate containment): the workspace `target` dirs cached
      # here hold compiled output of the PRIVATE engine crates. `key` is folded into rust-cache's
      # cache key (and into its restore-key prefixes), so each ref gets its OWN cache partition and a
      # run on one branch cannot restore another branch's private-engine intermediates -- not via an
      # exact hit and not via the lockfile-dropped prefix fallback. Include the fetched private
      # source content in that prefix too: even a same-ref engine update must not restore old
      # private targets. Public app-only edits can still reuse identical engine/dependency work.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ github.ref_name }}-native-${{ env.VORTX_ENGINE_SOURCE_SHA }}-${{ hashFiles('core/Cargo.*', 'core/rust-toolchain.toml', 'core/.cargo/**', 'core/src/**', 'core/include/**', 'vortx-core/Cargo.*', 'vortx-core/rust-toolchain.toml', 'vortx-core/.cargo/**', 'vortx-core/crates/**', 'android/app/build.gradle.kts') }}
          workspaces: |
            core -> target
            vortx-core -> target-andx

      # Pinned EXACTLY: "^3" is a moving target (a new 3.x release would swap the build tool under
      # this runtime-proven lane with no diff here). =3.5.4 is what "^3" resolves to at pin time,
      # i.e. the version the proven runs actually installed. cargo-ndk 4.x exists (4.1.2 today);
      # that major bump is a deliberate future change with its own verifying run, not a pin.
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version "=3.5.4" --locked

      # Build BOTH flavors. lint.abortOnError = true (app/build.gradle.kts) still gates each assemble.
      #
      # External sync credentials (Trakt device-code OAuth, SIMKL PIN flow) are injected here as env vars,
      # which app/build.gradle.kts's externalSyncSecret() reads into BuildConfig (TraktAuth / SIMKLAuth).
      # These are the SAME GitHub Actions secrets the Apple release CI uses (release-tvos.yml feeds them
      # into the Info.plist): TRAKT_CLIENT_ID, TRAKT_CLIENT_SECRET, SIMKL_CLIENT_ID, SIMKL_CLIENT_SECRET.
      # Absent secrets resolve to "" so the build still succeeds with the feature dormant (e.g. on a fork).
      # Engine wiring (see the fetch block above for the gradle-contract citations):
      #   STREMIOX_CORE_DIR      -> cargoNdkBuild's crate dir (explicit; don't lean on the legacy
      #                             ../core fallback chain in build.gradle.kts:261-264).
      #   VORTX_ENGINE_CORE_DIR  -> cargoNdkBuildVortxFfi's engine workspace (build.gradle.kts:382-385).
      #   VORTX_REQUIRE_ENGINE=1 -> the selected Vortx FFI task fails closed on missing source, cargo,
      #                             or per-ABI output, so native CI cannot package staged leftovers.
      # Native selection is explicit at the Gradle invocation boundary. Passing both properties is
      # required: the app BuildConfig and the vortx-ffi resource-host feature are derived from the
      # same fail-closed contract in app/build.gradle.kts. VORTX_NATIVE_RESOURCE_HOST remains in
      # env for the private-engine fetch/build diagnostics and backwards-compatible local tooling.
      # Reproducibility: the selected Vortx cargo-ndk invocation passes --locked against the Cargo.lock
      # at its exact private commit. The retained Stremio pin is not built in native mode.
      - name: Build debug APKs (full + play)
        working-directory: android
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          STREMIOX_CORE_DIR: ${{ github.workspace }}/core
          VORTX_ENGINE_CORE_DIR: ${{ github.workspace }}/vortx-core
          VORTX_REQUIRE_ENGINE: "1"
          VORTX_NATIVE_RESOURCE_HOST: "1"
          VORTX_NATIVE_ENGINE: "1"
        run: ./gradlew assembleFullDebug assemblePlayDebug -Pvortx.nativeEngine=true -Pvortx.nativeResourceHost=true --no-daemon --stacktrace

      # Fail loud if either flavor did not produce an APK (a path drift or a silently-skipped variant
      # must fail the job, not pass with a missing artifact).
      - name: Verify per-flavor APK presence
        run: |
          set -euo pipefail
          shopt -s nullglob
          full=(android/app/build/outputs/apk/full/debug/*.apk)
          play=(android/app/build/outputs/apk/play/debug/*.apk)
          if [ ${#full[@]} -eq 0 ]; then echo "::error::full-flavor debug APK missing"; exit 1; fi
          if [ ${#play[@]} -eq 0 ]; then echo "::error::play-flavor debug APK missing"; exit 1; fi
          echo "full APK(s): ${full[*]}"
          echo "play APK(s): ${play[*]}"

      # Native-only package proof: BuildConfig must select the Vortx repository, every APK must
      # contain exactly one libvortx_ffi.so for each shipped ABI and no libstremiox_core.so, and the
      # packaged bytes must match fresh src/main/jniLibs output after identical pinned llvm-strip
      # normalization. The shared verifier checks ELF architecture, kernel/server JNI exports, and the
      # resource-host ABI; it records the exact private source SHA, feature set, and normalized hashes.
      # BuildConfig remains a separate pinned-dexdump check because it is DEX data, not ELF metadata.
      - name: Verify native BuildConfig and native-only .so in every APK
        run: |
          set -euo pipefail
          shopt -s nullglob
          READELF="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          STRIP="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          DEXDUMP="$ANDROID_HOME/build-tools/36.0.0/dexdump"
          test -x "$READELF" || { echo "::error::pinned NDK llvm-readelf unavailable"; exit 1; }
          test -x "$STRIP" || { echo "::error::pinned NDK llvm-strip unavailable"; exit 1; }
          test -x "$DEXDUMP" || { echo "::error::pinned Android build-tools dexdump unavailable"; exit 1; }
          full_apks=(android/app/build/outputs/apk/full/debug/*.apk)
          play_apks=(android/app/build/outputs/apk/play/debug/*.apk)
          if [ ${#full_apks[@]} -ne 1 ] || [ ${#play_apks[@]} -ne 1 ]; then
            echo "::error::expected exactly one Full APK and one Play APK to verify native-only packaging"
            exit 1
          fi
          apks=("${full_apks[@]}" "${play_apks[@]}")
          for apk in "${apks[@]}"; do
            DEXDUMP="$DEXDUMP" bash scripts/verify-android-native-build-config.sh "$apk"
          done
          READELF="$READELF" STRIP="$STRIP" bash scripts/verify-native-android-artifacts.sh \
            --native-only \
            --staged-dir android/app/src/main/jniLibs \
            --source-sha "$VORTX_ENGINE_SOURCE_SHA" \
            "${apks[@]}"

      # Licensing boundary gate: the `play` flavor must be free of the GPLv3 mpv/ffmpeg native libs
      # (they ship only via fullImplementation). libmpv.so is the canonical marker; the sibling libs
      # from the same AAR are scanned too. Any hit fails the build.
      - name: GPL scan (play flavor must not contain libmpv)
        run: |
          set -euo pipefail
          shopt -s nullglob
          gpl_pattern='lib(mpv|player|avcodec|avformat|avutil)\.so'
          fail=0
          for apk in android/app/build/outputs/apk/play/debug/*.apk; do
            # Capture the full listing first so grep never SIGPIPEs unzip under pipefail
            # (a short-circuiting grep -q on a long listing would make the step falsely pass).
            listing="$(unzip -l "$apk")"
            if grep -Eq "$gpl_pattern" <<<"$listing"; then
              echo "::error::GPL native lib found in play APK: $apk"
              grep -E "$gpl_pattern" <<<"$listing" || true
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "play flavor is clean of libmpv/ffmpeg GPL native libs"

      - name: Upload full-flavor APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VortX-Android-full-debug
          path: android/app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error

      - name: Upload play-flavor APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VortX-Android-play-debug
          path: android/app/build/outputs/apk/play/debug/*.apk
          if-no-files-found: error

      # ---- Signed release build (W0-3) -----------------------------------------------------------
      # Everything above (debug build + engine verification + debug uploads) is unchanged and always
      # runs. The signed release is ADDITIVE and gated on the upload keystore being provisioned: when
      # ANDROID_KEYSTORE_BASE64 is absent (a fork, or before the owner sets the secrets) the steps
      # below skip and the job still succeeds on the debug artifacts. The release is the sideloaded
      # `full` flavor (mirrors the Apple sideload-IPA model); the GPL-gated `play` flavor is a separate
      # Play-Store concern. VORTX_REQUIRE_ENGINE=1 requires fresh Vortx FFI output and the native-only
      # artifact verifier rejects missing, stale, or legacy Stremio JNI libraries.
      #
      # Secrets cannot be referenced directly in a step `if:`, so this preflight promotes their
      # presence to an output the later steps gate on. It reveals only whether the secret is set,
      # never its value.
      - name: Preflight release signing (gate on keystore secret)
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "upload keystore secret present; a signed release will be built"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANDROID_KEYSTORE_BASE64 not set; skipping the signed release build (debug artifacts unaffected)"
          fi

      # Decode the base64 keystore secret to a temp file OUTSIDE the workspace so it is never picked up
      # by a gradle source set or an artifact glob. Fail closed if the decode yields an empty file.
      - name: Decode upload keystore
        if: steps.signing.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/upload.jks"
          test -s "$RUNNER_TEMP/signing/upload.jks" || { echo "::error::decoded keystore is empty (bad ANDROID_KEYSTORE_BASE64)"; exit 1; }

      # Build the signed release APK + AAB for the sideloaded `full` flavor. Same native-only engine
      # wiring as the debug build above; both immutable private pins remain checked. The
      # VORTX_* signing env vars are exactly what app/build.gradle.kts's signingSecret() reads; with all
      # four set, its release signingConfig activates and signs the outputs.
      - name: Build signed release (full flavor APK + AAB)
        if: steps.signing.outputs.ready == 'true'
        working-directory: android
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          STREMIOX_CORE_DIR: ${{ github.workspace }}/core
          VORTX_ENGINE_CORE_DIR: ${{ github.workspace }}/vortx-core
          VORTX_REQUIRE_ENGINE: "1"
          VORTX_NATIVE_RESOURCE_HOST: "1"
          VORTX_NATIVE_ENGINE: "1"
          VORTX_KEYSTORE_PATH: ${{ runner.temp }}/signing/upload.jks
          VORTX_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VORTX_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VORTX_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleFullRelease bundleFullRelease -Pvortx.nativeEngine=true -Pvortx.nativeResourceHost=true --no-daemon --stacktrace

      # Signing-variable mapping assertion (fail-closed): prove the release build exports exactly
      # the four signing variables Gradle reads (build.gradle.kts:38-43), and Gradle maps exactly
      # those four names through signingSecret(). The assertion runs unconditionally (not gated on
      # steps.signing.outputs.ready) because this source contract must hold even when secrets are absent.
      - name: Assert release signing-variable mapping (exact four canonical vars)
        run: |
          set -euo pipefail
          wf=".github/workflows/android.yml"
          gradle="android/app/build.gradle.kts"
          fail=0
          # Extract the authoritative blocks before checking them. Do not search this whole workflow:
          # the assertions below intentionally name forbidden values and regular expressions.
          release_env="$(
            awk '
              $0 == "      - name: Build signed release (full flavor APK + AAB)" { in_release_step=1; next }
              in_release_step && /^      - name:/ { exit }
              in_release_step && /^        env:$/ { in_env=1; next }
              in_env && /^          [[:alpha:]_][[:alnum:]_]*:/ { print; next }
              in_env { exit }
            ' "$wf"
          )"
          gradle_inputs="$(
            awk '
              /^val releaseSigningInputs = mapOf\(/ { in_inputs=1 }
              in_inputs { print }
              in_inputs && /^\)$/ { exit }
            ' "$gradle"
          )"
          # 1. Gradle declares exactly these four variable names in its release-signing input map.
          normalized_gradle_inputs="$(tr -d '[:space:]' <<<"$gradle_inputs")"
          canonical_gradle_inputs='valreleaseSigningInputs=mapOf("VORTX_KEYSTORE_PATH"tosigningSecret("VORTX_KEYSTORE_PATH"),"VORTX_KEYSTORE_PASSWORD"tosigningSecret("VORTX_KEYSTORE_PASSWORD"),"VORTX_KEY_ALIAS"tosigningSecret("VORTX_KEY_ALIAS"),"VORTX_KEY_PASSWORD"tosigningSecret("VORTX_KEY_PASSWORD"),)'
          for var in VORTX_KEYSTORE_PATH VORTX_KEYSTORE_PASSWORD VORTX_KEY_ALIAS VORTX_KEY_PASSWORD; do
            grep -qF "\"$var\"tosigningSecret(\"$var\")" <<<"$normalized_gradle_inputs" \
              || { echo "::error::Gradle signing contract missing $var in $gradle"; fail=1; }
          done
          if [ "$normalized_gradle_inputs" != "$canonical_gradle_inputs" ]; then
            echo "::error::$gradle releaseSigningInputs must exactly match the canonical four-entry signing map"
            fail=1
          fi
          # 2. This workflow exports exactly those four signing keys under the release-build step.
          for var in VORTX_KEYSTORE_PATH VORTX_KEYSTORE_PASSWORD VORTX_KEY_ALIAS VORTX_KEY_PASSWORD; do
            grep -qE "^[[:space:]]*${var}:" <<<"$release_env" \
              || { echo "::error::$wf does not export $var for the release build"; fail=1; }
          done
          release_signing_key_count="$(grep -Ec '^[[:space:]]*VORTX_KEY[[:alnum:]_]*:' <<<"$release_env" || true)"
          if [ "$release_signing_key_count" -ne 4 ]; then
            echo "::error::$wf release build must export exactly four VORTX_KEY* signing variables"
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "ok: release signing-variable mapping holds (exactly 4 canonical vars)"

      # Remove the decoded keystore as soon as the build is done, whatever the outcome.
      - name: Shred decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/signing/upload.jks" || true

      # Run the same v2 + PEM certificate + pinned-production-identity verifier used by the release
      # lane, so candidate CI catches signer-policy and parser regressions before publication.
      - name: Verify signed release artifacts against the pinned production signer
        if: steps.signing.outputs.ready == 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(android/app/build/outputs/apk/full/release/*.apk)
          bundles=(android/app/build/outputs/bundle/fullRelease/*.aab)
          if [ ${#apks[@]} -ne 1 ] || [ ${#bundles[@]} -ne 1 ]; then
            echo "::error::expected one signed full release APK and one signed full release AAB"; exit 1
          fi
          scripts/verify-android-release-signing.sh verify "${apks[@]}" "${bundles[@]}"
          READELF="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
          STRIP="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" \
            bash scripts/verify-native-android-artifacts.sh \
              --native-only --staged-dir android/app/src/main/jniLibs \
              --source-sha "$VORTX_ENGINE_SOURCE_SHA" "${apks[@]}" "${bundles[@]}"

      # The packaged .so gate above proves JNI/resource-host exports. This separate bytecode gate
      # proves the signed APK/AAB selected the same native mode at compile time; a release with a
      # resource-host library but BuildConfig=false would silently route the app through legacy
      # repository seams and is not a native release.
      - name: Verify native BuildConfig in signed release artifacts
        if: steps.signing.outputs.ready == 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(android/app/build/outputs/apk/full/release/*.apk)
          bundles=(android/app/build/outputs/bundle/fullRelease/*.aab)
          DEXDUMP="$ANDROID_HOME/build-tools/36.0.0/dexdump"
          test -x "$DEXDUMP" || { echo "::error::pinned Android build-tools dexdump unavailable"; exit 1; }
          for artifact in "${apks[@]}" "${bundles[@]}"; do
            DEXDUMP="$DEXDUMP" bash scripts/verify-android-native-build-config.sh "$artifact"
          done

      - name: Upload signed release APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VortX-Android-full-release-signed
          path: android/app/build/outputs/apk/full/release/*.apk
          if-no-files-found: error

      - name: Upload signed release AAB
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VortX-Android-full-release-bundle
          path: android/app/build/outputs/bundle/fullRelease/*.aab
          if-no-files-found: error
