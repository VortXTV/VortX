name: Protected Android legacy preference restore proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vortx-android-legacy-preference-restore-proof
  cancel-in-progress: false

jobs:
  legacy-preference-restore-jni:
    if: >-
      github.event_name == 'workflow_dispatch' && github.repository == 'VortXTV/VortX' &&
      github.actor == 'mamaclapper' &&
      github.ref == 'refs/tags/vortx-android-legacy-preference-restore-recheck-20261115'
    runs-on: ubuntu-24.04
    environment: engine-ci
    timeout-minutes: 75
    env:
      APP_SOURCE: '1d886b0d82b4e3329224de3adbd0875053afc32f'
      ENGINE_SOURCE: 2ea2e0f27dd2e53b7b28228435ca35a70f92831f
      HOST_TOOLCHAIN: nightly-2026-07-19
      HOST_TARGET: x86_64-unknown-linux-gnu
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the exact operations commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: operations
          fetch-depth: 2
          persist-credentials: false

      - name: Check out the reviewed application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.APP_SOURCE }}
          path: frozen
          persist-credentials: false

      - name: Authenticate the protected ref and workflow-only delta
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_REF=refs/tags/vortx-android-legacy-preference-restore-recheck-20261115
          test "$GITHUB_REPOSITORY" = VortXTV/VortX
          test "$GITHUB_ACTOR" = mamaclapper
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = "$EXPECTED_REF"
          test "$GITHUB_WORKFLOW_REF" = "VortXTV/VortX/.github/workflows/android.yml@$EXPECTED_REF"
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$APP_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C operations rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C operations rev-list --parents -n 1 HEAD)" = "$GITHUB_SHA $APP_SOURCE"
          test "$(git -C operations diff --name-only "$APP_SOURCE" HEAD)" = .github/workflows/android.yml
          test -z "$(git -C operations status --porcelain --untracked-files=all)"
          test "$(git -C frozen rev-parse HEAD)" = "$APP_SOURCE"
          test -z "$(git -C frozen status --porcelain --untracked-files=all)"

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK for JVM test compilation
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0 cmake;4.1.2'

      - name: Install the pinned NDK for Gradle configuration
        shell: bash
        run: sdkmanager 'ndk;30.0.16248370'

      - name: Install the pinned Rust toolchain for the Linux host
        uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2
        with:
          toolchain: nightly-2026-07-19
          targets: x86_64-unknown-linux-gnu
          components: rust-src

      - name: Fetch the exact private engine with isolated credentials
        timeout-minutes: 5
        env:
          ENGINE_REPO_TOKEN: ${{ secrets.ENGINE_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "${ENGINE_REPO_TOKEN:-}"
          SCRATCH="$(mktemp -d "$RUNNER_TEMP/vortx-legacy-preference-private.XXXXXXXX")"
          trap 'rm -rf -- "$SCRATCH"' EXIT
          PRIVATE="$SCRATCH/engine"
          mkdir "$PRIVATE"
          (
            export LC_ALL=C GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
            unset GIT_TRACE GIT_TRACE_PACKET GIT_TRACE_CURL GIT_CURL_VERBOSE
            cat > "$SCRATCH/askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$ENGINE_REPO_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
            chmod 700 "$SCRATCH/askpass"
            export GIT_ASKPASS="$SCRATCH/askpass"
            git -C "$PRIVATE" init --quiet
            git -C "$PRIVATE" -c credential.helper= -c http.followRedirects=false \
              -c protocol.allow=never -c protocol.https.allow=always fetch --no-tags --depth=1 \
              https://github.com/VortXTV/vortx-core.git "$ENGINE_SOURCE"
            git -C "$PRIVATE" -c core.hooksPath=/dev/null checkout --detach --quiet FETCH_HEAD
            rm "$SCRATCH/askpass"
            test "$(git -C "$PRIVATE" rev-parse HEAD)" = "$ENGINE_SOURCE"
            test -z "$(git -C "$PRIVATE" status --porcelain --untracked-files=all)"
          ) >"$SCRATCH/private-checkout.log" 2>&1
          printf 'VORTX_LEGACY_PREFERENCE_PRIVATE_DIR=%s\n' "$SCRATCH" >> "$GITHUB_ENV"
          trap - EXIT

      - name: Run the three restore suites against the exact host JNI library
        timeout-minutes: 63
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(uname -m)" = x86_64
          test -z "${ENGINE_REPO_TOKEN+x}"
          SCRATCH="$VORTX_LEGACY_PREFERENCE_PRIVATE_DIR"
          PREFIX="$RUNNER_TEMP/vortx-legacy-preference-private."
          SUFFIX="${SCRATCH#"$PREFIX"}"
          [[ "$SUFFIX" =~ ^[A-Za-z0-9]{8}$ && "$SCRATCH" == "$PREFIX$SUFFIX" ]]
          test -d "$SCRATCH" && test ! -L "$SCRATCH"
          APP="$GITHUB_WORKSPACE/frozen"
          PRIVATE="$SCRATCH/engine"
          WORKSPACE="$PRIVATE/vortx-core"
          RESULTS="$APP/android/app/build/test-results/testPlayDebugUnitTest"
          PROOF="$(mktemp -d "$RUNNER_TEMP/vortx-legacy-preference-proof.XXXXXXXX")"
          test -f "$WORKSPACE/Cargo.toml" && test -f "$WORKSPACE/Cargo.lock"
          test "$(realpath "$WORKSPACE")" = "$WORKSPACE"
          test ! -e "$RESULTS"

          manifest() {
            test "$(git -C "$PRIVATE" rev-parse HEAD)" = "$ENGINE_SOURCE" || return 1
            test -z "$(git -C "$PRIVATE" status --porcelain --untracked-files=all)" || return 1
            test -z "$(find "$WORKSPACE" ! -type f ! -type d -print -quit)" || return 1
            (cd "$WORKSPACE" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum) >"$1"
            test -s "$1"
          }

          echo 'Building the reviewed x86_64 Linux host JNI library.'
          (
            manifest "$SCRATCH/source-before.sha256"
            cd "$WORKSPACE"
            timeout --signal=TERM --kill-after=30s 36m nice -n 15 \
              cargo "+$HOST_TOOLCHAIN" build --locked --manifest-path "$WORKSPACE/Cargo.toml" \
              -p vortx-ffi --no-default-features --features jni,server,resource-host \
              --release --target "$HOST_TARGET" --target-dir "$SCRATCH/target" --jobs 1
            manifest "$SCRATCH/source-after-build.sha256"
            cmp --silent "$SCRATCH/source-before.sha256" "$SCRATCH/source-after-build.sha256"
          ) >"$SCRATCH/private-cargo.log" 2>&1
          LIBRARY="$SCRATCH/target/$HOST_TARGET/release/libvortx_ffi.so"
          test -s "$LIBRARY" && test ! -L "$LIBRARY"
          test "$(realpath "$LIBRARY")" = "$LIBRARY"
          readelf -h "$LIBRARY" >"$SCRATCH/private-elf.log" 2>&1
          grep -Eq 'Machine:[[:space:]]+Advanced Micro Devices X86-64' "$SCRATCH/private-elf.log"
          grep -Eq 'Type:[[:space:]]+DYN' "$SCRATCH/private-elf.log"
          READELF=readelf bash "$APP/scripts/verify-native-engine-abi.sh" android "$LIBRARY" owner-history \
            >"$SCRATCH/private-abi.log" 2>&1
          LIBRARY_SHA="$(sha256sum "$LIBRARY" | cut -d ' ' -f 1)"
          [[ "$LIBRARY_SHA" =~ ^[0-9a-f]{64}$ ]]

          cat >"$SCRATCH/host-only.init.gradle" <<'GROOVY'
          gradle.taskGraph.whenReady { graph ->
              def forbidden = graph.allTasks.findAll { task ->
                  task.name ==~ /(?i)(cargo.*|.*externalNativeBuild.*|.*CMake.*|merge.*JniLib.*|assemble.*|bundle.*(Aar|Apk|Aab).*|package.*(Apk|Bundle).*|package(Full|Play)?(Debug|Release)|sign.*(Apk|Bundle|Release).*|validateSigning.*|install.*|connected.*|publish.*)/
              }
              def tests = graph.allTasks.findAll { it instanceof org.gradle.api.tasks.testing.Test }
              if (!forbidden.empty || tests*.path != [":app:testPlayDebugUnitTest"])
                  throw new GradleException("Require exactly the Play JVM test task and no package/device/cross-build tasks")
          }
          allprojects {
              tasks.withType(org.gradle.api.tasks.testing.Test).configureEach { task ->
                  if (task.path == ":app:testPlayDebugUnitTest") {
                      def library = new File(System.getenv("VORTX_JNI_LIBRARY"))
                      maxParallelForks = 1
                      forkEvery = 0
                      maxHeapSize = "768m"
                      jvmArgs "-XX:ActiveProcessorCount=1", "-XX:+UseSerialGC",
                          "-Djava.library.path=" + library.parent,
                          "-Dkotlinx.coroutines.io.parallelism=1", "-Dkotlinx.coroutines.scheduler.core.pool.size=1",
                          "-Dkotlinx.coroutines.scheduler.max.pool.size=2"
                      filter.failOnNoMatchingTests = true
                      ignoreFailures = false
                      outputs.upToDateWhen { false }
                      outputs.cacheIf { false }
                  }
              }
          }
          GROOVY
          export VORTX_JNI_SYNC=1 VORTX_JNI_LIBRARY="$LIBRARY" VORTX_JNI_SHA256="$LIBRARY_SHA"
          export VORTX_ENGINE_CORE_DIR="$SCRATCH/no-android-cross-build-workspace" VORTX_REQUIRE_ENGINE=0
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370" ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/30.0.16248370"
          export JAVA_TOOL_OPTIONS='-XX:ActiveProcessorCount=1'
          outcome=0
          (
            cd "$APP/android"
            timeout --signal=TERM --kill-after=30s 24m nice -n 15 \
              ./gradlew :app:testPlayDebugUnitTest -I "$SCRATCH/host-only.init.gradle" --no-daemon --no-build-cache \
              --max-workers=1 --no-parallel --no-configuration-cache \
              -Pkotlin.compiler.execution.strategy=in-process -Pvortx.nativeEngine=true -Pvortx.nativeResourceHost=true \
              --tests com.vortx.android.engine.NativeHostDocumentTest \
              --tests com.vortx.android.sync.NativeAccountSyncTest \
              --tests com.vortx.android.engine.NativeOwnerHistoryJniTest
          ) >"$SCRATCH/private-gradle.log" 2>&1 || outcome=$?

          manifest "$SCRATCH/source-after-runtime.sha256" >"$SCRATCH/private-manifest.log" 2>&1
          cmp --silent "$SCRATCH/source-before.sha256" "$SCRATCH/source-after-runtime.sha256"
          test "$(sha256sum "$LIBRARY" | cut -d ' ' -f 1)" = "$LIBRARY_SHA"
          test "$(git -C "$APP" rev-parse HEAD)" = "$APP_SOURCE"
          test -z "$(git -C "$APP" status --porcelain --untracked-files=all)"
          if [ "$outcome" != 0 ]; then
            printf 'Host JVM proof failed with exit status %s. Raw engine, build and test logs were kept private.\n' "$outcome"
            # Emit only public source coordinates and reviewed test identities.
            python3 -I - "$SCRATCH/private-gradle.log" "$APP" "$RESULTS" <<'PY'
          import re
          import sys
          from pathlib import Path
          from xml.etree import ElementTree as ET

          report, app, results = map(Path, sys.argv[1:4])
          with report.open("rb") as stream:
              stream.seek(max(0, report.stat().st_size - 65536))
              data = stream.read(65536)
          locations = re.findall(rb"(?m)^e: file://[^\r\n]*?/frozen/(android/app/src/(?:main|test)/kotlin/com/vortx/android/[A-Za-z0-9_/]+\.kt):([1-9][0-9]{0,4}):[1-9][0-9]{0,4}", data)
          for path, line in sorted(set(locations))[:8]:
              print("Public Kotlin diagnostic at " + path.decode("ascii") + ":" + line.decode("ascii"))

          classes = ("com.vortx.android.engine.NativeHostDocumentTest",
                     "com.vortx.android.sync.NativeAccountSyncTest",
                     "com.vortx.android.engine.NativeOwnerHistoryJniTest")
          public_sources = app / "android/app/src/test/kotlin"
          fixture = public_sources / "com/vortx/android/engine/NativeLegacyPreferenceRestoreFixture.kt"
          frame = re.compile(r"(?m)^\s*at com\.vortx\.android\.engine\.NativeLegacyPreferenceRestoreFixtureKt"
                             r"(?:\$[A-Za-z0-9_$]+)*\.[A-Za-z0-9_$-]{1,180}"
                             r"\(NativeLegacyPreferenceRestoreFixture\.kt:([1-9][0-9]{0,3})\)[ \t]*$")
          fixture_lines = (len(fixture.read_text(encoding="utf-8").splitlines()) if fixture.is_file() and
                           not fixture.is_symlink() and fixture.stat().st_size <= 1024**2 else 0)
          diagnostics = set()
          if results.is_dir() and not results.is_symlink() and results.resolve() == results:
              for name in classes:
                  candidate = results / f"TEST-{name}.xml"
                  source = public_sources / (name.replace(".", "/") + ".kt")
                  if (not candidate.is_file() or candidate.is_symlink() or not source.is_file() or
                          source.is_symlink() or source.stat().st_size > 1024**2):
                      continue
                  try:
                      with candidate.open("rb") as stream:
                          raw = stream.read(1024**2 + 1)
                      if not 0 < len(raw) <= 1024**2 or any(mark in raw for mark in (b"<!DOCTYPE", b"<!ENTITY", b"\0")):
                          continue
                      suite = ET.fromstring(raw.decode("utf-8"))
                      if suite.tag != "testsuite" or suite.get("name") != name:
                          continue
                      methods = re.findall(r"^[ \t]*@Test\s+fun\s+(`[^`\r\n]+`|[A-Za-z_][A-Za-z0-9_]*)\s*\(", source.read_text(encoding="utf-8"), re.M)
                      expected = {method.strip("`") for method in methods}
                      for case in suite.findall("testcase"):
                          method = case.get("name")
                          if case.get("classname") != name or method not in expected:
                              continue
                          failures = [node for node in case if node.tag in ("failure", "error")]
                          if len(failures) != 1:
                              continue
                          match = frame.search(failures[0].text or "")
                          location = (f" | NativeLegacyPreferenceRestoreFixture.kt:{match[1]}"
                                      if match and int(match[1]) <= fixture_lines else "")
                          diagnostics.add(f"Host JVM fixture failed: {name} | {method}{location}")
                          reason = (failures[0].get("message") or "").removeprefix("java.lang.AssertionError: ")
                          if re.fullmatch(r"LEGACY_RESTORE_TRACE: (?:DOWN|PUSH)(?:,[A-Za-z0-9_.=:]{1,96}){1,18}", reason):
                              diagnostics.add(reason)
                  except (ET.ParseError, OSError, UnicodeError):
                      continue
          for diagnostic in sorted(diagnostics)[:8]:
              print(diagnostic)
          PY
            exit "$outcome"
          fi

          if ! python3 -I - "$APP" "$RESULTS" "$SCRATCH/source-before.sha256" "$LIBRARY_SHA" "$PROOF" \
            >"$SCRATCH/private-proof.log" 2>&1 <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys
          from pathlib import Path
          from xml.etree import ElementTree as ET

          app, results, manifest = map(Path, sys.argv[1:4])
          library_sha, output = sys.argv[4], Path(sys.argv[5])
          classes = (
              "com.vortx.android.engine.NativeHostDocumentTest",
              "com.vortx.android.sync.NativeAccountSyncTest",
              "com.vortx.android.engine.NativeOwnerHistoryJniTest",
          )
          require_results = {
              classes[1]: "real native library checkpoint retries past retained theme dirty stamp and receives peer after cold restart",
              classes[2]: "warmSchemaSixReceiveEncryptedColdReopenAndOrdinaryMutationUseRealJni",
          }
          assert results.is_dir() and not results.is_symlink() and results.resolve() == results
          assert {p.name for p in results.glob("TEST-*.xml")} == {f"TEST-{name}.xml" for name in classes}
          evidence = {}
          for name in classes:
              source = app / "android/app/src/test/kotlin" / (name.replace(".", "/") + ".kt")
              assert source.is_file() and not source.is_symlink() and source.stat().st_size <= 1024**2
              source_bytes = source.read_bytes()
              kotlin = source_bytes.decode("utf-8")
              declarations = re.findall(r"^[ \t]*@Test\s+fun\s+(`[^`\r\n]+`|[A-Za-z_][A-Za-z0-9_]*)\s*\(", kotlin, re.M)
              expected = {method.strip("`") for method in declarations}
              assert len(expected) == len(declarations) == len(re.findall(r"^[ \t]*@Test\b", kotlin, re.M))
              assert expected and (name not in require_results or require_results[name] in expected)
              report = results / f"TEST-{name}.xml"
              assert report.is_file() and not report.is_symlink()
              with report.open("rb") as stream:
                  raw = stream.read(1024**2 + 1)
              assert 0 < len(raw) <= 1024**2 and not any(mark in raw for mark in (b"<!DOCTYPE", b"<!ENTITY", b"\0"))
              suite = ET.fromstring(raw.decode("utf-8"))
              assert suite.tag == "testsuite" and suite.get("name") == name
              assert suite.get("tests") == str(len(expected))
              assert all(suite.get(key) == "0" for key in ("failures", "errors", "skipped"))
              assert suite.get("disabled", "0") == "0"
              cases = suite.findall("testcase")
              assert len(cases) == len(expected) and {case.get("name") for case in cases} == expected
              assert all(case.get("classname") == name and case.get("status", "run") == "run" for case in cases)
              assert not any(node.tag in ("failure", "error", "skipped", "disabled") for node in suite.iter())
              evidence[name] = {"cases": len(cases), "junitSha256": hashlib.sha256(raw).hexdigest(),
                                "sourceSha256": hashlib.sha256(source_bytes).hexdigest()}
          run_id, operations = os.environ["GITHUB_RUN_ID"], os.environ["GITHUB_SHA"]
          assert re.fullmatch(r"[1-9][0-9]{0,17}", run_id) and re.fullmatch(r"[0-9a-f]{40}", operations)
          assert os.environ["GITHUB_RUN_ATTEMPT"] == "1"
          with manifest.open("rb") as stream:
              private_inputs_sha = hashlib.file_digest(stream, "sha256").hexdigest()
          proof = {"schemaVersion": 1, "status": "PASS", "appSource": os.environ["APP_SOURCE"],
                   "operationsSource": operations, "operationsRef": os.environ["GITHUB_REF"], "runId": int(run_id),
                   "attempt": 1, "engineSource": os.environ["ENGINE_SOURCE"], "toolchain": os.environ["HOST_TOOLCHAIN"],
                   "hostTarget": os.environ["HOST_TARGET"], "features": "jni,server,resource-host",
                   "engineInputsSha256": private_inputs_sha, "librarySha256": library_sha,
                   "postRuntimeEngineInputsSha256": private_inputs_sha, "postRuntimeLibrarySha256": library_sha,
                   "suites": evidence, "requiredRestoreCases": require_results,
                   "tests": sum(suite["cases"] for suite in evidence.values()), "skipped": 0, "failures": 0, "errors": 0}
          data = (json.dumps(proof, sort_keys=True, indent=2, ensure_ascii=True) + "\n").encode("ascii")
          assert len(data) <= 4096 and output.is_dir() and not output.is_symlink() and not list(output.iterdir())
          name = "android-legacy-preference-restore-proof.json"
          with (output / name).open("xb") as stream:
              stream.write(data)
          with (output / "android-legacy-preference-restore-proof.sha256").open("x", encoding="ascii") as stream:
              stream.write(f"{hashlib.sha256(data).hexdigest()}  {name}\n")
          PY
          then
            echo 'Exact restore suite or report verification failed. Private outputs were excluded.'
            exit 1
          fi
          (cd "$PROOF" && sha256sum --check android-legacy-preference-restore-proof.sha256)
          printf 'VORTX_LEGACY_PREFERENCE_PROOF_DIR=%s\n' "$PROOF" >> "$GITHUB_ENV"

      - name: Retain only the bounded restore proof and checksum
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: VortX-Android-Legacy-Preference-Restore-Proof
          path: |
            ${{ env.VORTX_LEGACY_PREFERENCE_PROOF_DIR }}/android-legacy-preference-restore-proof.json
            ${{ env.VORTX_LEGACY_PREFERENCE_PROOF_DIR }}/android-legacy-preference-restore-proof.sha256
          if-no-files-found: error
          retention-days: 14
          overwrite: false

      - name: Remove the scoped private checkout and logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          SCRATCH="${VORTX_LEGACY_PREFERENCE_PRIVATE_DIR:-}"
          [ -n "$SCRATCH" ] || exit 0
          PREFIX="$RUNNER_TEMP/vortx-legacy-preference-private."
          SUFFIX="${SCRATCH#"$PREFIX"}"
          [[ "$SUFFIX" =~ ^[A-Za-z0-9]{8}$ && "$SCRATCH" == "$PREFIX$SUFFIX" ]]
          test -d "$SCRATCH" && test ! -L "$SCRATCH"
          rm -rf -- "$SCRATCH"
