name: Verify Android Watch Next with real host JNI
run-name: Android Watch Next completed-owner JNI proof

on: workflow_dispatch

permissions:
  contents: read

jobs:
  watch-next-host-jni:
    if: >-
      github.event_name == 'workflow_dispatch' && github.repository == 'VortXTV/VortX' &&
      github.repository_id == '1261501126' && github.actor == 'mamaclapper' &&
      github.actor_id == '50227842' && github.run_attempt == '1' &&
      github.ref == 'refs/tags/vortx-android-watch-next-jni-20261112'
    runs-on: ubuntu-24.04
    environment: engine-ci
    timeout-minutes: 75
    env:
      APP_SOURCE: adf06caf797710d680e51ca5dbcb01cc18d61d6b
      FIXTURE_SOURCE_SHA: 751dc1c43d607b09fc806487b52a05adec867ce97f6cd8a5c30cbd391b34ff4c
      ENGINE_SOURCE: 2ea2e0f27dd2e53b7b28228435ca35a70f92831f
      HOST_TOOLCHAIN: nightly-2026-07-19
      HOST_TARGET: x86_64-unknown-linux-gnu
      FIXTURE_CLASS: com.vortx.android.engine.NativeOwnAccountCoordinatorTest
      FIXTURE_METHOD: Play Next callbacks run only for completed and still mounted roster
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify the exact Watch Next source and operation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = VortXTV/VortX && test "$GITHUB_REPOSITORY_ID" = 1261501126
          test "$GITHUB_ACTOR" = mamaclapper && test "$GITHUB_ACTOR_ID" = 50227842
          test "$GITHUB_TRIGGERING_ACTOR" = mamaclapper && test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = refs/tags/vortx-android-watch-next-jni-20261112
          test "$GITHUB_WORKFLOW_REF" = "VortXTV/VortX/.github/workflows/android.yml@$GITHUB_REF"
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list --parents -n 1 HEAD)" = "$GITHUB_SHA $APP_SOURCE"
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/android.yml
          test -z "$(git status --porcelain --untracked-files=all)"
          fixture=android/app/src/test/kotlin/com/vortx/android/engine/NativeOwnAccountCoordinatorTest.kt
          printf '%s  %s\n' "$FIXTURE_SOURCE_SHA" "$fixture" | sha256sum --check --status
          grep -Fq "@Test fun \`$FIXTURE_METHOD\`" "$fixture"

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0 cmake;4.1.2'

      - name: Select the pinned Android NDK for Gradle configuration
        run: sdkmanager 'ndk;30.0.16248370'

      - uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2
        with:
          toolchain: nightly-2026-07-19
          targets: x86_64-unknown-linux-gnu
          components: rust-src

      - name: Fetch the exact private engine with isolated credentials
        timeout-minutes: 5
        env:
          ENGINE_REPO_TOKEN: ${{ secrets.ENGINE_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "${ENGINE_REPO_TOKEN:-}"
          scratch="$(mktemp -d "$RUNNER_TEMP/vortx-watch-next-private.XXXXXXXX")"
          trap 'rm -rf -- "$scratch"' EXIT
          checkout="$scratch/engine"
          mkdir "$checkout"
          (
            export LC_ALL=C GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
            unset GIT_TRACE GIT_TRACE_PACKET GIT_TRACE_CURL GIT_CURL_VERBOSE
            askpass="$scratch/askpass"
            cat > "$askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$ENGINE_REPO_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
            chmod 700 "$askpass"
            export GIT_ASKPASS="$askpass"
            git -C "$checkout" init --quiet
            git -C "$checkout" -c credential.helper= -c http.followRedirects=false \
              -c protocol.allow=never -c protocol.https.allow=always fetch --no-tags --depth=1 \
              https://github.com/VortXTV/vortx-core.git "$ENGINE_SOURCE"
            git -C "$checkout" -c core.hooksPath=/dev/null checkout --detach --quiet FETCH_HEAD
          ) >"$scratch/private-fetch.log" 2>&1
          rm "$scratch/askpass"
          test "$(git -C "$checkout" rev-parse HEAD)" = "$ENGINE_SOURCE"
          test -z "$(git -C "$checkout" status --porcelain --untracked-files=all)"
          printf 'VORTX_WATCH_NEXT_PRIVATE_DIR=%s\n' "$scratch" >> "$GITHUB_ENV"
          trap - EXIT

      - name: Run the exact completed-roster Watch Next callback with real host JNI
        timeout-minutes: 60
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(uname -m)" = x86_64
          test -z "${ENGINE_REPO_TOKEN+x}"
          scratch="$VORTX_WATCH_NEXT_PRIVATE_DIR"
          prefix="$RUNNER_TEMP/vortx-watch-next-private."
          suffix="${scratch#"$prefix"}"
          [[ "$suffix" =~ ^[A-Za-z0-9]{8}$ && "$scratch" == "$prefix$suffix" ]] || exit 1
          test -d "$scratch" && test ! -L "$scratch"
          checkout="$scratch/engine"
          workspace="$checkout/vortx-core"
          test -f "$workspace/Cargo.toml" && test -f "$workspace/Cargo.lock"
          test -z "$(find "$workspace" -type l -print -quit)"

          verify_checkout() {
            test "$(git -C "$checkout" rev-parse HEAD)" = "$ENGINE_SOURCE" &&
              test -z "$(git -C "$checkout" status --porcelain --untracked-files=all)"
          }
          hash_source() {
            (cd "$checkout" && git ls-files -z -- vortx-core | xargs -0 sha256sum)
          }
          echo 'Building the reviewed Linux host JNI library.'
          verify_checkout
          hash_source > "$scratch/source-before.sha256" 2> "$scratch/private-manifest.log"
          test -s "$scratch/source-before.sha256"
          (
            cd "$workspace"
            timeout --signal=TERM --kill-after=30s 36m nice -n 15 \
              cargo "+$HOST_TOOLCHAIN" build --locked --manifest-path "$workspace/Cargo.toml" \
              -p vortx-ffi --no-default-features --features jni,server,resource-host \
              --release --target "$HOST_TARGET" --target-dir "$scratch/target" --jobs 1
          ) > "$scratch/private-cargo.log" 2>&1
          verify_checkout
          hash_source > "$scratch/source-after-build.sha256" 2>> "$scratch/private-manifest.log"
          cmp --silent "$scratch/source-before.sha256" "$scratch/source-after-build.sha256"
          library="$scratch/target/$HOST_TARGET/release/libvortx_ffi.so"
          test -s "$library" && test ! -L "$library"
          readelf -h "$library" > "$scratch/private-elf.log" 2>&1
          grep -Eq 'Machine:[[:space:]]+Advanced Micro Devices X86-64' "$scratch/private-elf.log"
          grep -Eq 'Type:[[:space:]]+DYN' "$scratch/private-elf.log"
          READELF=readelf bash scripts/verify-native-engine-abi.sh android "$library" owner-history \
            > "$scratch/private-abi.log" 2>&1
          library_sha="$(sha256sum "$library" | cut -d' ' -f1)"
          [[ "$library_sha" =~ ^[0-9a-f]{64}$ ]]

          cat > "$scratch/host-only.init.gradle" <<'GRADLE'
          gradle.taskGraph.whenReady { graph ->
              def forbidden = graph.allTasks.findAll { task ->
                  task.name ==~ /(?i)(cargo.*|.*externalNativeBuild.*|.*CMake.*|merge.*JniLib.*|assemble.*|bundle.*(Aar|Apk|Aab).*|package.*(Apk|Bundle).*|package(Full|Play)?(Debug|Release)|sign.*(Apk|Bundle|Release).*|validateSigning.*|install.*|connected.*|publish.*)/
              }
              if (!forbidden.empty) throw new GradleException("Only JVM host tasks are admitted")
              def tests = graph.allTasks.findAll { it instanceof org.gradle.api.tasks.testing.Test }
              if (tests*.path != [":app:testPlayDebugUnitTest"])
                  throw new GradleException("Require the exact Play Debug JVM test task")
              def testTask = tests[0]
              testTask.maxParallelForks = 1
              testTask.filter.failOnNoMatchingTests = true
              testTask.ignoreFailures = false
              testTask.outputs.upToDateWhen { false }
              testTask.outputs.cacheIf { false }
          }
          GRADLE

          echo 'Running the exact Watch Next callback fixture.'
          export VORTX_JNI_SYNC=1 VORTX_JNI_LIBRARY="$library"
          export VORTX_ENGINE_CORE_DIR="$scratch/no-android-cross-build-workspace" VORTX_REQUIRE_ENGINE=0
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370" ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/30.0.16248370"
          export JAVA_TOOL_OPTIONS='-XX:ActiveProcessorCount=1'
          gradle_results=android/app/build/test-results/testPlayDebugUnitTest
          gradle_reports=android/app/build/reports/tests/testPlayDebugUnitTest
          test ! -e "$gradle_results" && test ! -e "$gradle_reports"
          status=0
          (
            cd android
            timeout --signal=TERM --kill-after=30s 23m nice -n 15 \
              ./gradlew :app:testPlayDebugUnitTest -I "$scratch/host-only.init.gradle" \
              --no-daemon --max-workers=1 --no-parallel --no-configuration-cache --no-build-cache \
              -Pkotlin.compiler.execution.strategy=in-process -Pvortx.nativeEngine=true -Pvortx.nativeResourceHost=true \
              --tests "$FIXTURE_CLASS.$FIXTURE_METHOD"
          ) > "$scratch/private-gradle.log" 2>&1 || status=$?

          results="$scratch/private-junit"
          if [ -d "$gradle_results" ]; then mv -- "$gradle_results" "$results"; fi
          if [ -d "$gradle_reports" ]; then mv -- "$gradle_reports" "$scratch/private-junit-html"; fi
          verify_checkout
          hash_source > "$scratch/source-after-runtime.sha256" 2>> "$scratch/private-manifest.log"
          cmp --silent "$scratch/source-before.sha256" "$scratch/source-after-runtime.sha256"
          test "$(sha256sum "$library" | cut -d' ' -f1)" = "$library_sha"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          if [ "$status" -ne 0 ]; then
            echo 'Watch Next JVM fixture failed. Runner-private diagnostics were withheld.'
            exit "$status"
          fi
          python3 -B - "$results" > "$scratch/private-junit-check.log" 2>&1 <<'PY'
          import os
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          root = Path(sys.argv[1])
          name = os.environ['FIXTURE_CLASS']
          report = root / f'TEST-{name}.xml'
          assert set(root.rglob('*.xml')) == {report} and not report.is_symlink()
          assert 0 < report.stat().st_size <= 1024 * 1024
          suite = ET.parse(report).getroot()
          assert suite.tag == 'testsuite' and suite.get('name') == name
          assert suite.get('tests') == '1' and all(suite.get(key) == '0' for key in ('failures', 'errors', 'skipped'))
          case, = suite.findall('testcase')
          assert case.get('classname') == name and case.get('name') == os.environ['FIXTURE_METHOD']
          assert suite.get('disabled', '0') == case.get('disabled', '0') == '0'
          assert case.get('status', 'run').lower() in ('run', 'passed')
          assert not any(suite.findall('.//' + key) for key in ('failure', 'error', 'skipped', 'disabled', 'ignored'))
          PY
          echo 'ANDROID_WATCH_NEXT_REAL_JNI: exact completed-roster callback passed (1 executed, 0 skipped, 0 failures, 0 errors)'

      - name: Remove runner-private Watch Next inputs and results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          scratch="${VORTX_WATCH_NEXT_PRIVATE_DIR:-}"
          if [ -n "$scratch" ]; then
            prefix="$RUNNER_TEMP/vortx-watch-next-private."
            suffix="${scratch#"$prefix"}"
            [[ "$suffix" =~ ^[A-Za-z0-9]{8}$ && "$scratch" == "$prefix$suffix" ]] || exit 1
            test ! -L "$scratch"
            rm -rf -- "$scratch"
          fi
