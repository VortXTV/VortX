name: MPVKit-DVFEL source pin report

# VortX no longer consumes an MPVKit release version.  It builds the local
# Vendor/MPVKit-DVFEL package from pinned source plus VortX patches, so an upstream release tag
# cannot be treated as an actionable version bump.  This scheduled workflow only reports the
# authoritative base-source SHA and deliberately creates no issue.

on:
  schedule:
    - cron: "0 9 * * *"   # daily 09:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report the local MPVKit-DVFEL source pin
        run: |
          set -euo pipefail
          MPVKIT_PATH=$(awk '
            /^  MPVKit:$/ { in_mpvkit = 1; next }
            in_mpvkit && /^  [^[:space:]]/ { exit }
            in_mpvkit && /^[[:space:]]+path:/ {
              sub(/^[[:space:]]*path:[[:space:]]*/, "")
              print
              exit
            }
          ' app/project.yml)
          if [ "$MPVKIT_PATH" != "Vendor/MPVKit-DVFEL" ]; then
            echo "MPVKit is not the expected local DVFEL package; no release-version issue will be created."
            exit 0
          fi
          PINNED=$(sed -nE 's/^MPVKIT_REF="([0-9a-f]{40})".*/\1/p' scripts/build-mpvkit-dvfel.sh)
          PINNED_COUNT=$(printf '%s\n' "$PINNED" | awk 'NF { count++ } END { print count + 0 }')
          if [ "$PINNED_COUNT" -ne 1 ] || ! printf '%s\n' "$PINNED" | grep -qxE '[0-9a-f]{40}'; then
            echo "Could not read one 40-character MPVKIT_REF from scripts/build-mpvkit-dvfel.sh." >&2
            exit 1
          fi
          echo "MPVKit-DVFEL is local at $MPVKIT_PATH."
          echo "Authoritative MPVKit base-source pin: $PINNED (scripts/build-mpvkit-dvfel.sh)."
          echo "No upstream release comparison or version-bump issue is valid for this patched local package."
