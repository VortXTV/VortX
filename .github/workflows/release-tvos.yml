name: Release apps (iOS + tvOS + macOS)

# One-off native account verification. The app code and test runner come from APP_SOURCE.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  apple-native-account-proof:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'VortXTV/VortX' &&
      github.ref == 'refs/tags/vortx-apple-account-recovery-recheck-20261115'
    runs-on: macos-26
    environment: engine-ci
    timeout-minutes: 50
    env:
      APP_SOURCE: 'e5b28a8d8509ce4674d0db2fdc57ef700ff8d2e8'
      ENGINE_SOURCE: 2ea2e0f27dd2e53b7b28228435ca35a70f92831f
      ENGINE_HEADER_SHA256: 02698eaa7bbd99b89b7003be7ee6c39714b8fe7ba87cf9dce0e10769617b5b6f
      ENGINE_LOCK_SHA256: a320e65b9a11884c3f0f7e6cbf1a796d7726d9902bc2b08662e2adc14c4e69cc
      RUST_TOOLCHAIN: nightly-2026-07-19
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Bind the workflow-only overlay to the frozen app source
        run: |
          set -euo pipefail
          workflow=.github/workflows/release-tvos.yml
          [[ "$APP_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD^{commit})" = "$GITHUB_SHA"
          test "$(git show -s --format=%P HEAD)" = "$APP_SOURCE"
          test "$(git diff --name-status --no-renames "$APP_SOURCE" HEAD)" = "$(printf 'M\t%s' "$workflow")"
          git -c advice.detachedHead=false checkout --detach "$APP_SOURCE"
          test "$(git rev-parse HEAD^{commit})" = "$APP_SOURCE"
          test -z "$(git status --porcelain)"

      - name: Select the Xcode build used for the reviewed Apple release
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          developer_dir=""
          for xcode in /Applications/Xcode_26.6.app /Applications/Xcode_26.6.0.app; do
            [[ -d "$xcode/Contents/Developer" ]] || continue
            candidate="$(cd "$xcode/Contents/Developer" && pwd -P)"
            if version="$(DEVELOPER_DIR="$candidate" "$candidate/usr/bin/xcodebuild" -version 2>/dev/null)" &&
                [[ "$version" = "$(printf 'Xcode 26.6\nBuild version 17F113')" ]]; then
              developer_dir="$candidate"
              break
            fi
          done
          test -n "$developer_dir"
          export DEVELOPER_DIR="$developer_dir"
          mac_sdk="$(xcrun --sdk macosx --show-sdk-version)"
          [[ "$mac_sdk" =~ ^[0-9]+(\.[0-9]+)+$ ]]
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          echo "VORTX_PROOF_MAC_SDK=$mac_sdk" >> "$GITHUB_ENV"
          echo "Exact Xcode 26.6 (17F113), arm64 macOS SDK $mac_sdk"

      - name: Fetch the reviewed private engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: VortXTV/vortx-core
          ref: ${{ env.ENGINE_SOURCE }}
          token: ${{ secrets.ENGINE_REPO_TOKEN }}
          path: _vortx_core_src
          persist-credentials: false

      - name: Install the pinned Rust host toolchain
        timeout-minutes: 8
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rust-src

      - name: Build and verify the exact macOS account ABI
        timeout-minutes: 38
        run: |
          set -euo pipefail
          engine_repo="$PWD/_vortx_core_src"
          engine="$engine_repo/vortx-core"
          header="$engine/crates/ffi/include/vortx_ffi.h"
          test "$(git -C "$engine_repo" rev-parse HEAD^{commit})" = "$ENGINE_SOURCE"
          test -z "$(git -C "$engine_repo" status --porcelain --untracked-files=all)"
          test -s "$header" && test ! -L "$header"
          test -s "$engine/Cargo.toml"
          test "$(shasum -a 256 "$engine/Cargo.lock" | awk '{print $1}')" = "$ENGINE_LOCK_SHA256"
          test "$(shasum -a 256 "$header" | awk '{print $1}')" = "$ENGINE_HEADER_SHA256"

          work="$(mktemp -d "$RUNNER_TEMP/apple-native-proof.XXXXXXXX")"
          source scripts/native-rust-toolchain-env.sh
          llvm_path="$(native_rust_llvm_library_path "$RUST_TOOLCHAIN")"
          if ! DYLD_LIBRARY_PATH="$llvm_path" MACOSX_DEPLOYMENT_TARGET=14.0 \
            nice -n 15 cargo +"$RUST_TOOLCHAIN" build --locked \
              --manifest-path "$engine/Cargo.toml" -p vortx-ffi --no-default-features \
              --features resource-host --release --target aarch64-apple-darwin \
              --target-dir "$work/target" --jobs 2 > "$work/build.log" 2>&1; then
            echo "::error::Pinned resource-host engine build failed"
            exit 1
          fi
          library="$work/target/aarch64-apple-darwin/release/libvortx_ffi.dylib"
          test -s "$library" && test ! -L "$library"
          test "$(xcrun lipo -archs "$library")" = arm64
          library_sha="$(shasum -a 256 "$library" | awk '{print $1}')"

          if ! VORTX_FFI_HEADER="$header" VORTX_FFI_LIBRARY="$library" \
            bash scripts/test-native-cutover-live-abi.sh > "$work/live-abi.log" 2>&1; then
            echo "::error::Swift account live ABI gate failed"
            LC_ALL=C grep -E '([A-Za-z0-9_.]+[.]swift:[0-9]+(:[0-9]+)?: error:|[.]swift:[0-9]+: (Fatal error|Precondition failed):)'               "$work/live-abi.log" | tail -n 18 | cut -c 1-300 || true
            exit 1
          fi
          marker='Live Swift typed cold restore: repaired a stranded encrypted checkpoint with exact local slices and original CAS'
          test "$(grep -Fxc "$marker" "$work/live-abi.log")" = 1
          test "$(grep -Fxc "Verified unchanged library $library_sha" "$work/live-abi.log")" = 1
          test "$(grep -Fxc "Verified unchanged header $ENGINE_HEADER_SHA256" "$work/live-abi.log")" = 1
          test "$(git rev-parse HEAD^{commit})" = "$APP_SOURCE"
          git diff --quiet HEAD --
          test -z "$(git -C "$engine_repo" status --porcelain --untracked-files=all)"
          test "$(shasum -a 256 "$library" | awk '{print $1}')" = "$library_sha"
          test "$(shasum -a 256 "$header" | awk '{print $1}')" = "$ENGINE_HEADER_SHA256"
          echo "$marker"

          VORTX_PROOF_LIBRARY_SHA="$library_sha" python3 -I - <<'PYTEST'
          import hashlib
          import json
          import os
          from pathlib import Path

          test_script = Path("scripts/test-native-cutover-live-abi.sh")
          test_case = Path("app/Tests/OwnerHistorySwiftLiveABICases.swift")
          receipt = Path(os.environ["RUNNER_TEMP"]) / "apple-native-account-proof.json"
          receipt.write_text(json.dumps({
              "schema": 1, "appSource": os.environ["APP_SOURCE"],
              "workflowSource": os.environ["GITHUB_SHA"],
              "workflowOnlyOverlay": True, "ref": os.environ["GITHUB_REF"],
              "run": os.environ["GITHUB_RUN_ID"], "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "engineSource": os.environ["ENGINE_SOURCE"],
              "engineCargoLockSha256": os.environ["ENGINE_LOCK_SHA256"],
              "headerSha256": os.environ["ENGINE_HEADER_SHA256"],
              "librarySha256": os.environ["VORTX_PROOF_LIBRARY_SHA"],
              "engineCargoFeatures": ["resource-host"], "target": "aarch64-apple-darwin",
              "xcode": "26.6 (17F113)", "macSdk": os.environ["VORTX_PROOF_MAC_SDK"],
              "rustToolchain": os.environ["RUST_TOOLCHAIN"],
              "testScriptSha256": hashlib.sha256(test_script.read_bytes()).hexdigest(),
              "testFixtureSha256": hashlib.sha256(test_case.read_bytes()).hexdigest(),
              "liveAbiPassed": True, "typedColdRestorePassed": True,
          }, sort_keys=True, indent=2) + "\n")
          PYTEST
          cd "$RUNNER_TEMP"
          shasum -a 256 apple-native-account-proof.json > apple-native-account-proof.sha256

      - name: Upload only the bounded account recovery receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VortX-Apple-native-account-proof
          path: |
            ${{ runner.temp }}/apple-native-account-proof.json
            ${{ runner.temp }}/apple-native-account-proof.sha256
          if-no-files-found: error
          retention-days: 30
