name: Release apps (iOS + tvOS + macOS)

# Builds the iOS + tvOS IPAs and the native macOS app from source on GitHub's
# runners and hands the immutable bytes to the draft release lane (issue #7). The app sources, scripts,
# NodeMobile + fonts (this repo's vendor release), and server.js (Stremio's CDN)
# are public; the two ENGINE crates (stremiox-core, vortx-core) are PRIVATE
# (moved out of the public tree in 33ff9b5) and are fetched below at pinned
# commits with the ENGINE_REPO_TOKEN secret. Bumping an engine pin means editing
# this file, which is itself a path trigger, so the old `core/**` path filters
# are gone (that dir no longer exists in the public tree).
# The macOS app ships as a drag-to-install .dmg (ad-hoc signed, not notarized).
#
# No `pull_request` trigger, DELIBERATELY: this job holds ENGINE_REPO_TOKEN (plus the
# Trakt/SIMKL/edge secrets) in the same job that executes repo-controlled code (scripts/*,
# app/scripts/*, the xcodegen'd build phases), so building PR heads here would hand any same-repo
# PR author's code a credential / private-source exfiltration lane. Fork PRs never received
# secrets anyway, so their builds could only fail early; nothing of value is lost. The dev flow is
# push-to-branch; PR validation of app-only changes belongs to a future SECRETLESS workflow (no
# engine fetch, no secrets in the job), out of scope here. Do not re-add `pull_request` -- and
# never `pull_request_target` -- to THIS workflow.

on:
  # Release-tag caches are isolated per tag, so seed the same exact cache key on
  # main where later release runs can restore it from the default-branch scope.
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-tvos.yml"
      - "scripts/**"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the built apps to this existing release tag (e.g. v0.3.0-beta13). Leave blank to upload as a run artifact only."
        required: false
        default: ""
      altstore_note:
        description: "Optional one-line blurb for the AltStore/SideStore update entry. Leave blank to derive it from the release name."
        required: false
        default: ""
      publish_release:
        description: "After draft asset and staged-feed verification, publish this existing draft release as the final write."
        required: false
        type: boolean
        default: false
      release_id:
        description: "Optional numeric draft-release ID. When set, CI resolves the draft by ID directly instead of by tag lookup (GITHUB_TOKEN tag lookup can miss drafts)."
        required: false
        default: ""

# Workflow-wide default is READ-ONLY: repo-controlled build code (scripts/*, app/scripts/*,
# the xcodegen'd build phases) must never hold blanket write authority. Two narrowly scoped
# exceptions override this default for themselves alone: `build-tvos` (draft-release fail-closed
# verification inside the approved engine-ci environment) and `attach-release` (asset attachment,
# feed promotion, publication; runs no repo-controlled code).
permissions:
  contents: read

jobs:
  build-tvos:
    if: github.event_name != 'release'
    # Environment gate for the token-bearing build job (trust boundary): the `engine-ci` environment
    # carries explicit deployment protection policies for branch and tag build refs. A run started
    # from any other ref blocks before any build step executes, keeping ENGINE_REPO_TOKEN unreachable
    # outside the approved build lanes. Release events intentionally skip this job and run only the
    # immutable published-release verifier below.
    #
    # Read-only-build vs release-write split (amended): the feed-artifact lane inside this
    # job must fail-closed VERIFY the target draft (id, tag, draft/prerelease bits).
    # Stable tags are non-prereleases; beta tags retain the prerelease bit.
    # before any release bytes are built, and GitHub only exposes draft releases to
    # `contents: write` tokens. This job therefore carries `contents: write`, reachable only
    # through the manually approved `engine-ci` environment gate above. Asset attachment,
    # feed promotion, and publication remain isolated in `attach-release` below.
    permissions:
      contents: write
    environment: engine-ci
    # Pin the known-good arm64 lane explicitly. `macos-latest` is a moving alias, while macos-15
    # tops out below the Xcode 26.6 / tvOS SDK 26.5 release floor enforced below.
    runs-on: macos-26
    timeout-minutes: 90
    # GitHub-owned actions are SHA-pinned too (a mutable tag -- even on an actions/* repo -- can be
    # repointed, and this job holds ENGINE_REPO_TOKEN + the release secrets). Each pin carries the
    # tag it resolved from.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ---- Private engine fetch (moved out of the public tree in 33ff9b5) --------------------------
      # Apple builds BOTH engines: StremioXCore.xcframework from core/ AND VortxEngine.xcframework
      # from vortx-core/. Pinned to the exact commits the current beta build links. Requires the
      # ENGINE_REPO_TOKEN secret (fine-grained PAT, Contents:read on both private repos; deploy keys
      # are disabled by the VortXTV org). Both fetches use actions/checkout (GitHub's own auth path:
      # the token is injected through an env-sourced local git config, never argv, and
      # persist-credentials: false wipes it after the step). Fails closed: an empty secret or a
      # missing crate manifest kills the job (no silent build-without-engine).
      - name: Preflight the engine token (fail closed)
        env:
          ENGINE_REPO_TOKEN: ${{ secrets.ENGINE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ENGINE_REPO_TOKEN:-}" ]; then
            echo "::error::ENGINE_REPO_TOKEN secret is not set; CI cannot fetch the private engine repos (VortXTV/stremiox-core + VortXTV/vortx-core)"
            exit 1
          fi

      # stremiox-core is a STANDALONE crate (Cargo.toml at its repo root): check out straight into core/.
      - name: Fetch stremiox-core (private, pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: VortXTV/stremiox-core
          # fix/meta-imdb-link-preserve: engine keeps addon-supplied imdbRating when the addon
          # also sends its own links. PUSH GATE: this ref carries a path patch on stremio-core;
          # publish the patched stremio-core to the private mirror and swap the patch for a git
          # rev pin (see the engine repo's Cargo.toml note), then update this ref to that commit.
          ref: 4d5ae6371cc9e4031f787cf1c7adf7a535474b0c
          token: ${{ secrets.ENGINE_REPO_TOKEN }}
          path: core
          persist-credentials: false

      # vortx-core is a FULL MONOREPO whose engine workspace is its vortx-core/ SUBDIR; a direct
      # checkout would nest the engine manifest at vortx-core/vortx-core/Cargo.toml. Check out to a
      # temp path, then promote only that subdir to the app-root vortx-core/ (where the build-ffi
      # step's VORTX_ENGINE_DIR + the hashFiles('vortx-core/...') cache keys expect it).
      - name: Fetch vortx-core (private monorepo, pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: VortXTV/vortx-core
          ref: df6b8f5a200dc9ad2c23ad823ebcf97ba1b9b602
          token: ${{ secrets.ENGINE_REPO_TOKEN }}
          path: _vortx_core_src
          persist-credentials: false

      - name: Promote the vortx-core engine workspace + verify both engines (fail closed)
        run: |
          set -euo pipefail
          rm -rf vortx-core
          mv _vortx_core_src/vortx-core vortx-core
          rm -rf _vortx_core_src
          test -f core/Cargo.toml       || { echo "::error::stremiox-core crate missing after checkout (core/Cargo.toml)"; exit 1; }
          test -f vortx-core/Cargo.toml || { echo "::error::vortx-core engine workspace missing after promote (vortx-core/Cargo.toml)"; exit 1; }
          test -d vortx-core/crates     || { echo "::error::vortx-core engine crates/ missing after promote (vortx-core/crates)"; exit 1; }
          echo "engines fetched: core@$(git -C core rev-parse --short HEAD) vortx-core@df6b8f5 (promoted from monorepo subdir)"

      - name: Select the newest Xcode on the runner
        run: |
          # Pick the newest Xcode whose toolchain ACTUALLY WORKS, then resolve it to its REAL path. A
          # rotated runner image ships a newest-by-version entry (e.g. Xcode_26.3.0.app) that is a SYMLINK
          # to a real bundle. `xcodebuild -version` works through the symlink at selection time, but the
          # disk-free cleanup below then deletes the symlink's real TARGET (it only spared the symlink path
          # by name), leaving Contents/Developer dangling, so the build dies with "missing DEVELOPER_DIR
          # path" (the Beta-14 failure: same workflow passed on a runner with a real Xcode_26.6 and failed
          # on one where 26.3.0 was a symlink). Fix: resolve the chosen app to its canonical directory and
          # pin THAT, so DEVELOPER_DIR points at the real bundle and the cleanup compares real paths.
          XCODE=""
          for c in $(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -Vr); do
            dev="$c/Contents/Developer"
            xb="$dev/usr/bin/xcodebuild"
            if [ -d "$dev" ] && [ -x "$xb" ] && DEVELOPER_DIR="$dev" "$xb" -version >/dev/null 2>&1; then
              XCODE="$c"; break
            fi
            echo "Skipping $c (no working toolchain at $dev)"
          done
          if [ -z "$XCODE" ]; then XCODE="$(dirname "$(dirname "$(xcode-select -p)")")"; fi
          # Canonicalize: if $XCODE is a symlink, follow it to the real .app so the cleanup can't orphan it.
          XCODE_REAL="$(cd "$XCODE" && pwd -P)"
          echo "Selected Xcode: $XCODE -> $XCODE_REAL ($("$XCODE_REAL/Contents/Developer/usr/bin/xcodebuild" -version 2>/dev/null | head -1))"
          XCODE="$XCODE_REAL"
          sudo xcode-select -s "$XCODE"
          # Pin it for EVERY later step via DEVELOPER_DIR (xcodebuild honors it over the global
          # xcode-select state), so a runner-image default flip or the disk-free cleanup can never
          # drop the build onto /Library/Developer/CommandLineTools (the Beta-13 build-126 failure).
          # SELECTED_XCODE guards the cleanup step so it can't delete the Xcode we just selected.
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          echo "SELECTED_XCODE=$XCODE" >> "$GITHUB_ENV"

      - name: Show toolchain
        id: toolchain
        run: |
          set -euo pipefail
          # Release floor established by the known-launching Beta 3 lane. Image rotation may add or
          # remove toolchains, so the runner label alone is not authority: reject any silent downgrade.
          XCODE_FLOOR="26.6"
          TVOS_SDK_FLOOR="26.5"

          version_at_least() {
            /usr/bin/awk -v actual="$1" -v floor="$2" 'BEGIN {
              actual_count = split(actual, actual_parts, ".")
              floor_count = split(floor, floor_parts, ".")
              count = actual_count > floor_count ? actual_count : floor_count
              for (i = 1; i <= count; i++) {
                actual_part = i <= actual_count ? actual_parts[i] + 0 : 0
                floor_part = i <= floor_count ? floor_parts[i] + 0 : 0
                if (actual_part > floor_part) exit 0
                if (actual_part < floor_part) exit 1
              }
              exit 0
            }'
          }

          XCODE_INFO="$(xcodebuild -version)"
          XCODE_VERSION="$(printf '%s\n' "$XCODE_INFO" | /usr/bin/awk 'NR == 1 { print $2 }')"
          TVOS_SDK="$(xcrun --sdk appletvos --show-sdk-version)"
          printf '%s\n' "$XCODE_INFO"
          echo "tvOS SDK $TVOS_SDK"

          VERSION_RE='^[0-9]+(\.[0-9]+)*$'
          if ! [[ "$XCODE_VERSION" =~ $VERSION_RE ]]; then
            echo "::error::could not parse selected Xcode version: '$XCODE_VERSION'"
            exit 1
          fi
          if ! [[ "$TVOS_SDK" =~ $VERSION_RE ]]; then
            echo "::error::could not parse selected tvOS SDK version: '$TVOS_SDK'"
            exit 1
          fi
          if ! version_at_least "$XCODE_VERSION" "$XCODE_FLOOR"; then
            echo "::error::Xcode $XCODE_VERSION is below the release floor $XCODE_FLOOR"
            exit 1
          fi
          if ! version_at_least "$TVOS_SDK" "$TVOS_SDK_FLOOR"; then
            echo "::error::tvOS SDK $TVOS_SDK is below the release floor $TVOS_SDK_FLOOR"
            exit 1
          fi
          echo "toolchain floor verified: Xcode $XCODE_VERSION >= $XCODE_FLOOR; tvOS SDK $TVOS_SDK >= $TVOS_SDK_FLOOR"
          echo "xcode_version=$(printf '%s\n' "$XCODE_INFO" | tr ' \n' '-')" >> "$GITHUB_OUTPUT"
          echo "tvos_sdk=$TVOS_SDK" >> "$GITHUB_OUTPUT"

      - name: Free disk space while preserving the tvOS launch-smoke runtime
        run: |
          echo "Before:"; df -h /
          # The launch smoke below needs one installed tvOS runtime, so keep simulator state until its
          # verdict-preserving cleanup. Unused Xcodes and stale DerivedData are still safe to reclaim now.
          sudo rm -rf ~/Library/Developer/Xcode/DerivedData/* || true
          # Keep the Xcode selected above ($SELECTED_XCODE, already canonicalized to its real path);
          # never delete the active one by re-deriving its path (the brittle string-compare that deleted
          # it on build 126). Compare REAL paths so a leftover symlink-Xcode and the real bundle it points
          # to are both spared: deleting the symlink's target (which is $SELECTED_XCODE) was the Beta-14
          # "missing DEVELOPER_DIR path" failure. skip the entry whenever its resolved path matches.
          for x in /Applications/Xcode_*.app; do
            xr="$(cd "$x" 2>/dev/null && pwd -P || echo "$x")"
            [ "$xr" = "$SELECTED_XCODE" ] || sudo rm -rf "$x"
          done
          echo "After:"; df -h /

      - name: Install XcodeGen (pinned release artifact, sha256-verified)
        env:
          XCODEGEN_VERSION: "2.46.0"
          # sha256 of yonaskolb/XcodeGen 2.46.0's xcodegen.zip (computed from the release asset).
          XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
        run: |
          set -euo pipefail
          # `brew install xcodegen` installs whatever the formula's HEAD resolves to -- a MOVING
          # version with no clean per-formula pin -- so the release build tool could shift under this
          # runtime-proven lane with no diff in this file. Instead fetch the EXACT release zip, verify
          # the sha256 recorded above before trusting a byte of it (fail closed on mismatch), and put
          # its bin on PATH. The release bundle keeps bin/ and share/ as siblings, so the binary
          # resolves its SettingPresets from ../share with no separate install step or sudo.
          workdir="$(mktemp -d)"
          url="https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          curl -fsSL --retry 3 -o "$workdir/xcodegen.zip" "$url"
          printf '%s  %s\n' "$XCODEGEN_SHA256" "$workdir/xcodegen.zip" > "$workdir/xcodegen.sha256"
          shasum -a 256 -c "$workdir/xcodegen.sha256"
          unzip -q "$workdir/xcodegen.zip" -d "$workdir"
          "$workdir/xcodegen/bin/xcodegen" --version
          echo "$workdir/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Rust nightly with rust-src (tvOS is a tier 3 target)
        # Dated nightly, matching the engines' rust-toolchain.toml pin: the xcframework scripts run
        # cargo with --manifest-path from repo root, so the engines' directory-based toolchain pin
        # cannot govern them; the scripts select +nightly-2026-07-19 explicitly and this step installs
        # exactly that toolchain. A floating `nightly` here would rebuild with a different rustc daily.
        run: |
          rustup toolchain install nightly-2026-07-19 --profile minimal --component rust-src
          rustup +nightly-2026-07-19 target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Cache ONLY the public dependency downloads under ~/.cargo. The private-engine BUILD
          # intermediates (core/target, vortx-core/target) are DELIBERATELY excluded: this cache
          # carries a broad restore-keys prefix (cargo-<os>-) and its default-branch copy is
          # restorable from ANY ref in the repo, so caching compiled private-engine objects here
          # would let an untrusted-ref run (e.g. a future secretless PR workflow) restore them.
          # The engines' compiled output lives only in the two xcframework caches below, which are
          # exact-key-only (content-addressed to the private source via hashFiles, with NO
          # restore-keys fallback), so a run without the private source cannot reconstruct their key
          # and cannot restore them. Excluding the target dirs costs a recompile only on an
          # xcframework-cache MISS (rare: a miss means the private source changed, which also rolls
          # the xcframework key); on the common hit the engine build steps are skipped and these
          # target dirs are never produced or needed.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          # hashFiles runs when this step runs, i.e. AFTER the engine fetch above, so both engines'
          # manifests exist and both feed the key (a vortx-core-only dep bump must roll the cache too).
          key: cargo-${{ runner.os }}-${{ hashFiles('core/Cargo.lock', 'core/Cargo.toml', 'vortx-core/Cargo.lock', 'vortx-core/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Fetch server deps (NodeMobile, server.js, subtitle fonts)
        run: ./scripts/fetch-server-deps.sh

      - name: Fetch the macOS node runtime
        # VortXMac bundles node + server.js as its streaming server. The binary is gitignored, so
        # it must be fetched BEFORE xcodegen runs: xcodegen validates that the
        # Resources/node-darwin-arm64 source path exists, and fails project generation if it's absent.
        run: ./app/scripts/fetch-node-macos.sh

      - name: Cache stremio-core xcframework
        id: cache-core-xcframework
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Cache the xcframework AND its retained pre-localization archive under the SAME exact key,
          # so a warm hit restores BOTH together: the localized macOS object's OSO/debug-map points at
          # engine-prelocalize/StremioXCore/..., which must exist at the app's dsymutil time even when
          # the build step below is skipped on the hit. Same exact-key-only, no-restore-keys posture as
          # before (content-addressed to the private core source via hashFiles), so a run without the
          # private source cannot reconstruct the key and cannot restore these engine-derived objects.
          path: |
            app/Vendor/StremioXCore.xcframework
            app/Vendor/engine-prelocalize/StremioXCore
          key: stremio-core-xcframework-${{ runner.os }}-${{ steps.toolchain.outputs.xcode_version }}-${{ steps.toolchain.outputs.tvos_sdk }}-${{ hashFiles('core/Cargo.lock', 'core/Cargo.toml', 'core/rust-toolchain.toml', 'core/src/**', 'core/include/**', 'scripts/build-core-xcframework.sh') }}

      - name: Build the stremio-core xcframework
        if: steps.cache-core-xcframework.outputs.cache-hit != 'true'
        run: ./scripts/build-core-xcframework.sh

      # Phase 7 (engine/apple-cutover): the vortx-core engine ABI the shadow-ranking bridge links
      # (app/project.yml references Vendor/VortxEngine.xcframework on VortXiOSNative, so project
      # generation + the iOS build need it present). Built from the vortx-core workspace in this
      # checkout; VORTX_ENGINE_DIR can repoint the step if the engine workspace lives elsewhere.
      # The step fails fast with a clear message if the checkout's vortx-core lacks crates/ffi.
      - name: Cache vortx-ffi xcframework
        id: cache-ffi-xcframework
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Cache the xcframework AND its five retained pre-localization archives under the SAME exact
          # key (see the core cache above for the full rationale): every FFI slice is localized, so all
          # five engine-prelocalize/VortxEngine/<triple> archives must survive to the app's dsymutil
          # time, including on a warm hit that skips the build step. Exact-key-only, no restore-keys.
          path: |
            app/Vendor/VortxEngine.xcframework
            app/Vendor/engine-prelocalize/VortxEngine
          key: vortx-ffi-xcframework-${{ runner.os }}-${{ steps.toolchain.outputs.xcode_version }}-${{ hashFiles('vortx-core/Cargo.toml', 'vortx-core/Cargo.lock', 'vortx-core/rust-toolchain.toml', 'vortx-core/crates/**', 'scripts/build-ffi-xcframework.sh') }}

      - name: Build the vortx-ffi xcframework
        if: steps.cache-ffi-xcframework.outputs.cache-hit != 'true'
        env:
          VORTX_ENGINE_DIR: vortx-core
        run: ./scripts/build-ffi-xcframework.sh

      # Fail closed if either engine xcframework OR its retained pre-localization archives would
      # reintroduce the newer-minOS or missing-OSO warning families this repair removed. Runs
      # UNCONDITIONALLY (not gated on a cache miss): on a warm build the two build steps above are
      # skipped, so this is the only place that re-proves the cache-restored objects are clean. It
      # inspects the final XCFramework slices AND app/Vendor/engine-prelocalize/*, asserting zero of
      # each family (whole-family, computed) without filtering, stripping, or -oso_prefix.
      - name: Verify Apple engine artifacts (fail closed)
        # Apple's nm cannot parse some rust-produced objects (newer LLVM attribute format), so the
        # verifier's OSO check falls back to the rust toolchain's llvm-nm; install it here so it is
        # present on cold AND warm runs (the verifier still runs on a cache hit).
        run: |
          rustup component add llvm-tools-preview 2>/dev/null || true
          ./scripts/verify-apple-engine-artifacts.sh

      # The self-built player stack. `app/Vendor/MPVKit-DVFEL/artifacts/` is gitignored and reproducing it
      # needs a multi-hour nine-slice source build, so CI fetches the prebuilt xcframeworks the same way it
      # fetches NodeMobile. Beta 9's release run failed without this: SwiftPM reported "does not contain a
      # binary artifact" for all nine local binary targets, and it failed at the SIMULATOR smoke test, which
      # runs BEFORE the build, so nothing was produced at all.
      - name: Fetch the MPVKit-DVFEL artifacts (pinned, sha256-verified)
        run: |
          set -euo pipefail
          DEST="app/Vendor/MPVKit-DVFEL"
          EXPECTED="6b22848743a9744dc4d61edadf6ae82eac583ea6802e2d154f4a6fbc9aa03fc1"
          curl -sfL -o /tmp/mpvkit.zip \
            "https://github.com/VortXTV/VortX/releases/download/vendor-mpvkit-dvfel-1/mpvkit-dvfel-artifacts.zip"
          ACTUAL="$(shasum -a 256 /tmp/mpvkit.zip | cut -d' ' -f1)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::MPVKit artifact checksum mismatch. expected $EXPECTED got $ACTUAL"
            exit 1
          fi
          rm -rf "$DEST/artifacts"
          unzip -q /tmp/mpvkit.zip -d "$DEST"
          test -d "$DEST/artifacts/Libmpv-GPL.xcframework/tvos-arm64_x86_64-simulator" \
            || { echo "::error::tvOS simulator slice missing after unpack"; exit 1; }
          echo "MPVKit-DVFEL artifacts in place: $(ls "$DEST/artifacts" | wc -l | tr -d ' ') xcframeworks"

      - name: Generate the Xcode project
        run: cd app && xcodegen generate

      # Derive the masked edge secret and inject it into every app build.
      #
      # WHY THE APP GETS A MASKED BLOB WHILE THE WORKERS HOLD RAW HEX. The VortX edge workers
      # (skip / trickplay / ratings / ...) authenticate a request with HMAC-SHA256 whose key is the
      # UTF-8 bytes of a 64-char hex string, so they hold the RAW hex. The app must not ship that hex
      # as a findable literal, so VortXEdgeAuth carries a MASKED blob (XOR with a code-assembled mask,
      # then base64) in Info.plist and de-masks it at launch. That is two encodings of ONE secret, for
      # two different consumers.
      #
      # We keep a SINGLE source of truth: the VORTX_EDGE_SECRET repo secret holds the raw hex, and CI
      # derives the masked blob here by compiling the app's OWN VortXEdgeAuth.swift with a tiny driver,
      # so the derivation can never drift from the runtime de-mask. The value is derived, never stored
      # twice. A fork or otherwise secretless build: the driver reports EMPTY, we inject nothing, and request
      # signing stays a harmless observe-mode no-op (the workers accept unsigned requests today). An
      # already-masked stored value is detected and passed through unchanged; a value that is neither
      # 64-hex nor a valid masked blob falls back to an empty secret with a warning, never failing the
      # build. The derived blob is add-masked before it reaches $GITHUB_OUTPUT so it never hits the log.
      - name: Derive the masked edge secret
        id: edge_secret
        env:
          VORTX_EDGE_SECRET: ${{ secrets.VORTX_EDGE_SECRET }}
        run: |
          cat > "$RUNNER_TEMP/vxmask_driver.swift" <<'SWIFT'
          import Foundation
          // Reads the candidate edge secret from the environment, classifies its stored form, and prints
          // two lines: FORM (EMPTY | RAW | MASKED | INVALID) then the masked blob to inject (empty for
          // EMPTY / INVALID). Compiling against the app's own VortXEdgeAuth keeps this in lockstep with
          // the runtime de-mask.
          @main
          enum VXMaskDriver {
              static func isHex64(_ s: String) -> Bool {
                  return s.count == 64 && s.allSatisfy { $0.isHexDigit }
              }
              // Recover the 32-byte mask through the app's own maskedValue(): it XORs the UTF-8 bytes of
              // its input with the repeating mask, so feeding 32 NUL bytes yields base64(mask) exactly.
              // The mask is private in the source; reconstructing it via the public helper means the
              // derivation cannot drift from the runtime.
              static func recoverMask() -> [UInt8] {
                  let zeros = String(repeating: "\u{0}", count: 32)
                  guard let data = Data(base64Encoded: VortXEdgeAuth.maskedValue(for: zeros)) else { return [] }
                  return Array(data)
              }
              // Reproduce the runtime de-mask: base64-decode, XOR with the repeating mask, UTF-8 decode.
              static func demask(_ masked: String) -> String? {
                  guard let blob = Data(base64Encoded: masked), !blob.isEmpty else { return nil }
                  let mask = recoverMask()
                  guard !mask.isEmpty else { return nil }
                  var out = [UInt8](); out.reserveCapacity(blob.count)
                  for (i, b) in blob.enumerated() { out.append(b ^ mask[i % mask.count]) }
                  return String(bytes: out, encoding: .utf8)
              }
              static func main() {
                  let raw = (ProcessInfo.processInfo.environment["VORTX_EDGE_SECRET"] ?? "")
                      .trimmingCharacters(in: .whitespacesAndNewlines)
                  if raw.isEmpty {
                      print("EMPTY"); print("")
                  } else if isHex64(raw) {
                      print("RAW"); print(VortXEdgeAuth.maskedValue(for: raw))
                  } else if let demasked = demask(raw), isHex64(demasked) {
                      print("MASKED"); print(raw)
                  } else {
                      print("INVALID"); print("")
                  }
              }
          }
          SWIFT
          swiftc -O app/SourcesShared/VortXEdgeAuth.swift "$RUNNER_TEMP/vxmask_driver.swift" -o "$RUNNER_TEMP/vxmask"
          "$RUNNER_TEMP/vxmask" > "$RUNNER_TEMP/vxmask.out"
          FORM="$(sed -n '1p' "$RUNNER_TEMP/vxmask.out")"
          MASKED="$(sed -n '2p' "$RUNNER_TEMP/vxmask.out")"
          case "$FORM" in
            EMPTY)   echo "edge secret: none provided, building with empty secret (request signing disabled, observe-safe)" ;;
            RAW)     echo "edge secret: raw-hex form detected, deriving masked value" ;;
            MASKED)  echo "edge secret: masked form detected, passing through" ;;
            *)       echo "::warning::edge secret is neither 64-hex nor a valid masked blob; building with empty secret, request signing will be disabled" ;;
          esac
          if [ -n "$MASKED" ]; then echo "::add-mask::$MASKED"; fi
          echo "masked=$MASKED" >> "$GITHUB_OUTPUT"

      # A device Release product cannot be installed into CoreSimulator. Build the same current
      # source as a Release simulator product and require it to remain alive after first launch.
      - name: Smoke-test tvOS launch in a simulator (fail closed)
        timeout-minutes: 20
        run: |
          set -euo pipefail
          BUNDLE_ID="com.stremiox.tv"
          SIM_UDID=""
          SMOKE_DERIVED="$PWD/app/build/ci-smoke"
          SMOKE_TMP="$(mktemp -d)"

          cleanup() {
            cleanup_status="$1"
            trap - EXIT INT TERM
            set +e
            if [ -n "${SIM_UDID:-}" ]; then
              xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" >/dev/null 2>&1
              xcrun simctl shutdown "$SIM_UDID" >/dev/null 2>&1
            fi
            rm -rf "$SMOKE_DERIVED" "$SMOKE_TMP"
            # These were retained by the earlier disk cleanup solely for this smoke. Device SDKs
            # live inside Xcode, so reclaiming simulator runtimes here does not affect later builds.
            sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* >/dev/null 2>&1
            rm -rf "$HOME/Library/Developer/CoreSimulator"/* >/dev/null 2>&1
            exit "$cleanup_status"
          }
          trap 'cleanup $?' EXIT
          trap 'cleanup 130' INT
          trap 'cleanup 143' TERM

          version_at_least() {
            /usr/bin/awk -v actual="$1" -v floor="$2" 'BEGIN {
              actual_count = split(actual, actual_parts, ".")
              floor_count = split(floor, floor_parts, ".")
              count = actual_count > floor_count ? actual_count : floor_count
              for (i = 1; i <= count; i++) {
                actual_part = i <= actual_count ? actual_parts[i] + 0 : 0
                floor_part = i <= floor_count ? floor_parts[i] + 0 : 0
                if (actual_part > floor_part) exit 0
                if (actual_part < floor_part) exit 1
              }
              exit 0
            }'
          }

          SIM_ROW="$(
            xcrun simctl list devices available -j | jq -r '
              [
                .devices
                | to_entries[]
                | select(.key | test("SimRuntime\\.tvOS-[0-9-]+$"))
                | (.key | capture("tvOS-(?<version>[0-9-]+)$").version | gsub("-"; ".")) as $runtime
                | .value[]
                | select(.isAvailable == true)
                | { runtime: $runtime, udid: .udid, name: .name }
              ]
              | sort_by(.runtime | split(".") | map(tonumber))
              | reverse
              | if length == 0 then empty else .[0] | [.udid, .runtime, .name] | @tsv end
            '
          )"
          if [ -z "$SIM_ROW" ]; then
            echo "::error::no available tvOS simulator device is installed"
            exit 1
          fi
          IFS=$'\t' read -r SIM_UDID SIM_RUNTIME SIM_NAME <<< "$SIM_ROW"
          VERSION_RE='^[0-9]+(\.[0-9]+)*$'
          if ! [[ "$SIM_RUNTIME" =~ $VERSION_RE ]] || ! version_at_least "$SIM_RUNTIME" "18.0"; then
            echo "::error::selected simulator runtime '$SIM_RUNTIME' is below the app floor 18.0 or malformed"
            exit 1
          fi
          echo "selected tvOS $SIM_RUNTIME simulator: $SIM_NAME ($SIM_UDID)"

          xcodebuild -project app/VortX.xcodeproj -scheme VortXTV \
            -configuration Release -destination "platform=tvOS Simulator,id=$SIM_UDID" \
            -derivedDataPath "$SMOKE_DERIVED" CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            VORTX_EDGE_SECRET="${{ steps.edge_secret.outputs.masked }}" \
            TRAKT_CLIENT_ID="${{ secrets.TRAKT_CLIENT_ID }}" \
            TRAKT_CLIENT_SECRET="${{ secrets.TRAKT_CLIENT_SECRET }}" \
            SIMKL_CLIENT_ID="${{ secrets.SIMKL_CLIENT_ID }}" \
            SIMKL_CLIENT_SECRET="${{ secrets.SIMKL_CLIENT_SECRET }}" build

          SIM_APP="$SMOKE_DERIVED/Build/Products/Release-appletvsimulator/VortXTV.app"
          if [ ! -d "$SIM_APP" ]; then
            echo "::error::simulator build succeeded without the expected app at $SIM_APP"
            exit 1
          fi

          xcrun simctl shutdown "$SIM_UDID" >/dev/null 2>&1 || true
          xcrun simctl boot "$SIM_UDID"
          xcrun simctl bootstatus "$SIM_UDID" -b > "$SMOKE_TMP/bootstatus.log" 2>&1 &
          BOOTSTATUS_PID=$!
          for _ in $(seq 1 60); do
            if ! jobs -pr | grep -qx "$BOOTSTATUS_PID"; then break; fi
            sleep 2
          done
          if jobs -pr | grep -qx "$BOOTSTATUS_PID"; then
            kill "$BOOTSTATUS_PID" >/dev/null 2>&1 || true
            wait "$BOOTSTATUS_PID" >/dev/null 2>&1 || true
            cat "$SMOKE_TMP/bootstatus.log"
            echo "::error::tvOS simulator did not finish booting within 120 seconds"
            exit 1
          fi
          if ! wait "$BOOTSTATUS_PID"; then
            cat "$SMOKE_TMP/bootstatus.log"
            echo "::error::tvOS simulator bootstatus failed"
            exit 1
          fi

          xcrun simctl install "$SIM_UDID" "$SIM_APP"

          snapshot_crashes() {
            {
              for crash_root in \
                "$HOME/Library/Logs/DiagnosticReports" \
                "$HOME/Library/Logs/CrashReporter" \
                "$HOME/Library/Logs/CoreSimulator/$SIM_UDID" \
                "$HOME/Library/Developer/CoreSimulator/Devices/$SIM_UDID/data/Library/Logs/DiagnosticReports" \
                "$HOME/Library/Developer/CoreSimulator/Devices/$SIM_UDID/data/Library/Logs/CrashReporter"; do
                if [ -d "$crash_root" ]; then
                  find "$crash_root" -type f \( -iname 'VortX*.crash' -o -iname 'VortX*.ips' \) -print 2>/dev/null || true
                fi
              done
            } | LC_ALL=C sort -u
          }

          snapshot_crashes > "$SMOKE_TMP/crashes.before"
          LAUNCH_OUTPUT="$(xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID")"
          printf '%s\n' "$LAUNCH_OUTPUT"
          APP_PID="$(printf '%s\n' "$LAUNCH_OUTPUT" | sed -n 's/.*: \([0-9][0-9]*\)$/\1/p' | tail -1)"
          PID_RE='^[0-9]+$'
          if ! [[ "$APP_PID" =~ $PID_RE ]]; then
            echo "::error::simctl launch did not return a process id"
            exit 1
          fi

          sleep 5
          snapshot_crashes > "$SMOKE_TMP/crashes.after"
          NEW_CRASHES="$(comm -13 "$SMOKE_TMP/crashes.before" "$SMOKE_TMP/crashes.after")"
          alive=true
          if ! kill -0 "$APP_PID" 2>/dev/null; then alive=false; fi

          if [ "$alive" != true ]; then
            echo "::error::$BUNDLE_ID process $APP_PID exited within the five-second launch window"
          fi
          if [ -n "$NEW_CRASHES" ]; then
            echo "::error::new VortX crash report appeared during launch smoke"
            printf '%s\n' "$NEW_CRASHES"
          fi
          if [ "$alive" != true ] || [ -n "$NEW_CRASHES" ]; then
            exit 1
          fi
          echo "launch smoke verified: $BUNDLE_ID process $APP_PID remained alive with no new VortX crash report"

      - name: Build tvOS (Full)
        run: |
          xcodebuild -project app/VortX.xcodeproj -scheme VortXTV \
            -configuration Release -destination 'generic/platform=tvOS' \
            -derivedDataPath app/build/ci CODE_SIGNING_ALLOWED=NO \
            VORTX_EDGE_SECRET="${{ steps.edge_secret.outputs.masked }}" \
            TRAKT_CLIENT_ID="${{ secrets.TRAKT_CLIENT_ID }}" \
            TRAKT_CLIENT_SECRET="${{ secrets.TRAKT_CLIENT_SECRET }}" \
            SIMKL_CLIENT_ID="${{ secrets.SIMKL_CLIENT_ID }}" \
            SIMKL_CLIENT_SECRET="${{ secrets.SIMKL_CLIENT_SECRET }}" build

      - name: Build tvOS (Lite)
        run: |
          xcodebuild -project app/VortX.xcodeproj -scheme VortXTVLite \
            -configuration Release -destination 'generic/platform=tvOS' \
            -derivedDataPath app/build/ci-lite CODE_SIGNING_ALLOWED=NO \
            VORTX_EDGE_SECRET="${{ steps.edge_secret.outputs.masked }}" \
            TRAKT_CLIENT_ID="${{ secrets.TRAKT_CLIENT_ID }}" \
            TRAKT_CLIENT_SECRET="${{ secrets.TRAKT_CLIENT_SECRET }}" \
            SIMKL_CLIENT_ID="${{ secrets.SIMKL_CLIENT_ID }}" \
            SIMKL_CLIENT_SECRET="${{ secrets.SIMKL_CLIENT_SECRET }}" build

      - name: Build iOS
        run: |
          xcodebuild -project app/VortX.xcodeproj -scheme VortXiOSNative \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath app/build/ci-ios CODE_SIGNING_ALLOWED=NO \
            VORTX_EDGE_SECRET="${{ steps.edge_secret.outputs.masked }}" \
            TRAKT_CLIENT_ID="${{ secrets.TRAKT_CLIENT_ID }}" \
            TRAKT_CLIENT_SECRET="${{ secrets.TRAKT_CLIENT_SECRET }}" \
            SIMKL_CLIENT_ID="${{ secrets.SIMKL_CLIENT_ID }}" \
            SIMKL_CLIENT_SECRET="${{ secrets.SIMKL_CLIENT_SECRET }}" build

      # Generic iOS-SIMULATOR link + dSYM gate. The device builds above never link the
      # aarch64-apple-ios-sim engine slice, so any newer-minOS / missing-OSO defect specific to it
      # stays latent. Link the simulator product with dwarf-with-dsym so BOTH ld (newer-minOS) and
      # dsymutil (missing-OSO) actually run over that slice, then FAIL on either warning family. The
      # grep DETECTS and fails the build (the opposite of suppressing a warning); nothing is filtered
      # from the log, which is streamed in full via tee.
      - name: Gate iOS-simulator link + dSYM (fail closed)
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/ios-sim-dsym.log"
          xcodebuild -project app/VortX.xcodeproj -scheme VortXiOSNative \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath app/build/ci-ios-sim CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES DEBUG_INFORMATION_FORMAT=dwarf-with-dsym \
            VORTX_EDGE_SECRET="${{ steps.edge_secret.outputs.masked }}" \
            TRAKT_CLIENT_ID="${{ secrets.TRAKT_CLIENT_ID }}" \
            TRAKT_CLIENT_SECRET="${{ secrets.TRAKT_CLIENT_SECRET }}" \
            SIMKL_CLIENT_ID="${{ secrets.SIMKL_CLIENT_ID }}" \
            SIMKL_CLIENT_SECRET="${{ secrets.SIMKL_CLIENT_SECRET }}" build 2>&1 | tee "$LOG"
          SIM_DSYM="app/build/ci-ios-sim/Build/Products/Release-iphonesimulator/VortXiOSNative.app.dSYM"
          if [ ! -d "$SIM_DSYM" ]; then
            echo "::error::iOS-simulator dSYM was not produced at $SIM_DSYM (dsymutil did not run; the missing-OSO family would stay latent)"
            exit 1
          fi
          # Broad on purpose: dsymutil's missing-input wording varies across LLVM (".*object file",
          # "could not open '<path>'", "unable to open"), so match the verbs without requiring a fixed
          # trailing token. The verifier (run earlier) is the primary OSO check; this is defense in depth.
          if grep -E "was built for newer|warning:.*(could not (find|open)|unable to open)" "$LOG"; then
            echo "::error::iOS-simulator link/dSYM reintroduced a newer-minOS or missing-OSO warning (matches printed above)"
            exit 1
          fi
          # Reclaim the simulator build tree at once; the disk-tight IPA/DMG legs below do not need it.
          rm -rf app/build/ci-ios-sim
          echo "iOS-simulator link + dSYM gate passed: no newer-minOS, no missing-OSO"

      - name: Build macOS
        run: |
          # ARCHS=arm64 (not just destination arch): a macOS Release build otherwise compiles the universal
          # ARCHS_STANDARD (arm64 + x86_64), and the StremioXCore.xcframework macOS slice is arm64-only, so the
          # x86_64 leg fails to link ("Undefined symbols for architecture x86_64"). Force arm64 to match the
          # Apple Silicon runner and the local build recipe.
          xcodebuild -project app/VortX.xcodeproj -scheme VortXMac \
            -configuration Release -destination 'platform=macOS,arch=arm64' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath app/build/ci-mac CODE_SIGNING_ALLOWED=NO \
            VORTX_EDGE_SECRET="${{ steps.edge_secret.outputs.masked }}" \
            TRAKT_CLIENT_ID="${{ secrets.TRAKT_CLIENT_ID }}" \
            TRAKT_CLIENT_SECRET="${{ secrets.TRAKT_CLIENT_SECRET }}" \
            SIMKL_CLIENT_ID="${{ secrets.SIMKL_CLIENT_ID }}" \
            SIMKL_CLIENT_SECRET="${{ secrets.SIMKL_CLIENT_SECRET }}" build

      - name: Verify tvOS device artifact metadata (fail closed)
        run: |
          set -euo pipefail
          EXPECTED_MINOS="18.0"
          TVOS_SDK_FLOOR="26.5"

          version_at_least() {
            /usr/bin/awk -v actual="$1" -v floor="$2" 'BEGIN {
              actual_count = split(actual, actual_parts, ".")
              floor_count = split(floor, floor_parts, ".")
              count = actual_count > floor_count ? actual_count : floor_count
              for (i = 1; i <= count; i++) {
                actual_part = i <= actual_count ? actual_parts[i] + 0 : 0
                floor_part = i <= floor_count ? floor_parts[i] + 0 : 0
                if (actual_part > floor_part) exit 0
                if (actual_part < floor_part) exit 1
              }
              exit 0
            }'
          }

          assert_tvos_build_version() {
            label="$1"
            binary="$2"
            if [ ! -f "$binary" ]; then
              echo "::error::$label executable is missing at $binary"
              return 1
            fi
            if ! load_commands="$(otool -l "$binary" 2>&1)"; then
              echo "::error::$label is not a readable Mach-O executable: $load_commands"
              return 1
            fi

            build_version_count="$(printf '%s\n' "$load_commands" | /usr/bin/awk '$1 == "cmd" && $2 == "LC_BUILD_VERSION" { count++ } END { print count + 0 }')"
            if [ "$build_version_count" -ne 1 ]; then
              echo "::error::$label has $build_version_count LC_BUILD_VERSION commands; expected exactly 1"
              return 1
            fi
            build_version="$(printf '%s\n' "$load_commands" | /usr/bin/awk '
              $1 == "cmd" && $2 == "LC_BUILD_VERSION" { capture = 1; next }
              capture && $1 == "Load" && $2 == "command" { exit }
              capture { print }
            ')"

            platform_count="$(printf '%s\n' "$build_version" | /usr/bin/awk '$1 == "platform" { count++ } END { print count + 0 }')"
            minos_count="$(printf '%s\n' "$build_version" | /usr/bin/awk '$1 == "minos" { count++ } END { print count + 0 }')"
            sdk_count="$(printf '%s\n' "$build_version" | /usr/bin/awk '$1 == "sdk" { count++ } END { print count + 0 }')"
            if [ "$platform_count" -ne 1 ] || [ "$minos_count" -ne 1 ] || [ "$sdk_count" -ne 1 ]; then
              echo "::error::$label has malformed LC_BUILD_VERSION fields (platform=$platform_count minos=$minos_count sdk=$sdk_count)"
              return 1
            fi

            platform="$(printf '%s\n' "$build_version" | /usr/bin/awk '$1 == "platform" { print $2 }')"
            minos="$(printf '%s\n' "$build_version" | /usr/bin/awk '$1 == "minos" { print $2 }')"
            sdk="$(printf '%s\n' "$build_version" | /usr/bin/awk '$1 == "sdk" { print $2 }')"
            echo "$label LC_BUILD_VERSION: platform=$platform minos=$minos sdk=$sdk"

            # otool prints Apple's PLATFORM_TVOS either as its numeric value 3 or as TVOS.
            if [ "$platform" != "3" ] && [ "$platform" != "TVOS" ]; then
              echo "::error::$label platform '$platform' is not tvOS"
              return 1
            fi
            if [ "$minos" != "$EXPECTED_MINOS" ]; then
              echo "::error::$label minos $minos does not equal the project floor $EXPECTED_MINOS"
              return 1
            fi
            VERSION_RE='^[0-9]+(\.[0-9]+)*$'
            if ! [[ "$sdk" =~ $VERSION_RE ]]; then
              echo "::error::$label SDK '$sdk' is malformed"
              return 1
            fi
            if ! version_at_least "$sdk" "$TVOS_SDK_FLOOR"; then
              echo "::error::$label SDK $sdk is below the release floor $TVOS_SDK_FLOOR"
              return 1
            fi
          }

          assert_tvos_build_version \
            "VortXTV" \
            "app/build/ci/Build/Products/Release-appletvos/VortXTV.app/VortXTV"
          assert_tvos_build_version \
            "VortXTVLite" \
            "app/build/ci-lite/Build/Products/Release-appletvos/VortXTVLite.app/VortXTVLite"
          assert_tvos_build_version \
            "VortXTopShelf" \
            "app/build/ci/Build/Products/Release-appletvos/VortXTV.app/PlugIns/VortXTopShelf.appex/VortXTopShelf"
          echo "tvOS artifact metadata verified for Full, Lite, and Top Shelf"

      # Fail closed on unsafe symlinks in the SHIPPED bundles. These are the exact .app trees that
      # get zipped into the IPAs and the DMG below, so this is where the check has to run; a
      # local-only checker protects nobody. It rejects any symlink that is absolute, dangling, or
      # escapes its bundle (the shipped `fonts/fonts -> /Users/daksh/...` link was all three on CI),
      # while allowing the legitimate RELATIVE framework symlinks that VortXMac's bundle contains.
      - name: Audit bundle symlinks (fail closed)
        run: |
          bash scripts/audit-bundle-symlinks.sh \
            "app/build/ci/Build/Products/Release-appletvos/VortXTV.app" \
            "app/build/ci-lite/Build/Products/Release-appletvos/VortXTVLite.app" \
            "app/build/ci-ios/Build/Products/Release-iphoneos/VortXiOSNative.app" \
            "app/build/ci-mac/Build/Products/Release/VortX.app"

      # Private-symbols RETENTION. Keep the five shipped app dSYMs for later crash symbolication in a
      # PRIVATE symbols vault, keyed by the exact release tag + built commit. Must run BEFORE "Package
      # the IPAs" below, which deletes the app/build/ci* trees (dSYMs included). The dSYMs are NEVER
      # added to the public VortX-tvOS-ci artifact or any release asset - only to the private vault
      # repo. GUARDED: with no SYMBOL_VAULT_TOKEN (provisioned separately) or no release tag to key by,
      # the step SKIPS cleanly (exit 0) and changes nothing, so it is a no-op on ordinary pushes today.
      - name: Retain app dSYMs to the private symbols vault (guarded)
        env:
          # Distinct from GITHUB_TOKEN and ENGINE_REPO_TOKEN: a narrowly scoped token for the symbols
          # vault only. Absent today (provisioned separately), which makes the step skip.
          SYMBOL_VAULT_TOKEN: ${{ secrets.SYMBOL_VAULT_TOKEN }}
          # The private repo that holds symbols only. Overridable via an Actions variable; falls back
          # to the org default below when unset.
          SYMBOL_VAULT_REPO: ${{ vars.SYMBOL_VAULT_REPO }}
          # Passed through env (never inlined into the script body) so a tag string can never be parsed
          # as shell; the strict grammar below is re-asserted before the value reaches any gh call.
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ -z "${SYMBOL_VAULT_TOKEN:-}" ]; then
            echo "SYMBOL_VAULT_TOKEN not set; skipping private dSYM retention (provisioned separately)."
            exit 0
          fi
          if [ -z "${TAG:-}" ]; then
            echo "no release tag on this run; skipping private dSYM retention (nothing to key by)."
            exit 0
          fi
          # Same strict release-tag grammar the attach-release job enforces: refuse anything that is
          # not vMAJOR.MINOR.PATCH[-prerelease], so an option-shaped value can never reach a gh call.
          TAG_RE='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          if ! [[ "$TAG" =~ $TAG_RE ]]; then
            echo "::error::release tag '$TAG' is not a strict release tag; refusing to retain symbols"
            exit 1
          fi
          VAULT="${SYMBOL_VAULT_REPO:-VortXTV/vortx-symbols}"
          SHORT_SHA="$(printf '%s' "$GITHUB_SHA" | cut -c1-12)"
          # Exactly the five shipped-binary dSYMs (VortXTV, VortXTVLite, VortXTopShelf, VortXiOSNative,
          # VortX/mac). Missing any is a hard failure once the token exists: never retain fewer symbol
          # sets than the release ships.
          DSYMS=(
            "app/build/ci/Build/Products/Release-appletvos/VortXTV.app.dSYM"
            "app/build/ci-lite/Build/Products/Release-appletvos/VortXTVLite.app.dSYM"
            "app/build/ci/Build/Products/Release-appletvos/VortXTopShelf.appex.dSYM"
            "app/build/ci-ios/Build/Products/Release-iphoneos/VortXiOSNative.app.dSYM"
            "app/build/ci-mac/Build/Products/Release/VortX.app.dSYM"
          )
          for d in "${DSYMS[@]}"; do
            [ -d "$d" ] || { echo "::error::expected app dSYM missing: $d"; exit 1; }
          done
          STAGE="$RUNNER_TEMP/vortx-dsyms"
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          for d in "${DSYMS[@]}"; do cp -R "$d" "$STAGE/"; done
          BUNDLE="$RUNNER_TEMP/VortX-$TAG-$SHORT_SHA-dSYMs.zip"
          ( cd "$STAGE" && zip -qry "$BUNDLE" . )
          echo "retaining ${#DSYMS[@]} dSYMs to private vault $VAULT, keyed by $TAG @ $GITHUB_SHA"
          # Private vault only. A per-key prerelease in the PRIVATE repo carries the bundle; tag AND
          # commit are encoded in the vault release tag, the asset name, and the notes, so a retained
          # symbol set is unambiguously addressable by (release tag, built commit).
          export GH_TOKEN="$SYMBOL_VAULT_TOKEN"
          VAULT_TAG="symbols-$TAG-$SHORT_SHA"
          if ! gh release view -R "$VAULT" -- "$VAULT_TAG" >/dev/null 2>&1; then
            gh release create -R "$VAULT" --prerelease \
              --title "VortX symbols $TAG ($SHORT_SHA)" \
              --notes "Private dSYMs for $TAG at $GITHUB_SHA. Internal symbolication only; not for distribution." \
              -- "$VAULT_TAG" \
              || { echo "::error::could not create private symbols release $VAULT_TAG in $VAULT"; exit 1; }
          fi
          gh release upload -R "$VAULT" -- "$VAULT_TAG" "$BUNDLE"
          echo "private dSYM retention complete: $VAULT $VAULT_TAG"

      - name: Package the IPAs
        run: |
          mkdir -p out/full/Payload out/lite/Payload out/ios/Payload
          mv app/build/ci/Build/Products/Release-appletvos/VortXTV.app out/full/Payload/
          mv app/build/ci-lite/Build/Products/Release-appletvos/VortXTVLite.app out/lite/Payload/
          mv app/build/ci-ios/Build/Products/Release-iphoneos/VortXiOSNative.app out/ios/Payload/
          (cd out/full && zip -qry ../VortX-tvOS-ci.ipa Payload)
          (cd out/lite && zip -qry ../VortX-tvOS-lite-ci.ipa Payload)
          (cd out/ios && zip -qry ../VortX-iOS-ci.ipa Payload)
          # Reclaim disk before building the .dmg: the IPAs are zipped now, so the tvOS/iOS build
          # trees and the unzipped payloads are dead weight, and the macos-26 runner disk is
          # tight (four MPVKit-GPL builds + node). Without this, `hdiutil create` failed with
          # "No space left on device" on the macOS leg (the empty-asset release for v0.3.6).
          rm -rf out/full/Payload out/lite/Payload out/ios/Payload
          rm -rf app/build/ci app/build/ci-lite app/build/ci-ios
          df -h / | tail -1
          # macOS: an UNSIGNED arm64 app shows "damaged and can't be opened", so ad-hoc sign it
          # (every nested binary gets a valid signature, so the kernel will run it), then package it as
          # a drag-to-install .dmg holding the app plus an /Applications symlink. We can't notarize
          # without an Apple Developer ID, so a downloaded build is still quarantined; the release notes
          # give the one-time right-click-Open / xattr fix.
          MAC_APP="app/build/ci-mac/Build/Products/Release/VortX.app"
          codesign --force --deep --sign - "$MAC_APP"
          codesign -dv "$MAC_APP" 2>&1 | sed -n '1,3p' || true
          DMG_STAGE="$(mktemp -d)"
          mv "$MAC_APP" "$DMG_STAGE/"
          ln -s /Applications "$DMG_STAGE/Applications"
          hdiutil create -volname "VortX" -srcfolder "$DMG_STAGE" -ov -format UDZO out/VortX-macOS-ci.dmg
          shasum -a 256 out/VortX-tvOS-ci.ipa out/VortX-tvOS-lite-ci.ipa out/VortX-iOS-ci.ipa out/VortX-macOS-ci.dmg | tee out/SHA256SUMS-ci.txt

      # Build the feed from the exact immutable tag checkout while this job still has read-only
      # authority. The later release-write job receives only these bytes and never executes a
      # repository script or checks out a mutable branch with contents:write.
      - name: Build the content-addressed release feed artifact
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && github.ref == format('refs/tags/{0}', inputs.release_tag)
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          ALTSTORE_NOTE: ${{ inputs.altstore_note }}
          RELEASE_ID_INPUT: ${{ inputs.release_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          TAG_RE='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          [[ "$TAG" =~ $TAG_RE ]] || { echo "::error::release tag $TAG is not strict"; exit 1; }
          IS_PRERELEASE=false; [[ "$TAG" == *-* ]] && IS_PRERELEASE=true
          BUILD="$(node scripts/release-feed.mjs project-build --file app/project.yml)"
          [[ "$BUILD" =~ ^[0-9]+$ ]] || { echo "::error::tag project build is not numeric"; exit 1; }
          if [[ "$RELEASE_ID_INPUT" =~ ^[0-9]+$ ]]; then
            RELEASE_JSON="$(gh api "repos/$GH_REPO/releases/$RELEASE_ID_INPUT")"
          else
            RELEASE_JSON="$(gh api "repos/$GH_REPO/releases?per_page=100" --jq "first(.[] | select(.tag_name == \"$TAG\"))")"
          fi
          RELEASE_ID="$(jq -er '.id' <<<"$RELEASE_JSON")"
          jq -e --arg tag "$TAG" --argjson prerelease "$IS_PRERELEASE" '.tag_name == $tag and .draft == true and .prerelease == $prerelease' <<<"$RELEASE_JSON" >/dev/null || { echo "::error::target release must be an existing draft with the tag-derived prerelease state"; exit 1; }
          RELEASE_NAME="$(jq -r '.name // .tag_name' <<<"$RELEASE_JSON")"
          RELEASE_BODY="$(jq -r '.body // ""' <<<"$RELEASE_JSON")"
          mv out/VortX-tvOS-ci.ipa "out/VortX-tvOS-$TAG-ci.ipa"
          mv out/VortX-tvOS-lite-ci.ipa "out/VortX-tvOS-lite-$TAG-ci.ipa"
          mv out/VortX-iOS-ci.ipa "out/VortX-iOS-$TAG-ci.ipa"
          mv out/VortX-macOS-ci.dmg "out/VortX-macOS-$TAG-ci.dmg"
          shasum -a 256 \
            "out/VortX-tvOS-$TAG-ci.ipa" \
            "out/VortX-tvOS-lite-$TAG-ci.ipa" \
            "out/VortX-iOS-$TAG-ci.ipa" \
            "out/VortX-macOS-$TAG-ci.dmg" > out/SHA256SUMS-ci.txt
          rm -rf feed-artifact
          node scripts/release-feed.mjs build-artifact \
            --tag "$TAG" --build "$BUILD" --source-commit "$GITHUB_SHA" \
            --source-template altstore/source.json --output feed-artifact \
            --ios-file "out/VortX-iOS-$TAG-ci.ipa" --tvos-file "out/VortX-tvOS-$TAG-ci.ipa" \
            --tvos-lite-file "out/VortX-tvOS-lite-$TAG-ci.ipa" --mac-file "out/VortX-macOS-$TAG-ci.dmg" \
            --checksum-file out/SHA256SUMS-ci.txt --date "$(date -u +%F)" \
            --name "$RELEASE_NAME" --note "${ALTSTORE_NOTE:-$RELEASE_BODY}" --release-id "$RELEASE_ID"
          jq -e --arg tag "$TAG" --arg commit "$GITHUB_SHA" --arg id "$RELEASE_ID" '.tag == $tag and .sourceCommit == $commit and (.releaseId | tostring) == $id and .android == null' feed-artifact/manifest.json >/dev/null
          test -s feed-artifact/source.json -a -s feed-artifact/appcast.json -a -s feed-artifact/manifest.json -a -s feed-artifact/SHA256SUMS-ci.txt

      - name: Upload the immutable app handoff
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VortX-tvOS-ci
          path: |
            out/VortX-tvOS-${{ inputs.release_tag }}-ci.ipa
            out/VortX-tvOS-lite-${{ inputs.release_tag }}-ci.ipa
            out/VortX-iOS-${{ inputs.release_tag }}-ci.ipa
            out/VortX-macOS-${{ inputs.release_tag }}-ci.dmg
            out/SHA256SUMS-ci.txt

      - name: Upload the immutable feed handoff
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VortX-release-feed
          path: feed-artifact
  # The release write lane is draft-only until every trusted local byte and the staged edge receipt
  # pass. It is keyed by release tag so independent cuts cannot cancel one another's pending work.
  # It never checks out a branch or executes a repository script with contents:write.
  attach-release:
    needs: [build-tvos]
    outputs:
      release_id: ${{ steps.identity.outputs.release_id }}
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && github.ref == format('refs/tags/{0}', inputs.release_tag)
    concurrency:
      group: vortx-release-${{ inputs.release_tag }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    environment: release-approval
    permissions:
      contents: write
    timeout-minutes: 35
    steps:
      - name: Download the built apps
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: VortX-tvOS-ci
          path: out

      - name: Download the immutable feed artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: VortX-release-feed
          path: feed-artifact

      - name: Bind the draft release, tag commit, and monotonic source before any write
        id: identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
          RELEASE_ID_INPUT: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          TAG_RE='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          if [ -z "$TAG" ] || ! [[ "$TAG" =~ $TAG_RE ]]; then
            echo "::error::release tag '$TAG' is not strict"
            exit 1
          fi
          IS_PRERELEASE=false; [[ "$TAG" == *-* ]] && IS_PRERELEASE=true
          MANIFEST=feed-artifact/manifest.json
          jq -e --arg tag "$TAG" --arg commit "$GITHUB_SHA" \
            '.tag == $tag and (.sourceCommit | ascii_downcase) == ($commit | ascii_downcase) and .android == null' "$MANIFEST" >/dev/null
          BUILD="$(jq -er '.build' "$MANIFEST")"
          [[ "$BUILD" =~ ^[0-9]+$ ]] || { echo "::error::feed artifact build is not numeric"; exit 1; }
          if [[ "$RELEASE_ID_INPUT" =~ ^[0-9]+$ ]]; then
            RELEASE_JSON="$(gh api "repos/$GH_REPO/releases/$RELEASE_ID_INPUT")"
          else
            RELEASE_JSON="$(gh api "repos/$GH_REPO/releases?per_page=100" --jq "first(.[] | select(.tag_name == \"$TAG\"))")"
          fi
          RELEASE_ID="$(jq -er '.id' <<<"$RELEASE_JSON")"
          jq -e --arg id "$RELEASE_ID" '(.releaseId | tostring) == $id' "$MANIFEST" >/dev/null || { echo "::error::draft release identity differs from the immutable feed artifact"; exit 1; }
          [ "$(jq -r '.draft' <<<"$RELEASE_JSON")" = true ] || { echo "::error::release $RELEASE_ID is not a draft; refusing asset writes"; exit 1; }
          REF_JSON="$(gh api -- "repos/$GH_REPO/git/ref/tags/$TAG")"
          TAG_SHA="$(jq -r '.object.sha' <<<"$REF_JSON")"
          TAG_TYPE="$(jq -r '.object.type' <<<"$REF_JSON")"
          HOPS=0
          while [ "$TAG_TYPE" = tag ]; do
            HOPS=$((HOPS + 1)); [ "$HOPS" -le 5 ] || { echo "::error::tag object nesting is excessive"; exit 1; }
            TAG_OBJECT="$(gh api -- "repos/$GH_REPO/git/tags/$TAG_SHA")"
            TAG_SHA="$(jq -r '.object.sha' <<<"$TAG_OBJECT")"
            TAG_TYPE="$(jq -r '.object.type' <<<"$TAG_OBJECT")"
          done
          [ "$TAG_TYPE" = commit ] && [ "$TAG_SHA" = "$GITHUB_SHA" ] || { echo "::error::tag $TAG is not bound to this immutable build"; exit 1; }
          gh api -- "repos/$GH_REPO/releases/$RELEASE_ID" | jq -e --arg tag "$TAG" --argjson id "$RELEASE_ID" --argjson prerelease "$IS_PRERELEASE" '.id == $id and .tag_name == $tag and .draft == true and .prerelease == $prerelease' >/dev/null
          MAIN_REF="$(gh api -- "repos/$GH_REPO/git/ref/heads/main")"
          MAIN_HEAD="$(jq -er '.object.sha' <<<"$MAIN_REF")"
          MAIN_CONTENT="$(gh api -- "repos/$GH_REPO/contents/altstore/source.json?ref=$MAIN_HEAD")"
          printf '%s' "$MAIN_CONTENT" | jq -er '.content' | tr -d '\n' | base64 --decode > "$RUNNER_TEMP/previous-source.json"
          PREVIOUS_SOURCE_SHA256="$(shasum -a 256 "$RUNNER_TEMP/previous-source.json" | awk '{print $1}')"
          CURRENT_BUILDS="$(jq -r '.apps[] | select(.bundleIdentifier == "com.stremiox.app.native" or .bundleIdentifier == "com.stremiox.tv") | .versions[0].buildVersion' "$RUNNER_TEMP/previous-source.json")"
          CURRENT_TOP=0
          while IFS= read -r CURRENT_BUILD; do
            [[ "$CURRENT_BUILD" =~ ^[0-9]+$ ]] || { echo "::error::main source has a non-numeric top build"; exit 1; }
            if [ "$CURRENT_BUILD" -gt "$CURRENT_TOP" ]; then CURRENT_TOP="$CURRENT_BUILD"; fi
          done <<< "$CURRENT_BUILDS"
          [ "$CURRENT_TOP" -le "$BUILD" ] || { echo "::error::main source already leads build $CURRENT_TOP over target $BUILD"; exit 1; }
          if [ "$CURRENT_TOP" -eq "$BUILD" ]; then
            CURRENT_TAGS="$(jq -r '.apps[] | select(.bundleIdentifier == "com.stremiox.app.native" or .bundleIdentifier == "com.stremiox.tv") | .versions[0].downloadURL | split("/download/")[1] | split("/")[0]' "$RUNNER_TEMP/previous-source.json" | sort -u)"
            [ "$(wc -l <<<"$CURRENT_TAGS" | tr -d ' ')" = 1 ] && [ "$CURRENT_TAGS" = "$TAG" ] || { echo "::error::main source uses build $BUILD for a different Apple tag"; exit 1; }
          fi
          set +e
          curl -sS --connect-timeout 5 --max-time 10 -D "$RUNNER_TEMP/active.headers" -o /dev/null https://vortx.tv/altstore.json
          set -e
          EXPECTED_ACTIVE="$(awk 'tolower($1) == "x-vortx-feed-generation:" {sub(/\r$/, "", $2); print $2}' "$RUNNER_TEMP/active.headers" | tail -1)"
          [ -n "$EXPECTED_ACTIVE" ] || EXPECTED_ACTIVE=none
          if [ "$EXPECTED_ACTIVE" != none ]; then
            for ROUTE_FILE in \
              "https://vortx.tv/altstore.json|$RUNNER_TEMP/previous-edge-source.json" \
              "https://vortx.tv/vortx-altstore.json|$RUNNER_TEMP/previous-edge-compat.json" \
              "https://vortx.tv/appcast.json|$RUNNER_TEMP/previous-edge-appcast.json"; do
              ROUTE="${ROUTE_FILE%%|*}"; FILE="${ROUTE_FILE#*|}"
              curl --fail-with-body --connect-timeout 5 --max-time 15 -sS -D "$FILE.headers" "$ROUTE" -o "$FILE"
              curl --fail-with-body --connect-timeout 5 --max-time 15 -sS "$ROUTE?rollback-snapshot=$EXPECTED_ACTIVE" -o "$FILE.query"
              cmp -s "$FILE" "$FILE.query" || { echo "::error::edge snapshot query bytes differ: $ROUTE"; exit 1; }
              grep -Fqi "x-vortx-feed-generation: $EXPECTED_ACTIVE" "$FILE.headers" || { echo "::error::edge snapshot generation differs: $ROUTE"; exit 1; }
            done
            cmp -s "$RUNNER_TEMP/previous-edge-source.json" "$RUNNER_TEMP/previous-edge-compat.json" || { echo "::error::edge snapshot compatibility bytes differ"; exit 1; }
          fi
          {
            echo "release_id=$RELEASE_ID"
            echo "build=$BUILD"
            echo "expected_active=$EXPECTED_ACTIVE"
            echo "main_head=$MAIN_HEAD"
            echo "previous_source_sha256=$PREVIOUS_SOURCE_SHA256"
          } >> "$GITHUB_OUTPUT"
          echo "PREVIOUS_SOURCE_FILE=$RUNNER_TEMP/previous-source.json" >> "$GITHUB_ENV"
          echo "PREVIOUS_EDGE_SOURCE_FILE=$RUNNER_TEMP/previous-edge-source.json" >> "$GITHUB_ENV"
          echo "PREVIOUS_EDGE_APPCAST_FILE=$RUNNER_TEMP/previous-edge-appcast.json" >> "$GITHUB_ENV"
          echo "EXPECTED_MAIN_HEAD=$MAIN_HEAD" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> "$GITHUB_ENV"
          echo "release identity $RELEASE_ID is draft and tag $TAG peels to $TAG_SHA; main top $CURRENT_TOP <= target $BUILD"

      - name: Attach only exact draft assets and create the authenticated staged receipt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
          RELEASE_ID: ${{ steps.identity.outputs.release_id }}
          EXPECTED_ACTIVE: ${{ steps.identity.outputs.expected_active }}
          RELEASE_FEED_RECEIPT_SECRET: ${{ secrets.RELEASE_FEED_RECEIPT_SECRET }}
        run: |
          set -euo pipefail
          [ -n "${RELEASE_FEED_RECEIPT_SECRET:-}" ] || { echo "::error::RELEASE_FEED_RECEIPT_SECRET is not configured"; exit 1; }
          cmp -s feed-artifact/SHA256SUMS-ci.txt out/SHA256SUMS-ci.txt || { echo "::error::feed checksum file differs from the trusted build handoff"; exit 1; }
          for KEY_FILE in \
            "ios:out/VortX-iOS-$TAG-ci.ipa" \
            "tvos:out/VortX-tvOS-$TAG-ci.ipa" \
            "tvosLite:out/VortX-tvOS-lite-$TAG-ci.ipa" \
            "mac:out/VortX-macOS-$TAG-ci.dmg"; do
            KEY="${KEY_FILE%%:*}"; FILE="${KEY_FILE#*:}"
            EXPECTED_NAME="$(jq -er --arg key "$KEY" '.assets[$key].name' feed-artifact/manifest.json)"
            EXPECTED_SIZE="$(jq -er --arg key "$KEY" '.assets[$key].size' feed-artifact/manifest.json)"
            EXPECTED_SHA="$(jq -er --arg key "$KEY" '.assets[$key].sha256' feed-artifact/manifest.json)"
            LOCAL_SIZE="$(wc -c <"$FILE" | tr -d ' ')"; LOCAL_SHA="$(shasum -a 256 "$FILE" | awk '{print $1}')"
            [ "$FILE" = "out/$EXPECTED_NAME" ] && [ "$LOCAL_SIZE" = "$EXPECTED_SIZE" ] && [ "$LOCAL_SHA" = "$EXPECTED_SHA" ] || { echo "::error::trusted local metadata mismatch for $KEY"; exit 1; }
          done
          RELEASE_JSON="$(gh api -- "repos/$GH_REPO/releases/$RELEASE_ID")"
          jq -e --arg tag "$TAG" --argjson id "$RELEASE_ID" --argjson prerelease "$IS_PRERELEASE" '.id == $id and .tag_name == $tag and .prerelease == $prerelease and .draft == true' <<<"$RELEASE_JSON" >/dev/null || { echo "::error::release identity changed while draft assets were being attached"; exit 1; }
          register_asset() {
            local name="$1" file="$2" expected_size="$3" expected_sha="$4"
            local count existing_size existing_sha existing_state
            count="$(jq --arg n "$name" '[.assets[] | select(.name == $n)] | length' <<<"$RELEASE_JSON")"
            if [ "$count" -gt 1 ]; then echo "::error::duplicate release assets named $name"; exit 1; fi
            if [ "$count" -eq 1 ]; then
              existing_size="$(jq -er --arg n "$name" '.assets[] | select(.name == $n) | .size' <<<"$RELEASE_JSON")"
              existing_sha="$(jq -er --arg n "$name" '.assets[] | select(.name == $n) | (.digest // "") | sub("^sha256:"; "") | ascii_downcase' <<<"$RELEASE_JSON")"
              existing_state="$(jq -er --arg n "$name" '.assets[] | select(.name == $n) | .state' <<<"$RELEASE_JSON")"
              [ "$existing_state" = uploaded ] && [ "$existing_size" = "$expected_size" ] && [ "$existing_sha" = "$expected_sha" ] || { echo "::error::existing draft asset $name differs; refusing replacement"; exit 1; }
            else
              # Upload via uploads.github.com directly. `gh api --method POST` on the assets
              # endpoint regressed to posting at api.github.com (which 404s asset writes); the
              # upload host is the only documented write endpoint for release assets.
              curl -sS -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Content-Type: application/octet-stream" \
                --data-binary @"$file" \
                -o /dev/null -w '%{http_code}' \
                "https://uploads.github.com/repos/$GH_REPO/releases/$RELEASE_ID/assets?name=$name" \
                | grep -qx '201' || { echo "::error::asset upload failed for $name"; exit 1; }
              RELEASE_JSON="$(gh api -- "repos/$GH_REPO/releases/$RELEASE_ID")"
            fi
            jq -e --arg n "$name" --arg sha "$expected_sha" --argjson size "$expected_size" --argjson rid "$RELEASE_ID" \
              '.assets | map(select(.name == $n and .state == "uploaded" and .size == $size and .id > 0 and ((.digest // "") | sub("^sha256:"; "") | ascii_downcase) == $sha)) | length == 1' <<<"$RELEASE_JSON" >/dev/null || { echo "::error::release API metadata did not match trusted $name"; exit 1; }
            REGISTERED_ID="$(jq -er --arg n "$name" '.assets[] | select(.name == $n) | .id' <<<"$RELEASE_JSON")"
          }
          IOS_NAME="$(jq -er '.assets.ios.name' feed-artifact/manifest.json)"; IOS_SIZE="$(jq -er '.assets.ios.size' feed-artifact/manifest.json)"; IOS_SHA="$(jq -er '.assets.ios.sha256' feed-artifact/manifest.json)"
          TVOS_NAME="$(jq -er '.assets.tvos.name' feed-artifact/manifest.json)"; TVOS_SIZE="$(jq -er '.assets.tvos.size' feed-artifact/manifest.json)"; TVOS_SHA="$(jq -er '.assets.tvos.sha256' feed-artifact/manifest.json)"
          LITE_NAME="$(jq -er '.assets.tvosLite.name' feed-artifact/manifest.json)"; LITE_SIZE="$(jq -er '.assets.tvosLite.size' feed-artifact/manifest.json)"; LITE_SHA="$(jq -er '.assets.tvosLite.sha256' feed-artifact/manifest.json)"
          MAC_NAME="$(jq -er '.assets.mac.name' feed-artifact/manifest.json)"; MAC_SIZE="$(jq -er '.assets.mac.size' feed-artifact/manifest.json)"; MAC_SHA="$(jq -er '.assets.mac.sha256' feed-artifact/manifest.json)"
          register_asset "$IOS_NAME" "out/$IOS_NAME" "$IOS_SIZE" "$IOS_SHA"; IOS_ID="$REGISTERED_ID"
          register_asset "$TVOS_NAME" "out/$TVOS_NAME" "$TVOS_SIZE" "$TVOS_SHA"; TVOS_ID="$REGISTERED_ID"
          register_asset "$LITE_NAME" "out/$LITE_NAME" "$LITE_SIZE" "$LITE_SHA"; LITE_ID="$REGISTERED_ID"
          register_asset "$MAC_NAME" "out/$MAC_NAME" "$MAC_SIZE" "$MAC_SHA"; MAC_ID="$REGISTERED_ID"
          register_asset "SHA256SUMS-ci.txt" out/SHA256SUMS-ci.txt "$(wc -c <out/SHA256SUMS-ci.txt | tr -d ' ')" "$(shasum -a 256 out/SHA256SUMS-ci.txt | awk '{print $1}')"; CHECKSUM_ID="$REGISTERED_ID"
          # Android must already have attached its complete, signed flavor set. This gate does not
          # build Android, but it prevents the Apple coordinator from publishing a partial release.
          VERSION="${TAG#v}"
          ANDROID_SUMS_ID="$(jq -er '.assets[] | select(.name == "SHA256SUMS-android.txt" and .state == "uploaded") | .id' <<<"$RELEASE_JSON")" || { echo "::error::Android checksum asset is missing; attach the Android draft artifacts before this coordinator"; exit 1; }
          gh api -H 'Accept: application/octet-stream' -- "repos/$GH_REPO/releases/assets/$ANDROID_SUMS_ID" > "$RUNNER_TEMP/SHA256SUMS-android.txt"
          for NAME in "VortX-$VERSION-full-mpv-universal.apk" "VortX-$VERSION-play-media3-universal.apk" "VortX-$VERSION-play-media3.aab"; do
            EXPECTED_SHA="$(awk -v name="$NAME" '$2 == name {print $1}' "$RUNNER_TEMP/SHA256SUMS-android.txt")"
            [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::Android checksum is missing or malformed for downloadable asset $NAME"; exit 1; }
            jq -e --arg name "$NAME" --arg sha "$EXPECTED_SHA" '.assets | map(select(.name == $name and .state == "uploaded" and ((.digest // "") | sub("^sha256:"; "") | ascii_downcase) == $sha)) | length == 1' <<<"$RELEASE_JSON" >/dev/null || { echo "::error::Android release asset does not match its checksum: $NAME"; exit 1; }
          done
          jq --arg rid "$RELEASE_ID" --arg iid "$IOS_ID" --arg tid "$TVOS_ID" --arg lid "$LITE_ID" --arg mid "$MAC_ID" \
            '.releaseId = $rid | .assets.ios.assetId = ($iid | tonumber) | .assets.tvos.assetId = ($tid | tonumber) | .assets.tvosLite.assetId = ($lid | tonumber) | .assets.mac.assetId = ($mid | tonumber) | .assets[] .state = "uploaded"' \
            feed-artifact/manifest.json > "$RUNNER_TEMP/receipt-manifest.json"
          # -n is load-bearing: every payload comes from --slurpfile/--rawfile. Without a
          # synthetic main input jq runs the filter zero times on Actions stdin and silently
          # writes a zero-byte receipt, which the coordinator correctly rejects with HTTP 503.
          jq -cn --slurpfile manifest "$RUNNER_TEMP/receipt-manifest.json" --rawfile source feed-artifact/source.json --rawfile appcast feed-artifact/appcast.json --rawfile checksum feed-artifact/SHA256SUMS-ci.txt \
            '{schemaVersion:2, action:"stage", manifest:$manifest[0], source:$source, appcast:$appcast, checksum:$checksum}' > "$RUNNER_TEMP/feed-receipt.json"
          RECEIPT_BYTES="$(wc -c <"$RUNNER_TEMP/feed-receipt.json" | tr -d ' ')"
          [ "$RECEIPT_BYTES" -gt 10000 ] || { echo "::error::receipt construction produced only $RECEIPT_BYTES bytes"; exit 1; }
          SIGNATURE="$(openssl dgst -sha256 -hmac "$RELEASE_FEED_RECEIPT_SECRET" -binary <"$RUNNER_TEMP/feed-receipt.json" | od -An -tx1 | tr -d ' \n')"
          RECEIPT_RESPONSE="$(curl --fail-with-body --connect-timeout 5 --max-time 20 -sS \
            -H 'Content-Type: application/json' -H "X-VortX-Receipt: sha256=$SIGNATURE" \
            --data-binary @"$RUNNER_TEMP/feed-receipt.json" https://vortx.tv/__release/receipt)"
          jq -e --arg generation "$(jq -er '.generation' feed-artifact/manifest.json)" '.staged == true and .generation == $generation' <<<"$RECEIPT_RESPONSE" >/dev/null
          for ASSET_ID_FILE in "$IOS_ID:out/$IOS_NAME" "$TVOS_ID:out/$TVOS_NAME" "$LITE_ID:out/$LITE_NAME" "$MAC_ID:out/$MAC_NAME" "$CHECKSUM_ID:out/SHA256SUMS-ci.txt"; do
            ASSET_ID="${ASSET_ID_FILE%%:*}"; FILE="${ASSET_ID_FILE#*:}"
            gh api -H 'Accept: application/octet-stream' -- "repos/$GH_REPO/releases/assets/$ASSET_ID" > "$RUNNER_TEMP/draft-$ASSET_ID"
            cmp -s "$FILE" "$RUNNER_TEMP/draft-$ASSET_ID" || { echo "::error::authenticated draft bytes differ for asset $ASSET_ID"; exit 1; }
          done
          {
            echo "FEED_GENERATION=$(jq -er '.generation' feed-artifact/manifest.json)"
            echo "IOS_ASSET_ID=$IOS_ID"; echo "TVOS_ASSET_ID=$TVOS_ID"; echo "LITE_ASSET_ID=$LITE_ID"; echo "MAC_ASSET_ID=$MAC_ID"; echo "CHECKSUM_ASSET_ID=$CHECKSUM_ID"
          } >> "$GITHUB_ENV"
          if [ "${{ inputs.publish_release }}" != true ]; then
            echo "draft release $RELEASE_ID is attached and feed generation $FEED_GENERATION is staged; publication remains an explicit final step"
            exit 0
          fi

      - name: Atomically activate the staged feed, prove routes, then publish last
        if: inputs.publish_release == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
          RELEASE_ID: ${{ steps.identity.outputs.release_id }}
          EXPECTED_ACTIVE: ${{ steps.identity.outputs.expected_active }}
          RELEASE_FEED_RECEIPT_SECRET: ${{ secrets.RELEASE_FEED_RECEIPT_SECRET }}
        run: |
          set -Eeuo pipefail
          PROMOTED=0
          SOURCE_COMMITTED=0
          ROLLBACK_FAILURE=0
          rollback_edge() {
            [ "$PROMOTED" = 1 ] || return 0
            local restore="$EXPECTED_ACTIVE"
            [ "$restore" = none ] && restore=none
            local body signature result
            body="$(jq -cn --arg generation "$FEED_GENERATION" --arg restore "$restore" '{action:"rollback",expectedCurrentGeneration:$generation,restoreGeneration:$restore}')"
            signature="$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$RELEASE_FEED_RECEIPT_SECRET" -binary | od -An -tx1 | tr -d ' \n')"
            result="$(curl --fail-with-body --connect-timeout 5 --max-time 20 -sS -H 'Content-Type: application/json' -H "X-VortX-Receipt: sha256=$signature" --data-binary "$body" https://vortx.tv/__release/receipt || true)"
            if ! jq -e --arg restore "$restore" '.rolledBack == true and .generation == (if $restore == "none" then "none" else $restore end)' <<<"$result" >/dev/null; then
              echo "::error::incident: edge rollback did not verify"
              ROLLBACK_FAILURE=1
              return 0
            fi
            if [ "$restore" = none ]; then
              for ROUTE in https://vortx.tv/altstore.json https://vortx.tv/vortx-altstore.json https://vortx.tv/appcast.json; do
                STATUS="$(curl -sS --connect-timeout 5 --max-time 15 -o /dev/null -w '%{http_code}' "$ROUTE" || true)"
                [ "$STATUS" = 503 ] || { echo "::error::incident: edge rollback did not return unavailable for $ROUTE"; ROLLBACK_FAILURE=1; }
              done
              return 0
            fi
            for ROUTE_FILE in \
              "https://vortx.tv/altstore.json|$PREVIOUS_EDGE_SOURCE_FILE" \
              "https://vortx.tv/vortx-altstore.json|$PREVIOUS_EDGE_SOURCE_FILE" \
              "https://vortx.tv/appcast.json|$PREVIOUS_EDGE_APPCAST_FILE"; do
              ROUTE="${ROUTE_FILE%%|*}"; EXPECTED_FILE="${ROUTE_FILE#*|}"; BODY="$RUNNER_TEMP/rollback-edge-body"; HEADERS="$RUNNER_TEMP/rollback-edge-headers"
              curl --fail-with-body --connect-timeout 5 --max-time 15 -sS -D "$HEADERS" "$ROUTE" -o "$BODY" || { echo "::error::incident: edge rollback route unavailable: $ROUTE"; ROLLBACK_FAILURE=1; continue; }
              cmp -s "$EXPECTED_FILE" "$BODY" || { echo "::error::incident: edge rollback bytes differ: $ROUTE"; ROLLBACK_FAILURE=1; }
              grep -Fqi "x-vortx-feed-generation: $restore" "$HEADERS" || { echo "::error::incident: edge rollback generation differs: $ROUTE"; ROLLBACK_FAILURE=1; }
              curl --fail-with-body --connect-timeout 5 --max-time 15 -sS -D "$HEADERS.query" "$ROUTE?rollback-verify=$restore" -o "$BODY.query" || { echo "::error::incident: edge rollback query unavailable: $ROUTE"; ROLLBACK_FAILURE=1; continue; }
              cmp -s "$EXPECTED_FILE" "$BODY.query" || { echo "::error::incident: edge rollback query bytes differ: $ROUTE"; ROLLBACK_FAILURE=1; }
              grep -Fqi "x-vortx-feed-generation: $restore" "$HEADERS.query" || { echo "::error::incident: edge rollback query generation differs: $ROUTE"; ROLLBACK_FAILURE=1; }
            done
          }
          commit_source_bytes() {
            local file="$1" message="$2" expected_head="${3:-}" main_head base_tree source_b64 blob_sha tree_sha commit_sha
            main_head="$(gh api --jq '.object.sha' -- "repos/$GH_REPO/git/ref/heads/main")"
            if [ -n "$expected_head" ] && [ "$main_head" != "$expected_head" ]; then
              echo "::error::main moved from the guarded head $expected_head to $main_head; refusing feed overwrite"
              return 1
            fi
            base_tree="$(gh api --jq '.tree.sha' -- "repos/$GH_REPO/git/commits/$main_head")"
            source_b64="$(base64 <"$file" | tr -d '\n')"
            blob_sha="$(jq -cn --arg content "$source_b64" '{content:$content,encoding:"base64"}' | gh api --method POST --input - --jq '.sha' -- "repos/$GH_REPO/git/blobs")"
            tree_sha="$(jq -cn --arg base "$base_tree" --arg blob "$blob_sha" '{base_tree:$base,tree:[{path:"altstore/source.json",mode:"100644",type:"blob",sha:$blob}]}' | gh api --method POST --input - --jq '.sha' -- "repos/$GH_REPO/git/trees")"
            commit_sha="$(jq -cn --arg message "$message" --arg tree "$tree_sha" --arg parent "$main_head" '{message:$message,tree:$tree,parents:[$parent]}' | gh api --method POST --input - --jq '.sha' -- "repos/$GH_REPO/git/commits")"
            jq -cn --arg sha "$commit_sha" '{sha:$sha,force:false}' | gh api --method PATCH --input - --jq '.object.sha' -- "repos/$GH_REPO/git/refs/heads/main" >/dev/null
            SOURCE_COMMITTED=1
          }
          rollback_source() {
            [ "$SOURCE_COMMITTED" = 1 ] || return 0
            local current current_ref current_head
            current="$RUNNER_TEMP/rollback-current-source.json"
            current_ref="$(gh api -- "repos/$GH_REPO/git/ref/heads/main" 2>/dev/null || true)"
            current_head="$(jq -er '.object.sha' <<<"$current_ref" 2>/dev/null || true)"
            gh api -- "repos/$GH_REPO/contents/altstore/source.json?ref=main" | jq -er '.content' | tr -d '\n' | base64 --decode > "$current" || { echo "::error::incident: cannot read current main source for rollback CAS"; ROLLBACK_FAILURE=1; return 0; }
            if cmp -s "$current" feed-artifact/source.json; then
              [ -n "$current_head" ] || { echo "::error::incident: current main ref is unavailable for rollback CAS"; ROLLBACK_FAILURE=1; return 0; }
              if ! commit_source_bytes "$PREVIOUS_SOURCE_FILE" "chore(release): restore verified install feed" "$current_head"; then
                echo "::error::incident: main-source rollback failed"
                ROLLBACK_FAILURE=1
              fi
            else
              echo "::error::source rollback CAS refused because main no longer contains the published feed bytes"
              ROLLBACK_FAILURE=1
            fi
            RAW_DEADLINE=$(($(date +%s) + 90)); RAW_RESTORED=0
            while [ "$(date +%s)" -lt "$RAW_DEADLINE" ]; do
              if curl --fail-with-body --connect-timeout 5 --max-time 15 -sS "https://raw.githubusercontent.com/$GH_REPO/main/altstore/source.json" -o "$RUNNER_TEMP/rollback-raw-source.json" && cmp -s "$PREVIOUS_SOURCE_FILE" "$RUNNER_TEMP/rollback-raw-source.json"; then RAW_RESTORED=1; break; fi
              sleep 5
            done
            [ "$RAW_RESTORED" = 1 ] || { echo "::error::incident: raw main source rollback did not verify"; ROLLBACK_FAILURE=1; }
          }
          rollback_release() {
            local current
            current="$(gh api -- "repos/$GH_REPO/releases/$RELEASE_ID" 2>/dev/null || true)"
            if [ -n "$current" ] && [ -n "${PUBLISHED_AT:-}" ] && jq -e --arg tag "$TAG" --arg published "$PUBLISHED_AT" --argjson prerelease "$IS_PRERELEASE" '.tag_name == $tag and .prerelease == $prerelease and .draft == false and .published_at == $published' <<<"$current" >/dev/null; then
              restored="$(gh api --method PATCH -f draft=true -- "repos/$GH_REPO/releases/$RELEASE_ID" 2>/dev/null || true)"
              jq -e --arg tag "$TAG" --argjson id "$RELEASE_ID" --argjson prerelease "$IS_PRERELEASE" '.id == $id and .tag_name == $tag and .prerelease == $prerelease and .draft == true' <<<"$restored" >/dev/null || { echo "::error::incident: GitHub could not restore release $RELEASE_ID to draft"; ROLLBACK_FAILURE=1; }
            elif [ -n "${PUBLISHED_AT:-}" ]; then
              echo "::error::incident: release rollback identity changed before restore"
              ROLLBACK_FAILURE=1
            fi
          }
          on_failure() {
            local status=$?
            if [ "$status" -ne 0 ]; then
              set +e
              rollback_edge
              rollback_source
              rollback_release
              set -e
              if [ "$ROLLBACK_FAILURE" = 1 ]; then
                echo "::error::incident: release rollback was incomplete; do not retry blindly"
              fi
            fi
            exit "$status"
          }
          trap on_failure EXIT
          # The draft asset API proof happened before staging. Do not fetch the
          # public download URLs yet: the release must remain a draft until the
          # main and edge state have both accepted the exact staged bytes.
          RELEASE_JSON="$(gh api -- "repos/$GH_REPO/releases/$RELEASE_ID")"
          jq -e --arg tag "$TAG" --argjson id "$RELEASE_ID" --argjson prerelease "$IS_PRERELEASE" '.id == $id and .tag_name == $tag and .prerelease == $prerelease and .draft == true' <<<"$RELEASE_JSON" >/dev/null
          for KEY_FILE in \
            "ios:out/VortX-iOS-$TAG-ci.ipa:$IOS_ASSET_ID" \
            "tvos:out/VortX-tvOS-$TAG-ci.ipa:$TVOS_ASSET_ID" \
            "tvosLite:out/VortX-tvOS-lite-$TAG-ci.ipa:$LITE_ASSET_ID" \
            "mac:out/VortX-macOS-$TAG-ci.dmg:$MAC_ASSET_ID"; do
            KEY="${KEY_FILE%%:*}"; REMAINDER="${KEY_FILE#*:}"; FILE="${REMAINDER%%:*}"; ASSET_ID="${REMAINDER#*:}"
            NAME="$(jq -er --arg key "$KEY" '.assets[$key].name' feed-artifact/manifest.json)"; URL="$(jq -er --arg key "$KEY" '.assets[$key].url' feed-artifact/manifest.json)"; SIZE="$(jq -er --arg key "$KEY" '.assets[$key].size' feed-artifact/manifest.json)"; SHA="$(jq -er --arg key "$KEY" '.assets[$key].sha256' feed-artifact/manifest.json)"
            API_DIGEST="$(jq -er --argjson id "$ASSET_ID" '.assets[] | select(.id == $id) | (.digest // "") | sub("^sha256:"; "") | ascii_downcase' <<<"$RELEASE_JSON")"
            API_SIZE="$(jq -er --argjson id "$ASSET_ID" '.assets[] | select(.id == $id) | .size' <<<"$RELEASE_JSON")"
            API_NAME="$(jq -er --argjson id "$ASSET_ID" '.assets[] | select(.id == $id) | .name' <<<"$RELEASE_JSON")"
            [ "$API_NAME" = "$NAME" ] && [ "$API_SIZE" = "$SIZE" ] && [ "$API_DIGEST" = "$SHA" ] || { echo "::error::release API asset metadata differs for $KEY"; exit 1; }
          done
          gh api -H 'Accept: application/octet-stream' -- "repos/$GH_REPO/releases/assets/$CHECKSUM_ASSET_ID" > "$RUNNER_TEMP/draft-checksums.txt"
          cmp -s out/SHA256SUMS-ci.txt "$RUNNER_TEMP/draft-checksums.txt" || { echo "::error::authenticated draft checksum bytes differ"; exit 1; }
          commit_source_bytes feed-artifact/source.json "chore(release): publish verified install feed" "$EXPECTED_MAIN_HEAD"
          OPERATION_ID="promote:$RELEASE_ID:$FEED_GENERATION"
          PROMOTE_BODY="$(jq -cn --arg oid "$OPERATION_ID" --arg rid "$RELEASE_ID" --arg generation "$FEED_GENERATION" --arg expected "$EXPECTED_ACTIVE" '{action:"promote",operationId:$oid,releaseId:$rid,generation:$generation,expectedActiveGeneration:(if $expected == "none" then null else $expected end)}')"
          PROMOTE_SIGNATURE="$(printf '%s' "$PROMOTE_BODY" | openssl dgst -sha256 -hmac "$RELEASE_FEED_RECEIPT_SECRET" -binary | od -An -tx1 | tr -d ' \n')"
          # Retry the EXACT same signed bytes on transport/5xx loss so a committed-but-unacknowledged
          # promotion is answered idempotently instead of being replayed as a new operation.
          PROMOTE_RESPONSE=""
          PROMOTE_STATUS=""
          PROMOTE_DEADLINE=$(($(date +%s) + 90))
          while [ "$(date +%s)" -lt "$PROMOTE_DEADLINE" ]; do
            PROMOTE_STATUS="$(curl --silent --show-error --connect-timeout 5 --max-time 20 -o "$RUNNER_TEMP/promote-body.json" -w '%{http_code}' -H 'Content-Type: application/json' -H "X-VortX-Receipt: sha256=$PROMOTE_SIGNATURE" --data-binary "$PROMOTE_BODY" https://vortx.tv/__release/receipt 2>/dev/null || true)"
            PROMOTE_RESPONSE="$(cat "$RUNNER_TEMP/promote-body.json" 2>/dev/null || true)"
            if [ "$PROMOTE_STATUS" = "200" ]; then break; fi
            case "$PROMOTE_STATUS" in
              400|404|409) break ;;
              *) sleep 10 ;;
            esac
          done
          [ "$PROMOTE_STATUS" = "200" ] || { echo "::error::promotion did not succeed (HTTP $PROMOTE_STATUS): $PROMOTE_RESPONSE"; exit 1; }
          jq -e --arg generation "$FEED_GENERATION" '.promoted == true and .generation == $generation' <<<"$PROMOTE_RESPONSE" >/dev/null
          PROMOTED=1
          DEADLINE=$(($(date +%s) + 270))
          verify_route() {
            local url="$1" expected_file="$2" body="$RUNNER_TEMP/route-body"
            [ "$(date +%s)" -lt "$DEADLINE" ] || return 1
            curl --fail-with-body --connect-timeout 5 --max-time 15 -sS -D "$RUNNER_TEMP/route-headers" "$url" -o "$body" || return 1
            grep -Eiq '^content-type: application/json' "$RUNNER_TEMP/route-headers" || return 1
            grep -Eiq '^cache-control: public, max-age=120, s-maxage=120, must-revalidate' "$RUNNER_TEMP/route-headers" || return 1
            ! grep -Eiq 'immutable|no-store' "$RUNNER_TEMP/route-headers" || return 1
            grep -Fqi "x-vortx-feed-generation: $FEED_GENERATION" "$RUNNER_TEMP/route-headers" || return 1
            cmp -s "$expected_file" "$body"
          }
          # The appcast worker derives a combined Apple+Android view from immutable release
          # assets, so its post-promotion bytes are intentionally not the staged Apple-only
          # appcast artifact. Verify the staged source routes here; the read-only verifier below
          # independently validates the worker's live combined result after publication.
          for ROUTE_FILE in "https://vortx.tv/altstore.json|feed-artifact/source.json" "https://vortx.tv/vortx-altstore.json|feed-artifact/source.json"; do
            ROUTE="${ROUTE_FILE%%|*}"; EXPECTED_FILE="${ROUTE_FILE#*|}"; VERIFIED=0
            while [ "$(date +%s)" -lt "$DEADLINE" ]; do
              if verify_route "$ROUTE" "$EXPECTED_FILE" && verify_route "$ROUTE?release-check=$FEED_GENERATION" "$EXPECTED_FILE"; then VERIFIED=1; break; fi
              sleep 15
            done
            [ "$VERIFIED" = 1 ] || { echo "::error::public route did not converge to exact generation $FEED_GENERATION: $ROUTE"; exit 1; }
          done
          MAIN_PUBLIC="$RUNNER_TEMP/public-source.json"
          MAIN_VERIFIED=0
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            if curl --fail-with-body --connect-timeout 5 --max-time 15 -sS "https://raw.githubusercontent.com/$GH_REPO/main/altstore/source.json" -o "$MAIN_PUBLIC" && cmp -s feed-artifact/source.json "$MAIN_PUBLIC"; then
              MAIN_VERIFIED=1
              break
            fi
            sleep 15
          done
          [ "$MAIN_VERIFIED" = 1 ] || { echo "::error::raw main source did not converge to the exact staged bytes"; exit 1; }
          # Final write: only now can the draft become externally installable.
          # Retrying is bounded and every readback binds the same immutable ID,
          # tag, and published timestamp before any public-asset proof starts.
          PUBLISH_DEADLINE=$(($(date +%s) + 90))
          PUBLISHED=0
          while [ "$(date +%s)" -lt "$PUBLISH_DEADLINE" ]; do
            if [ "$IS_PRERELEASE" = false ]; then
              gh api --method PATCH -f draft=false -F make_latest=true -- "repos/$GH_REPO/releases/$RELEASE_ID" >/dev/null || true
            else
              gh api --method PATCH -f draft=false -- "repos/$GH_REPO/releases/$RELEASE_ID" >/dev/null || true
            fi
            RELEASE_JSON="$(gh api -- "repos/$GH_REPO/releases/$RELEASE_ID" 2>/dev/null || true)"
            LATEST_JSON='{}'
            if [ "$IS_PRERELEASE" = false ]; then LATEST_JSON="$(gh api -- "repos/$GH_REPO/releases/latest" 2>/dev/null || true)"; fi
            if [ -n "$RELEASE_JSON" ] && jq -e --arg tag "$TAG" --argjson id "$RELEASE_ID" --argjson prerelease "$IS_PRERELEASE" --argjson latest "$LATEST_JSON" '.id == $id and .tag_name == $tag and .prerelease == $prerelease and .draft == false and .published_at != null and (if $prerelease then true else ($latest.id == $id and $latest.tag_name == $tag) end)' <<<"$RELEASE_JSON" >/dev/null; then
              PUBLISHED_AT="$(jq -er '.published_at' <<<"$RELEASE_JSON")"
              PUBLISHED=1
              break
            fi
            sleep 5
          done
          [ "$PUBLISHED" = 1 ] || { echo "::error::release:published did not converge for immutable release $RELEASE_ID"; exit 1; }
          # Post-publication checks are read-only. They use the API-bound
          # release JSON plus the public CDN bytes and never mutate a feed.
          for KEY_FILE in \
            "ios:out/VortX-iOS-$TAG-ci.ipa" \
            "tvos:out/VortX-tvOS-$TAG-ci.ipa" \
            "tvosLite:out/VortX-tvOS-lite-$TAG-ci.ipa" \
            "mac:out/VortX-macOS-$TAG-ci.dmg"; do
            KEY="${KEY_FILE%%:*}"; FILE="${KEY_FILE#*:}"
            URL="$(jq -er --arg key "$KEY" '.assets[$key].url' feed-artifact/manifest.json)"; SIZE="$(jq -er --arg key "$KEY" '.assets[$key].size' feed-artifact/manifest.json)"; SHA="$(jq -er --arg key "$KEY" '.assets[$key].sha256' feed-artifact/manifest.json)"
            curl --fail-with-body --connect-timeout 5 --max-time 30 --retry 2 --retry-delay 2 -sS -L "$URL" -o "$RUNNER_TEMP/public-$KEY"
            cmp -s "$FILE" "$RUNNER_TEMP/public-$KEY" || { echo "::error::public asset bytes differ for $KEY"; exit 1; }
            [ "$(wc -c <"$RUNNER_TEMP/public-$KEY" | tr -d ' ')" = "$SIZE" ] || { echo "::error::public asset size differs for $KEY"; exit 1; }
            [ "$(shasum -a 256 "$RUNNER_TEMP/public-$KEY" | awk '{print $1}')" = "$SHA" ] || { echo "::error::public asset digest differs for $KEY"; exit 1; }
          done
          curl --fail-with-body --connect-timeout 5 --max-time 30 --retry 2 --retry-delay 2 -sS -L "https://github.com/$GH_REPO/releases/download/$TAG/SHA256SUMS-ci.txt" -o "$RUNNER_TEMP/public-checksums.txt"
          cmp -s out/SHA256SUMS-ci.txt "$RUNNER_TEMP/public-checksums.txt" || { echo "::error::public checksum bytes differ from the trusted local checksum file"; exit 1; }
          trap - EXIT
          echo "promoted feed generation $FEED_GENERATION, verified public/raw bytes, then published release $RELEASE_ID and completed read-only postchecks"

  # A published release is verification and recovery only. GitHub deliberately suppresses a new
  # `release: published` event when this workflow publishes with GITHUB_TOKEN, so the dispatch
  # publication path runs this same read-only verifier downstream from attach-release. External
  # published-release events continue to use their immutable event payload. Neither path attaches
  # assets, mutates main, promotes a feed, or republishes.
  verify-published:
    needs: [attach-release]
    if: >-
      always() && (
        github.event_name == 'release' ||
        (github.event_name == 'workflow_dispatch' &&
        inputs.publish_release == true &&
        needs.attach-release.result == 'success')
      )
    concurrency:
      group: vortx-release-verify-${{ github.event.release.id || needs.attach-release.outputs.release_id }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 12
    steps:
      - name: Wait for the immutable published release to become readable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ github.event.release.id || needs.attach-release.outputs.release_id }}
          EVENT_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          [ "$RELEASE_ID" -gt 0 ] || { echo "::error::published event has no immutable release ID"; exit 1; }
          IS_PRERELEASE=false; [[ "$EVENT_TAG" == *-* ]] && IS_PRERELEASE=true
          READ_DEADLINE=$(($(date +%s) + 90))
          READY=0
          while [ "$(date +%s)" -lt "$READ_DEADLINE" ]; do
            RELEASE_JSON="$(gh api -- "repos/$GH_REPO/releases/$RELEASE_ID" 2>/dev/null || true)"
            LATEST_JSON='{}'
            if [ "$IS_PRERELEASE" = false ]; then LATEST_JSON="$(gh api -- "repos/$GH_REPO/releases/latest" 2>/dev/null || true)"; fi
            if [ -n "$RELEASE_JSON" ] && jq -e --arg tag "$EVENT_TAG" --argjson id "$RELEASE_ID" --argjson prerelease "$IS_PRERELEASE" --argjson latest "$LATEST_JSON" '.id == $id and .tag_name == $tag and .prerelease == $prerelease and .draft == false and .published_at != null and (if $prerelease then true else ($latest.id == $id and $latest.tag_name == $tag) end)' <<<"$RELEASE_JSON" >/dev/null; then
              READY=1
              break
            fi
            sleep 5
          done
          [ "$READY" = 1 ] || { echo "::error::release:published did not become readable for immutable release $RELEASE_ID"; exit 1; }
      - name: Verify the immutable published release and public feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ github.event.release.id || needs.attach-release.outputs.release_id }}
          EVENT_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          [ "$RELEASE_ID" -gt 0 ] || { echo "::error::published event has no immutable release ID"; exit 1; }
          RELEASE_JSON="$(gh api -- "repos/$GH_REPO/releases/$RELEASE_ID")"
          IS_PRERELEASE=false; [[ "$EVENT_TAG" == *-* ]] && IS_PRERELEASE=true
          LATEST_JSON='{}'
          if [ "$IS_PRERELEASE" = false ]; then LATEST_JSON="$(gh api -- "repos/$GH_REPO/releases/latest")"; fi
          jq -e --arg tag "$EVENT_TAG" --argjson id "$RELEASE_ID" --argjson prerelease "$IS_PRERELEASE" --argjson latest "$LATEST_JSON" '.id == $id and .tag_name == $tag and .prerelease == $prerelease and .draft == false and .published_at != null and (if $prerelease then true else ($latest.id == $id and $latest.tag_name == $tag) end)' <<<"$RELEASE_JSON" >/dev/null || { echo "::error::release ID/tag/latest identity changed or release was recreated"; exit 1; }
          REF_JSON="$(gh api -- "repos/$GH_REPO/git/ref/tags/$EVENT_TAG")"
          TAG_SHA="$(jq -r '.object.sha' <<<"$REF_JSON")"; TAG_TYPE="$(jq -r '.object.type' <<<"$REF_JSON")"; HOPS=0
          while [ "$TAG_TYPE" = tag ]; do HOPS=$((HOPS + 1)); [ "$HOPS" -le 5 ] || exit 1; TAG_OBJECT="$(gh api -- "repos/$GH_REPO/git/tags/$TAG_SHA")"; TAG_SHA="$(jq -r '.object.sha' <<<"$TAG_OBJECT")"; TAG_TYPE="$(jq -r '.object.type' <<<"$TAG_OBJECT")"; done
          [ "$TAG_TYPE" = commit ] || { echo "::error::published tag does not resolve to a commit"; exit 1; }
          curl --fail-with-body --connect-timeout 5 --max-time 15 -sS -D "$RUNNER_TEMP/appcast.headers" https://vortx.tv/appcast.json -o "$RUNNER_TEMP/appcast.json"
          grep -Eiq '^content-type: application/json' "$RUNNER_TEMP/appcast.headers" || exit 1
          grep -Eiq '^cache-control: public, max-age=120, s-maxage=120, must-revalidate' "$RUNNER_TEMP/appcast.headers" || exit 1
          grep -Eiq '^x-vortx-feed-generation: .+' "$RUNNER_TEMP/appcast.headers" || exit 1
