name: diag-receipt

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  repair-publication:
    runs-on: ubuntu-latest
    environment: release-approval
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Stage, promote, prove, and publish Beta 26.2 build 228
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_FEED_RECEIPT_SECRET: ${{ secrets.RELEASE_FEED_RECEIPT_SECRET }}
          EXPECTED_ACTIVE: v0.3.14-beta.26.2:228:4cf6c804f828126b2fdfe5ff5767382d5ca10414db48f0814aa54b8e1e5e9ce4
        run: |
          set -euo pipefail
          [ -n "${RELEASE_FEED_RECEIPT_SECRET:-}" ] || { echo "::error::secret missing"; exit 1; }
          GEN=$(jq -er '.generation' regen-feed/manifest.json)
          RELEASE_ID=$(jq -er '.releaseId' regen-feed/manifest.json)
          echo "generation=$GEN releaseId=$RELEASE_ID"
          IOS_ID=$(gh api repos/VortXTV/VortX/releases/375254899 --jq '.assets[]|select(.name=="VortX-iOS-v0.3.14-beta.26.2-ci.ipa")|.id')
          TVOS_ID=$(gh api repos/VortXTV/VortX/releases/375254899 --jq '.assets[]|select(.name=="VortX-tvOS-v0.3.14-beta.26.2-ci.ipa")|.id')
          LITE_ID=$(gh api repos/VortXTV/VortX/releases/375254899 --jq '.assets[]|select(.name=="VortX-tvOS-lite-v0.3.14-beta.26.2-ci.ipa")|.id')
          MAC_ID=$(gh api repos/VortXTV/VortX/releases/375254899 --jq '.assets[]|select(.name=="VortX-macOS-v0.3.14-beta.26.2-ci.dmg")|.id')
          CHECKSUM_ID=$(gh api repos/VortXTV/VortX/releases/375254899 --jq '.assets[]|select(.name=="SHA256SUMS-ci.txt")|.id')
          echo "assetIds ios=$IOS_ID tvos=$TVOS_ID lite=$LITE_ID mac=$MAC_ID checksum=$CHECKSUM_ID"
          jq --arg rid "$RELEASE_ID" --arg iid "$IOS_ID" --arg tid "$TVOS_ID" --arg lid "$LITE_ID" --arg mid "$MAC_ID" '.releaseId = $rid | .assets.ios.assetId = ($iid | tonumber) | .assets.tvos.assetId = ($tid | tonumber) | .assets.tvosLite.assetId = ($lid | tonumber) | .assets.mac.assetId = ($mid | tonumber) | .assets[] .state = "uploaded"' regen-feed/manifest.json > receipt-manifest.json
          # -n is REQUIRED: without a main input jq reads stdin and runs the filter zero times
          jq -cn --slurpfile manifest receipt-manifest.json --rawfile source regen-feed/source.json --rawfile appcast regen-feed/appcast.json --rawfile checksum regen-feed/SHA256SUMS-ci.txt '{schemaVersion:2, action:"stage", manifest:$manifest[0], source:$source, appcast:$appcast, checksum:$checksum}' > ../feed-receipt.json
          BYTES=$(wc -c < feed-receipt.json | tr -d ' ')
          echo "receiptBytes=$BYTES"
          [ "$BYTES" -gt 10000 ] || { echo "::error::receipt construction produced empty output"; exit 1; }
          SIGNATURE="$(openssl dgst -sha256 -hmac "$RELEASE_FEED_RECEIPT_SECRET" -binary < feed-receipt.json | od -An -tx1 | tr -d ' \n')"
          CODE="$(curl -sS --connect-timeout 5 --max-time 30 -o stage-body.json -w '%{http_code}' -H 'Content-Type: application/json' -H "X-VortX-Receipt: sha256=$SIGNATURE" --data-binary @feed-receipt.json https://vortx.tv/__release/receipt || true)"
          echo "STAGE_HTTP_STATUS=$CODE"
          jq -c '{staged, error, message, generation}' stage-body.json || head -c 600 stage-body.json
          [ "$CODE" = "200" ] || { echo "::error::stage did not succeed"; exit 1; }
          jq -e --arg g "$GEN" '.staged == true and .generation == $g' stage-body.json >/dev/null || { echo "::error::stage response mismatch"; exit 1; }
          echo "== staging confirmed; promoting =="
          OPERATION_ID="repair-$(openssl rand -hex 12)"
          PROMOTE_BODY="$(jq -cn --arg oid "$OPERATION_ID" --arg rid "$RELEASE_ID" --arg g "$GEN" --arg e "$EXPECTED_ACTIVE" '{action:"promote",operationId:$oid,releaseId:$rid,generation:$g,expectedActiveGeneration:$e}')"
          PROMOTE_SIGNATURE="$(printf '%s' "$PROMOTE_BODY" | openssl dgst -sha256 -hmac "$RELEASE_FEED_RECEIPT_SECRET" -binary | od -An -tx1 | tr -d ' \n')"
          PCODE="$(curl -sS --connect-timeout 5 --max-time 30 -o promote-body.json -w '%{http_code}' -H 'Content-Type: application/json' -H "X-VortX-Receipt: sha256=$PROMOTE_SIGNATURE" --data-binary "$PROMOTE_BODY" https://vortx.tv/__release/receipt || true)"
          echo "PROMOTE_HTTP_STATUS=$PCODE"
          jq -c '.' promote-body.json || head -c 600 promote-body.json
          [ "$PCODE" = "200" ] || { echo "::error::promote did not succeed"; exit 1; }
          echo "== proving edge routes =="
          OK=0
          for i in $(seq 1 12); do
            H="$(curl -sS --connect-timeout 5 --max-time 15 -D - -o /tmp/route-body.json https://vortx.tv/appcast.json | grep -i '^x-vortx-feed-generation:' | tr -d '\r' | awk '{print $2}')"
            echo "[$i] active=$H"
            if [ "$H" = "$GEN" ]; then OK=1; break; fi
            sleep 5
          done
          [ "$OK" = 1 ] || { echo "::error::edge did not serve generation $GEN"; exit 1; }
          curl -sS https://vortx.tv/altstore.json | jq -e '.apps[0].version == "0.3.14"' >/dev/null || { echo "::error::altstore route sanity failed"; exit 1; }
          echo "edge routes proven for generation $GEN"
          echo "== publishing draft release last =="
          gh api --method PATCH repos/VortXTV/VortX/releases/375254899 -f draft=false -f prerelease=true --jq '{id,tag_name,draft,prerelease,html_url}'

      - name: Commit altstore/source.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main "https://x-access-token:${GH_TOKEN}@github.com/VortXTV/VortX.git" repo
          cd repo
          cp "$GITHUB_WORKSPACE/regen-feed/source.json" altstore/source.json
          if git diff --quiet altstore/source.json; then echo "altstore/source.json already current"; exit 0; fi
          git config user.name "mamaclapper"
          git config user.email "50227842+mamaclapper@users.noreply.github.com"
          git add altstore/source.json
          git commit -m "Update AltStore source for Beta 26 build 228 (v0.3.14-beta.26.2)"
          git push origin main
          echo "altstore/source.json committed"
