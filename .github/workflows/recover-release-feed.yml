name: Recover published release feed

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Existing public Build 301 release ID
        required: true
        type: string
      release_tag:
        description: Existing public Build 301 release tag
        required: true
        type: string
      generation:
        description: Exact reviewed Build 301 target generation
        required: true
        type: string
      expected_active_generation:
        description: Exact Build 285 predecessor generation
        required: true
        type: string
      source_commit:
        description: Immutable Build 301 source commit
        required: true
        type: string

permissions: {}

concurrency:
  group: vortx-published-feed-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.repository == 'VortXTV/VortX' &&
      github.repository_id == '1261501126' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/tags/v0.5.6-ops-feed301-20261116' &&
      github.actor == 'mamaclapper' &&
      github.triggering_actor == 'mamaclapper' &&
      github.run_attempt == '1' &&
      inputs.release_id == '446921868' &&
      inputs.release_tag == 'v0.5.6-beta.15' &&
      inputs.generation == 'v0.5.6-beta.15:301:9b5d98edbb135958738be10ca7bf3619fa3e7592c9b81953448ae7c839e15310' &&
      inputs.expected_active_generation == 'v0.5.6-beta.13:285:f1880ad0551005ecd7ff55228513595ac18810a8c72118ea491a2cb99e4aea43' &&
      inputs.source_commit == '44c1fe53ed4012561f5326baba6e2d5951af18d4'
    runs-on: ubuntu-24.04
    environment: release-approval
    permissions:
      actions: read
      contents: write
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact Build 301 and promote the published update feed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_FEED_RECEIPT_SECRET: ${{ secrets.RELEASE_FEED_RECEIPT_SECRET }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GENERATION: ${{ inputs.generation }}
          EXPECTED_ACTIVE_GENERATION: ${{ inputs.expected_active_generation }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RELEASE_FEED_RECEIPT_SECRET:-}"
          printf '::add-mask::%s\n' "$RELEASE_FEED_RECEIPT_SECRET"
          python3 scripts/promote-feed-301.py
