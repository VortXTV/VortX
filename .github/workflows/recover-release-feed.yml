name: Recover published release feed

on:
  workflow_dispatch:
    inputs:
      plan_sha256:
        description: Independently reviewed immutable stable feed operation plan
        required: true
        type: string

permissions: {}

concurrency:
  group: vortx-published-feed-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.repository == 'VortXTV/VortX' &&
      github.repository_id == '1261501126' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/tags/v0.5.7-ops-combined-feed-20261117' &&
      github.actor == 'mamaclapper' &&
      github.triggering_actor == 'mamaclapper' &&
      github.run_attempt == '1' &&
      inputs.plan_sha256 == '6bdc67ddc500a1c3e0c799dcee6584947f8fa10bdd8afb3b76e75bd0fcd3d0c9'
    runs-on: ubuntu-24.04
    environment: release-approval
    permissions:
      actions: read
      contents: write
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Publish verified Build 302 and promote the complete stable update feed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_FEED_RECEIPT_SECRET: ${{ secrets.RELEASE_FEED_RECEIPT_SECRET }}
          REVIEWED_PLAN_SHA256: '6bdc67ddc500a1c3e0c799dcee6584947f8fa10bdd8afb3b76e75bd0fcd3d0c9'
          DISPATCH_PLAN_SHA256: ${{ inputs.plan_sha256 }}
        run: python3 -I -B scripts/stable-057-feed.py finalize

      - name: Retain public-only promotion evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VortX-Stable-057-Combined-Feed-Receipt
          path: ${{ runner.temp }}/stable-057-feed-result.json
          if-no-files-found: error
          retention-days: 90
