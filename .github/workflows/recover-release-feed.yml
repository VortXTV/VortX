name: Recover exact VortX stable Apple draft attachment

on:
  workflow_dispatch:
    inputs:
      plan_sha256:
        description: Independently reviewed stable Apple attachment plan
        required: true
        type: string

permissions: {}

concurrency:
  group: vortx-stable-057-draft-attachment
  cancel-in-progress: false

jobs:
  attach:
    if: >-
      github.repository == 'VortXTV/VortX' &&
      github.repository_id == '1261501126' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/tags/v0.5.7-ops-attach-20261117' &&
      github.actor == 'mamaclapper' &&
      github.triggering_actor == 'mamaclapper' &&
      github.run_attempt == '1' &&
      inputs.plan_sha256 == '9256da7e28caa1c925c153c29f1d6b31515daebc13b95ee54b22614575ae20e6'
    runs-on: ubuntu-24.04
    environment: release-approval
    permissions:
      actions: read
      contents: write
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Attach and authenticate the five original Apple draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_PLAN_SHA256: '9256da7e28caa1c925c153c29f1d6b31515daebc13b95ee54b22614575ae20e6'
          DISPATCH_PLAN_SHA256: ${{ inputs.plan_sha256 }}
        run: python3 -I -B scripts/stable-057-attach.py attach

      - name: Retain exact authenticated draft attachment receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VortX-Stable-057-Apple-Attachment-Receipt
          path: ${{ runner.temp }}/attachment.json
          if-no-files-found: error
          retention-days: 90
