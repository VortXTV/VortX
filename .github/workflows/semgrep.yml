name: Semgrep

# Pattern-based SAST covering the compiled apps that CodeQL cannot analyze in this repo without a
# full build: Swift (the Apple apps, which would need Xcode + the private engine) and Kotlin (the
# Android app, which CodeQL cannot extract in build-mode: none). A general security ruleset covers
# the rest of the tree. Findings are uploaded to code scanning as their own tool; the scan never
# fails the build (finding triage happens in the code-scanning UI, not as a red X).

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
  schedule:
    - cron: "0 7 * * 2"   # weekly, Tuesdays 07:00 UTC

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Semgrep
        run: pipx install semgrep

      - name: Scan (Swift + Kotlin + general security rules)
        run: |
          set -euo pipefail
          semgrep scan \
            --config p/swift \
            --config p/kotlin \
            --config p/security-audit \
            --sarif --output semgrep.sarif \
            --timeout 300 --metrics off
          # Findings remain advisory; an aborted scan or missing report must fail visibly.
          test -s semgrep.sarif

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep
