name: Release Android

# Proof-only rerun for the frozen Build 295 app. The signed package job already ran in the
# original candidate workflow. This overlay has no signing, private-engine, or release job.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact frozen Android artifact candidate to verify
        required: true
        type: string
      publish_release:
        description: Must be false for this proof-only operation
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  tools-instrumentation:
    name: Verify recovery Tools on phone and Google TV emulators
    if: >-
      github.repository == 'VortXTV/VortX' &&
      github.ref == 'refs/tags/vortx-android-b295-tools-dpad-20261115' &&
      inputs.release_tag == 'v0.5.6-beta.14-candidate.4' &&
      inputs.publish_release == false
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      APP_SOURCE: 7b7bbf00de25f90c1e6dee167372d3d0e0c58e05
      TOOLS_TEST_CLASS: com.vortx.android.ui.profilepicker.ProfilePickerToolsHostTest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Bind the workflow and UI fixture to the frozen app source
        id: source_binding
        run: |
          set -euo pipefail
          workflow=.github/workflows/android-release.yml
          fixture=android/app/src/androidTest/kotlin/com/vortx/android/ui/profilepicker/ProfilePickerToolsHostTest.kt
          test "$(git rev-parse HEAD^{commit})" = "$GITHUB_SHA"
          test "$(git show -s --format=%P HEAD)" = "$APP_SOURCE"
          actual="$(git diff --name-status --no-renames "$APP_SOURCE" HEAD | LC_ALL=C sort)"
          expected="$(printf 'M\t%s\nM\t%s\n' "$workflow" "$fixture" | LC_ALL=C sort)"
          test "$actual" = "$expected"
          test -z "$(git status --porcelain)"
          mkdir "$RUNNER_TEMP/tools-empty-engine"
          test ! -e "$RUNNER_TEMP/tools-empty-engine/Cargo.toml"
          echo "VORTX_ENGINE_CORE_DIR=$RUNNER_TEMP/tools-empty-engine" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0 cmake;4.1.2"

      - name: Set up Gradle without shared build caches
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Prepare isolated phone and Google TV emulators
        timeout-minutes: 12
        run: |
          set -euo pipefail
          phone_image='system-images;android-35;google_apis;x86_64'
          tv_image='system-images;android-36;google-tv;x86_64'
          sdkmanager --install emulator "$phone_image" "$tv_image" "ndk;30.0.16248370"
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          avd_root="$(mktemp -d "$RUNNER_TEMP/tools-android.XXXXXXXX")"
          export ANDROID_USER_HOME="$avd_root/user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          make_avd() {
            local avd="$1" image="$2" device="$3"
            avdmanager create avd --name "$avd" --package "$image" --device "$device" \
              --path "$ANDROID_AVD_HOME/$avd.avd" </dev/null
            test -s "$ANDROID_AVD_HOME/$avd.avd/config.ini"
            test -s "$ANDROID_AVD_HOME/$avd.ini"
            grep -Fxq "path=$ANDROID_AVD_HOME/$avd.avd" "$ANDROID_AVD_HOME/$avd.ini"
          }
          make_avd vortx-tools-phone "$phone_image" pixel_2
          make_avd vortx-tools-tv "$tv_image" tv_1080p
          listed_avds="$("$ANDROID_HOME/emulator/emulator" -list-avds)"
          grep -Fxq vortx-tools-phone <<<"$listed_avds"
          grep -Fxq vortx-tools-tv <<<"$listed_avds"
          printf 'ANDROID_USER_HOME=%s\nANDROID_AVD_HOME=%s\n' "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME" >> "$GITHUB_ENV"

      - name: Build and verify the single synthetic app and Tools fixture pair
        id: fixture_assemble
        timeout-minutes: 16
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew :app:assemblePlayDebug :app:assemblePlayDebugAndroidTest \
            --no-daemon --max-workers=1 --no-build-cache
          shopt -s nullglob
          app_apks=(app/build/outputs/apk/play/debug/*.apk)
          test_apks=(app/build/outputs/apk/androidTest/play/debug/*.apk)
          test "${#app_apks[@]}" = 1 && test "${#test_apks[@]}" = 1
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          app_badging="$("$aapt" dump badging "${app_apks[0]}")"
          test_badging="$("$aapt" dump badging "${test_apks[0]}")"
          grep -Eq "^package: name='com.vortx.android' versionCode='295' versionName='0.5.6'" <<<"$app_badging"
          grep -Eq "^package: name='com.vortx.android.test' " <<<"$test_badging"
          printf 'TOOLS_APP_APK=%s/%s\nTOOLS_TEST_APK=%s/%s\n' "$PWD" "${app_apks[0]}" "$PWD" "${test_apks[0]}" >> "$GITHUB_ENV"
          python3 -I - <<'PYTEST'
          import os
          import re
          from pathlib import Path

          suite = os.environ["TOOLS_TEST_CLASS"]
          fixture = Path("app/src/androidTest/kotlin") / (suite.replace(".", "/") + ".kt")
          source = fixture.read_text()
          methods = re.findall(r"^[ \t]*@Test\s+fun\s+([A-Za-z_][A-Za-z0-9_]*)\s*\(", source, re.M)
          tv = sorted(name for name in methods if name.startswith("television"))
          phone = sorted(set(methods) - set(tv))
          if len(methods) != 9 or len(re.findall(r"^[ \t]*@Test\b", source, re.M)) != 9 or len(tv) != 2 or len(phone) != 7:
              raise SystemExit("Expected two television tests and seven phone or general tests")
          for lane, names in (("phone", phone), ("tv", tv)):
              path = Path(os.environ["RUNNER_TEMP"]) / f"tools-{lane}-filter"
              path.write_text(",".join(f"{suite}#{name}" for name in names) + "\n")
          PYTEST

      - name: Prepare the bounded direct instrumentation runner
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/run-tools-fixture" <<'BASH'
          set -euo pipefail
          lane="$1"
          avd="$2"
          api="$3"
          port="$4"
          export ANDROID_SERIAL="emulator-$port"
          test -s "$ANDROID_AVD_HOME/$avd.ini"
          "$ANDROID_HOME/emulator/emulator" -avd "$avd" -port "$port" -accel on -gpu swiftshader \
            -no-window -no-audio -no-boot-anim -no-snapshot > "$RUNNER_TEMP/tools-$lane-emulator.log" 2>&1 &
          emulator_pid=$!
          finish_emulator() {
            local saved_status=$?
            trap - EXIT
            {
              timeout 8s adb logcat -d -v brief -b crash -t 60 AndroidRuntime:E '*:S' || true
              timeout 8s adb logcat -d -v brief -b main -t 100 TestRunner:I AndroidJUnitRunner:I InstrResultPrinter:I Instrumentation:E '*:S' || true
            } > "$RUNNER_TEMP/tools-$lane-logcat.txt" 2>&1
            timeout 10s adb emu kill >/dev/null 2>&1 || kill "$emulator_pid" 2>/dev/null || true
            # Wait briefly for this instance to release its serial and console port before the next lane.
            for attempt in 1 2 3 4 5; do
              if ! kill -0 "$emulator_pid" 2>/dev/null; then break; fi
              sleep 1
            done
            if kill -0 "$emulator_pid" 2>/dev/null; then kill "$emulator_pid" 2>/dev/null || true; fi
            exit "$saved_status"
          }
          trap finish_emulator EXIT
          if ! timeout 240s bash -c '
            set -euo pipefail
            while kill -0 "$1" 2>/dev/null; do
              ready="$(timeout 5s adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r" || true)"
              if [ "$ready" = 1 ]; then exit 0; fi
              sleep 2
            done
            exit 1
          ' _ "$emulator_pid"; then
            tail -n 25 "$RUNNER_TEMP/tools-$lane-emulator.log"
            exit 1
          fi
          test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = "$api"
          test "$(adb shell getprop ro.product.cpu.abi | tr -d '\r')" = x86_64
          features="$(adb shell pm list features | tr -d '\r')"
          if [[ "$lane" == tv ]]; then
            grep -Fxq 'feature:android.software.leanback' <<<"$features"
          else
            ! grep -Fxq 'feature:android.software.leanback' <<<"$features"
          fi
          adb shell input keyevent 82
          adb shell cmd connectivity airplane-mode enable
          adb shell svc wifi disable
          if [[ "$lane" == phone ]]; then adb shell svc data disable; fi
          timeout 60s adb install -t "$TOOLS_APP_APK"
          timeout 60s adb install -t "$TOOLS_TEST_APK"
          expected_runner='com.vortx.android.test/androidx.test.runner.AndroidJUnitRunner'
          instrumentations="$(timeout 10s adb shell pm list instrumentation com.vortx.android | tr -d '\r')"
          grep -Fxq "instrumentation:$expected_runner (target=com.vortx.android)" <<<"$instrumentations"
          test_filter="$(cat "$RUNNER_TEMP/tools-$lane-filter")"
          test -n "$test_filter"
          status=0
          timeout 300s adb shell am instrument -w -r -e class "$test_filter" "$expected_runner" \
            > "$RUNNER_TEMP/tools-$lane-instrumentation.txt" 2>&1 || status=$?
          printf '%s\n' "$status" > "$RUNNER_TEMP/tools-$lane-status"
          exit "$status"
          BASH

      - name: Run seven phone and general Tools tests
        id: phone
        timeout-minutes: 13
        run: bash "$RUNNER_TEMP/run-tools-fixture" phone vortx-tools-phone 35 5554

      - name: Run two Tools D-pad tests on a Google TV
        id: tv
        if: ${{ !cancelled() && steps.fixture_assemble.outcome == 'success' }}
        timeout-minutes: 13
        run: bash "$RUNNER_TEMP/run-tools-fixture" tv vortx-tools-tv 36 5556

      - name: Verify and retain separate phone and Google TV Tools results
        if: always()
        env:
          TOOLS_PHONE_OUTCOME: ${{ steps.phone.outcome }}
          TOOLS_TV_OUTCOME: ${{ steps.tv.outcome }}
          TOOLS_BIND_OUTCOME: ${{ steps.source_binding.outcome }}
        run: |
          set -euo pipefail
          proof_status=0
          for TOOLS_LANE in phone tv; do
            export TOOLS_LANE
            python3 -I - <<'PYTEST' || proof_status=1
          import hashlib
          import json
          import os
          import re
          from collections import Counter
          from pathlib import Path

          lane = os.environ["TOOLS_LANE"]
          suite = os.environ["TOOLS_TEST_CLASS"]
          tmp = Path(os.environ["RUNNER_TEMP"])
          source_path = Path("android/app/src/androidTest/kotlin") / (suite.replace(".", "/") + ".kt")
          source = source_path.read_bytes() if source_path.is_file() else b""
          all_names = {name.decode() for name in re.findall(rb"^[ \t]*@Test\s+fun\s+(\w+)\s*\(", source, re.M)}
          tv = {name for name in all_names if name.startswith("television")}
          expected = tv if lane == "tv" else all_names - tv
          expected_count = 2 if lane == "tv" else 7
          emulator = "Google TV API 36 x86_64" if lane == "tv" else "Phone Google APIs 35 x86_64"
          issues = []
          if len(all_names) != 9 or len(expected) != expected_count or len(re.findall(rb"^[ \t]*@Test\b", source, re.M)) != 9:
              issues.append("Frozen app fixture overlay does not contain the exact phone and TV rosters")

          def clean(line):
              line = re.sub(r"[\x00-\x1f\x7f]", " ", line.strip()).replace("::", ":")
              line = re.sub(r"(?:https?|file|content)://[^\s<>()]+", "[URL]", line, flags=re.I)
              line = re.sub(r"[\w.+-]+@[\w.-]+\.[a-z]{2,}", "[EMAIL]", line, flags=re.I)
              line = re.sub(r"\b(?:Bearer|Basic)\s+[A-Za-z0-9+/_.=-]+", "[AUTH]", line, flags=re.I)
              line = re.sub(r"\b(?:token|password|credential|secret|key|authorization)\s*[:=]\s*\S+", "[REDACTED]", line, flags=re.I)
              line = re.sub(r"\b[A-Za-z0-9_-]{16,}(?:\.[A-Za-z0-9_-]{16,}){2}\b", "[TOKEN]", line)
              line = re.sub(r"/(?:home/runner|data/(?:user|app))[/\w.+-]*", "[PATH]", line)
              return line[:280]

          def read_bounded(file, limit):
              if not file.is_file():
                  return b""
              with file.open("rb") as stream:
                  return stream.read(limit+1)

          raw = read_bounded(tmp / f"tools-{lane}-instrumentation.txt", 1024*1024)
          if not raw or len(raw) > 1024*1024:
              issues.append("Instrumentation output is absent or exceeds the receipt limit")
          lines = raw[:1024*1024].decode(errors="replace").splitlines()
          starts, passes = Counter(), Counter()
          failures = []
          final_codes = []
          ok_lines = []
          terminal_failures = []
          fields = {}
          field = None
          current_test = None
          for line in lines:
              if (match := re.fullmatch(r"INSTRUMENTATION_STATUS: (\w+)=(.*)", line)):
                  key, value = match.groups()
                  field = key
                  fields[key] = [value]
              elif (match := re.fullmatch(r"INSTRUMENTATION_STATUS_CODE: (-?\d+)", line)):
                  code = int(match.group(1))
                  name = fields.get("test", [""])[0]
                  classname = fields.get("class", [""])[0]
                  count = fields.get("numtests", [""])[0]
                  if name not in expected or classname != suite or count != str(expected_count):
                      issues.append("Instrumentation reported a test outside this emulator lane roster")
                  elif code == 1:
                      if current_test is not None:
                          issues.append("Instrumentation started a second test without completing its predecessor")
                      current_test = name
                      starts[name] += 1
                  elif code == 0:
                      if current_test != name or starts[name] != 1:
                          issues.append("Instrumentation returned a passing result without the matching start")
                      current_test = None
                      passes[name] += 1
                  else:
                      current_test = None
                  if code not in (0, 1):
                      content = fields.get("stack", []) + fields.get("stream", []) + fields.get("shortMsg", [])
                      failures.append({"test": name if name in expected else None, "statusCode": code,
                                       "trace": [clean(part) for part in content[:20] if part.strip()]})
                  fields, field = {}, None
              elif (match := re.fullmatch(r"INSTRUMENTATION_CODE: (-?\d+)", line)):
                  final_codes.append(int(match.group(1)))
                  field = None
              elif (match := re.fullmatch(r"OK \((\d+) tests?\)", line.strip())):
                  ok_lines.append(int(match.group(1)))
              elif re.search(r"INSTRUMENTATION_FAILED:|INSTRUMENTATION_ABORTED:|shortMsg=|longMsg=|FAILURES!!!|^Error:|^java\.lang\.SecurityException:|^android\.util\.AndroidException:", line):
                  terminal_failures.append(clean(line))
                  field = None
              elif line.startswith("INSTRUMENTATION_RESULT:"):
                  field = None
              elif field in {"stack", "stream"} and len(fields[field]) < 22:
                  fields[field].append(line)

          status_path = tmp / f"tools-{lane}-status"
          status = status_path.read_text().strip() if status_path.is_file() else ""
          if status != "0" or os.environ[f"TOOLS_{lane.upper()}_OUTCOME"] != "success":
              issues.append("Direct Android instrumentation command did not complete successfully")
          if os.environ["TOOLS_BIND_OUTCOME"] != "success":
              issues.append("Exact app source binding did not succeed")
          if set(starts) != expected or set(passes) != expected or any(value != 1 for value in (*starts.values(), *passes.values())) or current_test is not None:
              issues.append("Instrumentation did not report a single start and pass for every test")
          if final_codes != [-1] or ok_lines != [expected_count] or terminal_failures:
              issues.append("Instrumentation did not report the expected final OK status")
          ok = not issues and not failures
          log = read_bounded(tmp / f"tools-{lane}-logcat.txt", 128*1024).decode(errors="replace").splitlines()
          diagnostics = [clean(line) for line in (log[:48] if not ok else []) if line.strip()]
          proof = {
              "schema": 5, "lane": lane, "appSource": os.environ["APP_SOURCE"], "ref": os.environ["GITHUB_REF"],
              "workflowSource": os.environ["GITHUB_SHA"], "workflowAndFixtureOverlay": os.environ["TOOLS_BIND_OUTCOME"] == "success",
              "appCandidate": "v0.5.6-beta.14-candidate.4", "run": os.environ["GITHUB_RUN_ID"],
              "attempt": os.environ["GITHUB_RUN_ATTEMPT"], "emulator": emulator, "fixture": "synthetic offline account",
              "suite": suite, "expected": sorted(expected), "starts": dict(starts), "passes": dict(passes),
              "outcome": "success" if ok else "failure", "issues": sorted(set(issues)),
              "instrumentationExit": int(status) if status.isdecimal() else None,
              "terminalCodes": final_codes[:8], "okCounts": ok_lines[:8],
              "terminalFailures": terminal_failures[:14], "failures": failures[:9], "logcatDiagnostics": diagnostics,
              "testSourceSha256": hashlib.sha256(source).hexdigest() if source else None,
              "traceSha256": hashlib.sha256(raw).hexdigest() if 0 < len(raw) <= 1024*1024 else None,
          }
          (tmp / f"tools-instrumentation-{lane}-proof.json").write_text(json.dumps(proof, sort_keys=True, indent=2) + "\n")
          for issue in proof["issues"]:
              print(f"Instrumentation: {issue}")
          for text in proof["terminalFailures"]:
              print(f"Instrumentation terminal: {text}")
          for failure in proof["failures"]:
              print(f"Instrumentation test: {failure['test'] or 'runner'} status {failure['statusCode']}")
              for line in failure["trace"]:
                  print(f"Instrumentation stack: {line}")
          for line in diagnostics:
              print(f"Instrumentation logcat: {line}")
          if not ok:
              raise SystemExit(1)
          print(f"Verified {len(passes)} direct Android recovery Tools tests on {emulator}")
          PYTEST
          done
          exit "$proof_status"

      - name: Retain the bounded phone and Google TV instrumentation proofs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VortX-Android-tools-phones-and-google-tv
          path: |
            ${{ runner.temp }}/tools-instrumentation-phone-proof.json
            ${{ runner.temp }}/tools-instrumentation-tv-proof.json
          if-no-files-found: error
          retention-days: 30
