name: Release Android

# OWNER SETUP BEFORE THE FIRST REAL RUN:
# Add VORTX_KEYSTORE_PATH, VORTX_KEYSTORE_PASSWORD, VORTX_KEY_ALIAS, and
# VORTX_KEY_PASSWORD as secrets on the engine-ci environment. VORTX_KEYSTORE_PATH must contain the
# base64 of the upload keystore. This workflow fails closed before any build when one is absent.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag for the draft release, for example v0.3.14-beta.28-android
        required: true
        type: string
      publish_release:
        description: Deprecated safety switch. Android may attach verified assets to a draft but may never publish it.
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release-android:
    # Environment gate for this token-bearing job (trust boundary): engine-ci must restrict deployment
    # to reviewed release refs before ENGINE_REPO_TOKEN and signing secrets become available.
    environment: engine-ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false

      - name: Bind the build to the requested release tag (fail closed)
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          git check-ref-format "refs/tags/$RELEASE_TAG" >/dev/null || { echo "::error::invalid release tag"; exit 1; }
          tag_ref="refs/tags/$RELEASE_TAG"
          git show-ref --verify --quiet "$tag_ref" || { echo "::error::requested release tag was not checked out"; exit 1; }
          source_commit="$(git rev-parse HEAD^{commit})"
          tag_commit="$(git rev-parse "${tag_ref}^{commit}")"
          if [ "$source_commit" != "$tag_commit" ]; then
            echo "::error::checked-out source does not match the requested release tag"
            exit 1
          fi
          echo "SOURCE_COMMIT=$source_commit" >> "$GITHUB_ENV"
          echo "RELEASE_TAG_COMMIT=$tag_commit" >> "$GITHUB_ENV"

      - name: Refuse Android-only publication
        if: inputs.publish_release == true
        run: |
          echo "::error::Android artifacts may only be attached to the draft. The Apple release coordinator validates the complete cross-platform set and publishes last."
          exit 1

      - name: Acquire reviewed Android mpv component from the checked-out release source
        run: /usr/bin/python3 -I scripts/acquire-android-mpv-component.py

      # The private engine pin stays in lockstep with android.yml. Artifacts package only libvortx_ffi.so.
      - name: Preflight the engine token (fail closed)
        env:
          ENGINE_REPO_TOKEN: ${{ secrets.ENGINE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ENGINE_REPO_TOKEN:-}" ]; then
            echo "::error::ENGINE_REPO_TOKEN secret is not set; CI cannot fetch the private engine repo (VortXTV/vortx-core)"
            exit 1
          fi

      - name: Preflight release signing inputs (fail closed)
        env:
          VORTX_KEYSTORE_PATH: ${{ secrets.VORTX_KEYSTORE_PATH }}
          VORTX_KEYSTORE_PASSWORD: ${{ secrets.VORTX_KEYSTORE_PASSWORD }}
          VORTX_KEY_ALIAS: ${{ secrets.VORTX_KEY_ALIAS }}
          VORTX_KEY_PASSWORD: ${{ secrets.VORTX_KEY_PASSWORD }}
        run: scripts/verify-android-release-signing.sh preflight

      - name: Fetch vortx-core (private monorepo, pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: VortXTV/vortx-core
          ref: 0c30f4782aee544a2b7e33169ad60d03630d4097
          token: ${{ secrets.ENGINE_REPO_TOKEN }}
          path: _vortx_core_src
          persist-credentials: false

      - name: Promote the vortx-core workspace + record the exact private source pin
        run: |
          set -euo pipefail
          vortx_sha="$(git -C _vortx_core_src rev-parse HEAD^{commit})"
          test "$vortx_sha" = "0c30f4782aee544a2b7e33169ad60d03630d4097" \
            || { echo "::error::vortx-core checkout does not match the reviewed private pin"; exit 1; }
          echo "VORTX_ENGINE_SOURCE_SHA=$vortx_sha" >> "$GITHUB_ENV"
          rm -rf vortx-core
          mv _vortx_core_src/vortx-core vortx-core
          rm -rf _vortx_core_src
          test -f vortx-core/Cargo.toml || { echo "::error::vortx-core engine workspace missing after promote (vortx-core/Cargo.toml)"; exit 1; }
          test -d vortx-core/crates     || { echo "::error::vortx-core engine crates/ missing after promote (vortx-core/crates)"; exit 1; }
          echo "pinned private source: vortx-core@$vortx_sha (promoted monorepo subdir)"

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0 cmake;4.1.2"

      # The committed wrapper remains the Gradle version authority. This action supplies caching only.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Install Android NDK (must match ndkVersion in app/build.gradle.kts)
        run: |
          yes | sdkmanager "ndk;30.0.16248370"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
          # The runner image also exports an older NDK as ANDROID_NDK_ROOT; point it at the same pin
          # so no tool can pick the other one.
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Install Rust nightly + Android targets
        uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2 # nightly branch, 2026-07-19
        with:
          toolchain: nightly-2026-07-19
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          components: rust-src

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # `key` remains in the action's restore prefix; private source changes cannot fall
          # back to an older same-ref native target cache. The checkout exists before hashing.
          key: ${{ github.ref_name }}-native-${{ env.VORTX_ENGINE_SOURCE_SHA }}-${{ hashFiles('vortx-core/Cargo.*', 'vortx-core/rust-toolchain.toml', 'vortx-core/.cargo/**', 'vortx-core/crates/**', 'android/app/build.gradle.kts') }}
          workspaces: |
            vortx-core -> target-andx

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version "=3.5.4" --locked

      # Same protected job, same authenticated private pin, no extra credentials. Host JNI is
      # disposable and separate from target-andx/jniLibs; it must never enter an APK or handoff.
      - name: Build exact host JNI for native sync release tests
        timeout-minutes: 45
        run: |
          set -euo pipefail
          test "$VORTX_ENGINE_SOURCE_SHA" = 0c30f4782aee544a2b7e33169ad60d03630d4097
          test "$(git rev-parse HEAD^{commit})" = "$SOURCE_COMMIT"
          target="$(mktemp -d "$RUNNER_TEMP/native-sync-host.XXXXXXXX")"
          proof="$GITHUB_WORKSPACE/android/app/build/reports/native-sync-host"
          mkdir -p "$proof"
          source_manifest="$target/source-inputs.sha256"
          find vortx-core \( -path vortx-core/target -o -path vortx-core/target-andx \) -prune -o \
            -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$source_manifest"
          test -s "$source_manifest"
          nice -n 15 cargo +nightly-2026-07-19 build --locked \
            --manifest-path vortx-core/Cargo.toml -p vortx-ffi --no-default-features \
            --features jni,server,resource-host --release --target x86_64-unknown-linux-gnu \
            --target-dir "$target" --jobs 1
          find vortx-core \( -path vortx-core/target -o -path vortx-core/target-andx \) -prune -o \
            -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$target/source-inputs.after.sha256"
          cmp --silent "$source_manifest" "$target/source-inputs.after.sha256"
          library="$target/x86_64-unknown-linux-gnu/release/libvortx_ffi.so"
          test -s "$library" && test ! -L "$library"
          # Host architecture + the production JNI call surface, without printing private inputs.
          readelf -h "$library" | grep -Eq 'Machine:[[:space:]]+Advanced Micro Devices X86-64'
          READELF=readelf bash scripts/verify-native-engine-abi.sh android "$library" owner-history
          library_sha="$(sha256sum "$library" | cut -d' ' -f1)"
          source_sha="$(sha256sum "$source_manifest" | cut -d' ' -f1)"
          jq -n --arg app "$SOURCE_COMMIT" --arg source "$VORTX_ENGINE_SOURCE_SHA" \
            --arg path "$library" --arg sha "$library_sha" --arg inputs "$source_sha" \
            '{schema:1,appSource:$app,engineSource:$source,features:"jni,server,resource-host",
              toolchain:"nightly-2026-07-19",hostTarget:"x86_64-unknown-linux-gnu",
              libraryPath:$path,librarySha256:$sha,sourceInputsSha256:$inputs}' > "$proof/host-jni.json"
          echo "VORTX_JNI_LIBRARY=$library" >> "$GITHUB_ENV"
          echo "VORTX_JNI_EXPECTED_SHA256=$library_sha" >> "$GITHUB_ENV"
          echo "VORTX_JNI_RECEIPT=$proof/host-jni.json" >> "$GITHUB_ENV"
          echo "VORTX_JNI_SOURCE_MANIFEST=$source_manifest" >> "$GITHUB_ENV"

      - name: Require real native sync revision and account tests before packaging
        timeout-minutes: 30
        working-directory: android
        env:
          JAVA_TOOL_OPTIONS: "-XX:ActiveProcessorCount=1"
          VORTX_JNI_SYNC: "1"
        run: bash ../scripts/test-android-native-sync-host.sh

      - name: Retain native sync release JUnit and bounded provenance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VortX-Android-native-sync-host-tests
          path: |
            android/app/build/test-results/testPlayDebugUnitTest/*.xml
            android/app/build/reports/native-sync-host/host-jni.json
            android/app/build/reports/native-sync-host/host-jni-accepted.json
          if-no-files-found: warn
          retention-days: 90

      - name: Build release APKs and Play bundle
        working-directory: android
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          VORTX_ENGINE_CORE_DIR: ${{ github.workspace }}/vortx-core
          VORTX_REQUIRE_ENGINE: "1"
          VORTX_KEYSTORE_PATH: ${{ secrets.VORTX_KEYSTORE_PATH }}
          VORTX_KEYSTORE_PASSWORD: ${{ secrets.VORTX_KEYSTORE_PASSWORD }}
          VORTX_KEY_ALIAS: ${{ secrets.VORTX_KEY_ALIAS }}
          VORTX_KEY_PASSWORD: ${{ secrets.VORTX_KEY_PASSWORD }}
        run: ./gradlew :app:assembleFullRelease :app:assemblePlayRelease :app:bundlePlayRelease --no-daemon --stacktrace

      - name: Verify native-only engine in every Android artifact
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(android/app/build/outputs/apk/full/release/*.apk android/app/build/outputs/apk/play/release/*.apk)
          bundles=(android/app/build/outputs/bundle/playRelease/*.aab)
          if [ ${#apks[@]} -ne 2 ] || [ ${#bundles[@]} -ne 1 ]; then
            echo "::error::expected exactly two release APKs and one AAB"
            exit 1
          fi
          READELF="$ANDROID_HOME/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          STRIP="$ANDROID_HOME/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          test -x "$READELF" || { echo "::error::pinned NDK llvm-readelf unavailable"; exit 1; }
          test -x "$STRIP" || { echo "::error::pinned NDK llvm-strip unavailable"; exit 1; }
          READELF="$READELF" STRIP="$STRIP" bash scripts/verify-native-android-artifacts.sh \
            --native-only --staged-dir android/app/src/main/jniLibs \
            --source-sha "$VORTX_ENGINE_SOURCE_SHA" "${apks[@]}" "${bundles[@]}" \
            | tee "$RUNNER_TEMP/android-native-engine-provenance.txt"

      - name: Verify pinned production signer on every Android artifact
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(android/app/build/outputs/apk/full/release/*.apk android/app/build/outputs/apk/play/release/*.apk)
          bundles=(android/app/build/outputs/bundle/playRelease/*.aab)
          if [ ${#apks[@]} -ne 2 ] || [ ${#bundles[@]} -ne 1 ]; then
            echo "::error::expected exactly two release APKs and one release AAB before signer verification"
            exit 1
          fi
          scripts/verify-android-release-signing.sh verify "${apks[@]}" "${bundles[@]}"

      - name: Verify Play APK remains GPL-native-library free
        run: |
          set -euo pipefail
          shopt -s nullglob
          for apk in android/app/build/outputs/apk/play/release/*.apk; do
            listing="$(unzip -l "$apk")"
            if grep -Eq 'lib(mpv|player|avcodec|avformat|avutil)\.so' <<<"$listing"; then
              echo "::error::GPL native library found in play release APK: $apk"
              exit 1
            fi
          done

      # REL-02: stage names carry the REAL dimensions of each artifact, never a device split.
      # The product flavor is the engine/distribution boundary only:
      #   full-mpv     = sideloaded build carrying the GPLv3 libmpv native engine
      #   play-media3  = Google Play-bound build carrying only the Media3/ExoPlayer engine
      # BOTH variants contain the phone AND the Android TV activities (one APK per flavor runs
      # on both device classes; the flavor never selects a UI), and both are universal APKs:
      # one binary per flavor packages every shipped ABI (arm64-v8a + armeabi-v7a + x86_64). The canonical
      # dimension table, old-to-new name mapping, and consumer guidance live in
      # docs/RELEASE-ARTIFACTS.md.
      - name: Stage verified release assets and provenance
        id: assets
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -n1)"
          test -n "$version" || { echo "::error::could not read Android versionName"; exit 1; }
          version_code="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\)[[:space:]]*$/\1/p' android/app/build.gradle.kts)"
          [[ "$version_code" =~ ^[1-9][0-9]*$ ]] || { echo "::error::expected exactly one numeric Android versionCode"; exit 1; }
          full=(android/app/build/outputs/apk/full/release/*.apk)
          play=(android/app/build/outputs/apk/play/release/*.apk)
          bundle=(android/app/build/outputs/bundle/playRelease/*.aab)
          test ${#full[@]} -eq 1 && test ${#play[@]} -eq 1 && test ${#bundle[@]} -eq 1 || { echo "::error::expected one full APK, one play APK, and one play AAB"; exit 1; }
          rm -rf dist
          mkdir -p dist
          cp "${full[0]}" "dist/VortX-${version}-full-mpv-universal.apk"
          cp "${play[0]}" "dist/VortX-${version}-play-media3-universal.apk"
          cp "${bundle[0]}" "dist/VortX-${version}-play-media3.aab"
          # Google's bundletool inspects the protobuf AAB manifest. Pin and hash-check the
          # executable before using it; do not infer Android build identity from Apple metadata.
          curl --fail --location --connect-timeout 10 --max-time 90 --retry 2 \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar \
            --output "$RUNNER_TEMP/bundletool.jar"
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $RUNNER_TEMP/bundletool.jar" | sha256sum --check
          scripts/verify-android-release-signing.sh verify \
            "dist/VortX-${version}-full-mpv-universal.apk" \
            "dist/VortX-${version}-play-media3-universal.apk" \
            "dist/VortX-${version}-play-media3.aab" | tee dist/SIGNING_PROVENANCE.txt
          BUNDLETOOL_JAR="$RUNNER_TEMP/bundletool.jar" bash scripts/verify-android-release-version.sh \
            "$version_code" "$version" \
            "dist/VortX-${version}-full-mpv-universal.apk" \
            "dist/VortX-${version}-play-media3-universal.apk" \
            "dist/VortX-${version}-play-media3.aab" | tee -a dist/SIGNING_PROVENANCE.txt
          {
            echo "release tag: $RELEASE_TAG"
            echo "release tag commit: $RELEASE_TAG_COMMIT"
            echo "source commit: $SOURCE_COMMIT"
            echo "native engine source commit: $VORTX_ENGINE_SOURCE_SHA"
            echo "native engine Cargo features: jni,server,resource-host"
            echo "workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "workflow run attempt: $GITHUB_RUN_ATTEMPT"
          } >> dist/SIGNING_PROVENANCE.txt
          cat "$RUNNER_TEMP/android-native-engine-provenance.txt" >> dist/SIGNING_PROVENANCE.txt
          sha256sum \
            "dist/VortX-${version}-full-mpv-universal.apk" \
            "dist/VortX-${version}-play-media3-universal.apk" \
            "dist/VortX-${version}-play-media3.aab" \
            | sed 's#  dist/#  #' > dist/SHA256SUMS-android.txt
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload the immutable Android handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VortX-Android-release
          path: |
            dist/*.apk
            dist/*.aab
            dist/SHA256SUMS-android.txt
            dist/SIGNING_PROVENANCE.txt
          if-no-files-found: error
          retention-days: 90

      - name: Create or append to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if release_json="$(gh release view "$RELEASE_TAG" --json isDraft 2>/dev/null)"; then
            is_draft="$(python3 -c 'import json,sys; print(str(json.load(sys.stdin)["isDraft"]).lower())' <<<"$release_json")"
            if [ "$is_draft" != "true" ]; then
              echo "::error::release $RELEASE_TAG already exists and is not a draft"
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "$RELEASE_TAG" --notes "Android beta artifacts are named by engine and distribution, never by device: full-mpv-universal.apk is the sideloaded GPL mpv-engine build, play-media3-universal.apk and play-media3.aab are the Google Play Media3 builds. Every variant contains both the phone and the Android TV user interface. See docs/RELEASE-ARTIFACTS.md."
          fi
          gh release upload "$RELEASE_TAG" \
            dist/*.apk \
            dist/*.aab \
            dist/SHA256SUMS-android.txt \
            dist/SIGNING_PROVENANCE.txt \
            --clobber
