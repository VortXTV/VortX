name: Release Android

# Proof-only rerun for the frozen Build 295 app. The signed package job already ran in the
# original candidate workflow. This overlay has no signing, private-engine, or release job.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact frozen Android artifact candidate to verify
        required: true
        type: string
      publish_release:
        description: Must be false for this proof-only operation
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  tools-instrumentation:
    name: Verify Android recovery tools on an emulator
    if: >-
      github.repository == 'VortXTV/VortX' &&
      github.ref == 'refs/tags/vortx-android-b295-tools-direct-20261115' &&
      inputs.release_tag == 'v0.5.6-beta.14-candidate.4' &&
      inputs.publish_release == false
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      APP_SOURCE: 7b7bbf00de25f90c1e6dee167372d3d0e0c58e05
      TOOLS_TEST_CLASS: com.vortx.android.ui.profilepicker.ProfilePickerToolsHostTest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Bind the workflow-only overlay to the frozen app source
        id: source_binding
        run: |
          set -euo pipefail
          git_path=.github/workflows/android-release.yml
          test "$(git rev-parse HEAD^{commit})" = "$GITHUB_SHA"
          test "$(git show -s --format=%P HEAD)" = "$APP_SOURCE"
          test "$(git diff --name-status --no-renames "$APP_SOURCE" HEAD)" = "$(printf 'M\t%s' "$git_path")"
          git -c advice.detachedHead=false checkout --detach "$APP_SOURCE"
          test "$(git rev-parse HEAD^{commit})" = "$APP_SOURCE"
          test -z "$(git status --porcelain)"
          mkdir "$RUNNER_TEMP/tools-empty-engine"
          test ! -e "$RUNNER_TEMP/tools-empty-engine/Cargo.toml"
          echo "VORTX_ENGINE_CORE_DIR=$RUNNER_TEMP/tools-empty-engine" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0 cmake;4.1.2"

      - name: Set up Gradle without shared build caches
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Prepare the Android fixture emulator
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sdkmanager --install "emulator" "system-images;android-35;google_apis;x86_64" "ndk;30.0.16248370"
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          avd_root="$(mktemp -d "$RUNNER_TEMP/tools-android.XXXXXXXX")"
          export ANDROID_USER_HOME="$avd_root/user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          avdmanager create avd --name vortx-tools --package "system-images;android-35;google_apis;x86_64" \
            --device pixel_2 --path "$ANDROID_AVD_HOME/vortx-tools.avd" </dev/null
          test -s "$ANDROID_AVD_HOME/vortx-tools.avd/config.ini"
          test -s "$ANDROID_AVD_HOME/vortx-tools.ini"
          grep -Fxq "path=$ANDROID_AVD_HOME/vortx-tools.avd" "$ANDROID_AVD_HOME/vortx-tools.ini"
          listed_avds="$("$ANDROID_HOME/emulator/emulator" -list-avds)"
          grep -Fxq vortx-tools <<<"$listed_avds"
          printf 'ANDROID_USER_HOME=%s\nANDROID_AVD_HOME=%s\n' "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME" >> "$GITHUB_ENV"

      - name: Run the recovery tools instrumentation suite
        id: instrumentation
        timeout-minutes: 22
        working-directory: android
        env:
          ANDROID_SERIAL: emulator-5554
        run: |
          set -euo pipefail
          test -s "$ANDROID_AVD_HOME/vortx-tools.ini"
          test ! -e app/build/outputs/androidTest-results/connected
          "$ANDROID_HOME/emulator/emulator" -avd vortx-tools -port 5554 -accel on -gpu swiftshader \
            -no-window -no-audio -no-boot-anim -no-snapshot > "$RUNNER_TEMP/tools-emulator.log" 2>&1 &
          emulator_pid=$!
          finish_emulator() {
            local saved_status=$?
            trap - EXIT
            # The verifier retains these bounded slices only if the direct checks fail.
            {
              timeout 8s adb logcat -d -v brief -b crash -t 60 AndroidRuntime:E '*:S' || true
              timeout 8s adb logcat -d -v brief -b main -t 100 TestRunner:I AndroidJUnitRunner:I InstrResultPrinter:I Instrumentation:E '*:S' || true
            } > "$RUNNER_TEMP/tools-direct-logcat.txt" 2>&1
            timeout 10s adb emu kill >/dev/null 2>&1 || kill "$emulator_pid" 2>/dev/null || true
            exit "$saved_status"
          }
          trap finish_emulator EXIT
          if ! timeout 240s bash -c '
            set -euo pipefail
            while kill -0 "$1" 2>/dev/null; do
              ready="$(timeout 5s adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r" || true)"
              if [ "$ready" = 1 ]; then exit 0; fi
              sleep 2
            done
            exit 1
          ' _ "$emulator_pid"; then
            tail -n 40 "$RUNNER_TEMP/tools-emulator.log"
            exit 1
          fi
          test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = 35
          test "$(adb shell getprop ro.product.cpu.abi | tr -d '\r')" = x86_64
          adb shell input keyevent 82
          # The fixture app uses synthetic accounts. Keep its normal startup clients offline.
          adb shell cmd connectivity airplane-mode enable
          adb shell svc wifi disable
          adb shell svc data disable
          # This verifies the app/test APK pair directly, avoiding AGP's rendered-trace format.
          ./gradlew :app:assemblePlayDebug :app:assemblePlayDebugAndroidTest \
            --no-daemon --max-workers=1 --no-build-cache
          shopt -s nullglob
          app_apks=(app/build/outputs/apk/play/debug/*.apk)
          test_apks=(app/build/outputs/apk/androidTest/play/debug/*.apk)
          test "${#app_apks[@]}" = 1 && test "${#test_apks[@]}" = 1
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          app_badging="$("$aapt" dump badging "${app_apks[0]}")"
          test_badging="$("$aapt" dump badging "${test_apks[0]}")"
          grep -Eq "^package: name='com.vortx.android' versionCode='295' versionName='0.5.6'" <<<"$app_badging"
          grep -Eq "^package: name='com.vortx.android.test' " <<<"$test_badging"
          timeout 60s adb install -t "${app_apks[0]}"
          timeout 60s adb install -t "${test_apks[0]}"
          expected_runner='com.vortx.android.test/androidx.test.runner.AndroidJUnitRunner'
          instrumentations="$(timeout 10s adb shell pm list instrumentation com.vortx.android | tr -d '\r')"
          grep -Fxq "instrumentation:$expected_runner (target=com.vortx.android)" <<<"$instrumentations"
          status=0
          timeout 300s adb shell am instrument -w -r -e class "$TOOLS_TEST_CLASS" "$expected_runner" \
            > "$RUNNER_TEMP/tools-direct-instrumentation.txt" 2>&1 || status=$?
          printf '%s\n' "$status" > "$RUNNER_TEMP/tools-direct-status"
          exit "$status"

      - name: Verify the Tools roster and retain bounded failure details
        if: always()
        env:
          TOOLS_RUN_OUTCOME: ${{ steps.instrumentation.outcome }}
          TOOLS_BIND_OUTCOME: ${{ steps.source_binding.outcome }}
        run: |
          set -euo pipefail
          python3 -I - <<'PYTEST'
          import hashlib
          import json
          import os
          import re
          from collections import Counter
          from pathlib import Path

          suite = os.environ["TOOLS_TEST_CLASS"]
          tmp = Path(os.environ["RUNNER_TEMP"])
          source_path = Path("android/app/src/androidTest/kotlin") / (suite.replace(".", "/") + ".kt")
          source = source_path.read_bytes() if source_path.is_file() else b""
          expected = {name.decode() for name in re.findall(rb"^[ \t]*@Test\s+fun\s+(\w+)\s*\(", source, re.M)}
          issues = []
          if len(expected) != 9 or len(expected) != len(re.findall(rb"^[ \t]*@Test\b", source, re.M)):
              issues.append("Frozen UI fixture does not contain the exact nine-test roster")

          def clean(line):
              line = re.sub(r"[\x00-\x1f\x7f]", " ", line.strip()).replace("::", ":")
              line = re.sub(r"(?:https?|file|content)://[^\s<>()]+", "[URL]", line, flags=re.I)
              line = re.sub(r"[\w.+-]+@[\w.-]+\.[a-z]{2,}", "[EMAIL]", line, flags=re.I)
              line = re.sub(r"\b(?:Bearer|Basic)\s+[A-Za-z0-9+/_.=-]+", "[AUTH]", line, flags=re.I)
              line = re.sub(r"\b(?:token|password|credential|secret|key|authorization)\s*[:=]\s*\S+", "[REDACTED]", line, flags=re.I)
              line = re.sub(r"\b[A-Za-z0-9_-]{16,}(?:\.[A-Za-z0-9_-]{16,}){2}\b", "[TOKEN]", line)
              line = re.sub(r"/(?:home/runner|data/(?:user|app))[/\w.+-]*", "[PATH]", line)
              return line[:280]

          def read_bounded(file, limit):
              if not file.is_file():
                  return b""
              with file.open("rb") as stream:
                  return stream.read(limit+1)

          raw = read_bounded(tmp / "tools-direct-instrumentation.txt", 1024*1024)
          if not raw or len(raw) > 1024*1024:
              issues.append("Instrumentation output is absent or exceeds the receipt limit")
          lines = raw[:1024*1024].decode(errors="replace").splitlines()
          starts, passes = Counter(), Counter()
          failures = []
          final_codes = []
          ok_lines = []
          terminal_failures = []
          fields = {}
          field = None
          current_test = None
          for line in lines:
              if (match := re.fullmatch(r"INSTRUMENTATION_STATUS: (\w+)=(.*)", line)):
                  key, value = match.groups()
                  field = key
                  fields[key] = [value]
              elif (match := re.fullmatch(r"INSTRUMENTATION_STATUS_CODE: (-?\d+)", line)):
                  code = int(match.group(1))
                  name = fields.get("test", [""])[0]
                  classname = fields.get("class", [""])[0]
                  count = fields.get("numtests", [""])[0]
                  if name not in expected or classname != suite or count != "9":
                      issues.append("Instrumentation reported a test outside the frozen nine-test roster")
                  elif code == 1:
                      if current_test is not None:
                          issues.append("Instrumentation started a second test without completing its predecessor")
                      current_test = name
                      starts[name] += 1
                  elif code == 0:
                      if current_test != name or starts[name] != 1:
                          issues.append("Instrumentation returned a passing result without the matching start")
                      current_test = None
                      passes[name] += 1
                  else:
                      current_test = None
                  if code not in (0, 1):
                      content = fields.get("stack", []) + fields.get("stream", []) + fields.get("shortMsg", [])
                      failures.append({"test": name if name in expected else None, "statusCode": code,
                                       "trace": [clean(part) for part in content[:20] if part.strip()]})
                  fields, field = {}, None
              elif (match := re.fullmatch(r"INSTRUMENTATION_CODE: (-?\d+)", line)):
                  final_codes.append(int(match.group(1)))
                  field = None
              elif (match := re.fullmatch(r"OK \((\d+) tests?\)", line.strip())):
                  ok_lines.append(int(match.group(1)))
              elif re.search(r"INSTRUMENTATION_FAILED:|INSTRUMENTATION_ABORTED:|shortMsg=|longMsg=|FAILURES!!!|^Error:|^java\.lang\.SecurityException:|^android\.util\.AndroidException:", line):
                  terminal_failures.append(clean(line))
                  field = None
              elif line.startswith("INSTRUMENTATION_RESULT:"):
                  field = None
              elif field in {"stack", "stream"} and len(fields[field]) < 22:
                  fields[field].append(line)

          status_path = tmp / "tools-direct-status"
          status = status_path.read_text().strip() if status_path.is_file() else ""
          if status != "0" or os.environ["TOOLS_RUN_OUTCOME"] != "success":
              issues.append("Direct Android instrumentation command did not complete successfully")
          if os.environ["TOOLS_BIND_OUTCOME"] != "success":
              issues.append("Exact app source binding did not succeed")
          if set(starts) != expected or set(passes) != expected or any(value != 1 for value in (*starts.values(), *passes.values())) or current_test is not None:
              issues.append("Instrumentation did not report a single start and pass for every test")
          if final_codes != [-1] or ok_lines != [9] or terminal_failures:
              issues.append("Instrumentation did not report the expected final OK status")
          ok = not issues and not failures
          log = read_bounded(tmp / "tools-direct-logcat.txt", 128*1024).decode(errors="replace").splitlines()
          diagnostics = [clean(line) for line in (log[:48] if not ok else []) if line.strip()]
          proof = {
              "schema": 4, "appSource": os.environ["APP_SOURCE"], "ref": os.environ["GITHUB_REF"],
              "workflowSource": os.environ["GITHUB_SHA"], "workflowOnlyOverlay": os.environ["TOOLS_BIND_OUTCOME"] == "success",
              "appCandidate": "v0.5.6-beta.14-candidate.4", "run": os.environ["GITHUB_RUN_ID"],
              "attempt": os.environ["GITHUB_RUN_ATTEMPT"], "emulator": "API 35 Google APIs x86_64, synthetic offline account",
              "suite": suite, "expected": sorted(expected), "starts": dict(starts), "passes": dict(passes),
              "outcome": "success" if ok else "failure", "issues": sorted(set(issues)),
              "instrumentationExit": int(status) if status.isdecimal() else None,
              "terminalCodes": final_codes[:8], "okCounts": ok_lines[:8],
              "terminalFailures": terminal_failures[:14], "failures": failures[:9], "logcatDiagnostics": diagnostics,
              "testSourceSha256": hashlib.sha256(source).hexdigest() if source else None,
              "traceSha256": hashlib.sha256(raw).hexdigest() if 0 < len(raw) <= 1024*1024 else None,
          }
          (tmp / "tools-instrumentation-direct-proof.json").write_text(json.dumps(proof, sort_keys=True, indent=2) + "\n")
          for issue in proof["issues"]:
              print(f"Instrumentation: {issue}")
          for text in proof["terminalFailures"]:
              print(f"Instrumentation terminal: {text}")
          for failure in proof["failures"]:
              print(f"Instrumentation test: {failure['test'] or 'runner'} status {failure['statusCode']}")
              for line in failure["trace"]:
                  print(f"Instrumentation stack: {line}")
          for line in diagnostics:
              print(f"Instrumentation logcat: {line}")
          if not ok:
              raise SystemExit(1)
          print(f"Verified {len(passes)} direct Android recovery Tools tests on the emulator")
          PYTEST

      - name: Retain the bounded instrumentation proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VortX-Android-tools-instrumentation-direct
          path: ${{ runner.temp }}/tools-instrumentation-direct-proof.json
          if-no-files-found: error
          retention-days: 30
