name: Release Android

# Proof-only rerun for the frozen Build 295 app. The signed package job already ran in the
# original candidate workflow. This overlay has no signing, private-engine, or release job.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact frozen Android artifact candidate to verify
        required: true
        type: string
      publish_release:
        description: Must be false for this proof-only operation
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  tools-instrumentation:
    name: Verify Android recovery tools on an emulator
    if: >-
      github.repository == 'VortXTV/VortX' &&
      github.ref == 'refs/tags/vortx-android-b295-tools-proof-20261115' &&
      inputs.release_tag == 'v0.5.6-beta.14-candidate.4' &&
      inputs.publish_release == false
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      APP_SOURCE: 7b7bbf00de25f90c1e6dee167372d3d0e0c58e05
      TOOLS_TEST_CLASS: com.vortx.android.ui.profilepicker.ProfilePickerToolsHostTest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Bind the workflow-only overlay to the frozen app source
        id: source_binding
        run: |
          set -euo pipefail
          git_path=.github/workflows/android-release.yml
          test "$(git rev-parse HEAD^{commit})" = "$GITHUB_SHA"
          test "$(git show -s --format=%P HEAD)" = "$APP_SOURCE"
          test "$(git diff --name-status --no-renames "$APP_SOURCE" HEAD)" = "$(printf 'M\t%s' "$git_path")"
          git -c advice.detachedHead=false checkout --detach "$APP_SOURCE"
          test "$(git rev-parse HEAD^{commit})" = "$APP_SOURCE"
          test -z "$(git status --porcelain)"
          mkdir "$RUNNER_TEMP/tools-empty-engine"
          test ! -e "$RUNNER_TEMP/tools-empty-engine/Cargo.toml"
          echo "VORTX_ENGINE_CORE_DIR=$RUNNER_TEMP/tools-empty-engine" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0 cmake;4.1.2"

      - name: Set up Gradle without shared build caches
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Prepare the Android fixture emulator
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sdkmanager --install "emulator" "system-images;android-35;google_apis;x86_64" "ndk;30.0.16248370"
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          avd_root="$(mktemp -d "$RUNNER_TEMP/tools-android.XXXXXXXX")"
          export ANDROID_USER_HOME="$avd_root/user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          avdmanager create avd --name vortx-tools --package "system-images;android-35;google_apis;x86_64" \
            --device pixel_2 --path "$ANDROID_AVD_HOME/vortx-tools.avd" </dev/null
          test -s "$ANDROID_AVD_HOME/vortx-tools.avd/config.ini"
          test -s "$ANDROID_AVD_HOME/vortx-tools.ini"
          grep -Fxq "path=$ANDROID_AVD_HOME/vortx-tools.avd" "$ANDROID_AVD_HOME/vortx-tools.ini"
          listed_avds="$("$ANDROID_HOME/emulator/emulator" -list-avds)"
          grep -Fxq vortx-tools <<<"$listed_avds"
          printf 'ANDROID_USER_HOME=%s\nANDROID_AVD_HOME=%s\n' "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME" >> "$GITHUB_ENV"

      - name: Run the recovery tools instrumentation suite
        id: instrumentation
        timeout-minutes: 22
        working-directory: android
        env:
          ANDROID_SERIAL: emulator-5554
        run: |
          set -euo pipefail
          test -s "$ANDROID_AVD_HOME/vortx-tools.ini"
          test ! -e app/build/outputs/androidTest-results/connected
          "$ANDROID_HOME/emulator/emulator" -avd vortx-tools -port 5554 -accel on -gpu swiftshader \
            -no-window -no-audio -no-boot-anim -no-snapshot > "$RUNNER_TEMP/tools-emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'timeout 10s adb emu kill >/dev/null 2>&1 || kill "$emulator_pid" 2>/dev/null || true' EXIT
          if ! timeout 240s bash -c '
            set -euo pipefail
            while kill -0 "$1" 2>/dev/null; do
              ready="$(timeout 5s adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r" || true)"
              if [ "$ready" = 1 ]; then exit 0; fi
              sleep 2
            done
            exit 1
          ' _ "$emulator_pid"; then
            tail -n 40 "$RUNNER_TEMP/tools-emulator.log"
            exit 1
          fi
          test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = 35
          test "$(adb shell getprop ro.product.cpu.abi | tr -d '\r')" = x86_64
          adb shell input keyevent 82
          # The fixture app uses synthetic accounts. Keep its normal startup clients offline.
          adb shell cmd connectivity airplane-mode enable
          adb shell svc wifi disable
          adb shell svc data disable
          gradle_result=0
          ./gradlew :app:connectedPlayDebugAndroidTest --no-daemon --max-workers=1 \
            --no-build-cache "-Pandroid.testInstrumentationRunnerArguments.class=$TOOLS_TEST_CLASS" || gradle_result=$?
          printf '%s\n' "$gradle_result" > "$RUNNER_TEMP/tools-gradle.status"
          if [[ "$gradle_result" -ne 0 ]]; then
            # Keep only small runner and crash slices while the synthetic emulator still exists.
            if ! find app/build/outputs/androidTest-results/connected -name 'TEST-*.xml' -print -quit 2>/dev/null | grep -q .; then
              {
                timeout 8s adb logcat -d -v brief -b crash -t 60 AndroidRuntime:E '*:S' || true
                timeout 8s adb logcat -d -v brief -b main -t 100 TestRunner:I AndroidJUnitRunner:I Instrumentation:E '*:S' || true
              } > "$RUNNER_TEMP/tools-logcat-tail.txt"
            fi
          fi
          exit "$gradle_result"

      - name: Verify the Tools roster and retain bounded failure details
        if: always()
        env:
          TOOLS_RUN_OUTCOME: ${{ steps.instrumentation.outcome }}
          TOOLS_BIND_OUTCOME: ${{ steps.source_binding.outcome }}
        run: |
          set -euo pipefail
          python3 -I - <<'PYTEST'
          import hashlib
          import json
          import os
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          suite = os.environ["TOOLS_TEST_CLASS"]
          tmp = Path(os.environ["RUNNER_TEMP"])
          source_path = Path("android/app/src/androidTest/kotlin") / (suite.replace(".", "/") + ".kt")
          source = source_path.read_bytes() if source_path.is_file() else b""
          expected = set(re.findall(rb"^[ \t]*@Test\s+fun\s+([A-Za-z_][A-Za-z0-9_]*)\s*\(", source, re.M))
          expected = {name.decode() for name in expected}
          issues = []
          if not expected or len(expected) != len(re.findall(rb"^[ \t]*@Test\b", source, re.M)):
              issues.append("Could not determine the source test roster")

          def clean(line):
              line = re.sub(r"[\x00-\x1f\x7f]", " ", line.strip())
              line = re.sub(r"(?:https?|file|content)://[^\s<>()]+", "[URL]", line, flags=re.I)
              line = re.sub(r"[\w.+-]+@[\w.-]+\.[a-z]{2,}", "[EMAIL]", line, flags=re.I)
              line = re.sub(r"\b(?:Bearer|Basic)\s+[A-Za-z0-9+/_.=-]+", "[AUTH]", line, flags=re.I)
              line = re.sub(r"\b(?:token|password|credential|secret|key|authorization)\s*[:=]\s*\S+", "[REDACTED]", line, flags=re.I)
              line = re.sub(r"\b[A-Za-z0-9_-]{16,}(?:\.[A-Za-z0-9_-]{16,}){2}\b", "[TOKEN]", line)
              line = re.sub(r"/(?:home/runner|data/(?:user|app))[/\w.+-]*", "[PATH]", line)
              return line[:280]

          reports = sorted(Path("android/app/build/outputs/androidTest-results/connected").rglob("TEST-*.xml"))
          digests = []
          names = []
          failures = []
          if not reports:
              issues.append("No connected test XML was produced")
          elif len(reports) > 4:
              issues.append("Unexpected number of connected test XML reports")
          for report in reports[:4]:
              if report.is_symlink() or not 0 < report.stat().st_size <= 4 * 1024 * 1024:
                  issues.append("Invalid connected test XML report")
                  continue
              data = report.read_bytes()
              digests.append(hashlib.sha256(data).hexdigest())
              try:
                  root = ET.fromstring(data)
              except ET.ParseError:
                  issues.append("Malformed connected test XML report")
                  continue
              cases = root.findall(".//testcase")
              if root.tag != "testsuite" or root.get("tests") != str(len(cases)) or len(cases) > 32:
                  issues.append("Unexpected connected test XML structure")
                  continue
              if any(root.get(key, "0") != "0" for key in ("skipped", "failures", "errors")):
                  issues.append("The connected test XML reported failure, error or skip")
              for case in cases:
                  name = case.get("name", "")
                  if case.get("classname") != suite or name not in expected:
                      issues.append("Connected test XML reported an unexpected test")
                      continue
                  names.append(name)
                  for label in ("skipped", "failure", "error"):
                      detail = case.find(label)
                      if detail is None:
                          continue
                      kind = detail.get("type", label)
                      if not re.fullmatch(r"[.\w$]{1,140}", kind):
                          kind = label
                      trace = (detail.text or "").splitlines()
                      failures.append({
                          "test": name, "status": label, "type": kind,
                          "message": clean(detail.get("message") or (trace[0] if trace else label)),
                          "stack": [clean(line) for line in trace[:14] if line.strip()],
                      })

          status_file = tmp / "tools-gradle.status"
          status = status_file.read_text().strip() if status_file.is_file() else ""
          if status != "0" or os.environ["TOOLS_RUN_OUTCOME"] != "success":
              issues.append("Connected Android test task did not succeed")
          if len(names) != len(expected) or set(names) != expected:
              issues.append("Connected tests did not run the exact roster")
          log_file = tmp / "tools-logcat-tail.txt"
          fallback = []
          if not reports and log_file.is_file():
              fallback = [clean(line) for line in log_file.read_text(errors="replace").splitlines()[-24:] if line.strip()]
          if os.environ["TOOLS_BIND_OUTCOME"] != "success":
              issues.append("Exact app source binding did not succeed")
          ok = not issues and not failures
          proof = {
              "schema": 3, "appSource": os.environ["APP_SOURCE"], "ref": os.environ["GITHUB_REF"],
              "workflowSource": os.environ["GITHUB_SHA"],
              "workflowOnlyOverlay": os.environ["TOOLS_BIND_OUTCOME"] == "success",
              "appCandidate": "v0.5.6-beta.14-candidate.4",
              "run": os.environ["GITHUB_RUN_ID"], "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "emulator": "API 35 Google APIs x86_64, synthetic offline account", "suite": suite,
              "gradleExit": int(status) if status.isdecimal() else None,
              "outcome": "success" if ok else "failure", "expected": sorted(expected),
              "tests": sorted(set(names)), "failures": failures[:9], "issues": sorted(set(issues)),
              "testSourceSha256": hashlib.sha256(source).hexdigest() if source else None,
              "reportSha256": digests, "fallbackLogcat": fallback,
          }
          (tmp / "tools-instrumentation-proof.json").write_text(json.dumps(proof, sort_keys=True, indent=2) + "\n")
          for issue in proof["issues"]:
              print(f"Instrumentation: {issue}")
          for failure in proof["failures"]:
              print(f"Instrumentation {failure['status']}: {failure['test']} [{failure['type']}] {failure['message']}")
              for line in failure["stack"]:
                  print(f"Instrumentation stack: {line}")
          for line in fallback:
              print(f"Instrumentation logcat: {line}")
          if not ok:
              raise SystemExit(1)
          print(f"Verified {len(names)} Android recovery tools tests on the emulator")
          PYTEST

      - name: Retain the bounded instrumentation proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VortX-Android-tools-instrumentation
          path: ${{ runner.temp }}/tools-instrumentation-proof.json
          if-no-files-found: error
          retention-days: 30
