name: CodeQL

# Scans the Rust source tracked in this public repository, including the desktop Tauri backend.
# The private engine repositories and Swift apps are outside this source-only job; their candidate
# assurance belongs in their credential-gated build workflows.

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
  schedule:
    - cron: "0 6 * * 1"   # weekly, Mondays 06:00 UTC

jobs:
  analyze:
    name: Analyze (Rust)
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: rust
          build-mode: none   # analyze source + Cargo metadata, no cross-target build needed

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          category: "/language:rust"
