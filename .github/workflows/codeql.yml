name: CodeQL

# Static security analysis of the source tracked in this public repository, from source with no
# cross-target build (build-mode: none). Covers Rust (incl. the desktop Tauri backend), the
# TypeScript/JavaScript web + workers + desktop front ends, and the Python tooling.
# The compiled apps are covered without a build by Semgrep (semgrep.yml): Swift (the Apple apps) and
# Kotlin (the Android app, which CodeQL cannot extract in build-mode: none and whose autobuild would
# need the full Android + private-engine build). The private engine lives in its own gated repos.

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
  schedule:
    - cron: "0 6 * * 1"   # weekly, Mondays 06:00 UTC

# Least privilege at the top; the analyze job widens only what it needs.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Every one of these supports build-mode: none (source-only analysis, no compile step).
        # java-kotlin is intentionally NOT here: CodeQL cannot extract Kotlin in build-mode: none,
        # and autobuild would require the full Android + private-engine build. Kotlin is covered by
        # Semgrep instead (semgrep.yml).
        language: [rust, javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          category: "/language:${{ matrix.language }}"
