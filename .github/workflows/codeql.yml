name: CodeQL

# Static security analysis of the source tracked in this public repository. Rust (incl. the desktop
# Tauri backend), TypeScript/JavaScript web + workers + desktop front ends, and Python use source-only
# analysis. Kotlin needs a traced Gradle compilation, so it has a small dedicated manual-build lane.
# Swift remains covered by Semgrep (semgrep.yml); the private engine lives in its own gated repos.

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
  schedule:
    - cron: "0 6 * * 1"   # weekly, Mondays 06:00 UTC

# Least privilege at the top; the analyze job widens only what it needs.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Every one of these supports build-mode: none (source-only analysis, no compile step).
        # java-kotlin is intentionally NOT here: CodeQL cannot extract Kotlin in build-mode: none,
        # and autobuild would require the full Android + private-engine build. It is handled by the
        # dedicated analyze-java-kotlin manual-build job below.
        language: [rust, javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"

  analyze-java-kotlin:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0 cmake;4.1.2"

      # Keep both Android modules and every traced/package build on the same exact NDK.
      - name: Install Android NDK 30.0.16248370
        run: |
          yes | sdkmanager "ndk;30.0.16248370"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: java-kotlin
          build-mode: manual
          # The generated Code Quality autobuilder does not provision Android's pinned NDK.
          # Run the same maintained quality selector alongside security queries on this traced
          # build; do not suppress compiled-language findings to hide that infrastructure failure.
          queries: ./.github/codeql/java-quality.qls

      # CodeQL only extracts Kotlin from a compilation it traces. This task configures the Android
      # modules and compiles the Play variant without invoking the private-engine release pipeline.
      - name: Compile Android Kotlin for CodeQL
        id: android_compile
        working-directory: android
        run: ./gradlew :app:compilePlayDebugKotlin -Pvortx.nativeEngine=true -Pvortx.nativeResourceHost=true --no-daemon --stacktrace

      # Gradle uses current app/test dependencies from this checked-out source.
      - name: Test Android sync and account recovery
        working-directory: android
        run: >-
          ./gradlew :app:testPlayDebugUnitTest
          -Pvortx.nativeEngine=true -Pvortx.nativeResourceHost=true
          --tests com.vortx.android.sync.AndroidRealtimeSyncTest
          --tests com.vortx.android.sync.DurableSessionStateTest
          --tests com.vortx.android.sync.NativeAccountSyncTest
          --tests com.vortx.android.sync.VortXSessionOwnerTransitionContractTest
          --no-daemon --stacktrace

      - name: Perform CodeQL analysis
        if: ${{ always() && !cancelled() && steps.android_compile.outcome == 'success' }}
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:java-kotlin"
