name: Build Desktop (Tauri)

# Cross-platform desktop builds for Windows, Linux, and macOS on Tauri 2. Like the Android workflow,
# this is CI-first: the Windows and Linux bundles cannot be produced on the macOS dev machine, so CI
# is the build feedback loop. It builds installers per platform and uploads them as artifacts. The
# shared stremio-core engine (embedded directly, since the Tauri backend is Rust) and the libmpv
# player land on top of this verified skeleton.

on:
  push:
    branches: [main, beta]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    branches: [main, beta]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: "deb,appimage"
          - os: windows-2025
            bundles: "nsis"
          - os: macos-26
            bundles: "app,dmg"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev \
            pkg-config

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Exact Node 22 LTS patch. Node 20 is EOL (April 2026), and vite 8 requires
          # ^20.19.0 || >=22.12.0.
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2 # stable (2026-07-16)
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "desktop/src-tauri -> target"

      - name: Stage embedded server runtime
        working-directory: desktop
        shell: bash
        run: scripts/fetch-server-deps.sh

      # Stage Linux mpv as an extracted AppImage (AppDir): linuxdeploy bundles the distro mpv plus its
      # full .so closure, then we extract it so the app spawns AppRun directly at runtime - no system
      # mpv, no runtime FUSE. player.rs points the linux mpv path at mpv-linux-x64/AppRun, and
      # tauri.linux.conf.json bundles the AppDir as a directory resource. Inputs are static (distro
      # package + pinned tool), no untrusted event data.
      - name: Stage Linux mpv (extracted AppDir)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y mpv
          work="$(mktemp -d)"; cd "$work"
          curl -fsSL -o linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o linuxdeploy-plugin-appimage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          printf '%s  %s\n' \
            e87ee0815d109282fdda73e34c2361d64d02b0ffaea3674b18f1fd1f6a687dcf \
            linuxdeploy.AppImage | sha256sum -c -
          printf '%s  %s\n' \
            1da16a46fa5e058ae740e7c35ed0d36d86cb869ac9cc8a5fd9a1847d7978d99a \
            linuxdeploy-plugin-appimage | sha256sum -c -
          chmod +x linuxdeploy.AppImage linuxdeploy-plugin-appimage
          export APPIMAGE_EXTRACT_AND_RUN=1
          export PATH="$work:$PATH"
          desktop_file=/usr/share/applications/mpv.desktop
          if [ ! -f "$desktop_file" ]; then
            desktop_file="$work/mpv.desktop"
            printf '[Desktop Entry]\nType=Application\nName=mpv\nExec=mpv\nIcon=mpv\nCategories=AudioVideo;\nTerminal=false\n' > "$desktop_file"
          fi
          icon="$(find /usr/share/icons /usr/share/pixmaps -iname 'mpv.*' 2>/dev/null | head -1 || true)"
          if [ -z "$icon" ]; then
            icon="$work/mpv.png"
            echo 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==' | base64 -d > "$icon"
          fi
          ./linuxdeploy.AppImage --appdir AppDir --executable "$(command -v mpv)" \
            --desktop-file "$desktop_file" --icon-file "$icon" --output appimage
          out="$(ls *.AppImage | grep -viE '^linuxdeploy' | head -1)"
          chmod +x "$out"
          "./$out" --appimage-extract
          dest="${GITHUB_WORKSPACE}/desktop/src-tauri/resources/mpv-linux-x64"
          mkdir -p "$(dirname "$dest")"
          rm -rf "$dest"
          mv squashfs-root "$dest"
          test -x "$dest/AppRun"
          echo "staged Linux mpv AppDir at $dest"

      - name: Verify staged runtime resources
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          resources=src-tauri/resources
          test -s "$resources/server.cjs"
          case "${{ matrix.os }}" in
            ubuntu-24.04)
              node_bin="$resources/node-linux-x64"
              mpv_bin="$resources/mpv-linux-x64/AppRun"
              ;;
            windows-2025)
              node_bin="$resources/node-win-x64.exe"
              mpv_bin="$resources/mpv-win-x64.exe"
              ;;
            macos-26)
              node_bin="$resources/node-darwin-arm64"
              mpv_bin="$resources/mpv-darwin-arm64.app/Contents/MacOS/mpv"
              ;;
            *)
              echo "::error::No runtime contract for ${{ matrix.os }}"
              exit 1
              ;;
          esac
          test -x "$node_bin"
          test -x "$mpv_bin"
          test "$("$node_bin" --version)" = "v20.18.1"

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: desktop
        run: npm audit --audit-level=high

      - name: Build frontend
        working-directory: desktop
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --all -- --check

      - name: Check Rust targets
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml --locked --all-targets

      - name: Lint Rust targets
        run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: Test Rust targets
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked --all-targets

      - name: Build the app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        with:
          projectPath: desktop
          args: --bundles ${{ matrix.bundles }}

      - name: Verify every requested desktop bundle
        env:
          REQUESTED_BUNDLES: ${{ matrix.bundles }}
        shell: bash
        run: |
          set -euo pipefail
          bundle_root=desktop/src-tauri/target/release/bundle

          fail() {
            echo "::error::$*"
            exit 1
          }

          require_file_bundle() {
            local bundle="$1"
            local root="$2"
            local pattern="$3"
            local artifact
            local artifacts=()

            [ -d "$root" ] || fail "Requested $bundle bundle directory is missing: $root"
            while IFS= read -r -d '' artifact; do
              artifacts+=("$artifact")
            done < <(find "$root" -maxdepth 1 -type f -name "$pattern" -print0)
            [ "${#artifacts[@]}" -gt 0 ] || fail "Requested $bundle bundle is missing under $root"
            for artifact in "${artifacts[@]}"; do
              [ -s "$artifact" ] || fail "Requested $bundle artifact is empty: $artifact"
            done
          }

          require_app_bundle() {
            local root="$1"
            local app
            local binary
            local executable_found
            local apps=()

            [ -d "$root" ] || fail "Requested app bundle directory is missing: $root"
            while IFS= read -r -d '' app; do
              apps+=("$app")
            done < <(find "$root" -maxdepth 1 -type d -name '*.app' -print0)
            [ "${#apps[@]}" -gt 0 ] || fail "Requested app bundle is missing under $root"
            for app in "${apps[@]}"; do
              [ -s "$app/Contents/Info.plist" ] || fail "Requested app bundle has no nonempty Info.plist: $app"
              [ -d "$app/Contents/MacOS" ] || fail "Requested app bundle has no executable directory: $app"
              executable_found=
              while IFS= read -r -d '' binary; do
                if [ -s "$binary" ] && [ -x "$binary" ]; then
                  executable_found=1
                  break
                fi
              done < <(find "$app/Contents/MacOS" -maxdepth 1 -type f -print0)
              [ -n "$executable_found" ] || fail "Requested app bundle has no nonempty executable: $app"
            done
          }

          IFS=',' read -r -a requested_bundles <<< "$REQUESTED_BUNDLES"
          [ "${#requested_bundles[@]}" -gt 0 ] || fail "No desktop bundles were requested"
          for bundle in "${requested_bundles[@]}"; do
            case "$bundle" in
              deb)
                require_file_bundle deb "$bundle_root/deb" '*.deb'
                ;;
              appimage)
                require_file_bundle appimage "$bundle_root/appimage" '*.AppImage'
                ;;
              nsis)
                require_file_bundle nsis "$bundle_root/nsis" '*.exe'
                ;;
              app)
                require_app_bundle "$bundle_root/macos"
                ;;
              dmg)
                require_file_bundle dmg "$bundle_root/dmg" '*.dmg'
                ;;
              *)
                fail "No artifact-presence contract exists for requested bundle: $bundle"
                ;;
            esac
          done

      - name: Upload desktop bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VortX-desktop-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/macos/*.app
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
