version: 2
updates:
  # NO cargo entry here on purpose. The Rust engine crate lives in a PRIVATE repo and is fetched at
  # build time; the public tree carries only core/Cargo.lock, never core/Cargo.toml, so every
  # dependabot cargo run aborted with "/core/Cargo.toml not found" and failed the Dependabot Updates
  # workflow on a loop. Cargo dependency work (including security bumps such as quinn-proto
  # GHSA-4w2j-m93h-cj5j) is done in the private engine repo. Dependency ALERTS still fire off the
  # committed lockfile, so vulnerabilities stay visible here without a broken update job.
  # GitHub Actions workflows (kept current as CI is added).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
