# Offline diagnostic project: deliberately contains only the fixture renderer target, so XcodeGen
# never validates or needs the normal apps' ignored server/node release inputs.
name: CinemaUISmokeRenderer
options:
  bundleIdPrefix: com.stremiox
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  MPVKit:
    path: Vendor/MPVKit-DVFEL
settings:
  base:
    VORTX_EDGE_SECRET: ""
    TRAKT_CLIENT_ID: ""
    SIMKL_CLIENT_ID: ""
targets:
  CinemaUISmokeRenderer:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - SourcesiOS
      - path: SourcesShared
        excludes: [".claude/**"]
      - path: Sources/Player
        excludes: [".claude/**"]
      - Sources/PlayerScreen.swift
      - Sources/ShareSheet.swift
      - Sources/ExternalPlayer.swift
      - Resources/Assets.xcassets
      - Resources/Localizable.xcstrings
    dependencies:
      - package: MPVKit
        product: MPVKit-GPL
      - framework: Vendor/StremioXCore.xcframework
        embed: false
      - framework: Vendor/VortxEngine.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stremiox.cinema-ui-smoke
        PRODUCT_NAME: CinemaUISmokeRenderer
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Player/VortX-Bridging.h
        SWIFT_INCLUDE_PATHS: "$(inherited) $(BUILT_PRODUCTS_DIR)/include/vortx"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG CINEMA_UI_SMOKE_RENDERER VORTX_NO_EMBEDDED_SERVER"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Cinema UI Smoke
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
schemes:
  CinemaUISmokeRenderer:
    build:
      targets:
        CinemaUISmokeRenderer: all
    run:
      config: Debug
