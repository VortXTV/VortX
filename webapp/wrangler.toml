# Cloudflare Pages project config for web.vortx.tv.
#
# Deploy from the built output with:   npm run deploy
# (which runs `npm run build` then `wrangler pages deploy dist --project-name=vortx-web`).
#
# In the Cloudflare dashboard, the Pages project "vortx-web" should have the custom domain
# web.vortx.tv attached, and (for git-connected deploys) these build settings:
#   Root directory:       webapp
#   Build command:        corepack install && corepack npm ci && corepack npm run build
#   Build output dir:     dist
#   Build variable:       SKIP_DEPENDENCY_INSTALL=1 (Production and Preview)
#
# The Git root, build command, and pre-build variable are dashboard-only settings. Wrangler
# reads pages_build_output_dir for `wrangler pages deploy`; it cannot configure those fields.
name = "vortx-web"
pages_build_output_dir = "dist"
compatibility_date = "2026-06-01"
