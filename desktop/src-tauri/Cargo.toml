[package]
# Not vortx-desktop: the engine leak guard (scripts/scan-proprietary-engine.sh) reserves package
# names beginning with vortx- in Cargo manifests for the proprietary engine crates.
name = "desktop-app"
version = "0.5.6"
description = "VortX desktop shell (Tauri 2)"
authors = ["VortX"]
edition = "2021"
# Tauri 2's minimum; the shell and the engine crates it embeds build on stable.
rust-version = "1.77.2"

[lib]
# Tauri 2 splits the app into a lib (the app logic) plus a thin main.rs binary, so the same code can
# host mobile targets later. The cdylib is what those mobile shells load.
name = "vortx_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The VortX streaming server from the private engine, pinned to the same reviewed revision the apps
# build against, and run in process (src/server.rs). CI fetches it with the engine token.
vortx-streaming-server = { git = "https://github.com/VortXTV/vortx-core", rev = "7b79b45d62dd06716661ff196a845e76330a140f" }
once_cell = "1"
http = "1"
tempfile = "3"
# Native window handle (X11 Window / Win32 HWND / macOS NSView) so the mpv player can embed into the
# main window via `--wid`. Pinned to the same 0.6 line Tauri 2.11 re-exports, so HasWindowHandle and
# the RawWindowHandle variants match the handle Tauri hands back (a version skew would make the
# match arms in lib.rs reference a different enum). See src/player.rs.
raw-window-handle = "0.6"

[features]
# Used by the default tauri-build setup; harmless when empty.
custom-protocol = ["tauri/custom-protocol"]
